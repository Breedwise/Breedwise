<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Breedwise Accountability Chart</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#f7f6f3;--surface:#ffffff;--card:#fbfaf8;--border:#e2dfd8;--border-strong:#cfc9bd;
      --gold:#b8922e;--gold-deep:#8a6420;--gold-faint:rgba(184,146,46,.09);
      --ink:#1a1813;--mid:#48463f;--muted:#86847d;
      --lead-bg:#1f1c18;--lead-ink:#f3f0e8;--lead-mid:#cfcabd;--lead-line:#3a352f;
      --sales:#9a4f3a;--growth:#3c6a8a;--cs:#3c7a52;--ops:#8a6420;--fin:#6a5a8a;--prod:#2f7a78;
      --open:#a33a3a;--open-bg:rgba(163,58,58,.07);
      --heading:'Playfair Display',Georgia,'Times New Roman',serif;
      --body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      color-scheme:light;
    }
    @media (prefers-color-scheme:dark){
      :root:not([data-theme="light"]){
        --bg:#131317;--surface:#1c1c22;--card:#22222a;--border:#31313a;--border-strong:#44444e;
        --gold:#d6ba76;--gold-deep:#e2c98c;--gold-faint:rgba(214,186,118,.1);
        --ink:#f5f2ea;--mid:#c3c0b7;--muted:#8d8b83;
        --lead-bg:#0e0e11;--lead-ink:#f5f2ea;--lead-mid:#c3c0b7;--lead-line:#31313a;
        --sales:#dc967f;--growth:#86b4d4;--cs:#6dbf90;--ops:#d6ba76;--fin:#ab9dd3;--prod:#6cc3bf;
        --open:#e0807e;--open-bg:rgba(224,128,126,.08);
        color-scheme:dark;
      }
    }
    :root[data-theme="dark"]{
      --bg:#131317;--surface:#1c1c22;--card:#22222a;--border:#31313a;--border-strong:#44444e;
      --gold:#d6ba76;--gold-deep:#e2c98c;--gold-faint:rgba(214,186,118,.1);
      --ink:#f5f2ea;--mid:#c3c0b7;--muted:#8d8b83;
      --lead-bg:#0e0e11;--lead-ink:#f5f2ea;--lead-mid:#c3c0b7;--lead-line:#31313a;
      --sales:#dc967f;--growth:#86b4d4;--cs:#6dbf90;--ops:#d6ba76;--fin:#ab9dd3;--prod:#6cc3bf;
      --open:#e0807e;--open-bg:rgba(224,128,126,.08);
      color-scheme:dark;
    }
    html{scroll-behavior:smooth}
    body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
    .wrap{max-width:1120px;margin:0 auto;padding-inline:24px}
    h1,h2,h3{font-family:var(--heading);font-weight:600;text-wrap:balance;color:var(--ink)}
    a{color:var(--gold-deep)}
    :focus-visible{outline:2px solid var(--gold);outline-offset:2px}

    /* header */
    header{background:var(--surface);border-bottom:1px solid var(--border);padding-block:18px}
    .head-row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
    .brand{display:flex;align-items:center;gap:11px}.brand svg{width:30px;height:30px;flex:none}
    .brand b{font-family:var(--heading);font-size:21px;font-weight:600;color:var(--gold)}
    .brand span{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);border-left:1px solid var(--border);padding-left:11px}
    .back{font-size:13px;text-decoration:none;font-weight:500}.back:hover{text-decoration:underline}

    /* hero */
    .hero{padding-block:44px 28px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:40px;align-items:end}
    .eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:12px}
    h1{font-size:clamp(30px,4.4vw,44px);line-height:1.08}
    .lead{font-size:16px;color:var(--mid);margin-top:14px;max-width:60ch}
    .rules{list-style:none;display:grid;gap:10px;border-left:1px solid var(--border-strong);padding-left:20px}
    .rules li{font-size:13.5px;color:var(--mid);display:grid;grid-template-columns:18px 1fr;gap:8px}
    .rules li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold);margin-top:7px}
    .rules strong{color:var(--ink);font-weight:600}

    /* person filter */
    .filter{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-block:1px solid var(--border);padding-block:10px}
    .filter .wrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .filter .lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-right:4px}
    .chip{font:inherit;font-size:12.5px;font-weight:500;color:var(--mid);background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:5px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
    .chip:hover{border-color:var(--gold)}
    .chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
    .chip .n{font-variant-numeric:tabular-nums;font-size:11px;opacity:.65}
    .chip.open-chip{border-style:dashed}

    section.block{padding-block:40px;border-top:1px solid var(--border)}
    section.block:first-of-type{border-top:0}
    .sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:22px}
    h2{font-size:26px}
    .sec-head p{color:var(--muted);font-size:14px;max-width:56ch}

    /* CEO seat */
    .ceo{background:var(--lead-bg);color:var(--lead-ink);border:1px solid var(--lead-line);border-radius:14px;padding:26px 28px;display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:28px;position:relative}
    .ceo .role{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600}
    .ceo h3{font-size:30px;color:var(--lead-ink);margin-top:4px}
    .ceo .who{margin-top:14px;display:flex;align-items:center;gap:10px;color:var(--lead-mid);font-size:13px}
    .ceo ul{list-style:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 24px;align-content:center}
    .ceo li{font-size:14px;color:var(--lead-mid);padding-left:16px;position:relative}
    .ceo li::before{content:"";position:absolute;left:0;top:10px;width:8px;height:1px;background:var(--gold)}
    .spine{width:1px;height:28px;background:var(--border-strong);margin-inline:auto}

    /* avatars */
    .av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:11.5px;font-weight:700;letter-spacing:.02em;flex:none;background:var(--gold-faint);color:var(--gold-deep);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent)}
    .av.open{background:transparent;color:var(--open);border:1.5px dashed var(--open)}

    /* divisions */
    .division{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;padding-block:22px;border-top:1px solid var(--border)}
    .division:first-of-type{border-top:0;padding-top:4px}
    .div-label{--c:var(--gold)}
    .div-label .name{font-family:var(--heading);font-size:20px;font-weight:600;color:var(--c);line-height:1.2}
    .div-label .meta{font-size:12.5px;color:var(--muted);margin-top:6px}
    .div-label.pair + .div-label.pair{margin-top:18px}
    .seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
    .seat{--c:var(--gold);background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px;transition:opacity .2s,filter .2s,border-color .2s}
    .seat .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
    .seat .div{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--c)}
    .seat h3{font-size:18px;line-height:1.2;margin-top:3px}
    .owner{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border:1px solid var(--border);border-radius:9px}
    .owner .k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;line-height:1.2}
    .owner .v{font-size:14.5px;font-weight:600;color:var(--ink);line-height:1.3}
    .owner .v em{font-style:normal;font-weight:500;color:var(--muted);font-size:12.5px}
    .support{display:grid;gap:4px;font-size:12.5px;color:var(--mid)}
    .support div{display:grid;grid-template-columns:92px 1fr;gap:8px}
    .support span:first-child{color:var(--muted)}
    .owns{list-style:none;display:flex;flex-wrap:wrap;gap:5px}
    .owns li{font-size:12px;color:var(--mid);background:var(--card);border:1px solid var(--border);border-radius:6px;padding:2px 8px}
    .seat.is-open{border-style:dashed;border-color:color-mix(in srgb,var(--open) 55%,transparent);background:var(--open-bg)}
    .seat.is-open .owner{border-style:dashed;border-color:color-mix(in srgb,var(--open) 45%,transparent);background:transparent}
    .seat.is-open .owner .v{color:var(--open)}
    .flag{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--open);border:1px dashed var(--open);border-radius:999px;padding:2px 8px;white-space:nowrap}
    .decide{font-size:12.5px;color:var(--mid);border-top:1px dashed color-mix(in srgb,var(--open) 40%,transparent);padding-top:10px}
    .decide b{color:var(--open);font-weight:600}
    .dim{opacity:.22;filter:saturate(.3)}
    .hit{border-color:var(--gold)!important}

    .sales{--c:var(--sales)}.growth{--c:var(--growth)}.cs{--c:var(--cs)}.ops{--c:var(--ops)}.fin{--c:var(--fin)}.product{--c:var(--prod)}

    /* handoffs */
    .relay{list-style:none;display:grid;gap:0;max-width:820px}
    .leg{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:16px;align-items:center;padding-block:12px;position:relative;transition:opacity .2s,filter .2s}
    .leg::before{content:"";position:absolute;left:21px;top:0;bottom:0;width:2px;background:var(--border)}
    .leg:first-child::before{top:50%}.leg:last-child::before{bottom:50%}
    .leg .dot{position:relative;z-index:1;width:44px;height:44px;border-radius:50%;background:var(--surface);border:1px solid var(--border-strong);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
    .leg .stage{font-size:15.5px;font-weight:600;color:var(--ink)}
    .leg .stage small{display:block;font-size:12.5px;font-weight:400;color:var(--muted)}
    .leg .by{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mid);text-align:right;justify-content:flex-end}
    .leg .by b{color:var(--ink);font-weight:600}
    .pass{display:grid;grid-template-columns:44px 1fr;gap:16px;align-items:center;position:relative;padding-block:2px}
    .pass::before{content:"";position:absolute;left:21px;top:0;bottom:0;width:2px;background:var(--gold)}
    .pass span{grid-column:2;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--gold-deep);display:flex;align-items:center;gap:10px}
    .pass span::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}
    .relay-note{font-size:13.5px;color:var(--muted);margin-top:18px;max-width:64ch}

    /* load + open seats */
    .two{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px}
    .panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:22px 24px}
    .panel h3{font-size:19px;margin-bottom:6px}
    .panel p{color:var(--mid);font-size:14px}
    .meter{display:grid;grid-template-columns:repeat(18,1fr);gap:4px;margin-block:16px 8px}
    .meter i{height:26px;border-radius:4px;background:var(--card);border:1px solid var(--border)}
    .meter i.a{background:var(--gold);border-color:var(--gold)}
    .meter i.o{background:transparent;border:1.5px dashed var(--open)}
    .meter-key{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
    .meter-key span{display:inline-flex;align-items:center;gap:6px}
    .meter-key i{width:10px;height:10px;border-radius:3px;display:inline-block}
    .list{list-style:none;display:grid;gap:8px;margin-top:12px}
    .list li{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--mid);padding-bottom:8px;border-bottom:1px solid var(--border)}
    .list li:last-child{border-bottom:0;padding-bottom:0}
    .list li b{color:var(--ink);font-weight:600}
    .list .tagline{font-size:12px;color:var(--muted);white-space:nowrap}
    .sub{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:20px}

    /* doc stack */
    .stack{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface)}
    .stack div{padding:20px 20px 22px;border-left:1px solid var(--border)}
    .stack div:first-child{border-left:0;background:var(--gold-faint)}
    .stack .q{font-family:var(--heading);font-size:26px;font-weight:600;color:var(--gold)}
    .stack .d{font-size:14.5px;font-weight:600;color:var(--ink);margin-top:2px}
    .stack p{font-size:13px;color:var(--muted);margin-top:6px}
    .stack .here{display:inline-block;margin-top:10px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--gold-deep)}

    .note{font-size:12.5px;color:var(--mid);border-top:1px dashed var(--border-strong);padding-top:10px}
    .note b{color:var(--ink);font-weight:600}
    .seat.interim .flag{color:var(--muted);border-color:var(--border-strong)}
    .div-label .future{font-size:12px;color:var(--muted);margin-top:10px;font-style:italic}
    /* operating loop */
    .loop{list-style:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;counter-reset:l}
    .loop li{--c:var(--gold);background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;position:relative}
    .loop li .dp{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--c)}
    .loop li p{font-size:14px;color:var(--ink);margin-top:4px;line-height:1.4}
    .loop li.back{background:var(--gold-faint);border-style:dashed;border-color:var(--gold);display:flex;align-items:center}
    .loop li.back p{color:var(--gold-deep);font-weight:600}
    .loop li.lead-c{--c:var(--gold-deep)}
    /* branch + compare */
    .leg.branch .forks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .fork{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:10px 12px}
    .fork .k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted)}
    .fork .v{font-size:14px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:8px;margin-top:4px}
    .compare{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface);margin-top:26px}
    .compare > div{padding:20px 22px}
    .compare > div + div{border-left:1px solid var(--border)}
    .compare .dp{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--c)}
    .compare .big{font-family:var(--heading);font-size:21px;font-weight:600;line-height:1.25;margin-top:6px;color:var(--ink)}
    .compare .ex{grid-column:1/-1;border-top:1px solid var(--border);border-left:0!important;background:var(--card)}
    .compare .ex ol{margin:8px 0 0 18px;display:grid;gap:4px;font-size:14px;color:var(--mid)}
    .product{--c:var(--prod)}
    @media (max-width:900px){.loop{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media (max-width:640px){.loop{grid-template-columns:1fr}.leg.branch .forks,.compare{grid-template-columns:1fr}.compare > div + div{border-left:0;border-top:1px solid var(--border)}}
    footer{border-top:1px solid var(--border);padding-block:28px;text-align:center;font-size:12.5px;color:var(--muted);margin-top:20px}
    footer a{text-decoration:none}

    @media (max-width:900px){
      .hero{grid-template-columns:1fr;gap:24px}
      .division{grid-template-columns:1fr;gap:14px}
      .two{grid-template-columns:1fr}
      .stack{grid-template-columns:repeat(2,minmax(0,1fr))}
      .stack div:nth-child(3){border-left:0}
      .stack div:nth-child(n+3){border-top:1px solid var(--border)}
    }
    @media (max-width:640px){
      .wrap{padding-inline:16px}
      .ceo{grid-template-columns:1fr;padding:22px 20px;gap:18px}
      .ceo ul{grid-template-columns:1fr}
      .leg{grid-template-columns:44px minmax(0,1fr)}
      .leg .by{grid-column:2;justify-content:flex-start;text-align:left}
      .stack{grid-template-columns:1fr}
      .stack div{border-left:0;border-top:1px solid var(--border)}
      .stack div:first-child{border-top:0}
    }
    @media (prefers-reduced-motion:reduce){*{transition:none!important}html{scroll-behavior:auto}}
    @media print{.filter,.back{display:none}body{background:#fff;font-size:12px}.seat,.panel{break-inside:avoid}}

    .gate{min-height:100vh;display:grid;place-items:center;padding-inline:16px;padding-block:40px}
    .gate-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:32px 28px;text-align:center}
    .gate-card svg{width:40px;height:40px;margin-bottom:10px}
    .gate-card h1{font-size:26px;margin-top:6px}
    .gate-card p{color:var(--muted);font-size:14px;margin-top:8px}
    .gate-card form{display:grid;gap:10px;margin-top:22px}
    .gate-card input{font:inherit;font-size:16px;letter-spacing:.08em;text-transform:uppercase;text-align:center;padding:12px 14px;border:1px solid var(--border-strong);border-radius:10px;background:var(--card);color:var(--ink)}
    .gate-card input:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold)}
    .gate-card button{font:inherit;font-weight:600;font-size:15px;padding:12px;border:0;border-radius:10px;background:var(--gold);color:#1a1509;cursor:pointer}
    .gate-card button:disabled{opacity:.6;cursor:wait}
    .gate-err{color:var(--open);font-size:13px;min-height:18px}
  </style>
</head>
<body>
  <div class="gate" id="gate">
    <div class="gate-card">
      <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M4 28 L4 12 L14 8 L14 26 Z" fill="url(#bwg)"/><path d="M28 28 L28 12 L18 8 L18 26 Z" fill="url(#bwg)"/><rect x="14" y="8" width="4" height="18" fill="#f7f6f3"/><polygon points="14,8 18,8 16,5" fill="#c9a84c"/><path d="M4 12 L14 8 L16 11 L4 15 Z" fill="#c9a84c"/><path d="M28 12 L18 8 L16 11 L28 15 Z" fill="#c9a84c"/><defs><linearGradient id="bwg" x1="4" y1="8" x2="14" y2="28" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#d4aa50"/><stop offset="100%" stop-color="#8a6420"/></linearGradient></defs></svg>
      <div class="eyebrow" style="margin-bottom:0">Breedwise Team</div>
      <h1>Accountability Chart</h1>
      <p>Enter the team passcode to open the chart.</p>
      <form id="gate-form" autocomplete="off">
        <label for="gate-code" class="eyebrow" style="position:absolute;left:-9999px">Passcode</label>
        <input id="gate-code" type="password" placeholder="Passcode" autocapitalize="characters" spellcheck="false" required>
        <button id="gate-btn" type="submit">Open chart</button>
        <div class="gate-err" id="gate-err" role="alert"></div>
      </form>
    </div>
  </div>

          el.classList.toggle('dim', !on);
          el.classList.toggle('hit', p !== 'all' && on && !el.classList.contains('leg') && !el.classList.contains('ceo'));
        });
      });
    });
  }
    async function unlock(code,quiet){
      try{
        var html=await decrypt(code.trim().toUpperCase());
        document.body.innerHTML=html; initChart();
        try{localStorage.setItem(KEY,code.trim().toUpperCase());}catch(e){}
        return true;
      }catch(e){
        if(!quiet) document.getElementById('gate-err').textContent='That passcode didn\u2019t work. Check it and try again.';
        try{if(quiet)localStorage.removeItem(KEY);}catch(e){}
        return false;
      }
    }
    document.getElementById('gate-form').addEventListener('submit',async function(e){
      e.preventDefault();
      var btn=document.getElementById('gate-btn'); btn.disabled=true; btn.textContent='Opening\u2026';
      var ok=await unlock(document.getElementById('gate-code').value,false);
      if(!ok){btn.disabled=false;btn.textContent='Open chart';}
    });
    var saved=null; try{saved=localStorage.getItem(KEY);}catch(e){}
    if(saved) unlock(saved,true);
  })();
  </script>
</body>
</html>
