<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Private · Content OS</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,500;0,600;0,700;1,600&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../boss.css">
<style>
  .tlist{display:grid;gap:16px;padding:20px 0 60px}
  .train{display:flex;gap:20px;align-items:flex-start;background:linear-gradient(165deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:16px;padding:22px 24px;transition:.18s}
  a.train:hover{border-color:var(--gold-deep);transform:translateY(-2px)}
  .train .no{font-family:var(--disp);font-size:2.2rem;color:var(--gold-soft);line-height:1;min-width:48px}
  .train .meta{flex:1}
  .train h3{font-family:var(--disp);font-size:1.5rem;font-weight:600;display:flex;align-items:center;gap:12px}
  .train .mins{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
  .train p{color:var(--mid);font-size:.95rem;margin-top:6px;max-width:72ch}
  .train .st{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:4px 10px;border-radius:30px}
  .st.live{color:var(--green);background:rgba(94,197,154,.1);border:1px solid rgba(94,197,154,.25)}
  .st.building,.st.planned{color:var(--faint);background:rgba(87,82,75,.12);border:1px solid var(--line2)}
  .train.soon{opacity:.6}
  .go{color:var(--gold);font-size:1.4rem;align-self:center}
</style>
</head><body>

<!-- GATE -->
<div id="gate"><div class="box">
  <div class="logo"><span class="mk">B</span></div>
  <h1>Content OS</h1><div class="sub">Access</div>
  <input id="boss-pw" type="password" placeholder="Access code" autocomplete="off">
  <button id="boss-unlock">Enter &rarr;</button>
  <div class="err" id="boss-gate-err"></div>
</div></div>

<!-- APP -->
<div id="app" hidden>
  <header class="boss"><div class="wrap bar">
    <a class="brand" href="../index.html"><span class="mk">B</span>
      <span class="wm"><b>Content OS</b><span>BreedWise BOSS &middot; Module</span></span></a>
    <nav><a href="../index.html">&larr; All modules</a></nav>
  </div></header>

  <section class="hub-hero"><div class="wrap">
    <span class="eyebrow">Content OS</span>
    <h1>Make content a <em>system.</em></h1>
    <p>Short, visual trainings &mdash; one per concept, 5 to 10 minutes each. Watch a training, then run the play. More get added as we build.</p>
  </div></section>

  <div class="wrap"><div class="tlist" id="tlist"></div></div>
  <footer class="boss"><div class="wrap">BreedWise BOSS &middot; Content OS &middot; Private</div></footer>
</div>

<script src="../boss-gate.js"></script>
<script>
  // Trainings in this module. Add an entry per concept; status: live | building | planned.
  var TRAININGS=[
    { n:1, title:'Attention is Currency', mins:'~7 min', status:'live', url:'attention-is-currency.html',
      blurb:'Why attention is the first domino: strategy over random posting, good vs bad attention, momentum, repurposing, and tracking the funnel from views to inquiries to calls to deposits.' },
    { n:2, title:'Brand Strategy', mins:'~8 min', status:'live', url:'brand-strategy.html',
      blurb:'Branding as the associations you make on purpose: the four brand pillars, the foundation (breed purpose, program purpose, ICP, niche), finding your niche, and choosing your brand type (educator vs premium) then executing it premium.' },
    { n:3, title:'Platforms', mins:'~8 min', status:'live', url:'platforms.html',
      blurb:'A full breakdown of Instagram, Facebook, YouTube and TikTok: what each is for, the post styles that belong on each, and how to master one platform then spread that content style across all four.' },
    { n:4, title:'Gear for Content', mins:'~6 min', status:'live', url:'gear-for-content.html',
      blurb:'Exactly what to buy at each stage: start under $60 (phone, $20 mic, tripod), level up (DJI Mic 2, Sony a6400, 18-105mm lens), and go pro (Sony FX30, ZV-E10, a fast prime). Audio-first, buy-as-you-grow, with Amazon links.' }
  ];
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function row(t){
    var live=t.status==='live'&&t.url;
    var inner='<div class="no">'+String(t.n).padStart(2,'0')+'</div>'
      +'<div class="meta"><h3>'+esc(t.title)+' <span class="st '+esc(t.status)+'">'+esc(t.status)+'</span></h3>'
      +'<div class="mins">'+esc(t.mins||'')+'</div><p>'+esc(t.blurb||'')+'</p></div>'
      +(live?'<span class="go">&rarr;</span>':'');
    return live ? '<a class="train" href="'+esc(t.url)+'">'+inner+'</a>'
                : '<div class="train soon">'+inner+'</div>';
  }
  function render(){ document.getElementById('tlist').innerHTML=TRAININGS.map(row).join(''); }
  document.documentElement.addEventListener('boss:unlocked',render);
  if(!document.getElementById('gate')) render();
</script>
</body></html>
