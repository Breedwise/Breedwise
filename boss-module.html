<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Welcome to BOSS™ · BreedWise Operating System &amp; Standards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#080808;--ink:#F7F5F0;--gray:#A7A7A7;--dim:#6f6f6f;
    --gold:#D4AF37;--gold-soft:#f0dd9a;--gold-deep:#9e7b24;
    --line:rgba(247,245,240,.12);--line2:rgba(247,245,240,.22);--gline:rgba(212,175,55,.38);
    --disp:'Manrope',-apple-system,sans-serif;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Manrope',-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:radial-gradient(1200px 760px at 50% -14%,#17130a,#080808 60%),var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
  body.pure{background:#050505}
  .gold{background:linear-gradient(162deg,#f3e2a6 0%,#D4AF37 44%,#9e7b24 70%,#eccf82 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .serif{font-family:var(--serif);font-style:italic;font-weight:600}
  .top{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:15px 24px;border-bottom:1px solid var(--line);background:rgba(8,8,8,.62);backdrop-filter:blur(10px)}
  .brand{font-family:var(--disp);font-size:13px;letter-spacing:.26em;font-weight:800;color:var(--ink)}
  .topmod{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .prog{position:fixed;top:0;left:0;height:2px;background:linear-gradient(90deg,var(--gold-deep),var(--gold-soft));width:0;z-index:40;transition:width .4s ease}
  .stage{position:absolute;inset:0}
  .slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:84px 30px 96px;opacity:0;transform:translateY(16px) scale(.995);transition:opacity .5s cubic-bezier(.2,.7,.2,1),transform .5s cubic-bezier(.2,.7,.2,1);pointer-events:none}
  .slide.on{opacity:1;transform:none;pointer-events:auto}
  .inner{max-width:940px;width:100%}
  .kick{display:inline-block;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:22px}
  h1{font-family:var(--disp);font-weight:800;font-size:clamp(30px,5.4vw,58px);line-height:1.05;letter-spacing:-1.2px}
  .huge{font-family:var(--disp);font-weight:800;font-size:clamp(42px,9vw,112px);line-height:.98;letter-spacing:-3px}
  .lead{margin-top:20px;font-size:clamp(15px,2.1vw,20px);color:var(--gray);font-weight:400;line-height:1.5;max-width:720px;margin-left:auto;margin-right:auto}
  .lead.strike{text-decoration:line-through;text-decoration-color:var(--dim);color:var(--dim)}
  .foot{margin-top:26px;font-size:14px;color:var(--gray);font-weight:400;line-height:1.55;max-width:740px;margin-left:auto;margin-right:auto}
  .foot b{color:var(--ink);font-weight:700}
  .editorial{font-family:var(--serif);font-style:italic;font-weight:600;font-size:clamp(22px,3.4vw,38px);line-height:1.2;margin-top:16px}
  .big-line{font-family:var(--disp);font-weight:800;font-size:clamp(24px,3.6vw,40px);letter-spacing:-.8px;margin-top:30px;line-height:1.08}
  .neq{color:var(--gold)}
  .small-gold{margin-top:16px;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700}
  /* hero */
  .wordmark{font-family:var(--disp);font-weight:800;font-size:clamp(84px,17vw,168px);line-height:.9;letter-spacing:-5px}
  .wordmark .tm{font-size:.24em;vertical-align:super;letter-spacing:0}
  .full{font-family:var(--disp);font-size:clamp(15px,2.3vw,22px);color:var(--gray);font-weight:600;letter-spacing:.02em;margin-top:18px;text-transform:uppercase;letter-spacing:.08em}
  .tagline{margin-top:18px}
  .tagline.serif{font-size:clamp(18px,2.6vw,26px);color:var(--gold-soft)}
  /* pills / lists */
  .pills{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:24px}
  .pill{font-size:12px;color:var(--ink);border:1px solid var(--line2);border-radius:30px;padding:9px 16px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
  ul.pts,ol.pts{list-style:none;counter-reset:n;display:grid;gap:10px;margin-top:22px;max-width:640px;margin-left:auto;margin-right:auto;text-align:left}
  ul.pts li,ol.pts li{position:relative;padding-left:26px;font-size:clamp(14px,1.9vw,17px);color:var(--gray);line-height:1.4}
  ul.pts li::before{content:"";position:absolute;left:0;top:9px;width:7px;height:7px;background:var(--gold);border-radius:1px;transform:rotate(45deg)}
  ol.pts li{padding-left:34px}ol.pts li::before{counter-increment:n;content:counter(n,decimal-leading-zero);position:absolute;left:0;top:1px;font-family:var(--disp);font-size:13px;color:var(--gold);font-weight:700}
  ul.pts li b,ol.pts li b{color:var(--ink);font-weight:700}
  ul.inc,ul.exc{list-style:none;display:grid;gap:8px;margin-top:20px;max-width:620px;margin-left:auto;margin-right:auto;text-align:left}
  ul.inc li,ul.exc li{font-size:14.5px;padding-left:28px;position:relative;color:var(--gray)}
  ul.inc li::before{content:"✓";position:absolute;left:0;color:var(--gold);font-weight:800}
  ul.exc li::before{content:"✕";position:absolute;left:0;color:#8a5a5a;font-weight:800}
  /* chain flow */
  .railflow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin-top:22px;max-width:760px;margin-left:auto;margin-right:auto}
  .railflow span{font-family:var(--disp);font-size:12.5px;font-weight:600;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:8px 12px;letter-spacing:.04em}
  .railflow i{color:var(--gold);font-style:normal;font-size:12px}
  .vs{display:grid;gap:14px;margin-top:24px;max-width:720px;margin-left:auto;margin-right:auto}
  .vt{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;margin-bottom:8px}
  .vscol.old .vt{color:var(--dim)}.vscol.new .vt{color:var(--gold)}
  .chainflat{display:inline-block;font-family:var(--disp);font-weight:600;font-size:clamp(13px,1.8vw,16px);letter-spacing:.06em;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:13px 18px}
  .vscol.old .chainflat{color:var(--dim);border-style:dashed}
  .vscol.new .chainflat{border-color:var(--gline);color:var(--ink)}
  /* engines */
  .two{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:stretch;margin-top:24px;max-width:820px;margin-left:auto;margin-right:auto}
  @media(max-width:640px){.two{grid-template-columns:1fr}.two .plus{display:none}}
  .eng,.opt{border:1px solid var(--line2);border-radius:16px;padding:22px;text-align:left}
  .eng .et{font-family:var(--disp);font-size:18px;font-weight:700;margin-bottom:8px}
  .eng .ed{font-size:12.5px;color:var(--gray);line-height:1.5;letter-spacing:.02em}
  .plus{display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:26px;color:var(--gold)}
  /* loop */
  .loop{display:grid;gap:0;max-width:560px;margin:24px auto 0;text-align:left}
  .lstep{display:flex;gap:16px;align-items:center;padding:11px 0}
  .lstep .ln{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--gline);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:14px;color:var(--gold)}
  .lstep b{font-family:var(--disp);font-size:15px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;display:inline-block;min-width:140px}
  .lstep span{color:var(--gray);font-size:13.5px}
  .lconn{width:1px;height:11px;background:var(--gline);margin-left:21px}
  .lrepeat{display:inline-flex;align-items:center;gap:8px;margin-left:6px;margin-top:8px;font-family:var(--disp);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
  /* compare rows */
  .cmp{display:grid;gap:12px;margin-top:22px;max-width:780px;margin-left:auto;margin-right:auto}
  .cr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:620px){.cr{grid-template-columns:1fr}}
  .cr .know{font-size:13.5px;color:var(--dim);border:1px dashed var(--line);border-radius:12px;padding:13px 15px;text-align:left;font-style:italic}
  .cr .boss{font-size:13.5px;color:var(--ink);border:1px solid var(--gline);border-radius:12px;padding:13px 15px;text-align:left}
  /* timeline */
  .tl{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:24px}
  @media(max-width:720px){.tl{grid-template-columns:1fr 1fr}}
  .tc{border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left}
  .tc .td{font-family:var(--disp);font-size:11.5px;color:var(--gold);letter-spacing:.06em;font-weight:700}
  .tc .tt{font-family:var(--disp);font-size:15px;font-weight:700;margin:5px 0 4px}
  .tc .tp{font-size:12px;color:var(--gray);line-height:1.45}
  .steps4{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:22px}
  .steps4 .s{border:1px solid var(--line2);border-radius:12px;padding:12px 16px;min-width:146px}
  .steps4 .s b{font-family:var(--disp);font-size:14px;font-weight:700;display:block;letter-spacing:.1em;text-transform:uppercase}
  .steps4 .s span{font-size:12px;color:var(--gray)}
  .gates{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:22px}
  .gate{font-family:var(--disp);font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);border:1px solid var(--gline);border-radius:12px;padding:12px 18px}
  /* grid cards */
  .grid4{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px;max-width:800px;margin-left:auto;margin-right:auto;text-align:left}
  @media(max-width:620px){.grid4{grid-template-columns:1fr}}
  .grid4 .g{border:1px solid var(--line);border-radius:13px;padding:16px}
  .grid4 .g b{font-family:var(--disp);font-size:14.5px;font-weight:700;display:block;margin-bottom:4px}
  .grid4 .g span{font-size:12.5px;color:var(--gray);line-height:1.45}
  .opt .on{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700}
  .opt .ot{font-family:var(--disp);font-size:19px;font-weight:700;margin:4px 0 6px}
  .opt p{font-size:12.5px;color:var(--gray);line-height:1.5}
  .opt.hot{border-color:var(--gline)}
  .opt .price{margin-top:12px;font-family:var(--disp);font-size:14px;font-weight:700;color:var(--gold-soft)}
  .opt .price small{color:var(--dim);font-weight:400;font-size:12px}
  /* comparison table */
  .tblwrap{margin-top:20px;max-height:62vh;overflow:auto;border:1px solid var(--line);border-radius:14px}
  table.lanes{width:100%;border-collapse:collapse;font-size:12.5px;min-width:620px}
  table.lanes th,table.lanes td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line)}
  table.lanes thead th{position:sticky;top:0;background:#0d0d0d;font-family:var(--disp);font-weight:700;font-size:11px;letter-spacing:.04em;color:var(--ink)}
  table.lanes thead th.up{color:var(--gold)}
  table.lanes td.rl{color:var(--gray);font-weight:500}
  table.lanes td{color:var(--gray)}
  .yes{color:var(--gold);font-weight:800}.no{color:#6a6a6a}
  .up-col{background:rgba(212,175,55,.05)}
  /* upgrade stack */
  .stack{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:20px;max-width:800px;margin-left:auto;margin-right:auto;text-align:left}
  @media(max-width:640px){.stack{grid-template-columns:1fr}}
  .st{border:1px solid var(--line);border-radius:13px;padding:15px 16px}
  .st .sh{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:7px}
  .st ul{list-style:none;display:grid;gap:5px}
  .st ul li{font-size:12.8px;color:var(--gray);padding-left:14px;position:relative}
  .st ul li::before{content:"";position:absolute;left:0;top:7px;width:5px;height:5px;background:var(--gold);border-radius:50%}
  /* pricing */
  .prices{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px;max-width:640px;margin-left:auto;margin-right:auto}
  @media(max-width:560px){.prices{grid-template-columns:1fr}}
  .pc{border:1px solid var(--line2);border-radius:16px;padding:22px;text-align:left}
  .pc.legacy{border-color:var(--gline)}
  .pc .pl{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gray);font-weight:700}
  .pc .pt{font-family:var(--disp);font-size:16px;font-weight:700;margin:4px 0 8px}
  .pc .pp{font-family:var(--disp);font-size:34px;font-weight:800}
  .pc.legacy .pp{color:var(--gold-soft)}
  /* vertical flow */
  .vflow{display:grid;gap:0;max-width:430px;margin:20px auto 0;text-align:center}
  .vf{font-size:13.5px;color:var(--ink);border:1px solid var(--line);border-radius:11px;padding:11px 14px}
  .vf b{font-family:var(--disp);font-weight:700}
  .vf.sub{color:var(--gray);font-size:12.5px;border-style:dashed}
  .vf.gold{border-color:var(--gline);color:var(--gold-soft)}
  .va{color:var(--gold);font-size:13px;margin:4px 0}
  /* three choices */
  .choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px;text-align:left}
  @media(max-width:760px){.choices{grid-template-columns:1fr}}
  .ch{border:1px solid var(--line);border-radius:14px;padding:18px}
  .ch.mid{border-color:var(--gline)}
  .ch .cn{font-family:var(--disp);font-size:11px;letter-spacing:.1em;color:var(--gold);font-weight:700}
  .ch .ct{font-family:var(--disp);font-size:16px;font-weight:700;margin:6px 0 2px}
  .ch .cp{font-size:11.5px;color:var(--gray);line-height:1.45;margin-top:6px}
  .ch .cprice{font-family:var(--disp);font-size:13px;color:var(--gold-soft);font-weight:700;margin-top:6px}
  .ch .cline{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--gold-soft);margin-top:8px}
  .promise .p1{font-family:var(--disp);font-size:clamp(26px,4.4vw,46px);font-weight:600;letter-spacing:-1px;line-height:1.12}
  .promise .p1 .dim{color:var(--dim)}
  .promise .p2{font-family:var(--disp);font-size:clamp(30px,5.2vw,56px);font-weight:800;letter-spacing:-1.6px;line-height:1.05;margin-top:16px}
  .cta-btn{display:inline-block;margin-top:28px;padding:16px 34px;border-radius:13px;border:0;color:#120d02;font-family:var(--disp);font-weight:700;font-size:17px;cursor:pointer;text-decoration:none;background:linear-gradient(180deg,#f3e2a6,#D4AF37);box-shadow:0 10px 36px rgba(212,175,55,.18)}
  .disc{margin-top:16px;font-size:10.5px;color:var(--dim);letter-spacing:.02em;max-width:620px;margin-left:auto;margin-right:auto}
  .nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-top:1px solid var(--line);background:rgba(8,8,8,.62);backdrop-filter:blur(10px)}
  .nbtn{background:transparent;border:1px solid var(--line2);color:var(--gray);border-radius:10px;width:42px;height:42px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color .12s,color .12s}
  .nbtn:hover{border-color:var(--gold);color:var(--gold-soft)}
  .nbtn:disabled{opacity:.3;cursor:default}
  .count{font-size:12.5px;color:var(--dim);letter-spacing:.06em}.count b{color:var(--ink);font-family:var(--disp);font-size:15px}
  .dots{display:flex;gap:5px;align-items:center}.dot{width:6px;height:6px;border-radius:50%;background:var(--line2);cursor:pointer;transition:.15s}.dot.on{background:var(--gold);transform:scale(1.35)}
  @media(max-width:760px){.dots{display:none}}
  .zone{position:fixed;top:56px;bottom:74px;width:20%;z-index:20;cursor:pointer}.zone.l{left:0}.zone.r{right:0}
  .hint{position:fixed;bottom:76px;left:50%;translate:-50% 0;font-size:10px;color:#3a3a36;z-index:25;letter-spacing:.08em}
</style>
</head>
<body>
  <div class="prog" id="prog"></div>
  <div class="top"><span class="brand">BREEDWISE</span><span class="topmod">BOSS™ · Week 1</span></div>
  <div class="zone l" id="zl"></div><div class="zone r" id="zr"></div>
  <div class="stage" id="stage"></div>
  <div class="hint">← → · click sides · swipe</div>
  <div class="nav"><button class="nbtn" id="prev">‹</button><div class="dots" id="dots"></div><div class="count"><b id="cur">1</b> / <span id="tot">25</span></div><button class="nbtn" id="next">›</button></div>

<script>
var SLIDES=[
 {html:'<span class="kick">BreedWise presents</span>'
   +'<div class="wordmark gold">BOSS<span class="tm">™</span></div>'
   +'<div class="full">BreedWise Operating System &amp; Standards</div>'
   +'<div class="tagline serif gold">Better Breeding. Better Business. Stronger Programs.</div>'},

 {html:'<span class="kick">Why we built it</span>'
   +'<div class="huge">KNOWING <span class="neq">&ne;</span><br>IMPLEMENTING.</div>'
   +'<p class="foot" style="margin-top:34px">Breeders don\'t need another folder of videos. They need to know what deserves attention, what to do first, what system solves it, whether they implemented it, and whether it\'s working.</p>'},

 {html:'<span class="kick">The evolution</span>'
   +'<h1>BreedWise has <span class="gold">evolved</span>.</h1>'
   +'<div class="vs"><div class="vscol old"><div class="vt">The old model</div><div class="chainflat">LEARN → LEARN → LEARN → ASK → LEARN MORE</div></div>'
   +'<div class="vscol new"><div class="vt">The BOSS model</div><div class="chainflat">ASSESS → PRIORITIZE → IMPLEMENT → MEASURE → REASSESS</div></div></div>'
   +'<p class="foot">Education still matters. BOSS isn\'t organized around how much information we can give you. It\'s organized around how much of the <b>right</b> information you actually turn into a stronger program.</p>'},

 {html:'<span class="kick">What it is</span>'
   +'<h1>An operating system for your <span class="gold">breeding program</span>.</h1>'
   +'<div class="pills"><span class="pill">Breeding</span><span class="pill">Business</span><span class="pill">Systems</span><span class="pill">Standards</span><span class="pill">Measurement</span><span class="pill">Implementation</span></div>'
   +'<p class="editorial gold" style="margin-top:28px">Your breeding program shouldn\'t live entirely in your head.</p>'},

 {html:'<span class="kick">One program. Two engines.</span>'
   +'<div class="two"><div class="eng"><div class="et">Breeding Engine</div><div class="ed">Science · Preparation · Systems · Records · Standards</div></div>'
   +'<div class="plus">+</div>'
   +'<div class="eng"><div class="et">Business Engine</div><div class="ed">Positioning · Demand · Buyers · Sales · Economics · Operations</div></div></div>'
   +'<p class="foot">BOSS doesn\'t treat these like two separate businesses. We build the system that lets them work <b>together</b>.</p>'},

 {html:'<span class="kick">The BOSS™ Loop</span>'
   +'<div class="loop">'
   +'<div class="lstep"><span class="ln">01</span><div><b>Assess</b><span>Where are you now?</span></div></div><div class="lconn"></div>'
   +'<div class="lstep"><span class="ln">02</span><div><b>Prioritize</b><span>What matters most?</span></div></div><div class="lconn"></div>'
   +'<div class="lstep"><span class="ln">03</span><div><b>Implement</b><span>Build the system.</span></div></div><div class="lconn"></div>'
   +'<div class="lstep"><span class="ln">04</span><div><b>Measure</b><span>Is it actually working?</span></div></div><div class="lconn"></div>'
   +'<div class="lstep"><span class="ln">05</span><div><b>Reassess</b><span>What\'s the next constraint?</span></div></div>'
   +'<div class="lrepeat">&#8635; Repeat</div></div>'
   +'<p class="editorial gold">Your program is never &ldquo;finished.&rdquo; It becomes better operated.</p>'},

 {html:'<span class="kick">This changes how we teach</span>'
   +'<h1>No more <span class="gold">random</span> implementation.</h1>'
   +'<div class="railflow"><span>PROBLEM</span><i>→</i><span>STANDARD</span><i>→</i><span>SYSTEM</span><i>→</i><span>TRAINING</span><i>→</i><span>TOOL</span><i>→</i><span>IMPLEMENTATION</span><i>→</i><span>MEASUREMENT</span><i>→</i><span>DEFINITION OF DONE</span></div>'

var i=0;
var stage=document.getElementById('stage'),dots=document.getElementById('dots');
document.getElementById('tot').textContent=SLIDES.length;
function render(){
  stage.innerHTML=SLIDES.map(function(s,n){
    return '<div class="slide'+(s.cls?' '+s.cls:'')+(n===0?' on':'')+'" data-n="'+n+'">'+ (/^\s*<div class="inner/.test(s.html)?s.html:'<div class="inner">'+s.html+'</div>') +'</div>';
  }).join('');
  dots.innerHTML=SLIDES.map(function(_,n){return '<span class="dot'+(n===0?' on':'')+'" data-g="'+n+'"></span>';}).join('');
  Array.prototype.forEach.call(dots.querySelectorAll('.dot'),function(d){d.addEventListener('click',function(){go(+d.getAttribute('data-g'));});});
  update();
}
function update(){
  Array.prototype.forEach.call(stage.querySelectorAll('.slide'),function(el){el.classList.toggle('on',+el.getAttribute('data-n')===i);});
  Array.prototype.forEach.call(dots.querySelectorAll('.dot'),function(el,n){el.classList.toggle('on',n===i);});
  document.body.classList.toggle('pure', !!SLIDES[i].cls);
  document.getElementById('cur').textContent=i+1;
  document.getElementById('prog').style.width=((i)/(SLIDES.length-1)*100)+'%';
  document.getElementById('prev').disabled=(i===0);
  document.getElementById('next').disabled=(i===SLIDES.length-1);
}
function go(n){i=Math.max(0,Math.min(SLIDES.length-1,n));update();var sl=stage.querySelector('.slide.on');if(sl)sl.scrollTop=0;}
document.getElementById('next').onclick=function(){go(i+1);};
document.getElementById('prev').onclick=function(){go(i-1);};
document.getElementById('zr').onclick=function(){go(i+1);};
document.getElementById('zl').onclick=function(){go(i-1);};
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(i+1);}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(i-1);}
  else if(e.key==='Home'){go(0);} else if(e.key==='End'){go(SLIDES.length-1);}
});
var tx=0;
document.addEventListener('touchstart',function(e){tx=e.changedTouches[0].clientX;},{passive:true});
document.addEventListener('touchend',function(e){var dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>60){dx<0?go(i+1):go(i-1);}},{passive:true});
render();
</script>
