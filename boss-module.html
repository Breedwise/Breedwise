<!doctype html>
<html lang="en">
<head>

<title>Welcome to BOSS™ · BreedWise Operating System &amp; Standards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#080808;--ink:#F7F5F0;--gray:#A7A7A7;--dim:#6f6f6f;
    --gold:#D4AF37;--gold-soft:#f0dd9a;--gold-deep:#9e7b24;
    --line:rgba(247,245,240,.12);--line2:rgba(247,245,240,.22);--gline:rgba(212,175,55,.38);
    --disp:'Manrope',-apple-system,sans-serif;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Manrope',-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:radial-gradient(1200px 760px at 50% -14%,#17130a,#080808 60%),var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
  body.pure{background:#050505}
  .gold{background:linear-gradient(162deg,#f3e2a6 0%,#D4AF37 44%,#9e7b24 70%,#eccf82 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .serif{font-family:var(--serif);font-style:italic;font-weight:600}
  .top{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:15px 24px;border-bottom:1px solid var(--line);background:rgba(8,8,8,.62);backdrop-filter:blur(10px)}
  .brand{font-family:var(--disp);font-size:13px;letter-spacing:.26em;font-weight:800;color:var(--ink)}
  .topR{display:flex;align-items:center;gap:14px}
  .topmod{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .ntog{font-family:var(--disp);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:700;border:1px solid var(--line);border-radius:7px;padding:5px 9px;cursor:pointer;background:transparent}
  .ntog:hover{color:var(--gold);border-color:var(--gline)}
  body.notes-on .ntog{color:var(--gold);border-color:var(--gline)}
  .prog{position:fixed;top:0;left:0;height:2px;background:linear-gradient(90deg,var(--gold-deep),var(--gold-soft));width:0;z-index:40;transition:width .4s ease}
  .stage{position:absolute;inset:0}
  .slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:84px 30px 96px;opacity:0;transform:translateY(16px) scale(.995);transition:opacity .5s cubic-bezier(.2,.7,.2,1),transform .5s cubic-bezier(.2,.7,.2,1);pointer-events:none}
  .slide.on{opacity:1;transform:none;pointer-events:auto}
  .inner{max-width:940px;width:100%}
  .kick{display:inline-block;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:22px}
  h1{font-family:var(--disp);font-weight:800;font-size:clamp(30px,5.4vw,58px);line-height:1.05;letter-spacing:-1.2px}
  .huge{font-family:var(--disp);font-weight:800;font-size:clamp(40px,8.4vw,104px);line-height:.98;letter-spacing:-3px}
  .lead{margin-top:20px;font-size:clamp(15px,2.1vw,20px);color:var(--gray);font-weight:400;line-height:1.5;max-width:720px;margin-left:auto;margin-right:auto}
  .lead.strike{text-decoration:line-through;text-decoration-color:var(--dim);color:var(--dim)}
  .foot{margin-top:26px;font-size:14px;color:var(--gray);font-weight:400;line-height:1.55;max-width:740px;margin-left:auto;margin-right:auto}
  .foot b{color:var(--ink);font-weight:700}
  .editorial{font-family:var(--serif);font-style:italic;font-weight:600;font-size:clamp(22px,3.4vw,38px);line-height:1.2;margin-top:16px}
  .big-line{font-family:var(--disp);font-weight:800;font-size:clamp(22px,3.4vw,38px);letter-spacing:-.8px;margin-top:28px;line-height:1.1}
  .neq{color:var(--gold)}
  .small-gold{margin-top:16px;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700}
  .wordmark{font-family:var(--disp);font-weight:800;font-size:clamp(84px,17vw,168px);line-height:.9;letter-spacing:-5px}
  .wordmark .tm{font-size:.24em;vertical-align:super;letter-spacing:0}
  .full{font-family:var(--disp);font-size:clamp(14px,2.1vw,20px);color:var(--gray);font-weight:600;margin-top:18px;text-transform:uppercase;letter-spacing:.14em}
  .tagline{margin-top:18px}
  .tagline.serif{font-size:clamp(18px,2.6vw,26px);color:var(--gold-soft)}
  .pills{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:24px}
  .pill{font-size:12px;color:var(--ink);border:1px solid var(--line2);border-radius:30px;padding:9px 16px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
  ul.pts{list-style:none;display:grid;gap:10px;margin-top:22px;max-width:640px;margin-left:auto;margin-right:auto;text-align:left}
  ul.pts li{position:relative;padding-left:26px;font-size:clamp(14px,1.9vw,17px);color:var(--gray);line-height:1.45}
  ul.pts li::before{content:"";position:absolute;left:0;top:9px;width:7px;height:7px;background:var(--gold);border-radius:1px;transform:rotate(45deg)}
  ul.pts li b{color:var(--ink);font-weight:700}
  .railflow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin-top:22px;max-width:820px;margin-left:auto;margin-right:auto}
  .railflow span{font-family:var(--disp);font-size:12.5px;font-weight:600;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:8px 12px;letter-spacing:.04em}
  .railflow i{color:var(--gold);font-style:normal;font-size:12px}
  .vs{display:grid;gap:14px;margin-top:24px;max-width:720px;margin-left:auto;margin-right:auto}
  .vt{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;margin-bottom:8px}
  .vscol.old .vt{color:var(--dim)}.vscol.new .vt{color:var(--gold)}
  .chainflat{display:inline-block;font-family:var(--disp);font-weight:600;font-size:clamp(13px,1.8vw,16px);letter-spacing:.06em;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:13px 18px}
  .vscol.old .chainflat{color:var(--dim);border-style:dashed}
  .vscol.new .chainflat{border-color:var(--gline);color:var(--ink)}
  .two{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:stretch;margin-top:24px;max-width:820px;margin-left:auto;margin-right:auto}
  @media(max-width:640px){.two{grid-template-columns:1fr}.two .plus{display:none}}
  .eng{border:1px solid var(--line2);border-radius:16px;padding:22px;text-align:left}
  .eng .et{font-family:var(--disp);font-size:16px;font-weight:700;margin-bottom:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-soft)}
  .eng ul{list-style:none;display:grid;gap:6px}
  .eng ul li{font-size:12.8px;color:var(--gray);padding-left:14px;position:relative}
  .eng ul li::before{content:"";position:absolute;left:0;top:7px;width:5px;height:5px;background:var(--gold);border-radius:50%}
  .plus{display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:26px;color:var(--gold)}
  .loop{display:grid;gap:0;max-width:560px;margin:24px auto 0;text-align:left}
  .lstep{display:flex;gap:16px;align-items:center;padding:10px 0}
  .lstep .ln{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--gline);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:14px;color:var(--gold)}
  .lstep b{font-family:var(--disp);font-size:15px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;display:inline-block;min-width:140px}
  .lstep span{color:var(--gray);font-size:13.5px}
  .lconn{width:1px;height:10px;background:var(--gline);margin-left:21px}
  .lrepeat{display:inline-flex;align-items:center;gap:8px;margin-left:6px;margin-top:8px;font-family:var(--disp);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
  .tl{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:24px}
  @media(max-width:720px){.tl{grid-template-columns:1fr 1fr}}
  .tc{border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left}
  .tc .td{font-family:var(--disp);font-size:11.5px;color:var(--gold);letter-spacing:.06em;font-weight:700}
  .tc .tt{font-family:var(--disp);font-size:14.5px;font-weight:700;margin:5px 0 4px}
  .steps4{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:22px}
  .steps4 .s{border:1px solid var(--line2);border-radius:12px;padding:12px 16px;min-width:150px}
  .steps4 .s b{font-family:var(--disp);font-size:14px;font-weight:700;display:block;letter-spacing:.1em;text-transform:uppercase}
  .steps4 .s span{font-size:12px;color:var(--gray)}
  .gates{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:22px}
  .gate{font-family:var(--disp);font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);border:1px solid var(--gline);border-radius:12px;padding:12px 18px}
  .lines3{display:grid;gap:12px;margin-top:24px;max-width:640px;margin-left:auto;margin-right:auto}
  .lines3 div{font-size:clamp(14px,2vw,18px);color:var(--gray);border:1px solid var(--line);border-radius:12px;padding:14px 18px}
  .lines3 b{color:var(--ink);font-weight:700}
  .qs{display:grid;gap:14px;margin-top:26px;max-width:640px;margin-left:auto;margin-right:auto;text-align:left}
  .qrow{display:flex;gap:16px;align-items:baseline}
  .qrow .qn{font-family:var(--disp);font-weight:800;font-size:clamp(26px,4vw,40px);color:var(--gold);line-height:1;min-width:46px}
  .qrow .qt{font-family:var(--disp);font-weight:700;font-size:clamp(17px,2.4vw,24px);color:var(--ink)}
  .qrow .qs2{display:block;font-size:12.5px;color:var(--gray);font-weight:500;letter-spacing:.1em;text-transform:uppercase;margin-top:3px}
  .disc{margin-top:18px;font-size:10.5px;color:var(--dim);letter-spacing:.02em;max-width:660px;margin-left:auto;margin-right:auto;line-height:1.5}
  .promise .p1{font-family:var(--disp);font-size:clamp(24px,4vw,42px);font-weight:600;letter-spacing:-1px;line-height:1.14}
  .promise .p1 .dim{color:var(--dim)}
  .promise .p2{font-family:var(--disp);font-size:clamp(30px,5.2vw,56px);font-weight:800;letter-spacing:-1.6px;line-height:1.05;margin-top:16px}
  .cta-btn{display:inline-block;margin-top:28px;padding:16px 34px;border-radius:13px;border:0;color:#120d02;font-family:var(--disp);font-weight:700;font-size:17px;cursor:pointer;text-decoration:none;background:linear-gradient(180deg,#f3e2a6,#D4AF37);box-shadow:0 10px 36px rgba(212,175,55,.18)}
  .nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-top:1px solid var(--line);background:rgba(8,8,8,.62);backdrop-filter:blur(10px)}
  .nbtn{background:transparent;border:1px solid var(--line2);color:var(--gray);border-radius:10px;width:42px;height:42px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color .12s,color .12s}
  .nbtn:hover{border-color:var(--gold);color:var(--gold-soft)}
  .nbtn:disabled{opacity:.3;cursor:default}
  .count{font-size:12.5px;color:var(--dim);letter-spacing:.06em}.count b{color:var(--ink);font-family:var(--disp);font-size:15px}
  .dots{display:flex;gap:5px;align-items:center}.dot{width:6px;height:6px;border-radius:50%;background:var(--line2);cursor:pointer;transition:.15s}.dot.on{background:var(--gold);transform:scale(1.35)}
  @media(max-width:860px){.dots{display:none}}
  .notes{position:fixed;left:0;right:0;bottom:74px;z-index:28;background:rgba(6,6,6,.97);border-top:1px solid var(--gline);padding:16px 26px 18px;max-height:42vh;overflow:auto;display:none}
  body.notes-on .notes{display:block}
  .notes .nlab{font-family:var(--disp);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:8px}
  .notes .ntext{font-size:13.5px;line-height:1.62;color:#cfccc4;white-space:pre-line;max-width:900px}
  .zone{position:fixed;top:56px;bottom:74px;width:18%;z-index:20;cursor:pointer}.zone.l{left:0}.zone.r{right:0}
  .hint{position:fixed;bottom:76px;left:50%;translate:-50% 0;font-size:10px;color:#3a3a36;z-index:25;letter-spacing:.08em}
  body.notes-on .hint{display:none}
</style>

<body>
  <div class="prog" id="prog"></div>
  <div class="top"><span class="brand">BREEDWISE</span><span class="topR"><button class="ntog" id="ntog" title="Toggle script (N)">Script</button><span class="topmod">BOSS™ · Unveiling</span></span></div>
  <div class="zone l" id="zl"></div><div class="zone r" id="zr"></div>
  <div class="stage" id="stage"></div>
  <div class="notes" id="notes"><div class="nlab">Teleprompter script</div><div class="ntext" id="ntext"></div></div>
  <div class="hint">← → · click sides · swipe · press N for script</div>
  <div class="nav"><button class="nbtn" id="prev">‹</button><div class="dots" id="dots"></div><div class="count"><b id="cur">1</b> / <span id="tot">22</span></div><button class="nbtn" id="next">›</button></div>

<script>
var SLIDES=[
 {html:'<span class="kick">BreedWise presents</span>'
   +'<div class="wordmark gold">BOSS<span class="tm">™</span></div>'
   +'<div class="full">BreedWise Operating System &amp; Standards</div>'
   +'<div class="tagline serif gold">Better Breeding. Better Business. Stronger Programs.</div>',
  note:`Welcome to BOSS, the BreedWise Operating System and Standards. This is something we've been building toward for a long time, and if you've been inside BreedWise Academy, you've actually helped us build it.

Over the last few years we've learned a tremendous amount working directly with breeders. We've seen what people understand, what people struggle with, and what actually gets implemented. We've seen the difference between a breeder who knows what they should be doing and a breeder who has the systems to actually do it consistently.

That realization is what led us here. BOSS is the next evolution of BreedWise. In this module I want to show you exactly what it is, why we built it, how it's going to change the way we teach, and most importantly what this means for you as an existing BreedWise member.`},

 {html:'<span class="kick">Why BOSS</span>'
   +'<div class="huge">INFORMATION WAS<br>NEVER THE<br>END GOAL.</div>'
   +'<div class="editorial gold" style="margin-top:22px">Knowing &ne; Implementing.</div>',
  note:`One of the biggest things we've learned is that most breeders don't simply have an information problem. You can know you need better follow-up. You can know you should understand your litter economics. You can know your records need to be better, that you should prepare differently before a litter, that your buyer process isn't where it needs to be. But knowing those things doesn't mean they're fixed.

That's the distinction I want you to remember throughout everything we do with BOSS: knowing is not the same thing as implementing. Information matters. Education matters. But information was never supposed to be the finish line. The finish line is a better-operated breeding program.`},

 {html:'<span class="kick">The evolution of BreedWise</span>'
   +'<div class="vs"><div class="vscol old"><div class="vt">Before</div><div class="chainflat">LEARN → LEARN → ASK QUESTIONS → LEARN MORE</div></div>'
   +'<div class="vscol new"><div class="vt">BOSS</div><div class="chainflat">ASSESS → PRIORITIZE → IMPLEMENT → MEASURE → REASSESS</div></div></div>'
   +'<p class="foot">We\'re organizing everything around an operating loop, not a growing library of lessons.</p>',
  note:`We're changing the way we think about education inside BreedWise. The traditional model is basically: learn something, learn something else, ask some questions, watch another lesson, and eventually you have a giant library of information.

BOSS is different. We organize everything around an operating loop. Assess: where are you actually at? Prioritize: what matters most right now? Implement: what needs to change? Measure: did you actually implement it, and is it working? And then reassess, because once you improve one area, your next priority may change. That's BOSS.`},

 {html:'<span class="kick">What BOSS actually is</span>'
   +'<h1>An operating system for your <span class="gold">breeding program</span>.</h1>'
   +'<div class="pills"><span class="pill">Breeding</span><span class="pill">Business</span><span class="pill">Systems</span><span class="pill">Standards</span><span class="pill">Measurement</span></div>'
   +'<p class="editorial gold" style="margin-top:26px">Your program shouldn\'t live entirely in your head.</p>',
  note:`BOSS stands for BreedWise Operating System and Standards. I want you to think about the words operating system very intentionally.

Your breeding program shouldn't exist entirely inside your head. You shouldn't have to remember every follow-up, every preparation step, every number, every process, every buyer, every important record, every single thing that has to happen. Because eventually the breeder becomes the system, and when you're the system, everything depends on you remembering what to do next.

BOSS is about creating structure around the way the program actually operates. Breeding. Business. Systems. Standards. Measurement. And implementation.`},

 {html:'<span class="kick">One program. Two engines.</span>'
   +'<div class="two"><div class="eng"><div class="et">Breeding Engine</div><ul><li>Preparation</li><li>Reproduction</li><li>Pregnancy</li><li>Whelping</li><li>Neonatal care</li><li>Genetics + health</li><li>Records + standards</li></ul></div>'
   +'<div class="plus">+</div>'
   +'<div class="eng"><div class="et">Business Engine</div><ul><li>Positioning</li><li>Demand</li><li>Qualified buyers</li><li>Sales</li><li>Economics</li><li>Follow-up</li><li>Operations</li></ul></div></div>'
   +'<p class="foot">Not two separate businesses. <b>One breeding program.</b></p>',
  note:`BOSS recognizes something we've been teaching for a long time: your breeding program has two engines.

There's the breeding engine: preparation, reproduction, pregnancy, whelping, neonatal care, genetics and health, records and standards. And there's the business engine: positioning, demand, qualified buyers, sales, economics, follow-up and operations.

These aren't two separate businesses. They're one breeding program. A strong business gives you the resources to reinvest into your breeding. And strong breeding practices protect the reputation and long-term strength of your business. BOSS brings those two engines together.`},

 {html:'<span class="kick">The BOSS Loop</span>'
   +'<div class="loop">'
   +'<div class="lstep"><span class="ln">01</span><div><b>Assess</b><span>Where are you now?</span></div></div><div class="lconn"></div>'
   +'<div class="lstep"><span class="ln">02</span><div><b>Prioritize</b><span>What matters most right now?</span></div></div><div class="lconn"></div>'
   +'<div class="lstep"><span class="ln">03</span><div><b>Implement</b><span>What needs to change?</span></div></div><div class="lconn"></div>'
   +'<div class="lstep"><span class="ln">04</span><div><b>Measure</b><span>Did it happen? Is it working?</span></div></div><div class="lconn"></div>'
   +'<div class="lstep"><span class="ln">05</span><div><b>Reassess</b><span>What\'s the next constraint?</span></div></div>'
   +'<div class="lrepeat">&#8635; Repeat</div></div>'
   +'<p class="editorial gold">BOSS doesn\'t build everything. BOSS builds what matters next.</p>',
  note:`This is the loop I want you to start memorizing. Assess. Prioritize. Implement. Measure. Reassess.

BOSS is not about trying to fix everything at once. In fact, one of the principles we operate by is: BOSS doesn't build everything, BOSS builds what matters next. You might have ten things that could be better. That doesn't mean you work on all ten today. We need to understand which constraint matters most right now, what system is needed to address it, and what supporting pieces need to be built around it. Then we implement. Then we measure. Then we reassess.`},

 {html:'<span class="kick">This changes how we teach</span>'
   +'<h1>No more <span class="gold">random</span> implementation.</h1>'
   +'<div class="railflow"><span>PROBLEM</span><i>→</i><span>STANDARD</span><i>→</i><span>SYSTEM</span><i>→</i><span>TRAINING</span><i>→</i><span>TOOL</span><i>→</i><span>IMPLEMENTATION</span><i>→</i><span>KPI</span><i>→</i><span>DEFINITION OF DONE</span></div>'
   +'<p class="foot">Not &ldquo;did you watch the lesson?&rdquo; but <b>&ldquo;did something change in your program because of it?&rdquo;</b></p>',
  note:`This changes the way you see education released inside BreedWise. If we teach you something, I want you to be able to answer: Why does this matter? What does good look like? What system supports it? What do I need to learn? What tool helps me do it? What do I actually need to implement? How are we going to measure it? And when can I say this is actually done?

That's a completely different way of learning. Because we're not just asking, did you watch the lesson. We're asking, did something change inside your breeding program because of the lesson.`},

 {html:'<span class="kick">A critical distinction</span>'
   +'<div class="huge">BUILT <span class="neq">&ne;</span> IMPLEMENTED.</div>'
   +'<div class="lines3"><div>A CRM nobody uses is <b>not implemented.</b></div><div>A checklist nobody follows is <b>not implemented.</b></div><div>A process that lives only in your head is <b>not a system.</b></div></div>',
  note:`There's another distinction that's going to become extremely important. Built does not mean implemented.

You can have a beautiful CRM. If nobody uses it, it isn't implemented. You can have a whelping preparation checklist. If you don't actually follow it, it isn't implemented. You can have a spreadsheet for your litter economics. If you never enter your numbers, it isn't implemented. You can have an SOP sitting in Google Drive. If the way you actually operate is completely different, it isn't implemented.

BOSS isn't about collecting more files. It's about changing the way the program operates.`},

 {html:'<span class="kick">The simplest way to say it</span>'
   +'<div class="big-line" style="font-size:clamp(30px,5vw,56px)">KNOWLEDGE IS POTENTIAL.</div>'
   +'<div class="editorial gold" style="font-size:clamp(24px,3.8vw,42px)">Implementation is the asset.</div>',
  note:`This is probably the simplest way I can explain the shift. Knowledge is potential. Implementation is the asset.

Knowing you need better follow-up has potential. Having an inquiry enter your CRM, move through a defined process, receive the appropriate follow-up and get tracked through a measurable pipeline? That's an asset.

Knowing you should understand your litter economics has potential. Actually knowing what your litter produced, what it cost, what you kept, and how that should influence future decisions? That's an asset. That's the difference BOSS is designed to create.`},

 {html:'<span class="kick">The build phase</span>'
   +'<div class="huge">120 DAYS TO BUILD.</div>'
   +'<div class="tl" style="margin-top:28px">'
   +'<div class="tc"><div class="td">DAYS 1–30</div><div class="tt">Assess + Prioritize</div></div>'
   +'<div class="tc"><div class="td">DAYS 31–60</div><div class="tt">Build + Implement</div></div>'
   +'<div class="tc"><div class="td">DAYS 61–90</div><div class="tt">Implement + Measure</div></div>'
   +'<div class="tc"><div class="td">DAYS 91–120</div><div class="tt">Optimize + Reassess</div></div></div>'
   +'<p class="foot">This is the <b>architecture</b> of how BreedWise thinks about implementation.</p>',
  note:`For the full BOSS Implementation experience, we organize the work around a 120-day cycle. The first 30 days are assessing and prioritizing. Days 31 through 60 are building and implementing. Days 61 through 90 are using those systems and beginning to measure them. And days 91 through 120 are optimizing, reassessing and determining what comes next.

Now, because you're an existing Academy member, I don't want you to hear this and assume you've just been automatically enrolled into a new 120-day service. You haven't. I'll explain that distinction in a minute. I'm showing you the architecture because this is how BreedWise is going to begin thinking about implementation.`},

 {html:'<span class="kick">The proof phase</span>'
   +'<div class="huge">120 TO BUILD.</div><div class="small-gold">12 MONTHS TO PROVE.</div>'
   +'<div class="steps4" style="margin-top:28px"><div class="s"><b>Build it</b></div><div class="s"><b>Use it</b></div><div class="s"><b>Measure it</b></div><div class="s"><b>Prove it</b></div></div>'
   +'<p class="editorial gold">Doing something once doesn\'t prove that\'s how you operate.</p>',
  note:`But there's a second half to this. 120 days to build. 12 months to prove. Why? Because doing something once doesn't prove that's how you operate. You can create a system today. Consistency is what tells us whether it has actually become part of your program.

That's why the longer-term BOSS philosophy isn't simply about implementation. It's about operating, optimizing, measuring, and eventually being able to demonstrate the standards by which you actually run your breeding program. And that brings us to certification.`},

 {html:'<span class="kick">Certification</span>'
   +'<h1>Certification should <span class="gold">mean something</span>.</h1>'
   +'<p class="lead strike">Paid → Watched videos → Got a badge.</p>'
   +'<div class="gates"><span class="gate">Knowledge</span><span class="gate">Verification</span><span class="gate">Implementation</span><span class="gate">Audit</span></div>',
  note:`Certification has always mattered to me, and as BreedWise evolves I want it to mean even more. I don't want BreedWise certification to mean: you paid us, you watched some videos, here's a badge. I want certification to stand for something.

Our direction with BOSS is a standards-based model built around four ideas. Knowledge: do you understand the relevant principles? Verification: can the appropriate information or documentation be verified? Implementation: are the applicable systems and practices actually being used? And audit: can we evaluate those things against defined BreedWise standards? That's the direction we're building toward.`},

 {html:'<span class="kick">For existing Academy members</span>'
   +'<h1>We are <span class="gold">not</span> moving the goalposts.</h1>'
   +'<p class="lead">Your existing Academy certification pathway is still honored.</p>'
   +'<p class="foot">If you joined Academy with a certification pathway, your eligibility remains governed by the terms applicable to your Academy enrollment. The evolution of BreedWise does <b>not</b> erase what you already purchased.</p>',
  note:`This next part is extremely important for everyone already inside Academy. We are not moving the goalposts on something you've already purchased.

If you joined BreedWise Academy with a certification pathway as part of your enrollment, your existing Academy certification eligibility remains governed by the terms and requirements applicable to your Academy enrollment. We're not going to suddenly tell you everything changed, start over. That's not what BOSS means.

As we build the new BOSS certification standards, we'll explain that pathway separately and clearly. But I want you to hear this directly from me: the evolution of BreedWise does not mean we're erasing the certification opportunity you already purchased through Academy.`},

 {html:'<span class="kick">What BOSS certification will represent</span>'
   +'<div class="gates" style="margin-bottom:8px"><span class="gate">Knowledge</span><span class="gate">Verification</span><span class="gate">Implementation</span><span class="gate">Audit</span></div>'
   +'<div class="big-line gold">Certification is earned.</div>'
   +'<p class="disc">Evaluates knowledge, preparedness, documented practices, systems, records, implementation, ethics and defined BreedWise standards. It is <b style="color:var(--gray)">not</b> a guarantee of pregnancy, litter size, puppy health or profitability.</p>',
  note:`Going forward, the goal is for BOSS certification to represent something deeper. Not perfection, and absolutely not a guarantee of biological outcomes. A certification cannot guarantee pregnancy. It cannot guarantee litter size. It cannot guarantee that a puppy will never become sick. It cannot guarantee profitability. That's not what responsible certification means.

What we can evaluate are things like knowledge, preparedness, documented practices, systems, records, implementation, ethics and defined BreedWise standards. Certification should be earned through evidence. And if we're going to put the BreedWise name behind something, I want that name to carry weight.`},

 {html:'<span class="kick">What this means for you</span>'
   +'<h1>Academy is <span class="gold">not</span> being renamed BOSS.</h1>'
   +'<p class="lead">You keep your Academy. We\'re adding <b style="color:var(--ink)">BOSS Legacy Access</b>.</p>'
   +'<p class="editorial gold" style="margin-top:22px">We\'re adding to your experience, not taking Academy away.</p>',
  note:`Now let's talk about what all of this means for you. The first thing I want to make extremely clear is: Academy is not simply being renamed BOSS. BOSS is a new BreedWise offer and operating model.

You purchased Academy. We're honoring Academy. Your existing Academy experience doesn't disappear because we created something new. Instead, as an existing member, we're giving you BOSS Legacy Access so you can benefit from the new education, frameworks and applicable resources we're releasing as BreedWise evolves. That's something we're adding to your experience. We're not taking Academy away from you.`},

 {html:'<span class="kick">The distinction to remember</span>'
   +'<div class="huge" style="font-size:clamp(34px,7vw,88px)">ACCESS <span class="neq">&ne;</span><br>IMPLEMENTATION.</div>'
   +'<div class="two" style="margin-top:28px;grid-template-columns:1fr auto 1fr"><div class="eng"><div class="et">Legacy Access</div><ul><li>Learn the system</li><li>Use the frameworks</li><li>Apply what you learn</li></ul></div><div class="plus">&ne;</div><div class="eng"><div class="et">BOSS Implementation</div><ul><li>We build it with you</li><li>Configure the systems</li><li>Support, measure, reassess</li></ul></div></div>'
   +'<p class="foot">A separate service. <b>Not automatic. Not required.</b> We\'ll explain that opportunity separately.</p>',
  note:`There's a distinction I need to make now so there isn't confusion later. Access is not the same thing as implementation.

As an existing Academy member, you're getting access to the new BOSS education as we roll it out. You can learn it. You can use the frameworks. You can apply what you're learning.

The full BOSS Implementation experience is different. That's where our team works directly with a breeder to assess the program, determine the primary constraint, build a personalized implementation plan, configure the applicable systems, support adoption, measure implementation and reassess progress. That is a separate service. You're not automatically purchasing it. You're not required to purchase it. And simply receiving BOSS Legacy Access does not mean you've been automatically enrolled into it. We'll explain that opportunity separately for anyone who wants that level of implementation.`},

 {html:'<span class="kick">Three different questions</span>'
   +'<div class="qs">'
   +'<div class="qrow"><div class="qn">1</div><div><div class="qt">What do I need to know?</div><div class="qs2">Education</div></div></div>'
   +'<div class="qrow"><div class="qn">2</div><div><div class="qt">What do I need to build?</div><div class="qs2">Implementation</div></div></div>'
   +'<div class="qrow"><div class="qn">3</div><div><div class="qt">What do I need to prove?</div><div class="qs2">Evidence · Consistency · Standards</div></div></div></div>'
   +'<p class="foot">Most education stops at number one. <b>BOSS connects all three.</b></p>',
  note:`As you go through BOSS, I want you to start thinking in three different layers. First: what do I need to know? That's education. Second: what do I need to build? That's implementation. And third: what do I need to prove? That's evidence, consistency and eventually standards.

A lot of education stops at number one. BOSS is being designed to connect all three.`},

 {html:'<span class="kick">How I want you to use BOSS</span>'
   +'<div class="big-line" style="font-size:clamp(26px,4.4vw,48px)">LESS CONSUMPTION.</div>'
   +'<div class="editorial gold" style="font-size:clamp(26px,4.4vw,48px);margin-top:4px">More implementation.</div>'
   +'<div class="railflow" style="margin-top:26px"><span>UNDERSTAND</span><i>→</i><span>IDENTIFY</span><i>→</i><span>IMPLEMENT</span><i>→</i><span>DOCUMENT</span><i>→</i><span>MEASURE</span></div>'
   +'<p class="foot">Not &ldquo;did I finish the module?&rdquo; but <b>&ldquo;is this actually how I operate now?&rdquo;</b></p>',
  note:`Here's what I want from you as we start releasing BOSS. Don't binge it. Seriously, this isn't Netflix. I would rather you watch one lesson and change something meaningful inside your breeding program than watch twenty lessons and implement nothing.

When a lesson drops: understand the standard, identify your gap, find the system or tool, implement what applies to you, document it, measure it. And then ask: is this actually how I operate now? Not, did I finish the module. That's the behavior change I want BOSS to create.`},

 {html:'<span class="kick">Your first BOSS assignment</span>'
   +'<h1>Build your <span class="gold">baseline</span>.</h1>'
   +'<ul class="pts"><li>What\'s already working?</li><li>What\'s inconsistent?</li><li>What\'s undocumented?</li><li>What depends entirely on me remembering it?</li><li>What do I know I should be doing that I still haven\'t implemented?</li><li><b>If I could improve one system right now, which would make the biggest difference?</b></li></ul>'
   +'<p class="editorial gold">Clarity before activity.</p>',
  note:`I want to give you one assignment coming out of this module. Before you start trying to fix everything, establish your baseline. Look at your program and ask: What's already working? What's inconsistent? What's undocumented? What depends entirely on me remembering it? What do I know I should be doing that I still haven't implemented?

And then one final question: if I could improve one system inside my breeding program right now, which one would create the biggest difference? Don't worry about having the perfect answer. The purpose is to start thinking like an operator. Because the first principle of BOSS is clarity before activity.`},

 {html:'<span class="kick">What\'s coming next</span>'
   +'<h1>Don\'t rebuild <span class="gold">everything</span>.</h1>'
   +'<div class="steps4" style="margin-top:24px"><div class="s"><b>Assess</b><span>Understand where you are</span></div><div class="s"><b>Prioritize</b><span>Find what matters most</span></div><div class="s"><b>Build from there</b><span>One system at a time</span></div></div>'
   +'<p class="foot">Strong programs aren\'t built through random activity. They\'re built through <b>intentional implementation.</b></p>',
  note:`Over the coming weeks we're going to start releasing BOSS piece by piece. Don't interpret that as permission to tear your entire breeding program apart overnight. That's the opposite of what I want.

Assess first. Understand where you are. Identify what matters most. Then build from there. One priority at a time. One system at a time. One improvement at a time. Because strong programs aren't built through random activity. They're built through intentional implementation.`},

 {cls:'pure',html:'<div class="inner promise">'
   +'<div class="p1">We\'re not building breeders who <span class="dim">simply know more</span>.</div>'
   +'<div class="p2 gold">We\'re building better-operated breeding programs.</div></div>',
  note:`Ultimately, that's what BOSS represents to me. We're not trying to build breeders who simply know more. Knowledge matters, but that's not enough.

We're trying to build breeders who understand their programs. Who know their numbers. Who recognize their gaps. Who have systems. Who prepare intentionally. Who document what matters. Who can measure what they're doing. Who know what needs attention next. And who can eventually demonstrate the standards by which they operate. That's the future of BreedWise.`},

 {html:'<span class="kick">Welcome to BOSS</span>'
   +'<div class="wordmark gold" style="font-size:clamp(64px,13vw,128px)">BOSS<span class="tm">™</span></div>'
   +'<div class="full">BreedWise Operating System &amp; Standards</div>'
   +'<div class="small-gold" style="margin-top:18px">120 DAYS TO BUILD · 12 MONTHS TO PROVE</div>'
   +'<div class="tagline serif gold" style="margin-top:14px">Better Breeding. Better Business. Stronger Programs.</div>'
   +'<a class="cta-btn" href="scorecard.html">Build your baseline →</a>',
  note:`So welcome to BOSS. BreedWise Operating System and Standards. If you're an Academy member, you're part of the group that helped us get here. We're going to honor what you've already purchased. We're going to give you access to where BreedWise is going. And for those who eventually want us more directly involved in implementing the system with you, we'll explain exactly what that opportunity looks like separately.

For right now, your job is simple. Don't try to fix everything. Assess. Prioritize. Implement. Measure. Reassess. Remember: BOSS doesn't build everything, BOSS builds what matters next. 120 days to build. 12 months to prove. Better breeding. Better business. Stronger programs. Welcome to BOSS.`}
];

var i=0;
var stage=document.getElementById('stage'),dots=document.getElementById('dots');
document.getElementById('tot').textContent=SLIDES.length;
function render(){
  stage.innerHTML=SLIDES.map(function(s,n){
    return '<div class="slide'+(s.cls?' '+s.cls:'')+(n===0?' on':'')+'" data-n="'+n+'">'+ (/^\s*<div class="inner/.test(s.html)?s.html:'<div class="inner">'+s.html+'</div>') +'</div>';
  }).join('');
  dots.innerHTML=SLIDES.map(function(_,n){return '<span class="dot'+(n===0?' on':'')+'" data-g="'+n+'"></span>';}).join('');
  Array.prototype.forEach.call(dots.querySelectorAll('.dot'),function(d){d.addEventListener('click',function(){go(+d.getAttribute('data-g'));});});
  update();
}
function update(){
  Array.prototype.forEach.call(stage.querySelectorAll('.slide'),function(el){el.classList.toggle('on',+el.getAttribute('data-n')===i);});
  Array.prototype.forEach.call(dots.querySelectorAll('.dot'),function(el,n){el.classList.toggle('on',n===i);});
  document.body.classList.toggle('pure', !!SLIDES[i].cls);
  document.getElementById('ntext').textContent=SLIDES[i].note||'';
  document.getElementById('cur').textContent=i+1;
  document.getElementById('prog').style.width=((i)/(SLIDES.length-1)*100)+'%';
  document.getElementById('prev').disabled=(i===0);
  document.getElementById('next').disabled=(i===SLIDES.length-1);
}
function go(n){i=Math.max(0,Math.min(SLIDES.length-1,n));update();var sl=stage.querySelector('.slide.on');if(sl)sl.scrollTop=0;document.getElementById('notes').scrollTop=0;}
document.getElementById('next').onclick=function(){go(i+1);};
document.getElementById('prev').onclick=function(){go(i-1);};
document.getElementById('zr').onclick=function(){go(i+1);};
document.getElementById('zl').onclick=function(){go(i-1);};
document.getElementById('ntog').onclick=function(){document.body.classList.toggle('notes-on');};
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(i+1);}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(i-1);}
  else if(e.key==='Home'){go(0);} else if(e.key==='End'){go(SLIDES.length-1);}
  else if(e.key==='n'||e.key==='N'){document.body.classList.toggle('notes-on');}
});
var tx=0;
document.addEventListener('touchstart',function(e){tx=e.changedTouches[0].clientX;},{passive:true});
document.addEventListener('touchend',function(e){var dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>60){dx<0?go(i+1):go(i-1);}},{passive:true});
render();
</script>
</body>
