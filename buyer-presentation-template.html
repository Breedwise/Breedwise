<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Buyer Presentation Template · BreedWise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#100d0a;--panel:#1a1511;--panel2:#221b15;--line:#352a20;--line2:#473626;
    --ink:#f5efe6;--mid:#cabfb0;--muted:#8d8072;
    --gold:#c9a86a;--gold-soft:#e6cf9c;--brown:#6b513a;
    --disp:'Playfair Display',Georgia,serif;--sans:'Inter',-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:radial-gradient(1100px 620px at 50% -12%,rgba(201,168,106,.10),transparent 60%),var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
  .gold{color:var(--gold)}
  .serif{font-family:var(--disp)}
  .ph{color:var(--gold-soft)}
  .top{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--line);background:rgba(16,13,10,.66);backdrop-filter:blur(10px)}
  .brand{font-size:12px;letter-spacing:.24em;font-weight:700;color:var(--mid);text-transform:uppercase}
  .brand b{color:var(--gold)}
  .topR{display:flex;align-items:center;gap:13px}
  .topmod{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .ntog{font-family:var(--sans);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;border:1px solid var(--line);border-radius:7px;padding:5px 9px;cursor:pointer;background:transparent}
  .ntog:hover{color:var(--gold);border-color:var(--line2)}
  body.notes-on .ntog{color:var(--gold);border-color:var(--gold)}
  .prog{position:fixed;top:0;left:0;height:2px;background:linear-gradient(90deg,var(--brown),var(--gold-soft));width:0;z-index:40;transition:width .4s ease}
  .stage{position:absolute;inset:0}
  .slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:76px 32px 90px;opacity:0;transform:translateY(14px);transition:opacity .45s ease,transform .45s ease;pointer-events:none}
  .slide.on{opacity:1;transform:none;pointer-events:auto}
  .inner{max-width:860px;width:100%}
  .tag{display:inline-block;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:700;border:1px solid var(--line2);border-radius:20px;padding:6px 14px;margin-bottom:18px}
  h1{font-family:var(--disp);font-weight:600;font-size:clamp(28px,4.8vw,50px);line-height:1.08;letter-spacing:-.4px}
  .sub{margin-top:14px;font-size:clamp(14px,1.9vw,18px);color:var(--mid);font-weight:300;line-height:1.55;max-width:640px;margin-left:auto;margin-right:auto}
  .say{font-family:var(--disp);font-style:italic;font-size:clamp(17px,2.4vw,24px);color:var(--gold-soft);line-height:1.3;margin-top:18px}
  .pills-line{margin-top:16px;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .logo-ph{width:80px;height:80px;margin:0 auto 22px;border-radius:50%;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;background:var(--panel)}
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:12px 28px;margin:22px auto 0;max-width:620px;text-align:left}
  @media(max-width:600px){.fields{grid-template-columns:1fr}}
  .fr{border-bottom:1px solid var(--line);padding-bottom:9px}
  .fr .l{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:600;display:block}
  .fr .v{font-size:15px;color:var(--ink);margin-top:3px}
  .pillars{display:grid;gap:12px;margin:22px auto 0;max-width:640px;text-align:left}
  .pil{border-left:2px solid var(--gold);padding-left:15px}
  .pil b{font-family:var(--disp);font-size:16px;color:var(--ink);letter-spacing:.02em}
  .pil span{display:block;font-size:12.5px;color:var(--mid);font-weight:300;margin-top:2px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px;text-align:left}
  @media(max-width:640px){.two{grid-template-columns:1fr}}
  .cardm{border:1px solid var(--line);border-radius:14px;padding:18px;background:var(--panel)}
  .cardm .ct{font-family:var(--disp);font-size:18px;color:var(--ink);margin-bottom:8px}
  .cardm .meta{font-size:12px;color:var(--gold-soft);letter-spacing:.06em;margin-bottom:8px}
  .cardm ul{list-style:none;display:grid;gap:5px}
  .cardm ul li{font-size:12.5px;color:var(--mid);padding-left:13px;position:relative}
  .cardm ul li::before{content:"";position:absolute;left:0;top:7px;width:4px;height:4px;background:var(--gold);border-radius:50%}
  .reco{font-family:var(--disp);font-size:clamp(26px,4.4vw,40px);color:var(--gold-soft);margin-top:4px;letter-spacing:.01em}
  .whyline{margin-top:14px;font-size:14px;color:var(--mid);font-weight:300;max-width:620px;margin-left:auto;margin-right:auto}
  .whyline b{color:var(--gold-soft);font-weight:600}
  .flow{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;align-items:center;margin-top:22px}
  .flow .st{border:1px solid var(--line2);border-radius:11px;padding:10px 13px;min-width:92px}
  .flow .st b{font-size:12px;color:var(--ink);font-weight:600;display:block}
  .flow .st span{font-size:10.5px;color:var(--muted)}
  .flow i{color:var(--gold);font-style:normal;font-size:12px}
  .proc{display:grid;gap:11px;margin:22px auto 0;max-width:600px;text-align:left}
  .prow{display:flex;gap:14px;align-items:baseline}
  .prow .n{font-family:var(--disp);font-size:18px;color:var(--gold);min-width:32px}
  .prow b{font-size:15px;color:var(--ink);font-weight:600}
  .prow span{color:var(--muted);font-size:13px;display:block;font-weight:300;margin-top:1px}
  .incl{display:grid;gap:8px;margin:18px auto 0;max-width:520px;text-align:left}
  .incl div{font-size:14px;color:var(--ink);padding-left:24px;position:relative}
  .incl div::before{content:"\2713";position:absolute;left:0;color:var(--gold);font-weight:700}
  .price{font-family:var(--disp);font-size:clamp(34px,6.2vw,56px);color:var(--gold-soft);margin-top:4px}
  .price small{display:block;font-family:var(--sans);font-size:13px;color:var(--muted);font-weight:400;margin-top:4px}
  .three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:22px;text-align:left}
  @media(max-width:700px){.three{grid-template-columns:1fr}}
  .tc{border:1px solid var(--line);border-radius:13px;padding:16px;background:var(--panel)}
  .tc .quo{font-family:var(--disp);font-size:26px;color:var(--gold);line-height:.6}
  .tc p{font-size:12.5px;color:var(--mid);line-height:1.45;margin-top:6px}
  .tc .who{color:var(--muted);font-size:12px;margin-top:8px}
  .tc.yes b{color:var(--gold-soft)}.tc.may b{color:var(--ink)}.tc.no b{color:var(--muted)}
  .tc b{font-family:var(--disp);font-size:16px;display:block;margin-bottom:3px}
  .decide2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:24px;text-align:left}
  @media(max-width:560px){.decide2{grid-template-columns:1fr}}
  .do{border:1px solid var(--line2);border-radius:14px;padding:20px;background:var(--panel)}
  .do.hot{border-color:var(--gold)}
  .do .k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700}
  .do .t{font-family:var(--disp);font-size:19px;margin:5px 0 2px;color:var(--ink)}
  .do .amt{font-family:var(--disp);font-size:26px;color:var(--gold-soft)}
  .do .amt small{font-family:var(--sans);font-size:12px;color:var(--muted);font-weight:400}
  .decide-q{font-family:var(--disp);font-style:italic;font-size:clamp(18px,2.6vw,26px);color:var(--gold-soft);margin-top:24px}
  .pairnote{margin-top:18px;font-size:12px;color:var(--muted);max-width:560px;margin-left:auto;margin-right:auto;line-height:1.5}
  .pairnote a{color:var(--gold-soft);font-weight:600}
  .nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:15px 24px;border-top:1px solid var(--line);background:rgba(16,13,10,.66);backdrop-filter:blur(10px)}
  .nbtn{background:transparent;border:1px solid var(--line2);color:var(--mid);border-radius:10px;width:42px;height:42px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.12s}
  .nbtn:hover{border-color:var(--gold);color:var(--gold-soft)}.nbtn:disabled{opacity:.3;cursor:default}
  .count{font-size:12.5px;color:var(--muted)}.count b{color:var(--ink);font-size:15px}
  .dots{display:flex;gap:5px}.dot{width:6px;height:6px;border-radius:50%;background:var(--line2);cursor:pointer;transition:.15s}.dot.on{background:var(--gold);transform:scale(1.3)}
  @media(max-width:820px){.dots{display:none}}
  .notes{position:fixed;left:0;right:0;bottom:72px;z-index:28;background:rgba(14,11,8,.97);border-top:1px solid var(--gold);padding:15px 26px 17px;max-height:42vh;overflow:auto;display:none}
  body.notes-on .notes{display:block}
  .notes .nl{font-family:var(--sans);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:7px}
  .notes .nt{font-size:13.5px;line-height:1.6;color:#d8cebf;white-space:pre-line;max-width:880px}
  .zone{position:fixed;top:54px;bottom:72px;width:17%;z-index:20;cursor:pointer}.zone.l{left:0}.zone.r{right:0}
  .hint{position:fixed;bottom:74px;left:50%;translate:-50% 0;font-size:10px;color:#4a3d2f;z-index:25;letter-spacing:.08em}
  body.notes-on .hint{display:none}
</style>
</head>
<body>
  <div class="prog" id="prog"></div>
  <div class="top"><span class="brand"><b>BreedWise</b> · Buyer Presentation Template</span><span class="topR"><button class="ntog" id="ntog" title="What to put on this slide (N)">Fill-in guide</button><span class="topmod">BOSS Buyer Systems</span></span></div>
  <div class="zone l" id="zl"></div><div class="zone r" id="zr"></div>
  <div class="stage" id="stage"></div>
  <div class="notes" id="notes"><div class="nl">What goes on this slide</div><div class="nt" id="ntext"></div></div>
  <div class="hint">← → · click sides · press N for the fill-in guide</div>
  <div class="nav"><button class="nbtn" id="prev">‹</button><div class="dots" id="dots"></div><div class="count"><b id="cur">1</b> / <span id="tot">12</span></div><button class="nbtn" id="next">›</button></div>

<script>
var SLIDES=[
 /* 1 — Welcome / Outcome */
 {html:'<div class="logo-ph">Your logo</div>'
   +'<h1>Finding the Right <span class="ph">[ Puppy ]</span><br>for Your Family</h1>'
   +'<div class="pills-line"><span class="ph">[ Your pillars ]</span> &middot; e.g. Quality &middot; Temperament &middot; Health &middot; Service &middot; Family</div>',
  note:`SLIDE 1 — WELCOME / THE OUTCOME
Make it about THEM, not just you. The headline is the outcome the buyer wants, not your story.
Replace: your logo, your breed word, and your own set of pillars.
Rule for the whole deck: never send it cold. Run discovery first, then customize the next slides around what the buyer told you.`},

 /* 2 — Fit (the home) */
 {html:'<span class="tag">01 &middot; Fit &middot; your home</span>'
   +'<h1>Is this the right <span class="gold">fit</span> for your home?</h1>'
   +'<p class="sub">From our conversation, here\'s what matters most to you:</p>'
   +'<div class="fields">'
   +'<div class="fr"><span class="l">Purpose</span><div class="v ph">[ companion / family / ... ]</div></div>'
   +'<div class="fr"><span class="l">Temperament</span><div class="v ph">[ calm / balanced / active ]</div></div>'
   +'<div class="fr"><span class="l">Household</span><div class="v ph">[ who the dog lives with ]</div></div>'
   +'<div class="fr"><span class="l">Lifestyle</span><div class="v ph">[ daily life ]</div></div>'
   +'<div class="fr"><span class="l">Timeline</span><div class="v ph">[ when ]</div></div>'
   +'<div class="fr"><span class="l">Preferences</span><div class="v ph">[ sex, look, etc. ]</div></div>'
   +'</div>'
   +'<p class="say">You told me what you need. Now let me show you what I recommend.</p>',
  note:`SLIDE 2 — FIT: the HOME (the biggest thing most decks miss)
Fill these in from your discovery call. This slide is about the home and the buyer, not the puppy yet.
It bridges DISCOVER to MATCH and flips the psychology from "look at our puppies" to "you told me what you need." This is why the deck can't go out cold.
Keep it distinct from slide 8 (Matching), which is about the puppy.`},

 /* 3 — Our Standard (claim -> evidence) */
 {html:'<span class="tag">02 &middot; Our Standard</span>'
   +'<h1>Our <span class="gold">standard</span></h1>'
   +'<div class="pillars">'
   +'<div class="pil"><b class="ph">[ Pillar 1 ]</b><span>What it means: <span class="ph">[ claim ]</span> &mdash; proof: <span class="ph">[ evidence ]</span></span></div>'
   +'<div class="pil"><b class="ph">[ Pillar 2 ]</b><span>What it means: <span class="ph">[ claim ]</span> &mdash; proof: <span class="ph">[ evidence ]</span></span></div>'
   +'<div class="pil"><b class="ph">[ Pillar 3 ]</b><span>What it means: <span class="ph">[ claim ]</span> &mdash; proof: <span class="ph">[ evidence ]</span></span></div>'
   +'<div class="pil"><b class="ph">[ Pillar 4 ]</b><span>What it means: <span class="ph">[ claim ]</span> &mdash; proof: <span class="ph">[ evidence ]</span></span></div>'
   +'<div class="pil"><b class="ph">[ Pillar 5 ]</b><span>What it means: <span class="ph">[ claim ]</span> &mdash; proof: <span class="ph">[ evidence ]</span></span></div>'
   +'</div>',
  note:`SLIDE 3 — OUR STANDARD
Use your own pillars, but add a one-line PROOF under each. CLAIM to EVIDENCE.
Without proof, pillar words are just claims. The proof line is what makes them believable.`},

 /* 4 — Recommendation */
 {html:'<span class="tag">03 &middot; Recommendation</span>'
   +'<h1 class="serif">Based on what you told us,<br>here\'s our recommendation</h1>'
   +'<div class="reco"><span class="ph">[ Sire ]</span> <span class="gold">&times;</span> <span class="ph">[ Dam ]</span></div>'
   +'<p class="sub">We believe this breeding is a strong fit based on your preferences for <span class="ph">[ _ ]</span>, <span class="ph">[ _ ]</span>, and <span class="ph">[ _ ]</span>.</p>',
  note:`SLIDE 4 — YOUR RECOMMENDED BREEDING (this is MATCH)
You act as the professional and recommend, instead of asking the buyer to figure out which litter they want.
Replace: the pairing, and the 2 to 3 preferences from slide 2 that it matches.`},

 /* 5 — Pairing & Parents (merged why + parents) */
 {html:'<span class="tag">04 &middot; Proof &middot; the pairing</span>'
   +'<h1>Meet the parents, and <span class="gold">why this pairing</span></h1>'
   +'<p class="whyline"><b>Why we chose it:</b> <span class="ph">[ breeding goal ]</span>, to produce <span class="ph">[ temperament / type ]</span>, suited to <span class="ph">[ the home it fits ]</span>.</p>'
   +'<div class="two">'
   +'<div class="cardm"><div class="ct ph">[ Sire name ]</div><div class="meta"><span class="ph">[ height ]</span> &middot; <span class="ph">[ weight ]</span> &middot; <span class="ph">[ registry ]</span></div><ul><li><span class="ph">[ health testing ]</span></li><li><span class="ph">[ temperament ]</span></li><li><span class="ph">[ pedigree / titles ]</span></li></ul></div>'
   +'<div class="cardm"><div class="ct ph">[ Dam name ]</div><div class="meta"><span class="ph">[ height ]</span> &middot; <span class="ph">[ weight ]</span> &middot; <span class="ph">[ registry ]</span></div><ul><li><span class="ph">[ health testing ]</span></li><li><span class="ph">[ temperament ]</span></li><li><span class="ph">[ pedigree / titles ]</span></li></ul></div>'
   +'</div>',
  note:`SLIDE 5 — THE PAIRING & THE PARENTS (this is PROVE)
One slide for the reasoning AND the parents, so you're not saying the same thing twice. Lead with why you chose the pairing, then show the parents with the stats plus verified info only.
Add only what you can substantiate. Parent photos go here in your real deck.`},

 /* 6 — Health & Promise (guarantee) */
 {html:'<span class="tag">05 &middot; Proof &middot; health &amp; promise</span>'
   +'<h1>How we protect <span class="gold">health</span>, and our promise</h1>'
   +'<div class="two">'
   +'<div class="cardm"><div class="ct">How we protect health</div><ul><li><span class="ph">[ health testing / panels ]</span></li><li><span class="ph">[ whelping &amp; neonatal care ]</span></li><li><span class="ph">[ vet checks, vaccines, records ]</span></li></ul></div>'
   +'<div class="cardm"><div class="ct">Our promise to you</div><ul><li><span class="ph">[ health guarantee: what it covers ]</span></li><li>If something goes wrong: <span class="ph">[ what we do ]</span></li><li>Support for life: <span class="ph">[ how ]</span></li></ul></div>'
   +'</div>'
   +'<p class="sub">The honest answer to the question every buyer is quietly asking: what happens if something goes wrong?</p>',
  note:`SLIDE 6 — HEALTH & OUR PROMISE
The risk-reduction beat. A premium buyer's loudest unspoken fear is "what if something goes wrong?" Answer it on its own slide, don't bury it in a bullet.
Replace: your real testing, your guarantee terms, and exactly what happens if there's a problem. Be specific and honest.`},

 /* 7 — Social proof */
 {html:'<span class="tag">06 &middot; Proof &middot; families</span>'
   +'<h1>Families <span class="gold">like yours</span></h1>'
   +'<div class="three">'
   +'<div class="tc"><div class="quo">&ldquo;</div><p class="ph">[ Testimonial: what changed for them ]</p><div class="who ph">[ Family, location ]</div></div>'
   +'<div class="tc"><div class="quo">&ldquo;</div><p class="ph">[ Testimonial ]</p><div class="who ph">[ Family ]</div></div>'
   +'<div class="tc"><div class="quo">&ldquo;</div><p class="ph">[ Testimonial ]</p><div class="who ph">[ Family ]</div></div>'
   +'</div>'
   +'<p class="sub"><span class="ph">[ # ]</span> families placed &middot; <span class="ph">[ # ]</span> five-star reviews</p>',
  note:`SLIDE 7 — FAMILIES LIKE YOURS (social proof)
Testimonials, reviews and placement numbers belong HERE, inside Proof, BEFORE the price. At a premium price, third-party proof is one of the strongest trust drivers you have.
Replace: 2 to 3 real testimonials and your real numbers. Proof earns the price; it can't follow it.`},

 /* 8 — Matching (the puppy) */
 {html:'<span class="tag">07 &middot; Matching &middot; the puppy</span>'
   +'<h1>Finding the right puppy<br><span class="gold">within the litter</span></h1>'
   +'<div class="flow"><div class="st"><b>Temperament</b></div><i>&rarr;</i><div class="st"><b>Lifestyle</b></div><i>&rarr;</i><div class="st"><b>Purpose</b></div><i>&rarr;</i><div class="st"><b>Preferences</b></div></div>'
   +'<p class="sub">We\'ll consider your look and color preferences while matching the puppy that best fits what you\'re looking for.</p>',
  note:`SLIDE 8 — MATCHING: the PUPPY
This is the puppy, not the home (slide 2 was the home). Match on temperament, lifestyle and purpose first; color and look are preferences, not the primary criterion.
This reads far more professional than making color the headline decision.`},

 /* 9 — Timeline */
 {html:'<span class="tag">08 &middot; Timeline</span>'
   +'<h1>What happens <span class="gold">from here</span></h1>'
   +'<div class="flow"><div class="st"><b>Breeding</b><span class="ph">[ date ]</span></div><i>&rarr;</i><div class="st"><b>Confirmation</b><span class="ph">[ date ]</span></div><i>&rarr;</i><div class="st"><b>Birth</b><span class="ph">[ date ]</span></div><i>&rarr;</i><div class="st"><b>Development</b><span class="ph">[ weeks ]</span></div><i>&rarr;</i><div class="st"><b>Selection</b><span class="ph">[ date ]</span></div><i>&rarr;</i><div class="st"><b>Go-home</b><span class="ph">[ week ]</span></div></div>'
   +'<p class="sub">So you always know what comes next.</p>',
  note:`SLIDE 9 — WHAT HAPPENS FROM HERE
Turn your timeline into a visual journey with dates. This answers the biggest unspoken question, "what happens after I give you money?" That's certainty.`},

 /* 10 — Placement Process */
 {html:'<span class="tag">09 &middot; Process</span>'
   +'<h1>Our puppy <span class="gold">placement process</span></h1>'
   +'<div class="proc">'
   +'<div class="prow"><span class="n">01</span><div><b>Qualification</b><span>Make sure we\'re a good fit.</span></div></div>'
   +'<div class="prow"><span class="n">02</span><div><b>Reservation / deposit</b><span>Secure placement per your terms.</span></div></div>'
   +'<div class="prow"><span class="n">03</span><div><b>Litter selection</b><span>Confirm the appropriate breeding.</span></div></div>'
   +'<div class="prow"><span class="n">04</span><div><b>Puppy matching / pick placement</b><span>Complete the applicable selection process.</span></div></div>'
   +'<div class="prow"><span class="n">05</span><div><b>Contract &amp; documentation</b></div></div>'
   +'<div class="prow"><span class="n">06</span><div><b>Go-home &amp; support</b></div></div>'
   +'</div>',
  note:`SLIDE 10 — OUR PLACEMENT PROCESS
Make your steps sequential, 01 to 06, and customize to your own system. This is the transaction path (how they become an owner), distinct from slide 9 (the litter's calendar).`},

 /* 11 — Investment & What's Included */
 {html:'<span class="tag">10 &middot; Investment</span>'
   +'<h1>Your <span class="gold">investment</span></h1>'
   +'<div class="price ph">[ price range ]<small>Depending on the placement</small></div>'
   +'<div class="two" style="margin-top:22px"><div class="cardm"><div class="ct">What\'s included</div><div class="incl" style="margin-top:0"><div class="ph">[ item ]</div><div class="ph">[ item ]</div><div class="ph">[ item ]</div><div>Ongoing support: <span class="ph">[ _ ]</span></div></div></div>'
   +'<div class="cardm"><div class="ct">Terms</div><ul><li>Reservation: <span class="ph">[ amount ]</span></li><li>Balance due: <span class="ph">[ when ]</span></li><li>Transportation: <span class="ph">[ options ]</span></li><li>Contract &amp; terms: <span class="ph">[ _ ]</span></li></ul></div></div>',
  note:`SLIDE 11 — INVESTMENT & WHAT'S INCLUDED (this is CLARIFY)
Price and what's included sit together, so the number lands in context. Keep it transparent: range, reservation, balance, transportation, terms.
Don't hide price until a "magical final moment." By now the buyer understands what they're considering.`},

 /* 12 — Decision */
 {html:'<span class="tag">11 &middot; Decision</span>'
   +'<h1>Which next step is <span class="gold">right for you</span>?</h1>'
   +'<div class="decide2">'
   +'<div class="do hot"><div class="k">Ready to move forward</div><div class="t">Reserve your placement</div><div class="amt ph">[ amount ]</div></div>'
   +'<div class="do"><div class="k">Not ready yet</div><div class="t">Join the waitlist</div><div class="amt ph">[ amount ] <small>credited</small></div></div>'
   +'</div>'

   +'<p class="pairnote">Your deck is the front stage. Pair it with your <a href="buyer-path-builder.html">Buyer Path Builder</a> so every &ldquo;yes&rdquo; here is captured and followed up, not lost in an inbox.</p>',
  note:`SLIDE 12 — YOUR DECISION / NEXT STEP (this is DECIDE)
Offer the two clear paths, then ask the question: "Does this feel like the right fit for you and your family?"
No pressure, just clarity. Not "so are you putting down a deposit?" A legitimate no is a good outcome.
The deck runs Match to Prove to Clarify to Decide; Connect and Discover happen on the call before you ever send it.`}
];

var i=0;
var stage=document.getElementById('stage'),dots=document.getElementById('dots');
document.getElementById('tot').textContent=SLIDES.length;
function render(){
  stage.innerHTML=SLIDES.map(function(s,n){
    return '<div class="slide'+(n===0?' on':'')+'" data-n="'+n+'"><div class="inner">'+s.html+'</div></div>';
  }).join('');
  dots.innerHTML=SLIDES.map(function(_,n){return '<span class="dot'+(n===0?' on':'')+'" data-g="'+n+'"></span>';}).join('');
  Array.prototype.forEach.call(dots.querySelectorAll('.dot'),function(d){d.addEventListener('click',function(){go(+d.getAttribute('data-g'));});});
  update();
}
function update(){
  Array.prototype.forEach.call(stage.querySelectorAll('.slide'),function(el){el.classList.toggle('on',+el.getAttribute('data-n')===i);});
  Array.prototype.forEach.call(dots.querySelectorAll('.dot'),function(el,n){el.classList.toggle('on',n===i);});
  document.getElementById('ntext').textContent=SLIDES[i].note||'';
  document.getElementById('cur').textContent=i+1;
  document.getElementById('prog').style.width=((i)/(SLIDES.length-1)*100)+'%';
  document.getElementById('prev').disabled=(i===0);
  document.getElementById('next').disabled=(i===SLIDES.length-1);
}
function go(n){i=Math.max(0,Math.min(SLIDES.length-1,n));update();document.getElementById('notes').scrollTop=0;}
document.getElementById('next').onclick=function(){go(i+1);};
document.getElementById('prev').onclick=function(){go(i-1);};
document.getElementById('zr').onclick=function(){go(i+1);};
document.getElementById('zl').onclick=function(){go(i-1);};
document.getElementById('ntog').onclick=function(){document.body.classList.toggle('notes-on');};
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(i+1);}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(i-1);}
  else if(e.key==='Home'){go(0);}else if(e.key==='End'){go(SLIDES.length-1);}
  else if(e.key==='n'||e.key==='N'){document.body.classList.toggle('notes-on');}
});
var tx=0;
document.addEventListener('touchstart',function(e){tx=e.changedTouches[0].clientX;},{passive:true});
document.addEventListener('touchend',function(e){var dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>60){dx<0?go(i+1):go(i-1);}},{passive:true});
render();
</script>
