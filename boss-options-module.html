<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Academy → BOSS™ · What You Get, What You Don't, Your Options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#080808;--ink:#F7F5F0;--gray:#A7A7A7;--dim:#6f6f6f;
    --gold:#D4AF37;--gold-soft:#f0dd9a;--gold-deep:#9e7b24;
    --line:rgba(247,245,240,.12);--line2:rgba(247,245,240,.22);--gline:rgba(212,175,55,.38);
    --disp:'Manrope',-apple-system,sans-serif;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Manrope',-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:radial-gradient(1200px 760px at 50% -14%,#17130a,#080808 60%),var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
  body.pure{background:#050505}
  .gold{background:linear-gradient(162deg,#f3e2a6 0%,#D4AF37 44%,#9e7b24 70%,#eccf82 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .serif{font-family:var(--serif);font-style:italic;font-weight:600}
  .top{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:15px 24px;border-bottom:1px solid var(--line);background:rgba(8,8,8,.62);backdrop-filter:blur(10px)}
  .brand{font-family:var(--disp);font-size:13px;letter-spacing:.26em;font-weight:800;color:var(--ink)}
  .topR{display:flex;align-items:center;gap:14px}
  .topmod{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .ntog{font-family:var(--disp);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:700;border:1px solid var(--line);border-radius:7px;padding:5px 9px;cursor:pointer;background:transparent}
  .ntog:hover{color:var(--gold);border-color:var(--gline)}
  body.notes-on .ntog{color:var(--gold);border-color:var(--gline)}
  .prog{position:fixed;top:0;left:0;height:2px;background:linear-gradient(90deg,var(--gold-deep),var(--gold-soft));width:0;z-index:40;transition:width .4s ease}
  .stage{position:absolute;inset:0}
  .slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:84px 30px 96px;opacity:0;transform:translateY(16px) scale(.995);transition:opacity .5s cubic-bezier(.2,.7,.2,1),transform .5s cubic-bezier(.2,.7,.2,1);pointer-events:none}
  .slide.on{opacity:1;transform:none;pointer-events:auto}
  .inner{max-width:940px;width:100%}
  .kick{display:inline-block;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:22px}
  h1{font-family:var(--disp);font-weight:800;font-size:clamp(28px,5vw,54px);line-height:1.06;letter-spacing:-1.1px}
  .huge{font-family:var(--disp);font-weight:800;font-size:clamp(40px,8vw,100px);line-height:.98;letter-spacing:-3px}
  .lead{margin-top:20px;font-size:clamp(15px,2.1vw,20px);color:var(--gray);font-weight:400;line-height:1.5;max-width:720px;margin-left:auto;margin-right:auto}
  .lead b{color:var(--ink);font-weight:700}
  .foot{margin-top:24px;font-size:14px;color:var(--gray);line-height:1.55;max-width:740px;margin-left:auto;margin-right:auto}
  .foot b{color:var(--ink);font-weight:700}
  .editorial{font-family:var(--serif);font-style:italic;font-weight:600;font-size:clamp(20px,3.2vw,34px);line-height:1.2;margin-top:16px}
  .big-line{font-family:var(--disp);font-weight:800;font-size:clamp(20px,3vw,30px);letter-spacing:-.6px;margin-top:24px;line-height:1.1}
  .neq{color:var(--gold)}
  .hero-sub{font-family:var(--disp);font-size:clamp(14px,2vw,19px);color:var(--gray);font-weight:600;margin-top:16px;letter-spacing:.02em}
  ul.inc,ul.exc{list-style:none;display:grid;gap:8px;margin-top:20px;max-width:640px;margin-left:auto;margin-right:auto;text-align:left}
  ul.inc li,ul.exc li{font-size:14.5px;padding-left:28px;position:relative;color:var(--gray);line-height:1.4}
  ul.inc li::before{content:"✓";position:absolute;left:0;color:var(--gold);font-weight:800}
  ul.exc li::before{content:"✕";position:absolute;left:0;color:#8a5a5a;font-weight:800}
  .tblwrap{margin-top:20px;max-height:60vh;overflow:auto;border:1px solid var(--line);border-radius:14px}
  table.lanes{width:100%;border-collapse:collapse;font-size:12.5px;min-width:620px}
  table.lanes th,table.lanes td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line)}
  table.lanes thead th{position:sticky;top:0;background:#0d0d0d;font-family:var(--disp);font-weight:700;font-size:11px;letter-spacing:.04em;color:var(--ink)}
  table.lanes thead th.up{color:var(--gold)}
  table.lanes td.rl{color:var(--gray);font-weight:500}
  table.lanes td{color:var(--gray)}
  .yes{color:var(--gold);font-weight:800}.no{color:#6a6a6a}
  .up-col{background:rgba(212,175,55,.05)}
  .stack{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:20px;max-width:800px;margin-left:auto;margin-right:auto;text-align:left}
  @media(max-width:640px){.stack{grid-template-columns:1fr}}
  .st{border:1px solid var(--line);border-radius:13px;padding:15px 16px}
  .st .sh{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:7px}
  .st ul{list-style:none;display:grid;gap:5px}
  .st ul li{font-size:12.8px;color:var(--gray);padding-left:14px;position:relative}
  .st ul li::before{content:"";position:absolute;left:0;top:7px;width:5px;height:5px;background:var(--gold);border-radius:50%}
  .prices{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px;max-width:640px;margin-left:auto;margin-right:auto}
  @media(max-width:560px){.prices{grid-template-columns:1fr}}
  .pc{border:1px solid var(--line2);border-radius:16px;padding:22px;text-align:left}
  .pc.legacy{border-color:var(--gline)}
  .pc .pl{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gray);font-weight:700}
  .pc .pt{font-family:var(--disp);font-size:15px;font-weight:700;margin:4px 0 8px}
  .pc .pp{font-family:var(--disp);font-size:34px;font-weight:800}
  .pc.legacy .pp{color:var(--gold-soft)}
  .vflow{display:grid;gap:0;max-width:440px;margin:20px auto 0;text-align:center}
  .vf{font-size:13.5px;color:var(--ink);border:1px solid var(--line);border-radius:11px;padding:11px 14px}
  .vf b{font-family:var(--disp);font-weight:700}
  .vf.sub{color:var(--gray);font-size:12.5px;border-style:dashed}
  .vf.gold{border-color:var(--gline);color:var(--gold-soft)}
  .va{color:var(--gold);font-size:13px;margin:4px 0}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px;max-width:760px;margin-left:auto;margin-right:auto;text-align:left}
  @media(max-width:620px){.two{grid-template-columns:1fr}}
  .opt{border:1px solid var(--line2);border-radius:16px;padding:20px}
  .opt.hot{border-color:var(--gline)}
  .opt .on{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700}
  .opt .ot{font-family:var(--disp);font-size:18px;font-weight:700;margin:4px 0 6px}
  .opt p{font-size:12.5px;color:var(--gray);line-height:1.5}
  .opt .price{margin-top:12px;font-family:var(--disp);font-size:14px;font-weight:700;color:var(--gold-soft)}
  .opt .price small{color:var(--dim);font-weight:400;font-size:12px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:22px;max-width:820px;margin-left:auto;margin-right:auto;text-align:left}
  @media(max-width:700px){.grid3{grid-template-columns:1fr}}
  .grid3 .g{border:1px solid var(--line);border-radius:13px;padding:16px}
  .grid3 .g b{font-family:var(--disp);font-size:14px;font-weight:700;display:block;margin-bottom:5px}
  .grid3 .g span{font-size:12.5px;color:var(--gray);line-height:1.45}
  .choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px;text-align:left}
  @media(max-width:760px){.choices{grid-template-columns:1fr}}
  .ch{border:1px solid var(--line);border-radius:14px;padding:18px}
  .ch.mid{border-color:var(--gline)}
  .ch .cn{font-family:var(--disp);font-size:11px;letter-spacing:.1em;color:var(--gold);font-weight:700}
  .ch .ct{font-family:var(--disp);font-size:16px;font-weight:700;margin:6px 0 2px}
  .ch .cp{font-size:11.5px;color:var(--gray);line-height:1.45;margin-top:6px}
  .ch .cline{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--gold-soft);margin-top:8px}
  .promise .p2{font-family:var(--disp);font-size:clamp(28px,5vw,52px);font-weight:800;letter-spacing:-1.4px;line-height:1.06;margin-top:10px}
  .disc{margin-top:18px;font-size:10.5px;color:var(--dim);letter-spacing:.02em;max-width:680px;margin-left:auto;margin-right:auto;line-height:1.5}
  .cta-btn{display:inline-block;margin-top:26px;padding:15px 32px;border-radius:13px;border:0;color:#120d02;font-family:var(--disp);font-weight:700;font-size:16px;cursor:pointer;text-decoration:none;background:linear-gradient(180deg,#f3e2a6,#D4AF37);box-shadow:0 10px 36px rgba(212,175,55,.18)}
  .nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-top:1px solid var(--line);background:rgba(8,8,8,.62);backdrop-filter:blur(10px)}
  .nbtn{background:transparent;border:1px solid var(--line2);color:var(--gray);border-radius:10px;width:42px;height:42px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color .12s,color .12s}
  .nbtn:hover{border-color:var(--gold);color:var(--gold-soft)}
  .nbtn:disabled{opacity:.3;cursor:default}
  .count{font-size:12.5px;color:var(--dim);letter-spacing:.06em}.count b{color:var(--ink);font-family:var(--disp);font-size:15px}
  .dots{display:flex;gap:5px;align-items:center}.dot{width:6px;height:6px;border-radius:50%;background:var(--line2);cursor:pointer;transition:.15s}.dot.on{background:var(--gold);transform:scale(1.35)}
  @media(max-width:860px){.dots{display:none}}
  .notes{position:fixed;left:0;right:0;bottom:74px;z-index:28;background:rgba(6,6,6,.97);border-top:1px solid var(--gline);padding:16px 26px 18px;max-height:42vh;overflow:auto;display:none}
  body.notes-on .notes{display:block}
  .notes .nlab{font-family:var(--disp);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:8px}
  .notes .ntext{font-size:13.5px;line-height:1.62;color:#cfccc4;white-space:pre-line;max-width:900px}
  .zone{position:fixed;top:56px;bottom:74px;width:18%;z-index:20;cursor:pointer}.zone.l{left:0}.zone.r{right:0}
  .hint{position:fixed;bottom:76px;left:50%;translate:-50% 0;font-size:10px;color:#3a3a36;z-index:25;letter-spacing:.08em}
  body.notes-on .hint{display:none}
</style>
</head>
<body>
  <div class="prog" id="prog"></div>
  <div class="top"><span class="brand">BREEDWISE</span><span class="topR"><button class="ntog" id="ntog" title="Toggle script (N)">Script</button><span class="topmod">BOSS™ · Your Options</span></span></div>
  <div class="zone l" id="zl"></div><div class="zone r" id="zr"></div>
  <div class="stage" id="stage"></div>
  <div class="notes" id="notes"><div class="nlab">Teleprompter script · DRAFT (counsel to review)</div><div class="ntext" id="ntext"></div></div>
  <div class="hint">← → · click sides · swipe · press N for script</div>
  <div class="nav"><button class="nbtn" id="prev">‹</button><div class="dots" id="dots"></div><div class="count"><b id="cur">1</b> / <span id="tot">13</span></div><button class="nbtn" id="next">›</button></div>

<script>
var SLIDES=[
 {html:'<span class="kick">The practical follow-up</span>'
   +'<h1>Academy <span class="gold">→</span> BOSS™</h1>'
   +'<div class="hero-sub">What You Get · What You Don\'t · Your Options</div>'
   +'<p class="foot">In the unveiling we covered what BOSS is. This one is short and practical: exactly what changes for you as an Academy member, and the choices in front of you. <b>Nothing here is required.</b></p>',
  note:`In the unveiling, I covered what BOSS is and where BreedWise is going. This module is shorter and more practical. I want to answer three questions very directly: what you get as an existing member, what you don't automatically get, and what your options are. Nothing in here is something you're required to do.`},

 {html:'<span class="kick">Start from what\'s true</span>'
   +'<h1>You keep your Academy.<br>We\'re <span class="gold">adding</span> BOSS Legacy Access.</h1>'
   +'<p class="lead">Academy is not being renamed BOSS. Your enrollment, your access and your existing certification pathway stay intact. BOSS Legacy Access is something we\'re <b>adding</b> on top.</p>',
  note:`Let's start from what's true. You keep your Academy. Academy is not being renamed BOSS. Your enrollment, your access, and your existing certification pathway all stay intact. BOSS Legacy Access is something we are adding on top of what you already have. We're not taking anything away.`},

 {html:'<div class="inner"><span class="kick">Three lanes · no confusion</span>'
   +'<h1 style="font-size:clamp(24px,4vw,40px)">What each member actually gets</h1>'
   +'<div class="tblwrap"><table class="lanes"><thead><tr><th></th><th>Academy + Legacy Access</th><th class="up">BOSS Implementation Upgrade</th><th>BOSS Continuation</th></tr></thead><tbody>'
   +'<tr><td class="rl">Cost</td><td>No additional</td><td class="up-col">Paid upgrade</td><td>Monthly</td></tr>'
   +'<tr><td class="rl">Duration</td><td>Through Academy term*</td><td class="up-col">Fresh 120 days</td><td>Month-to-month</td></tr>'
   +'<tr><td class="rl">BOSS curriculum + tools</td><td class="yes">✓</td><td class="up-col yes">✓</td><td class="yes">✓</td></tr>'
   +'<tr><td class="rl">Community + group support</td><td class="yes">✓</td><td class="up-col yes">✓</td><td class="yes">✓</td></tr>'
   +'<tr><td class="rl">Personalized 120-day roadmap</td><td class="no">—</td><td class="up-col yes">✓</td><td>Updated roadmaps</td></tr>'
   +'<tr><td class="rl">Dedicated BOSS project mgmt</td><td class="no">—</td><td class="up-col yes">✓</td><td>Member Success</td></tr>'
   +'<tr><td class="rl">Private implementation channel</td><td class="no">—</td><td class="up-col yes">✓</td><td class="no">—</td></tr>'
   +'<tr><td class="rl">Private strategy sessions</td><td class="no">—</td><td class="up-col yes">✓</td><td class="no">—</td></tr>'
   +'<tr><td class="rl">Website build</td><td class="no">—</td><td class="up-col yes">✓</td><td class="no">—</td></tr>'
   +'<tr><td class="rl">CRM + lead-mgmt setup</td><td class="no">—</td><td class="up-col yes">✓</td><td class="no">—</td></tr>'
   +'<tr><td class="rl">30/60/90/120 reviews</td><td class="no">—</td><td class="up-col yes">✓</td><td>Periodic reassess</td></tr>'
   +'<tr><td class="rl">Implementation Report</td><td class="no">—</td><td class="up-col yes">✓</td><td class="no">—</td></tr>'
   +'<tr><td class="rl">Automatic conversion</td><td class="no">—</td><td class="up-col no">—</td><td>Opt-in only</td></tr>'
   +'</tbody></table></div><p class="disc">*A minimum transition window applies if a term expires shortly after launch. DRAFT: deliverables and terms pending counsel review of legacy agreement language.</p></div>',
  note:`Here's the clearest way to see it: three lanes. Lane one is Academy plus Legacy Access, which is what you already have, at no additional cost. Lane two is the BOSS Implementation Upgrade, a paid, done-with-you build on a fresh 120-day clock. Lane three is BOSS Continuation, an optional month-to-month option after your term.

The top rows are shared across all three: the BOSS curriculum, tools, community and group support. Everything below the line, the personalized roadmap, dedicated project management, private channel, strategy sessions, website build, CRM setup, the reviews and the Implementation Report, is the high-touch layer that only comes with the Implementation Upgrade. And nothing automatically converts.`},

 {html:'<span class="kick">Lane 1 · what you get</span>'
   +'<h1>As an Academy member, you get <span class="gold">BOSS Legacy Access</span>.</h1>'
   +'<ul class="inc"><li>New BOSS curriculum as it\'s released</li><li>BOSS frameworks and standards</li><li>Applicable BOSS tools, templates and resources</li><li>Your existing Academy community, calls and support</li><li>Existing expert education included in Academy</li><li>Access through your existing term or defined transition window</li></ul>'
   +'<p class="editorial gold">We\'re adding to your experience, not taking Academy away.</p>',
  note:`Lane one, what you get. As an existing Academy member you get BOSS Legacy Access: the new BOSS curriculum as it's released, the frameworks and standards, the applicable tools and templates, plus everything you already have in Academy, your community, your calls, your support, and the expert education included in your membership. This runs through your existing term or a defined transition window. Again, this is added to your experience.`},

 {html:'<span class="kick">The distinction that prevents confusion</span>'
   +'<div class="huge" style="font-size:clamp(34px,7vw,88px)">ACCESS <span class="neq">&ne;</span><br>IMPLEMENTATION.</div>'
   +'<p class="foot" style="margin-top:24px"><b>Legacy Access does not automatically include:</b></p>'
   +'<ul class="exc" style="margin-top:12px"><li>A new 120-day BOSS Implementation enrollment</li><li>A newly built BreedWise website</li><li>CRM and lead-management configuration</li><li>Done-with-you system configuration</li><li>A private BOSS implementation channel</li><li>Private strategy sessions and dedicated project management</li><li>BOSS 30/60/90/120 reviews or a personalized Implementation Report</li></ul>'
   +'<p class="editorial gold">You get the operating system. The upgrade is us building it with you.</p>',
  note:`Here's the distinction that prevents confusion later. Access is not the same thing as implementation. Legacy Access gives you the education and the system. It does not automatically include a new 120-day implementation enrollment, a built website, CRM and lead-management configuration, done-with-you setup, a private implementation channel, private strategy sessions, dedicated project management, or the 30/60/90/120 reviews and Implementation Report. You get the operating system. The upgrade is where we build it with you.`},

 {html:'<span class="kick">Lane 2 · the upgrade</span>'
   +'<div class="big-line gold" style="font-size:clamp(26px,5vw,52px);margin-top:0">BOSS IMPLEMENTATION™</div>'
   +'<div class="hero-sub" style="color:var(--gold-soft)">120 days · we build it with you</div>'
   +'<div class="stack" style="margin-top:20px">'
   +'<div class="st"><div class="sh">Personalized</div><ul><li>BOSS Baseline Assessment</li><li>120-day implementation pathway</li><li>Priorities, milestones, KPIs</li></ul></div>'
   +'<div class="st"><div class="sh">Built + configured</div><ul><li>BreedWise website</li><li>CRM + lead-management</li><li>Workflows + progress dashboard</li></ul></div>'
   +'<div class="st"><div class="sh">High-touch</div><ul><li>Private implementation channel</li><li>Dedicated project management</li><li>Private strategy + expert sessions</li><li>30/60/90/120 reviews</li></ul></div>'
   +'<div class="st"><div class="sh">Measured</div><ul><li>KPI tracking</li><li>Day-120 reassessment</li><li>Implementation Report + next roadmap</li></ul></div></div>',
  note:`Lane two is the BOSS Implementation Upgrade. This is the done-with-you experience on a fresh 120-day clock. It's personalized: a baseline assessment, a 120-day pathway, priorities and KPIs. It's built and configured: your website, your CRM and lead-management, your workflows and dashboard. It's high-touch: a private channel, dedicated project management, private strategy and expert sessions, and reviews at 30, 60, 90 and 120 days. And it's measured, ending in a reassessment, an Implementation Report, and your next roadmap.`},

 {html:'<span class="kick">Lane 2 · the numbers</span>'
   +'<h1>The <span class="gold">upgrade</span></h1>'
   +'<div class="prices"><div class="pc"><div class="pl">New customer</div><div class="pt">BOSS Implementation</div><div class="pp">$6,000</div></div>'
   +'<div class="pc legacy"><div class="pl">Current Academy member</div><div class="pt">Implementation Upgrade</div><div class="pp">+$3,000</div></div></div>'
   +'<p class="foot">You already invested in the education, community and tools that overlap with BOSS. The upgrade charges for the incremental done-with-you implementation layer, not for everything again.</p>'
   +'<p class="disc">DRAFT numbers: a strategic recommendation, not covered by the existing Academy agreement. Existing Academy obligations remain governed by that agreement unless counsel drafts a signed amendment. Confirm fulfillment economics before publishing.</p>',
  note:`If you want lane two, here are the numbers we're planning. For a brand-new customer, BOSS Implementation is six thousand dollars. For an existing Academy member, the upgrade is an additional three thousand, because you already invested in the education, community and tools that overlap with BOSS. You're only paying for the incremental done-with-you layer, not for everything again. These numbers are a recommendation we're still finalizing, and nothing about your existing Academy agreement changes unless you choose to sign a separate upgrade.`},

 {html:'<span class="kick">What happens if I upgrade</span>'
   +'<div class="vflow">'
   +'<div class="vf">Today · <b>Academy member</b></div><div class="va">↓</div>'
   +'<div class="vf gold">Opt in + sign the BOSS agreement</div><div class="va">↓</div>'
   +'<div class="vf"><b>Day 1</b> · new BOSS Baseline</div><div class="va">↓</div>'
   +'<div class="vf sub">Days 1–30 Assess · 31–60 Build · 61–90 Measure · 91–120 Optimize</div><div class="va">↓</div>'
   +'<div class="vf"><b>Day 120</b> · Implementation Report + next roadmap</div><div class="va">↓</div>'
   +'<div class="vf gold">Then you choose: conclude, or continue</div></div>'
   +'<p class="foot">A fresh 120-day clock from your upgrade date. Prior Academy months aren\'t counted as if you already received the new implementation deliverables.</p>',

var i=0;
var stage=document.getElementById('stage'),dots=document.getElementById('dots');
document.getElementById('tot').textContent=SLIDES.length;
function render(){
  stage.innerHTML=SLIDES.map(function(s,n){
    return '<div class="slide'+(s.cls?' '+s.cls:'')+(n===0?' on':'')+'" data-n="'+n+'">'+ (/^\s*<div class="inner/.test(s.html)?s.html:'<div class="inner">'+s.html+'</div>') +'</div>';
  }).join('');
  dots.innerHTML=SLIDES.map(function(_,n){return '<span class="dot'+(n===0?' on':'')+'" data-g="'+n+'"></span>';}).join('');
  Array.prototype.forEach.call(dots.querySelectorAll('.dot'),function(d){d.addEventListener('click',function(){go(+d.getAttribute('data-g'));});});
  update();
}
function update(){
  Array.prototype.forEach.call(stage.querySelectorAll('.slide'),function(el){el.classList.toggle('on',+el.getAttribute('data-n')===i);});
  Array.prototype.forEach.call(dots.querySelectorAll('.dot'),function(el,n){el.classList.toggle('on',n===i);});
  document.body.classList.toggle('pure', !!SLIDES[i].cls);
  document.getElementById('ntext').textContent=SLIDES[i].note||'';
  document.getElementById('cur').textContent=i+1;
  document.getElementById('prog').style.width=((i)/(SLIDES.length-1)*100)+'%';
  document.getElementById('prev').disabled=(i===0);
  document.getElementById('next').disabled=(i===SLIDES.length-1);
}
function go(n){i=Math.max(0,Math.min(SLIDES.length-1,n));update();var sl=stage.querySelector('.slide.on');if(sl)sl.scrollTop=0;document.getElementById('notes').scrollTop=0;}
document.getElementById('next').onclick=function(){go(i+1);};
document.getElementById('prev').onclick=function(){go(i-1);};
document.getElementById('zr').onclick=function(){go(i+1);};
document.getElementById('zl').onclick=function(){go(i-1);};
document.getElementById('ntog').onclick=function(){document.body.classList.toggle('notes-on');};
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(i+1);}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(i-1);}
  else if(e.key==='Home'){go(0);} else if(e.key==='End'){go(SLIDES.length-1);}
  else if(e.key==='n'||e.key==='N'){document.body.classList.toggle('notes-on');}
});
var tx=0;
document.addEventListener('touchstart',function(e){tx=e.changedTouches[0].clientX;},{passive:true});
document.addEventListener('touchend',function(e){var dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>60){dx<0?go(i+1):go(i-1);}},{passive:true});
render();
</script>
