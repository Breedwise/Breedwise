<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Buyer Presentation Template · BreedWise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#100d0a;--panel:#1a1511;--panel2:#221b15;--line:#352a20;--line2:#473626;
    --ink:#f5efe6;--mid:#cabfb0;--muted:#8d8072;
    --gold:#c9a86a;--gold-soft:#e6cf9c;--gline:rgba(201,168,106,.4);--brown:#6b513a;
    --disp:'Playfair Display',Georgia,serif;--sans:'Inter',-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:radial-gradient(1100px 620px at 50% -12%,rgba(201,168,106,.10),transparent 60%),var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
  .gold{color:var(--gold)}
  .serif{font-family:var(--disp)}
  /* editable field */
  .f{color:var(--gold-soft);outline:none;border-radius:3px;cursor:text;transition:background .1s}
  .f:hover{background:rgba(201,168,106,.09)}
  .f:focus{background:rgba(201,168,106,.14);box-shadow:0 0 0 1px var(--gline)}
  .f.filled{color:inherit}
  .f.ex{color:var(--mid);font-style:italic}
  .top{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--line);background:rgba(16,13,10,.72);backdrop-filter:blur(10px)}
  .brand{font-size:11.5px;letter-spacing:.2em;font-weight:700;color:var(--mid);text-transform:uppercase}
  .brand b{color:var(--gold)}
  .topR{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .tbtn{font-family:var(--sans);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;border:1px solid var(--line);border-radius:7px;padding:6px 10px;cursor:pointer;background:transparent}
  .tbtn:hover{color:var(--gold);border-color:var(--line2)}
  .tbtn.on{color:var(--gold);border-color:var(--gold)}
  .tbtn.p{color:#1a130a;background:linear-gradient(135deg,#e6cf9c,#b2894f);border-color:transparent}
  .saved{font-size:10px;color:var(--muted);align-self:center;margin-left:2px}
  .saved.on{color:#8fbf8a}
  .prog{position:fixed;top:0;left:0;height:2px;background:linear-gradient(90deg,var(--brown),var(--gold-soft));width:0;z-index:40;transition:width .4s ease}
  .stage{position:absolute;inset:0}
  .slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:78px 32px 90px;opacity:0;transform:translateY(14px);transition:opacity .45s ease,transform .45s ease;pointer-events:none}
  .slide.on{opacity:1;transform:none;pointer-events:auto}
  .inner{max-width:860px;width:100%}
  .tag{display:inline-block;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:700;border:1px solid var(--line2);border-radius:20px;padding:6px 14px;margin-bottom:18px}
  h1{font-family:var(--disp);font-weight:600;font-size:clamp(28px,4.8vw,50px);line-height:1.08;letter-spacing:-.4px}
  .sub{margin-top:14px;font-size:clamp(14px,1.9vw,18px);color:var(--mid);font-weight:300;line-height:1.55;max-width:640px;margin-left:auto;margin-right:auto}
  .say{font-family:var(--disp);font-style:italic;font-size:clamp(17px,2.4vw,24px);color:var(--gold-soft);line-height:1.3;margin-top:18px}
  .pills-line{margin-top:16px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .logo-ph{width:80px;height:80px;margin:0 auto 22px;border-radius:50%;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;background:var(--panel)}
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:12px 28px;margin:22px auto 0;max-width:620px;text-align:left}
  @media(max-width:600px){.fields{grid-template-columns:1fr}}
  .fr{border-bottom:1px solid var(--line);padding-bottom:9px}
  .fr .l{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:600;display:block}
  .fr .v{font-size:15px;color:var(--ink);margin-top:3px}
  .pillars{display:grid;gap:12px;margin:22px auto 0;max-width:640px;text-align:left}
  .pil{border-left:2px solid var(--gold);padding-left:15px}
  .pil b{font-family:var(--disp);font-size:16px;color:var(--ink);letter-spacing:.02em}
  .pil .d{display:block;font-size:12.5px;color:var(--mid);font-weight:300;margin-top:2px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px;text-align:left}
  @media(max-width:640px){.two{grid-template-columns:1fr}}
  .cardm{border:1px solid var(--line);border-radius:14px;padding:18px;background:var(--panel)}
  .cardm .ct{font-family:var(--disp);font-size:18px;color:var(--ink);margin-bottom:8px}
  .cardm .meta{font-size:12px;color:var(--mid);letter-spacing:.04em;margin-bottom:8px}
  .cardm ul{list-style:none;display:grid;gap:5px}
  .cardm ul li{font-size:12.5px;color:var(--mid);padding-left:13px;position:relative}
  .cardm ul li::before{content:"";position:absolute;left:0;top:7px;width:4px;height:4px;background:var(--gold);border-radius:50%}
  .reco{font-family:var(--disp);font-size:clamp(26px,4.4vw,40px);color:var(--ink);margin-top:4px;letter-spacing:.01em}
  .whyline{margin-top:14px;font-size:14px;color:var(--mid);font-weight:300;max-width:620px;margin-left:auto;margin-right:auto}
  .whyline b{color:var(--gold-soft);font-weight:600}
  .flow{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;align-items:center;margin-top:22px}
  .flow .st{border:1px solid var(--line2);border-radius:11px;padding:10px 13px;min-width:92px}
  .flow .st b{font-size:12px;color:var(--ink);font-weight:600;display:block}
  .flow .st .dt{font-size:10.5px;color:var(--muted)}
  .flow i{color:var(--gold);font-style:normal;font-size:12px}
  .proc{display:grid;gap:11px;margin:22px auto 0;max-width:600px;text-align:left}
  .prow{display:flex;gap:14px;align-items:baseline}
  .prow .n{font-family:var(--disp);font-size:18px;color:var(--gold);min-width:32px}
  .prow b{font-size:15px;color:var(--ink);font-weight:600}
  .prow .d{color:var(--muted);font-size:13px;display:block;font-weight:300;margin-top:1px}
  .incl{display:grid;gap:8px;margin:0;text-align:left}
  .incl .ic{font-size:14px;color:var(--ink);padding-left:24px;position:relative}
  .incl .ic::before{content:"\2713";position:absolute;left:0;color:var(--gold);font-weight:700}
  .price{font-family:var(--disp);font-size:clamp(34px,6.2vw,56px);color:var(--ink);margin-top:4px}
  .price small{display:block;font-family:var(--sans);font-size:13px;color:var(--muted);font-weight:400;margin-top:4px}
  .three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:22px;text-align:left}
  @media(max-width:700px){.three{grid-template-columns:1fr}}
  .tc{border:1px solid var(--line);border-radius:13px;padding:16px;background:var(--panel)}
  .tc .quo{font-family:var(--disp);font-size:26px;color:var(--gold);line-height:.6}
  .tc p{font-size:12.5px;color:var(--mid);line-height:1.45;margin-top:6px}
  .tc .who{color:var(--muted);font-size:12px;margin-top:8px}
  .decide2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:24px;text-align:left}
  @media(max-width:560px){.decide2{grid-template-columns:1fr}}
  .do{border:1px solid var(--line2);border-radius:14px;padding:20px;background:var(--panel)}
  .do.hot{border-color:var(--gold)}
  .do .k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700}
  .do .t{font-family:var(--disp);font-size:19px;margin:5px 0 2px;color:var(--ink)}
  .do .amt{font-family:var(--disp);font-size:26px;color:var(--ink)}
  .do .amt small{font-family:var(--sans);font-size:12px;color:var(--muted);font-weight:400}
  .decide-q{font-family:var(--disp);font-style:italic;font-size:clamp(18px,2.6vw,26px);color:var(--gold-soft);margin-top:24px}
  .pairnote{margin-top:18px;font-size:12px;color:var(--muted);max-width:560px;margin-left:auto;margin-right:auto;line-height:1.5}
  .pairnote a{color:var(--gold-soft);font-weight:600}
  .nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:15px 24px;border-top:1px solid var(--line);background:rgba(16,13,10,.66);backdrop-filter:blur(10px)}
  .nbtn{background:transparent;border:1px solid var(--line2);color:var(--mid);border-radius:10px;width:42px;height:42px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.12s}
  .nbtn:hover{border-color:var(--gold);color:var(--gold-soft)}.nbtn:disabled{opacity:.3;cursor:default}
  .count{font-size:12.5px;color:var(--muted)}.count b{color:var(--ink);font-size:15px}
  .dots{display:flex;gap:5px}.dot{width:6px;height:6px;border-radius:50%;background:var(--line2);cursor:pointer;transition:.15s}.dot.on{background:var(--gold);transform:scale(1.3)}
  @media(max-width:820px){.dots{display:none}}
  .notes{position:fixed;left:0;right:0;bottom:72px;z-index:28;background:rgba(14,11,8,.97);border-top:1px solid var(--gold);padding:15px 26px 17px;max-height:42vh;overflow:auto;display:none}
  body.notes-on .notes{display:block}
  .notes .nl{font-family:var(--sans);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:7px}
  .notes .nt{font-size:13.5px;line-height:1.6;color:#d8cebf;white-space:pre-line;max-width:880px}
  .zone{position:fixed;top:54px;bottom:72px;width:13%;z-index:20;cursor:pointer}.zone.l{left:0}.zone.r{right:0}
  .hint{position:fixed;bottom:74px;left:50%;translate:-50% 0;font-size:10px;color:#4a3d2f;z-index:25;letter-spacing:.07em;text-align:center}
  body.notes-on .hint{display:none}
  @media print{
    @page{size:landscape;margin:0}
    .top,.nav,.hint,.notes,.zone,.prog{display:none!important}
    body{overflow:visible;background:#100d0a!important;height:auto;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .stage{position:static}
    .slide{position:static!important;opacity:1!important;transform:none!important;display:flex!important;min-height:100vh;page-break-after:always;break-after:page}
    .slide:last-child{page-break-after:auto}
    .f{box-shadow:none!important;background:none!important}
  }
</style>
</head>
<body>
  <div class="prog" id="prog"></div>
  <div class="top"><span class="brand"><b>BreedWise</b> · Buyer Presentation Template</span>
    <span class="topR">
      <button class="tbtn" id="exBtn" title="Show a worked example">Show example</button>
      <button class="tbtn" id="ntog" title="What to put on this slide (N)">Fill-in guide</button>
      <button class="tbtn" id="resetBtn" title="Clear everything you typed">Reset</button>
      <button class="tbtn p" id="pdfBtn" title="Download / print to PDF">Download PDF</button>
      <span class="saved" id="savedlbl">Autosaves</span>
    </span>
  </div>
  <div class="zone l" id="zl"></div><div class="zone r" id="zr"></div>
  <div class="stage" id="stage"></div>
  <div class="notes" id="notes"><div class="nl">What goes on this slide</div><div class="nt" id="ntext"></div></div>
  <div class="hint">Click any gold text to type · ← → to move · N for the guide · Download PDF when done</div>
  <div class="nav"><button class="nbtn" id="prev">‹</button><div class="dots" id="dots"></div><div class="count"><b id="cur">1</b> / <span id="tot">12</span></div><button class="nbtn" id="next">›</button></div>

<script>
function F(ex,txt){return '<span class="f" data-ex="'+ex+'">'+txt+'</span>';}
var SLIDES=[
 /* 1 */
 {html:'<div class="logo-ph">Your logo</div>'
   +'<h1>Finding the Right '+F('Golden Retriever','[ Puppy ]')+'<br>for Your Family</h1>'
   +'<div class="pills-line">'+F('Quality · Temperament · Health · Service · Family','[ Your pillars ]')+'</div>',
  note:`SLIDE 1 — WELCOME / THE OUTCOME
Make it about THEM, not just you. The headline is the outcome the buyer wants, not your story.
Fill in: your breed word and your own pillars. (Your logo goes in the circle in your real deck.)
Rule for the whole deck: never send it cold. Run discovery first, then customize the next slides around what the buyer told you.`},

 /* 2 — Fit (home) */
 {html:'<span class="tag">01 · Fit · your home</span>'
   +'<h1>Is this the right <span class="gold">fit</span> for your home?</h1>'
   +'<p class="sub">From our conversation, here\'s what matters most to you:</p>'
   +'<div class="fields">'
   +'<div class="fr"><span class="l">Purpose</span><div class="v">'+F('Family companion','[ companion / family / ... ]')+'</div></div>'
   +'<div class="fr"><span class="l">Temperament</span><div class="v">'+F('Calm, confident','[ calm / balanced / active ]')+'</div></div>'
   +'<div class="fr"><span class="l">Household</span><div class="v">'+F('Family with two kids','[ who the dog lives with ]')+'</div></div>'
   +'<div class="fr"><span class="l">Lifestyle</span><div class="v">'+F('Active, weekends outdoors','[ daily life ]')+'</div></div>'
   +'<div class="fr"><span class="l">Timeline</span><div class="v">'+F('This spring','[ when ]')+'</div></div>'
   +'<div class="fr"><span class="l">Preferences</span><div class="v">'+F('Female, lighter coat','[ sex, look, etc. ]')+'</div></div>'
   +'</div>'
   +'<p class="say">You told me what you need. Now let me show you what I recommend.</p>',
  note:`SLIDE 2 — FIT: the HOME (the biggest thing most decks miss)
Fill these in live, from your discovery call. This slide is about the home and the buyer, not the puppy yet.
It flips the psychology from "look at our puppies" to "you told me what you need." This is why the deck can't go out cold.
Keep it distinct from slide 8 (Matching), which is about the puppy.`},

 /* 3 — Standard */
 {html:'<span class="tag">02 · Our Standard</span>'
   +'<h1>Our <span class="gold">standard</span></h1>'
   +'<div class="pillars">'
   +'<div class="pil"><b>'+F('Quality','[ Pillar 1 ]')+'</b><span class="d">What it means: '+F('Structurally sound, bred to standard','[ claim ]')+' · proof: '+F('Independent evaluations on file','[ evidence ]')+'</span></div>'
   +'<div class="pil"><b>'+F('Temperament','[ Pillar 2 ]')+'</b><span class="d">What it means: '+F('Stable, family-safe dogs','[ claim ]')+' · proof: '+F('Early socialization, temperament tested','[ evidence ]')+'</span></div>'
   +'<div class="pil"><b>'+F('Health','[ Pillar 3 ]')+'</b><span class="d">What it means: '+F('Fully health-tested lines','[ claim ]')+' · proof: '+F('OFA hips, elbows, eyes, heart','[ evidence ]')+'</span></div>'
   +'<div class="pil"><b>'+F('Service','[ Pillar 4 ]')+'</b><span class="d">What it means: '+F('Guided from inquiry to go-home','[ claim ]')+' · proof: '+F('Reply within a day, clear process','[ evidence ]')+'</span></div>'
   +'<div class="pil"><b>'+F('Family','[ Pillar 5 ]')+'</b><span class="d">What it means: '+F('Support for the dog whole life','[ claim ]')+' · proof: '+F('Take-back policy, any time','[ evidence ]')+'</span></div>'
   +'</div>',
  note:`SLIDE 3 — OUR STANDARD
Use your own pillars, but add a one-line PROOF under each. CLAIM to EVIDENCE.
Without proof, pillar words are just claims. The proof line is what makes them believable.`},

 /* 4 — Recommendation */
 {html:'<span class="tag">03 · Recommendation</span>'
   +'<h1 class="serif">Based on what you told us,<br>here\'s our recommendation</h1>'
   +'<div class="reco">'+F('Ranger','[ Sire ]')+' <span class="gold">&times;</span> '+F('Willow','[ Dam ]')+'</div>'
   +'<p class="sub">We believe this breeding is a strong fit based on your preferences for '+F('temperament','[ _ ]')+', '+F('size','[ _ ]')+', and '+F('timing','[ _ ]')+'.</p>',
  note:`SLIDE 4 — YOUR RECOMMENDED BREEDING (this is MATCH)
You act as the professional and recommend, instead of asking the buyer to figure out which litter they want.
Fill in: the pairing, and the 2 to 3 preferences from slide 2 that it matches.`},

 /* 5 — Pairing & Parents */
 {html:'<span class="tag">04 · Proof · the pairing</span>'
   +'<h1>Meet the parents, and <span class="gold">why this pairing</span></h1>'
   +'<p class="whyline"><b>Why we chose it:</b> '+F('healthy, steady family companions','[ breeding goal ]')+', to produce '+F('a calm temperament and sound structure','[ temperament / type ]')+', suited to '+F('an active family home','[ the home it fits ]')+'.</p>'
   +'<div class="two">'
   +'<div class="cardm"><div class="ct">'+F('Ranger','[ Sire name ]')+'</div><div class="meta">'+F('24 in','[ height ]')+' · '+F('70 lbs','[ weight ]')+' · '+F('AKC','[ registry ]')+'</div><ul><li>'+F('OFA hips Good, elbows normal','[ health testing ]')+'</li><li>'+F('Steady, biddable','[ temperament ]')+'</li><li>'+F('Champions in 3 generations','[ pedigree / titles ]')+'</li></ul></div>'
   +'<div class="cardm"><div class="ct">'+F('Willow','[ Dam name ]')+'</div><div class="meta">'+F('22 in','[ height ]')+' · '+F('60 lbs','[ weight ]')+' · '+F('AKC','[ registry ]')+'</div><ul><li>'+F('OFA clearances complete','[ health testing ]')+'</li><li>'+F('Gentle, attentive','[ temperament ]')+'</li><li>'+F('Health-tested dam line','[ pedigree / titles ]')+'</li></ul></div>'
   +'</div>',
  note:`SLIDE 5 — THE PAIRING & THE PARENTS (this is PROVE)
One slide for the reasoning AND the parents, so you are not saying the same thing twice. Lead with why you chose the pairing, then show the parents with stats plus verified info only.
Add only what you can substantiate. Parent photos go here in your real deck.`},

 /* 6 — Health & Promise */
 {html:'<span class="tag">05 · Proof · health &amp; promise</span>'
   +'<h1>How we protect <span class="gold">health</span>, and our promise</h1>'
   +'<div class="two">'
   +'<div class="cardm"><div class="ct">How we protect health</div><ul><li>'+F('Full OFA panel on both parents','[ health testing / panels ]')+'</li><li>'+F('Vet-attended whelping, daily weights','[ whelping &amp; neonatal care ]')+'</li><li>'+F('Vaccines, deworming, vet exam before go-home','[ vet checks, vaccines, records ]')+'</li></ul></div>'
   +'<div class="cardm"><div class="ct">Our promise to you</div><ul><li>'+F('2-year genetic health guarantee','[ health guarantee: what it covers ]')+'</li><li>If something goes wrong: '+F('replacement or refund per contract','[ what we do ]')+'</li><li>Support for life: '+F('a breeder you can call, any time','[ how ]')+'</li></ul></div>'
   +'</div>'
   +'<p class="sub">The honest answer to the question every buyer is quietly asking: what happens if something goes wrong?</p>',
  note:`SLIDE 6 — HEALTH & OUR PROMISE
The risk-reduction beat. A premium buyer's loudest unspoken fear is "what if something goes wrong?" Answer it on its own slide, do not bury it in a bullet.
Fill in: your real testing, your guarantee terms, and exactly what happens if there is a problem. Be specific and honest.`},

 /* 7 — Social proof */
 {html:'<span class="tag">06 · Proof · families</span>'
   +'<h1>Families <span class="gold">like yours</span></h1>'
   +'<div class="three">'
   +'<div class="tc"><div class="quo">&ldquo;</div><p>'+F('Our pup settled in within a day and is wonderful with our toddler.','[ Testimonial: what changed for them ]')+'</p><div class="who">'+F('The Harpers, Ohio','[ Family, location ]')+'</div></div>'
   +'<div class="tc"><div class="quo">&ldquo;</div><p>'+F('The health testing and support made the price easy to understand.','[ Testimonial ]')+'</p><div class="who">'+F('Maria G.','[ Family ]')+'</div></div>'
   +'<div class="tc"><div class="quo">&ldquo;</div><p>'+F('Best breeder experience we have had, start to finish.','[ Testimonial ]')+'</p><div class="who">'+F('The Delgados','[ Family ]')+'</div></div>'
   +'</div>'
   +'<p class="sub">'+F('120+','[ # ]')+' families placed · '+F('40+','[ # ]')+' five-star reviews</p>',
  note:`SLIDE 7 — FAMILIES LIKE YOURS (social proof)
Testimonials, reviews and placement numbers belong HERE, inside Proof, BEFORE the price. At a premium price, third-party proof is one of your strongest trust drivers.
Fill in: 2 to 3 real testimonials and your real numbers. Proof earns the price; it can't follow it.`},

 /* 8 — Matching (puppy) */
 {html:'<span class="tag">07 · Matching · the puppy</span>'
   +'<h1>Finding the right puppy<br><span class="gold">within the litter</span></h1>'
   +'<div class="flow"><div class="st"><b>Temperament</b></div><i>&rarr;</i><div class="st"><b>Lifestyle</b></div><i>&rarr;</i><div class="st"><b>Purpose</b></div><i>&rarr;</i><div class="st"><b>Preferences</b></div></div>'
   +'<p class="sub">We\'ll consider your look and color preferences while matching the puppy that best fits what you\'re looking for.</p>',
  note:`SLIDE 8 — MATCHING: the PUPPY
This is the puppy, not the home (slide 2 was the home). Match on temperament, lifestyle and purpose first; color and look are preferences, not the primary criterion.
This reads far more professional than making color the headline decision.`},

 /* 9 — Timeline */
 {html:'<span class="tag">08 · Timeline</span>'
   +'<h1>What happens <span class="gold">from here</span></h1>'

var i=0,exOn=false,saved={},saveT;
var stage=document.getElementById('stage'),dots=document.getElementById('dots');
document.getElementById('tot').textContent=SLIDES.length;
try{saved=JSON.parse(localStorage.getItem('bw-bpt-deck')||'{}')||{};}catch(e){saved={};}
function persist(){try{localStorage.setItem('bw-bpt-deck',JSON.stringify(saved));}catch(e){}var s=document.getElementById('savedlbl');if(s){s.textContent='Saved';s.classList.add('on');clearTimeout(saveT);saveT=setTimeout(function(){s.textContent='Autosaves';s.classList.remove('on');},1100);}}

function render(){
  stage.innerHTML=SLIDES.map(function(s,n){
    return '<div class="slide'+(n===0?' on':'')+'" data-n="'+n+'"><div class="inner">'+s.html+'</div></div>';
  }).join('');
  dots.innerHTML=SLIDES.map(function(_,n){return '<span class="dot'+(n===0?' on':'')+'" data-g="'+n+'"></span>';}).join('');
  Array.prototype.forEach.call(dots.querySelectorAll('.dot'),function(d){d.addEventListener('click',function(){go(+d.getAttribute('data-g'));});});
  Array.prototype.forEach.call(document.querySelectorAll('.f'),function(el,idx){
    var k='k'+idx; el.setAttribute('data-k',k); el.setAttribute('data-def',el.textContent); el.setAttribute('contenteditable','true'); el.spellcheck=false;
    if(saved[k]!=null && String(saved[k]).trim()!==''){el.textContent=saved[k]; el.classList.add('filled');}
    el.addEventListener('input',function(){var v=el.textContent; if(v.trim()){saved[k]=v; el.classList.add('filled'); el.classList.remove('ex');} else {delete saved[k]; el.classList.remove('filled');} persist();});
    el.addEventListener('blur',function(){ if(el.textContent.trim()===''){ el.textContent=(exOn && el.getAttribute('data-ex'))?el.getAttribute('data-ex'):el.getAttribute('data-def'); el.classList.toggle('ex', exOn && !!el.getAttribute('data-ex')); el.classList.remove('filled'); }});
    el.addEventListener('keydown',function(e){ e.stopPropagation(); if(e.key==='Enter'){e.preventDefault(); el.blur();} });
    el.addEventListener('focus',function(){ if(el.classList.contains('ex')){ el.textContent=''; el.classList.remove('ex'); } });
  });
  update();
}
function update(){
  Array.prototype.forEach.call(stage.querySelectorAll('.slide'),function(el){el.classList.toggle('on',+el.getAttribute('data-n')===i);});
  Array.prototype.forEach.call(dots.querySelectorAll('.dot'),function(el,n){el.classList.toggle('on',n===i);});
  document.getElementById('ntext').textContent=SLIDES[i].note||'';
  document.getElementById('cur').textContent=i+1;
  document.getElementById('prog').style.width=((i)/(SLIDES.length-1)*100)+'%';
  document.getElementById('prev').disabled=(i===0);
  document.getElementById('next').disabled=(i===SLIDES.length-1);
}
function go(n){i=Math.max(0,Math.min(SLIDES.length-1,n));update();document.getElementById('notes').scrollTop=0;}
function setExample(on){
  exOn=on; document.getElementById('exBtn').classList.toggle('on',on);
  document.getElementById('exBtn').textContent=on?'Hide example':'Show example';
  Array.prototype.forEach.call(document.querySelectorAll('.f'),function(el){
    if(el.classList.contains('filled'))return;
    if(on && el.getAttribute('data-ex')){el.textContent=el.getAttribute('data-ex'); el.classList.add('ex');}
    else {el.textContent=el.getAttribute('data-def'); el.classList.remove('ex');}
  });
}
document.getElementById('next').onclick=function(){go(i+1);};
document.getElementById('prev').onclick=function(){go(i-1);};
document.getElementById('zr').onclick=function(){go(i+1);};
document.getElementById('zl').onclick=function(){go(i-1);};
document.getElementById('ntog').onclick=function(){document.body.classList.toggle('notes-on');};
document.getElementById('exBtn').onclick=function(){setExample(!exOn);};
document.getElementById('pdfBtn').onclick=function(){window.print();};
document.getElementById('resetBtn').onclick=function(){
  if(!confirm('Clear everything you have typed into this deck? This cannot be undone.'))return;
  saved={}; try{localStorage.removeItem('bw-bpt-deck');}catch(e){}
  Array.prototype.forEach.call(document.querySelectorAll('.f'),function(el){el.classList.remove('filled','ex'); el.textContent=el.getAttribute('data-def');});
  exOn=false; document.getElementById('exBtn').classList.remove('on'); document.getElementById('exBtn').textContent='Show example';
};
document.addEventListener('keydown',function(e){
  if(document.activeElement && document.activeElement.isContentEditable) return;
  if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(i+1);}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(i-1);}
  else if(e.key==='Home'){go(0);}else if(e.key==='End'){go(SLIDES.length-1);}
  else if(e.key==='n'||e.key==='N'){document.body.classList.toggle('notes-on');}
});
var tx=0;
document.addEventListener('touchstart',function(e){tx=e.changedTouches[0].clientX;},{passive:true});
document.addEventListener('touchend',function(e){if(document.activeElement&&document.activeElement.isContentEditable)return;var dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>60){dx<0?go(i+1):go(i-1);}},{passive:true});
render();
</script>
</body>
</html>
