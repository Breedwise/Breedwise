<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Welcome to BOSS™ · BreedWise Operating System &amp; Standards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#060608;--ink:#f5f5f7;--mid:#a1a1a6;--dim:#6e6e73;--faint:#48484c;
    --line:rgba(255,255,255,.12);--line2:rgba(255,255,255,.22);
    --disp:'Space Grotesk',-apple-system,sans-serif;--sans:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:radial-gradient(1200px 760px at 50% -14%,#1c1c21,#060608 62%),var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
  body.pure{background:#000}
  .metal{background:linear-gradient(162deg,#ffffff 0%,#e9e9ee 26%,#9a9aa2 54%,#cfcfd6 72%,#f4f4f8 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 1px rgba(0,0,0,.45))}
  /* chrome / top bar */
  .top{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:15px 24px;border-bottom:1px solid var(--line);background:rgba(6,6,8,.6);backdrop-filter:blur(10px)}
  .brand{font-family:var(--disp);font-size:13px;letter-spacing:.26em;font-weight:700;color:var(--mid)}
  .topmod{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:500}
  .prog{position:fixed;top:0;left:0;height:2px;background:linear-gradient(90deg,#6e6e73,#f5f5f7);width:0;z-index:40;transition:width .4s ease}
  /* stage + slides */
  .stage{position:absolute;inset:0}
  .slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:84px 30px 96px;opacity:0;transform:translateY(16px) scale(.995);transition:opacity .5s cubic-bezier(.2,.7,.2,1),transform .5s cubic-bezier(.2,.7,.2,1);pointer-events:none}
  .slide.on{opacity:1;transform:none;pointer-events:auto}
  .inner{max-width:920px;width:100%}
  .kick{display:inline-block;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim);font-weight:600;margin-bottom:24px}
  h1{font-family:var(--disp);font-weight:600;font-size:clamp(30px,5.4vw,60px);line-height:1.04;letter-spacing:-1.4px}
  .lead{margin-top:20px;font-size:clamp(16px,2.2vw,21px);color:var(--mid);font-weight:300;line-height:1.5;max-width:720px;margin-left:auto;margin-right:auto}
  .lead.strike{text-decoration:line-through;text-decoration-color:var(--faint);color:var(--dim)}
  .foot{margin-top:26px;font-size:14.5px;color:var(--mid);font-weight:300;line-height:1.55;max-width:720px;margin-left:auto;margin-right:auto}
  .foot.big{font-family:var(--disp);font-size:clamp(18px,2.6vw,24px);color:var(--ink);font-weight:500}
  .big-line{font-family:var(--disp);font-weight:600;font-size:clamp(24px,3.6vw,40px);letter-spacing:-.8px;margin-top:34px;line-height:1.1}
  .neq{color:var(--dim)}
  /* hero */
  .wordmark{font-family:var(--disp);font-weight:700;font-size:clamp(84px,17vw,170px);line-height:.9;letter-spacing:-5px}
  .wordmark .tm{font-size:.26em;vertical-align:super;letter-spacing:0}
  .full{font-family:var(--disp);font-size:clamp(16px,2.4vw,23px);color:var(--mid);font-weight:400;letter-spacing:.02em;margin-top:18px}
  .tagline{margin-top:20px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:600}
  /* pills / lists */
  .pills{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:24px}
  .pill{font-size:13px;color:var(--mid);border:1px solid var(--line2);border-radius:30px;padding:9px 16px;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.01));font-weight:500}
  ul.pts,ol.pts{list-style:none;counter-reset:n;display:grid;gap:11px;margin-top:24px;max-width:640px;margin-left:auto;margin-right:auto;text-align:left}
  ul.pts li,ol.pts li{position:relative;padding-left:26px;font-size:clamp(15px,2vw,18px);color:var(--mid);line-height:1.4}
  ul.pts li::before{content:"";position:absolute;left:0;top:10px;width:7px;height:7px;background:linear-gradient(180deg,#fff,#8a8a90);border-radius:1px;transform:rotate(45deg)}
  ol.pts{counter-reset:n}ol.pts li{padding-left:34px}
  ol.pts li::before{counter-increment:n;content:counter(n,decimal-leading-zero);position:absolute;left:0;top:1px;font-family:var(--disp);font-size:13px;color:var(--ink);font-weight:600}
  ul.pts li b,ol.pts li b{color:var(--ink);font-weight:600}
  /* chain / rail flow */
  .chainflat{display:inline-block;font-family:var(--disp);font-size:clamp(13px,1.8vw,16px);color:var(--ink);letter-spacing:.01em;border:1px solid var(--line);border-radius:12px;padding:13px 18px;background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01))}
  .chainflat.metalborder{border-color:var(--line2);background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.02))}
  .railflow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin-top:24px;max-width:760px;margin-left:auto;margin-right:auto}
  .railflow span{font-family:var(--disp);font-size:13px;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:8px 12px;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.01))}
  .railflow i{color:var(--dim);font-style:normal;font-size:12px}
  .vs{display:grid;gap:14px;margin-top:26px;max-width:720px;margin-left:auto;margin-right:auto}
  .vscol .vt{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin-bottom:8px}
  .vscol.old .vt{color:var(--faint)}.vscol.new .vt{color:var(--mid)}
  .vscol.old .chainflat{color:var(--dim);border-style:dashed}
  /* engines */
  .two{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:stretch;margin-top:26px;max-width:800px;margin-left:auto;margin-right:auto}
  @media(max-width:640px){.two{grid-template-columns:1fr}.two .plus{display:none}}
  .eng,.opt{border:1px solid var(--line2);border-radius:16px;padding:22px;text-align:left;background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.012))}
  .eng .et{font-family:var(--disp);font-size:18px;font-weight:600;margin-bottom:8px}
  .eng .ed{font-size:13px;color:var(--mid);line-height:1.5}
  .plus{display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:26px;color:var(--dim)}
  /* loop */
  .loop{display:grid;gap:0;max-width:560px;margin:26px auto 0;text-align:left}
  .lstep{display:flex;gap:16px;align-items:center;padding:12px 0}
  .lstep .ln{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:600;font-size:15px;background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.02));color:var(--ink)}
  .lstep b{font-family:var(--disp);font-size:17px;font-weight:600;display:inline-block;min-width:118px}
  .lstep span{color:var(--mid);font-size:14px}
  .lconn{width:1px;height:12px;background:var(--line2);margin-left:21px}
  .lrepeat{display:inline-flex;align-items:center;gap:8px;margin-left:8px;margin-top:8px;font-family:var(--disp);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  /* compare */
  .cmp{display:grid;gap:12px;margin-top:24px;max-width:780px;margin-left:auto;margin-right:auto}
  .cr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:620px){.cr{grid-template-columns:1fr}}
  .cr .know{font-size:14px;color:var(--dim);border:1px dashed var(--line);border-radius:12px;padding:14px 16px;text-align:left;font-style:italic}
  .cr .boss{font-size:14px;color:var(--ink);border:1px solid var(--line2);border-radius:12px;padding:14px 16px;text-align:left;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.015))}
  /* timeline */
  .tl{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:26px}
  @media(max-width:720px){.tl{grid-template-columns:1fr 1fr}}
  .tc{border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.01))}
  .tc .td{font-family:var(--disp);font-size:12px;color:var(--dim);letter-spacing:.06em}
  .tc .tt{font-family:var(--disp);font-size:16px;font-weight:600;margin:5px 0 4px}
  .tc .tp{font-size:12.5px;color:var(--mid);line-height:1.45}
  .steps4{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:24px}
  .steps4 .s{border:1px solid var(--line2);border-radius:12px;padding:12px 16px;min-width:140px;background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.012))}
  .steps4 .s b{font-family:var(--disp);font-size:15px;display:block}
  .steps4 .s span{font-size:12px;color:var(--mid)}
  /* gates */
  .gates{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:24px}
  .gate{font-family:var(--disp);font-size:14px;color:var(--ink);border:1px solid var(--line2);border-radius:12px;padding:12px 18px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.015));letter-spacing:.01em}
  /* grid4 */
  .grid4{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px;max-width:780px;margin-left:auto;margin-right:auto;text-align:left}
  @media(max-width:620px){.grid4{grid-template-columns:1fr}}
  .grid4 .g{border:1px solid var(--line);border-radius:13px;padding:16px;background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01))}
  .grid4 .g b{font-family:var(--disp);font-size:15px;display:block;margin-bottom:4px}
  .grid4 .g span{font-size:13px;color:var(--mid);line-height:1.45}
  .opt{position:relative}
  .opt .on{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:700}
  .opt .ot{font-family:var(--disp);font-size:19px;font-weight:600;margin:4px 0 6px}
  .opt p{font-size:13px;color:var(--mid);line-height:1.5}
  .opt.hot{border-color:rgba(255,255,255,.4)}
  .opt .price{margin-top:12px;font-family:var(--disp);font-size:14px;color:var(--ink)}
  .opt .price small{color:var(--dim);font-weight:400;font-size:12px}
  /* promise (black) */
  .promise .p1{font-family:var(--disp);font-size:clamp(26px,4.4vw,46px);font-weight:500;letter-spacing:-1px;line-height:1.1}
  .promise .p1 .dim{color:var(--dim)}
  .promise .p2{font-family:var(--disp);font-size:clamp(30px,5.2vw,58px);font-weight:700;letter-spacing:-1.6px;line-height:1.05;margin-top:18px}
  .promise .tagline{margin-top:28px}
  /* cta */
  .cta-btn{display:inline-block;margin-top:30px;padding:16px 34px;border-radius:13px;border:1px solid var(--line2);color:#060608;font-family:var(--disp);font-weight:600;font-size:17px;cursor:pointer;text-decoration:none;background:linear-gradient(180deg,#ffffff,#d3d3d9);box-shadow:0 10px 36px rgba(255,255,255,.1)}
  /* nav */
  .nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-top:1px solid var(--line);background:rgba(6,6,8,.6);backdrop-filter:blur(10px)}
  .nbtn{background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:1px solid var(--line2);color:var(--mid);border-radius:10px;width:42px;height:42px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color .12s,color .12s}
  .nbtn:hover{border-color:#fff;color:#fff}
  .nbtn:disabled{opacity:.3;cursor:default}
  .count{font-size:12.5px;color:var(--dim);letter-spacing:.06em}
  .count b{color:var(--ink);font-family:var(--disp);font-size:15px}
  .dots{display:flex;gap:6px;align-items:center}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--line2);cursor:pointer;transition:background .15s,transform .15s}
  .dot.on{background:#fff;transform:scale(1.4)}
  @media(max-width:720px){.dots{display:none}}
  .zone{position:fixed;top:56px;bottom:74px;width:22%;z-index:20;cursor:pointer}.zone.l{left:0}.zone.r{right:0}
  .hint{position:fixed;bottom:76px;left:50%;translate:-50% 0;font-size:10.5px;color:#3a3a3e;z-index:25;letter-spacing:.08em}
</style>
</head>
<body>
  <div class="prog" id="prog"></div>
  <div class="top"><span class="brand">BREEDWISE</span><span class="topmod">BOSS™ · Week 1</span></div>
  <div class="zone l" id="zl"></div><div class="zone r" id="zr"></div>
  <div class="stage" id="stage"></div>
  <div class="hint">← → · click sides · swipe</div>
  <div class="nav">
    <button class="nbtn" id="prev">‹</button>
    <div class="dots" id="dots"></div>
    <div class="count"><b id="cur">1</b> / <span id="tot">18</span></div>
    <button class="nbtn" id="next">›</button>
  </div>

<script>
var SLIDES=[
 {html:'<span class="kick">BreedWise presents</span>'
   +'<div class="wordmark metal">BOSS<span class="tm">™</span></div>'
   +'<div class="full">BreedWise Operating System &amp; Standards</div>'
   +'<div class="tagline">Better Breeding · Better Business · Stronger Programs</div>'},

 {html:'<div class="inner"><span class="kick">Why we built it</span>'
   +'<h1>Information was never the <span class="metal">end goal</span>.</h1>'
   +'<p class="lead">Breeders don\'t need another folder of videos. They need to know:</p>'
   +'<ul class="pts"><li>What needs attention?</li><li>What should I do first?</li><li>What system solves it?</li><li>Did I actually implement it?</li><li>Is it working?</li></ul>'
   +'<div class="big-line">Knowing <span class="neq">&ne;</span> <span class="metal">Implementing</span></div></div>'},

 {html:'<div class="inner"><span class="kick">The evolution</span>'
   +'<h1>BreedWise has <span class="metal">evolved</span>.</h1>'
   +'<div class="vs"><div class="vscol old"><div class="vt">The old model</div><div class="chainflat">Learn → Learn → Learn → Ask → Learn more</div></div>'
   +'<div class="vscol new"><div class="vt">The BOSS model</div><div class="chainflat metalborder">Assess → Prioritize → Implement → Measure → Reassess</div></div></div>'
   +'<p class="foot">Education still matters. BOSS isn\'t organized around how much information we can give you — it\'s organized around how much of the <b style="color:var(--ink)">right</b> information you actually turn into a stronger program.</p></div>'},

 {html:'<div class="inner"><span class="kick">What it is</span>'
   +'<h1>An operating system for your <span class="metal">breeding program</span>.</h1>'
   +'<div class="pills"><span class="pill">Breeding</span><span class="pill">Business</span><span class="pill">Systems</span><span class="pill">Standards</span><span class="pill">Measurement</span><span class="pill">Implementation</span></div>'
   +'<p class="foot big" style="margin-top:30px">Your breeding program shouldn\'t live entirely <span class="metal">in your head</span>.</p></div>'},

 {html:'<div class="inner"><span class="kick">One program. Two engines.</span>'
   +'<div class="two"><div class="eng"><div class="et">Breeding Engine</div><div class="ed">Science · Preparation · Systems · Records · Standards</div></div>'
   +'<div class="plus">+</div>'
   +'<div class="eng"><div class="et">Business Engine</div><div class="ed">Positioning · Demand · Buyers · Sales · Economics · Operations</div></div></div>'
   +'<p class="foot">BOSS doesn\'t treat these like two separate businesses. We build the system that lets them work <b style="color:var(--ink)">together</b>.</p></div>'},

 {html:'<div class="inner"><span class="kick">The BOSS™ Loop</span>'
   +'<div class="loop">'
   +'<div class="lstep"><span class="ln">01</span><div><b>Assess</b><span>Where are you now?</span></div></div><div class="lconn"></div>'
   +'<div class="lstep"><span class="ln">02</span><div><b>Prioritize</b><span>What matters most?</span></div></div><div class="lconn"></div>'
   +'<div class="lstep"><span class="ln">03</span><div><b>Implement</b><span>Build the system.</span></div></div><div class="lconn"></div>'
   +'<div class="lstep"><span class="ln">04</span><div><b>Measure</b><span>Is it actually working?</span></div></div><div class="lconn"></div>'
   +'<div class="lstep"><span class="ln">05</span><div><b>Reassess</b><span>What\'s the next constraint?</span></div></div>'
   +'<div class="lrepeat">&#8635; Repeat</div></div>'
   +'<p class="foot big">Your breeding program is never &ldquo;finished.&rdquo; It becomes <span class="metal">better operated</span>.</p></div>'},

 {html:'<div class="inner"><span class="kick">This changes how we teach</span>'
   +'<h1>No more <span class="metal">random</span> implementation.</h1>'
   +'<div class="railflow"><span>Problem</span><i>→</i><span>Standard</span><i>→</i><span>System</span><i>→</i><span>Training</span><i>→</i><span>Tool</span><i>→</i><span>Implementation</span><i>→</i><span>Measurement</span><i>→</i><span>Definition of done</span></div>'
   +'<p class="foot">If we teach you something, you\'ll know why it matters, what to do with it, what tool supports it, and how to know when you\'ve actually implemented it.</p></div>'},

 {html:'<div class="inner"><span class="kick">Build vs. know</span>'
   +'<div class="cmp">'
   +'<div class="cr"><div class="know">&ldquo;I know I need a better follow-up process.&rdquo;</div><div class="boss">My follow-up process is documented, configured, used and measured.</div></div>'
   +'<div class="cr"><div class="know">&ldquo;I know I should track my litter numbers.&rdquo;</div><div class="boss">My numbers are recorded consistently and I use them to make decisions.</div></div>'
   +'<div class="cr"><div class="know">&ldquo;I know preparation matters.&rdquo;</div><div class="boss">My preparation system exists before I need it.</div></div>'
   +'</div><div class="big-line">Knowledge is potential. <span class="metal">Implementation is the asset.</span></div></div>'},

 {html:'<div class="inner"><span class="kick">The build phase</span>'
   +'<h1>120 days to <span class="metal">build</span>.</h1>'
   +'<div class="tl">'
   +'<div class="tc"><div class="td">Days 1–30</div><div class="tt">Assess + Prioritize</div><div class="tp">Know the baseline. Find the constraints. Build the roadmap.</div></div>'
   +'<div class="tc"><div class="td">Days 31–60</div><div class="tt">Build + Implement</div><div class="tp">Put the priority systems into operation.</div></div>'
   +'<div class="tc"><div class="td">Days 61–90</div><div class="tt">Implement + Measure</div><div class="tp">Use them. Track them. Find the friction.</div></div>'
   +'<div class="tc"><div class="td">Days 91–120</div><div class="tt">Optimize + Reassess</div><div class="tp">Review what works. Close gaps. Set the next priorities.</div></div></div>'
   +'<p class="foot">New BOSS enrollments: this is the core implementation phase. As a legacy Academy member, this is simply the architecture BreedWise now organizes around.</p></div>'},

 {html:'<div class="inner"><span class="kick">The proof phase</span>'
   +'<h1>120 days to build. <span class="metal">12 months to prove.</span></h1>'
   +'<div class="steps4"><div class="s"><b>Build it</b><span>System exists.</span></div><div class="s"><b>Use it</b><span>System becomes operational.</span></div><div class="s"><b>Measure it</b><span>Evidence exists.</span></div><div class="s"><b>Prove it</b><span>Standards demonstrated over time.</span></div></div>'
   +'<p class="foot">Building something once doesn\'t prove it\'s how you operate.</p></div>'},

 {html:'<div class="inner"><span class="kick">Certification</span>'
   +'<h1>Certification should <span class="metal">mean something</span>.</h1>'
   +'<p class="lead strike">Paid → Watched videos → Got a badge.</p>'
   +'<div class="gates"><span class="gate">Knowledge</span><span class="gate">Verification</span><span class="gate">Implementation</span><span class="gate">Audit</span></div>'
   +'<p class="foot">The direction we\'re taking certification is standards-based — it should demonstrate how a program operates, not how long someone has been paying us. If you\'re already an Academy member, your existing certification eligibility stays governed by your Academy enrollment. We\'re not moving the goalposts.</p></div>'},

 {html:'<div class="inner"><span class="kick">For Academy members</span>'
   +'<h1 class="metal">You\'re grandfathered in.</h1>'
   +'<div class="grid4">'
   +'<div class="g"><b>Your Academy doesn\'t disappear.</b><span>Your existing term and applicable commitments remain in place.</span></div>'
   +'<div class="g"><b>You get BOSS Legacy Access.</b><span>Access to the BOSS curriculum &amp; applicable resources through the remainder of your current term.</span></div>'
   +'<div class="g"><b>BOSS is a separate offer.</b><span>New BOSS enrollments operate under a separate offer, scope and agreement.</span></div>'
   +'<div class="g"><b>Nothing automatically converts.</b><span>When your term ends, you decide. Nothing auto-renews.</span></div></div></div>'},

 {html:'<div class="inner"><span class="kick">What Legacy Access includes</span>'
   +'<h1>BOSS <span class="metal">Legacy Access</span>.</h1>'

var i=0;
var stage=document.getElementById('stage'),dots=document.getElementById('dots');
document.getElementById('tot').textContent=SLIDES.length;
function render(){
  stage.innerHTML=SLIDES.map(function(s,n){
    return '<div class="slide'+(s.cls?' '+s.cls:'')+(n===0?' on':'')+'" data-n="'+n+'">'+ (/^\s*<div class="inner"/.test(s.html)?s.html:'<div class="inner">'+s.html+'</div>') +'</div>';
  }).join('');
  dots.innerHTML=SLIDES.map(function(_,n){return '<span class="dot'+(n===0?' on':'')+'" data-g="'+n+'"></span>';}).join('');
  Array.prototype.forEach.call(dots.querySelectorAll('.dot'),function(d){d.addEventListener('click',function(){go(+d.getAttribute('data-g'));});});
  update();
}
function update(){
  Array.prototype.forEach.call(stage.querySelectorAll('.slide'),function(el){el.classList.toggle('on',+el.getAttribute('data-n')===i);});
  Array.prototype.forEach.call(dots.querySelectorAll('.dot'),function(el,n){el.classList.toggle('on',n===i);});
  document.body.classList.toggle('pure', !!SLIDES[i].cls);
  document.getElementById('cur').textContent=i+1;
  document.getElementById('prog').style.width=((i)/(SLIDES.length-1)*100)+'%';
  document.getElementById('prev').disabled=(i===0);
  document.getElementById('next').disabled=(i===SLIDES.length-1);
}
function go(n){i=Math.max(0,Math.min(SLIDES.length-1,n));update();}
document.getElementById('next').onclick=function(){go(i+1);};
document.getElementById('prev').onclick=function(){go(i-1);};
document.getElementById('zr').onclick=function(){go(i+1);};
document.getElementById('zl').onclick=function(){go(i-1);};
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();go(i+1);}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(i-1);}
  else if(e.key==='Home'){go(0);} else if(e.key==='End'){go(SLIDES.length-1);}
});
var tx=0;
document.addEventListener('touchstart',function(e){tx=e.changedTouches[0].clientX;},{passive:true});
document.addEventListener('touchend',function(e){var dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50){dx<0?go(i+1):go(i-1);}},{passive:true});
render();
</script>
