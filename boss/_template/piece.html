<!DOCTYPE html>
<!-- BOSS module piece template. Copy to boss/<module-id>/<piece>.html and fill in.
     Good starting shell for doc-style pieces: workbook, checklist, assess, resources.
     For a Teach deck, duplicate ../boss-vision-os-module.html; for an OS tool, duplicate ../boss-vision-os.html. -->
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Private · BOSS</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,500;0,600;0,700;1,600&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../boss.css">
</head><body>

<!-- GATE -->
<div id="gate"><div class="box">
  <div class="logo"><span class="mk">B</span></div>
  <h1>BOSS</h1><div class="sub">Access</div>
  <input id="boss-pw" type="password" placeholder="Access code" autocomplete="off">
  <button id="boss-unlock">Enter &rarr;</button>
  <div class="err" id="boss-gate-err"></div>
</div></div>

<!-- APP -->
<div id="app" hidden>
  <header class="boss"><div class="wrap bar">
    <a class="brand" href="../index.html"><span class="mk">B</span>
      <span class="wm"><b>BOSS</b><span>Module Library</span></span></a>
    <nav><a href="../index.html">&larr; All modules</a></nav>
  </div></header>

  <main class="mpage"><div class="wrap">
    <div class="crumbs"><a href="../index.html">BOSS</a> / Module Name / Piece Name</div>
    <h1>Piece title</h1>
    <p>Replace this with the piece content. Use <code>h2</code> for sections and <code>p</code> for body copy; the BOSS brand is already applied.</p>

    <h2>A section</h2>
    <p>Body copy here.</p>
  </div></main>

  <footer class="boss"><div class="wrap">BreedWise BOSS &middot; Private</div></footer>
</div>

<script src="../boss-gate.js"></script>
</body></html>
