<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Private · BreedWise</title>
<style>
  :root{
    --bg:#0b0e13;--panel:#141a22;--panel2:#0f151c;--line:#232c38;--ink:#eef3f9;--mid:#c0cad6;--muted:#7f8b99;
    --gold:#c6a35c;--green:#54b487;--red:#e8695f;--blue:#5aa9e6;--purple:#9a7bd0;
    --disp:'Georgia',serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}

  /* gate */
  #gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:50}
  #gate .box{width:min(92vw,380px);text-align:center}
  #gate .brand{font-size:13px;letter-spacing:.24em;color:var(--muted);font-weight:700;margin-bottom:18px}
  #gate .brand b{color:var(--gold)}
  #gate input{width:100%;padding:13px 15px;background:var(--panel);border:1px solid var(--line);border-radius:11px;color:var(--ink);font-size:15px;text-align:center;letter-spacing:.05em}
  #gate button{width:100%;margin-top:10px;padding:13px;background:var(--gold);border:0;border-radius:11px;color:#1a130a;font-weight:700;font-size:15px;cursor:pointer}
  #gate .err{color:var(--red);font-size:12.5px;min-height:16px;margin-top:10px}
  #gate .hint{color:var(--muted);font-size:12px;margin-top:14px}

  #app{display:none;min-height:100vh;padding:16px 18px 22px}
  header.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
  .bar .brand{font-size:13px;letter-spacing:.22em;color:var(--mid);font-weight:700}
  .bar .brand b{color:var(--gold)}
  .bar .title{font-size:15px;color:var(--muted);font-weight:300}
  .bar .spacer{flex:1}
  .live{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(84,180,135,.6);animation:pulse 2s infinite}
  .dot.stale{background:var(--red);animation:none}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(84,180,135,.5)}70%{box-shadow:0 0 0 9px rgba(84,180,135,0)}100%{box-shadow:0 0 0 0 rgba(84,180,135,0)}}
  .refresh{background:var(--panel);border:1px solid var(--line);color:var(--mid);border-radius:9px;padding:7px 12px;font-size:12px;cursor:pointer}
  .refresh:hover{border-color:var(--gold);color:var(--ink)}

  .grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:14px;height:calc(100vh - 74px)}
  @media(max-width:820px){.grid{grid-template-columns:1fr;grid-template-rows:none;height:auto}}
  .tile{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:18px;padding:20px 22px;display:flex;flex-direction:column;overflow:hidden;position:relative;min-height:230px}
  .tile .th{display:flex;align-items:center;gap:9px;margin-bottom:4px}
  .tile .th .ic{font-size:15px}
  .tile .th h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0}
  .tile .th .tag{margin-left:auto;font-size:11px;color:var(--muted);font-weight:300}
  .accent-blue .th .ic{color:var(--blue)} .accent-purple .th .ic{color:var(--purple)}
  .accent-gold .th .ic{color:var(--gold)} .accent-green .th .ic{color:var(--green)}

  .hero{font-family:var(--disp);font-size:52px;line-height:1;margin:8px 0 2px;letter-spacing:-.5px}
  .hero.gold{color:var(--gold)} .hero.green{color:var(--green)} .hero.blue{color:var(--blue)} .hero.purple{color:var(--purple)}
  .hero small{font-size:20px;color:var(--muted);font-family:-apple-system,sans-serif;font-weight:300;margin-left:6px}
  .herosub{font-size:12.5px;color:var(--muted);font-weight:300;margin-bottom:12px}

  .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px 14px;margin-top:auto}
  .stat .v{font-size:19px;font-weight:600;color:var(--ink)}
  .stat .v.sm{font-size:16px}
  .stat .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:1px}
  .stat .v .up{color:var(--green);font-size:12px} .stat .v .dn{color:var(--red);font-size:12px}

  /* funnel bars */
  .bars{margin-top:10px;display:flex;flex-direction:column;gap:7px;overflow-y:auto}
  .brow{display:grid;grid-template-columns:130px 1fr auto;align-items:center;gap:10px;font-size:12.5px}
  .brow .nm{color:var(--mid);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brow .track{height:9px;background:#0a0e13;border-radius:6px;overflow:hidden}
  .brow .fill{height:100%;background:linear-gradient(90deg,var(--purple),var(--blue));border-radius:6px;min-width:2px}
  .brow .ct{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
  .brow .ct span{color:var(--muted);font-weight:300;font-size:11px}

  .foot{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);display:flex;gap:18px;font-size:12px;color:var(--muted)}
  .foot b{color:var(--ink);font-weight:600}

  .empty{margin:auto;text-align:center;color:var(--muted);max-width:280px}
  .empty .big{font-size:30px;color:var(--mid);font-family:var(--disp);margin-bottom:6px}
  .empty .cta{margin-top:10px;font-size:12px;color:var(--gold);word-break:break-word}
  .err{color:var(--red);font-size:11.5px;margin-top:6px}
  .skl{color:var(--muted);opacity:.5}
</style>
</head>
<body>
  <div id="gate"><div class="box">
    <div class="brand">BREED<b>WISE</b></div>
    <input id="pw" type="password" placeholder="Access code" autocomplete="off">
    <button id="unlock">Open Command Center →</button>
    <div class="err" id="gate-err"></div>
    <div class="hint">Internal metrics wall. Team access only.</div>
  </div></div>

  <div id="app">
    <header class="bar">
      <span class="brand">BREED<b>WISE</b></span>
      <span class="title">Command Center · <span id="pipeName">New VSL Funnel</span></span>
      <span class="spacer"></span>
      <span class="live"><span class="dot" id="liveDot"></span><span id="liveTxt">connecting…</span></span>
      <button class="refresh" id="refreshBtn">↻ Refresh</button>
    </header>

    <div class="grid">
      <!-- 1 WEBSITE -->
      <div class="tile accent-blue" id="tile-web">
        <div class="th"><span class="ic">◱</span><h2>Traffic &amp; Engagement</h2><span class="tag" id="webTag">last 24h</span></div>
        <div id="web-body"><div class="hero blue skl">—</div></div>
      </div>
      <!-- 2 ADS -->
      <div class="tile accent-gold" id="tile-ads">
        <div class="th"><span class="ic">◎</span><h2>Meta Ads</h2><span class="tag" id="adsTag"></span></div>
        <div id="ads-body"><div class="hero gold skl">—</div></div>
      </div>
      <!-- 3 FUNNEL -->
      <div class="tile accent-purple" id="tile-crm">
        <div class="th"><span class="ic">⇉</span><h2>Pipeline &amp; Outbound</h2><span class="tag" id="crmTag"></span></div>
        <div id="crm-body"><div class="hero purple skl">—</div></div>
      </div>
      <!-- 4 CASH -->
      <div class="tile accent-green" id="tile-cash">
        <div class="th"><span class="ic">$</span><h2>Cash Collected</h2><span class="tag">Stripe</span></div>
        <div id="cash-body"><div class="hero green skl">—</div></div>
      </div>
    </div>
  </div>

<script>
/* ---------- config ---------- */
var FEED='https://xhjdowbnqcsvhtcccuqx.supabase.co/functions/v1/bw-dashboard';
var SECRET='YrKJx6hWQ-buaiTVuN3VcqMS';           /* DASH_SECRET */
var REFRESH_MS=45000;
var lastOK=0, timer=null;

/* ---------- helpers ---------- */
function usd(n){n=Number(n)||0;var neg=n<0;n=Math.abs(n);var s=n>=1000?Math.round(n).toLocaleString('en-US'):(Math.round(n*100)/100).toLocaleString('en-US');return (neg?'-$':'$')+s;}
function k(n){n=Number(n)||0;return n>=1000?(Math.round(n/100)/10)+'k':String(n);}
function dur(sec){sec=Math.round(Number(sec)||0);if(sec<60)return sec+'s';var m=Math.floor(sec/60),s=sec%60;return m+'m'+(s?(' '+s+'s'):'');}
function el(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}

/* ---------- renderers ---------- */
function renderWeb(w){
  var b=el('web-body');
  if(!w||!w.available){b.innerHTML='<div class="empty"><div class="big">—</div>Analytics feed unavailable'+(w&&w.error?'<div class="err">'+esc(w.error)+'</div>':'')+'</div>';return;}
  b.innerHTML=
    '<div class="hero blue">'+ (w.views24||0) +'<small>views today</small></div>'+
    '<div class="herosub">'+(w.uniques24||0)+' unique visitors · top page: '+esc((w.topPages&&w.topPages[0]&&w.topPages[0].page)||'—')+'</div>'+
    '<div class="stats">'+
      stat(w.views7d||0,'views · 7d')+
      stat(dur(w.avgActiveSec),'avg active time')+
      stat((w.avgScrollPct||0)+'%','avg scroll')+
      stat((w.formReachedPct||0)+'%','reached form')+
      stat((w.formStartedPct||0)+'%','started form')+
      stat(w.sessions7d||0,'sessions · 7d')+
    '</div>';
}
function renderAds(a){
  var b=el('ads-body'), tag=el('adsTag');
  if(!a||!a.available){
    tag.textContent='not connected';
    var acct=a&&a.account?a.account:'832632449145533';
    b.innerHTML='<div class="empty"><div class="big">◎</div>Meta ad reporting is ready to switch on.'+
      '<div class="cta">Add a Meta System-User token with <b>ads_read</b> for account '+esc(acct)+'.</div>'+
      (a&&a.error?'<div class="err">'+esc(a.error)+'</div>':'')+'</div>';
    return;
  }
  tag.textContent='today · 7d';
  var t=a.today||{}, d=a.last7d||{};
  b.innerHTML=
    '<div class="hero gold">'+usd(t.spend)+'<small>spend today</small></div>'+
    '<div class="herosub">'+(t.leads||0)+' leads today · '+(t.leads? usd(t.cpl):'—')+' cost / lead</div>'+
    '<div class="stats">'+
      stat(usd(d.spend),'spend · 7d')+
      stat(d.leads||0,'leads · 7d')+
      stat(d.leads?usd(d.cpl):'—','CPL · 7d')+
      stat(((t.ctr||0).toFixed?(t.ctr).toFixed(2):t.ctr)+'%','CTR today')+
      stat(k(t.impressions),'impress. today')+
      stat(d.roas?(Math.round(d.roas*100)/100)+'x':'—','ROAS · 7d')+
    '</div>';
}
function renderCrm(c){
  var b=el('crm-body'), tag=el('crmTag');
  if(!c||!c.available){b.innerHTML='<div class="empty"><div class="big">—</div>Pipeline feed unavailable'+(c&&c.error?'<div class="err">'+esc(c.error)+'</div>':'')+'</div>';return;}
  if(c.pipeline) el('pipeName').textContent=c.pipeline;
  tag.textContent=(c.totalLeads||0)+' leads';
  var dist=c.distribution||[], max=1; dist.forEach(function(s){if(s.count>max)max=s.count;});
  var ob=c.outbound||{}, obTxt = ob.available ? ((ob.calls24||0)+' today · '+(ob.calls7d||0)+' · 7d'+(ob.calls7dCapped?'+':'')) : 'no dialer data';
  var bars=dist.map(function(s){
    return '<div class="brow"><span class="nm" title="'+esc(s.name)+'">'+esc(s.name)+'</span>'+
      '<span class="track"><span class="fill" style="width:'+Math.max(2,Math.round(s.count/max*100))+'%"></span></span>'+
      '<span class="ct">'+s.count+(s.value?' <span>'+usd(s.value)+'</span>':'')+'</span></div>';
  }).join('');
  b.innerHTML=
    '<div class="hero purple">'+usd(c.totalValue)+'<small>pipeline value</small></div>'+
    '<div class="herosub">'+(c.totalLeads||0)+' total leads · '+(c.openCount||0)+' open'+(c.wonCount?' · '+c.wonCount+' won':'')+'</div>'+
    '<div class="bars">'+(bars||'<div class="skl">No leads in this pipeline yet.</div>')+'</div>'+
    '<div class="foot"><span>Outbound dials: <b>'+esc(obTxt)+'</b></span></div>';
}
function renderCash(m){
  var b=el('cash-body');
  if(!m||!m.available){b.innerHTML='<div class="empty"><div class="big">—</div>Stripe feed unavailable'+(m&&m.error?'<div class="err">'+esc(m.error)+'</div>':'')+'</div>';return;}
  b.innerHTML=
    '<div class="hero green">'+usd(m.mtd)+'<small>month to date</small></div>'+
    '<div class="herosub">'+(m.countMtd||0)+' payments this month</div>'+
    '<div class="stats">'+
      stat(usd(m.today),'today')+
      stat(usd(m.last7d),'last 7 days')+
      stat(usd(m.last30d),'last 30 days')+
      stat(m.count24||0,'payments today')+
      stat(usd(m.net30d),'net · 30d')+
      stat('USD','currency')+
    '</div>';
}
function stat(v,l,cls){return '<div class="stat"><div class="v'+(cls?' '+cls:'')+'">'+v+'</div><div class="l">'+l+'</div></div>';}

/* ---------- fetch loop ---------- */
function setLive(ok,msg){var dot=el('liveDot');dot.classList.toggle('stale',!ok);el('liveTxt').textContent=msg;}
function ago(ts){var s=Math.round((Date.now()-ts)/1000);if(s<60)return s+'s ago';var m=Math.floor(s/60);return m+'m ago';}
function tickLabel(){if(lastOK)setLive(true,'live · updated '+ago(lastOK));}
function load(){
  setLive(true,'updating…');
  fetch(FEED+'?secret='+encodeURIComponent(SECRET),{cache:'no-store'})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .then(function(d){
      renderWeb(d.website); renderAds(d.ads); renderCrm(d.crm); renderCash(d.cash);
      lastOK=Date.now(); tickLabel();
    })
    .catch(function(e){setLive(false, 'reconnecting… ('+(e.message||'error')+')');});
}
function start(){load();if(timer)clearInterval(timer);timer=setInterval(load,REFRESH_MS);setInterval(tickLabel,5000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)load();});
  el('refreshBtn').addEventListener('click',load);}

/* ---------- gate ---------- */
(function(){
  var OK='9885ae29c35ad5f2ea7bfd249af85902cd22c7b426f60c795f6105d4ba5a1153'; /* BreedWiseNumbers26 */
  function h(s){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return x.toString(16).padStart(2,'0');}).join('');});}
  function reveal(){var g=el('gate');if(g)g.remove();el('app').style.display='block';document.title='Command Center · BreedWise';start();}
  function tryUnlock(){var v=(el('pw').value||'').trim();h(v).then(function(hex){if(hex===OK){try{sessionStorage.setItem('cc_ok','1');}catch(e){}reveal();}else{el('gate-err').textContent='Incorrect code.';el('pw').select();}});}
  el('unlock').addEventListener('click',tryUnlock);
  el('pw').addEventListener('keydown',function(e){if(e.key==='Enter')tryUnlock();});
  try{if(sessionStorage.getItem('cc_ok')==='1'){reveal();}else{el('pw').focus();}}catch(e){el('pw').focus();}
})();
</script>
</body>
</html>
