<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Private · BreedWise</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0a;--bg2:#060606;--card:#15151a;--card2:#1b1b21;--card3:#202027;
    --line:rgba(245,242,234,.10);--line2:rgba(245,242,234,.16);
    --ink:#f5f2ea;--mid:#b9b3a7;--muted:#8a8578;--faint:#5f5b52;
    --gold:#cdae72;--gold2:#dcc185;--gold-soft:rgba(205,174,114,.12);--gold-line:rgba(205,174,114,.3);
    --green:#6dbf90;--amber:#e0b15e;--red:#e07a6d;--blue:#6fa8d6;
    --green-s:rgba(109,191,144,.14);--amber-s:rgba(224,177,94,.14);--red-s:rgba(224,122,109,.14);
    --display:'Anton',Impact,sans-serif;--body:'Poppins',-apple-system,BlinkMacSystemFont,sans-serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:300;font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
  h1,h2,h3,h4{margin:0;font-family:var(--display);font-weight:400;letter-spacing:.01em;text-transform:uppercase}
  a{color:inherit}
  /* gate */
  #gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:120}
  #gate .box{width:min(92vw,400px);text-align:center}
  #gate .mk{width:56px;height:56px;border-radius:14px;background:linear-gradient(150deg,var(--gold),#9c7d3f);display:inline-flex;align-items:center;justify-content:center;font-family:var(--display);font-size:30px;color:#120d04;margin-bottom:20px}
  #gate h1{font-size:30px;letter-spacing:.04em}
  #gate .sub{color:var(--muted);font-size:12px;letter-spacing:.24em;text-transform:uppercase;margin:6px 0 22px}
  #gate input{width:100%;padding:14px 16px;background:var(--card);border:1px solid var(--line2);border-radius:10px;color:var(--ink);font-size:15px;text-align:center;letter-spacing:.05em;font-family:var(--body)}
  #gate button{width:100%;margin-top:11px;padding:14px;background:var(--gold);border:0;border-radius:10px;color:#120d04;font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;font-family:var(--body)}
  #gate .err{color:var(--red);font-size:12.5px;min-height:16px;margin-top:10px}
  #gate input+input{margin-top:11px}
  #gate .alt button{background:none;color:var(--muted);text-transform:none;letter-spacing:0;
    font-size:12.5px;width:auto;padding:6px;margin-top:16px;text-decoration:underline;cursor:pointer}
  #app{display:none}

  /* layout */
  .shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
  aside{background:var(--bg2);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;padding:22px 0}
  .brand{display:flex;align-items:center;gap:11px;padding:0 22px 20px;border-bottom:1px solid var(--line);margin-bottom:14px}
  .brand .mk{width:38px;height:38px;border-radius:10px;background:linear-gradient(150deg,var(--gold),#9c7d3f);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:21px;color:#120d04;flex:none}
  .brand .wm{font-family:var(--display);font-size:16px;line-height:1;letter-spacing:.02em}
  .brand .wm small{display:block;font-family:var(--body);font-size:8.5px;font-weight:600;letter-spacing:.26em;color:var(--gold);margin-top:5px}
  nav.side a{display:flex;align-items:center;gap:13px;padding:11px 22px;color:var(--mid);text-decoration:none;font-size:13.5px;font-weight:400;cursor:pointer;border-left:2px solid transparent}
  nav.side a .nn{font-family:var(--display);font-size:12px;color:var(--faint);width:20px;flex:none}
  nav.side a:hover{color:var(--ink);background:var(--card)}
  nav.side a.on{color:var(--gold2);border-left-color:var(--gold);background:var(--gold-soft)}
  nav.side a.on .nn{color:var(--gold)}
  .side-foot{padding:16px 22px;margin-top:10px;border-top:1px solid var(--line);font-size:11px;color:var(--faint);line-height:1.8}

  main{min-width:0}
  .topbar{position:sticky;top:0;z-index:40;background:rgba(10,10,10,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:14px 32px}
  .topbar .sct{font-family:var(--display);font-size:22px;letter-spacing:.02em}
  .topbar .q{font-size:11.5px;color:var(--muted);margin-left:4px}
  .topbar .sp{flex:1}
  .save{font-size:11.5px;color:var(--green);letter-spacing:.04em;display:flex;align-items:center;gap:7px}
  .save .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
  .save.saving{color:var(--amber)}.save.saving .dot{background:var(--amber)}
  .save.synced{color:var(--green)}.save.synced .dot{background:var(--green)}
  .save.local{color:var(--amber)}.save.local .dot{background:var(--amber)}
  .tbtn{background:var(--card);border:1px solid var(--line2);color:var(--mid);border-radius:8px;padding:8px 13px;font-size:12px;font-weight:500;cursor:pointer;font-family:var(--body)}
  .tbtn:hover{border-color:var(--gold);color:var(--ink)}
  .wrap{padding:30px 32px 80px;max-width:1240px}
  .panel{display:none}.panel.on{display:block}
  .intro{color:var(--mid);font-size:14px;max-width:760px;margin:0 0 26px;font-weight:300}
  .intro b{color:var(--ink);font-weight:600}

  /* blocks */
  .sec-h{display:flex;align-items:center;gap:14px;margin:34px 0 16px}
  .sec-h h3{font-size:18px;letter-spacing:.02em}
  .sec-h .ln{flex:1;height:1px;background:var(--line)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:16px}
  .grid{display:grid;gap:16px}
  .g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:1000px){.g3,.g4{grid-template-columns:1fr 1fr}}
  @media(max-width:720px){.shell{grid-template-columns:1fr}aside{position:static;height:auto}.g2,.g3,.g4{grid-template-columns:1fr}.wrap{padding:22px 18px 70px}.topbar{padding:12px 18px}}
  .lbl{font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  /* sales scorecard — the first three columns are pinned while the
     periods scroll. The offsets only line up if the widths are real, so
     the table is laid out fixed with an explicit colgroup; left:280px
     against a column the browser decided to make 230px wide is what put
     the Goal column on top of This week. */
  .sctwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
  .sctab{border-collapse:separate;border-spacing:0;width:100%;font-size:12px;table-layout:fixed}
  .sctab th,.sctab td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .sctab thead th{position:sticky;top:0;background:var(--card2);z-index:2;
    font-weight:600;color:var(--muted);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
  .sctab .scl{display:block;color:var(--mid);letter-spacing:.08em}
  .sctab .scs{display:block;font-size:9.5px;color:var(--faint);letter-spacing:0;text-transform:none}
  .sctab .sco,.sctab .scm,.sctab .scg{position:sticky;background:var(--card);z-index:1}
  .sctab .sco,.sctab .scm{text-align:left}
  .sctab .sco{left:0;vertical-align:top;padding-top:11px;border-right:1px solid var(--line)}
  .sctab .scm{left:116px;color:var(--mid);border-right:1px solid var(--line)}
  .sctab thead .sco,.sctab thead .scm,.sctab thead .scg{background:var(--card2);z-index:3}
  .sctab .scrole{display:block;font-size:9.5px;color:var(--faint);letter-spacing:.1em;text-transform:uppercase;margin-top:2px}
  .sctab .scg{left:296px;color:var(--gold2);font-variant-numeric:tabular-nums;
    border-right:1px solid var(--line2)}
  .sctab tr.own td{border-top:1px solid var(--line2)}
  .sctab .scnil{color:var(--faint)}
  .sctab .scg small{color:var(--faint);font-size:9.5px;margin-left:1px}
  .sctab tbody td{font-variant-numeric:tabular-nums}
  .sctab .scgoal{color:var(--faint);font-size:10px;margin-left:2px}
  .sc-good{background:var(--green-s);color:var(--green)}
  .sc-warn{background:var(--amber-s);color:var(--amber)}
  .sc-bad{background:var(--red-s);color:var(--red)}
  .sc-part{background:var(--card3);color:var(--mid)}
  .sclegend{display:flex;flex-wrap:wrap;gap:9px 16px;padding:9px 11px;font-size:11px;color:var(--faint);
    border-top:1px solid var(--line)}
  .scrange{display:flex;gap:7px;align-items:center;margin:0 0 10px}
  .scrange button{background:var(--card2);border:1px solid var(--line2);color:var(--muted);font-family:var(--body);
    font-size:11.5px;padding:5px 11px;border-radius:20px;cursor:pointer}
  .scrange button.on{background:var(--gold-soft);border-color:var(--gold-line);color:var(--gold2)}
  .sclegend .k{display:flex;align-items:center;gap:5px}
  .sclegend .sw{width:11px;height:11px;border-radius:3px;display:inline-block}
  /* target grid */
  .tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:9px;margin-bottom:16px}
  .tcell label{display:block;font-size:10.5px;color:var(--muted);margin-bottom:3px}
  .tcell input{width:100%}
  /* the numbers inside the EOD form */
  .eodnums{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px;margin:4px 0 12px}
  .eodnums label{display:block;font-size:10.5px;color:var(--muted);margin-bottom:3px}
  .eodnums input{width:100%}
  .eodrole{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:10px 0 2px}
  .khead{font-family:var(--display);font-size:13px;letter-spacing:.06em;color:var(--gold);margin-bottom:12px;text-transform:uppercase}

  /* editable fields */
  .f{width:100%;background:transparent;border:0;border-bottom:1px dashed transparent;color:var(--ink);font-family:var(--body);font-size:13.5px;font-weight:300;padding:4px 2px;transition:border-color .2s;resize:none;line-height:1.5}
  .f:hover{border-bottom-color:var(--line2)}
  .f:focus{outline:none;border-bottom-color:var(--gold);background:var(--gold-soft)}
  textarea.f{min-height:26px;overflow:hidden}
  .big{font-family:var(--display);font-size:30px;color:var(--gold2);letter-spacing:.01em}
  .big.f{border:0}
  select.f{cursor:pointer}
  select.f option{background:var(--card2);color:var(--ink)}

  /* tiles */
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  @media(max-width:1000px){.tiles{grid-template-columns:1fr 1fr}}
  .tile{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:14px;padding:18px 18px}
  .tile .t{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .tile .v{font-family:var(--display);font-size:30px;color:var(--ink);margin-top:6px;letter-spacing:.01em}
  .tile .v.gold{color:var(--gold2)}.tile .v.green{color:var(--green)}
  .tile .s{font-size:11.5px;color:var(--muted);margin-top:3px}

  /* five levers */
  .levers{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
  @media(max-width:1100px){.levers{grid-template-columns:1fr 1fr 1fr}}
  @media(max-width:720px){.levers{grid-template-columns:1fr}}
  .lever{position:relative;background:linear-gradient(165deg,var(--card),var(--card2));border:1px solid var(--line);border-top:2px solid var(--gold);border-radius:12px;padding:16px 15px 15px}
  .lever .lnum{font-family:var(--display);font-size:26px;color:var(--gold);line-height:1}
  .lever .lname{font-family:var(--display)!important;font-size:14.5px!important;letter-spacing:.03em;text-transform:uppercase;margin:9px 0 5px;color:var(--ink)}
  .lever .ldesc{font-size:12.5px;color:var(--mid)}
  .lever .x{position:absolute;top:9px;right:11px;color:var(--faint);cursor:pointer;font-size:15px;line-height:1}
  .lever .x:hover{color:var(--red)}

  /* list editor (bullets) */
  .lst{list-style:none;padding:0;margin:0}
  .lst li{display:flex;align-items:flex-start;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
  .lst li:last-child{border-bottom:0}
  .lst li .bu{color:var(--gold);font-weight:700;margin-top:4px;flex:none}
  .lst li .x{color:var(--faint);cursor:pointer;font-size:16px;line-height:1;margin-top:2px;flex:none}
  .lst li .x:hover{color:var(--red)}
  .addbtn{background:transparent;border:1px dashed var(--line2);color:var(--mid);border-radius:8px;padding:9px 14px;font-size:12px;font-weight:500;cursor:pointer;font-family:var(--body);margin-top:10px}
  .addbtn:hover{border-color:var(--gold);color:var(--gold2)}

  /* tables */
  .tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:12px 12px;border-bottom:1px solid var(--line2);white-space:nowrap;background:var(--bg2)}
  td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  tr:last-child td{border-bottom:0}
  td .f{font-size:13px}
  td.del{width:28px;text-align:center}
  td .x{color:var(--faint);cursor:pointer;font-size:16px}td .x:hover{color:var(--red)}

  /* status pill */
  .pill{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:30px;padding:5px 12px;font-size:11px;font-weight:600;letter-spacing:.04em;cursor:pointer;font-family:var(--body);white-space:nowrap}
  .pill .d{width:7px;height:7px;border-radius:50%}
  .pill.green{background:var(--green-s);color:var(--green)}.pill.green .d{background:var(--green)}
  .pill.yellow{background:var(--amber-s);color:var(--amber)}.pill.yellow .d{background:var(--amber)}
  .pill.red{background:var(--red-s);color:var(--red)}.pill.red .d{background:var(--red)}
  .pill.gray{background:var(--card3);color:var(--muted)}.pill.gray .d{background:var(--muted)}

  /* role / people cards */
  .rcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0;overflow:hidden;margin-bottom:16px}
  .rcard .rh{display:flex;align-items:center;gap:14px;padding:16px 20px;background:linear-gradient(120deg,var(--card2),var(--card));border-bottom:1px solid var(--line)}
  .rcard .rh .av{width:40px;height:40px;border-radius:50%;background:var(--gold-soft);border:1px solid var(--gold-line);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:17px;color:var(--gold2);flex:none;text-transform:uppercase}
  .rcard .rh .ti{flex:1;min-width:0}
  .rcard .rh .ti input{font-family:var(--display);font-size:18px}
  .rcard .rb{padding:18px 20px;display:grid;grid-template-columns:1fr 1fr;gap:16px 26px}
  @media(max-width:720px){.rcard .rb{grid-template-columns:1fr}}
  .rcard .fld.full{grid-column:1/-1}
  .delrole{color:var(--faint);cursor:pointer;font-size:12px;border:1px solid var(--line);border-radius:7px;padding:5px 10px}
  .delrole:hover{color:var(--red);border-color:var(--red)}

  .sopfolder{margin-bottom:14px}
  .sopfolder .fh{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:14px;color:var(--gold2);letter-spacing:.04em;padding:10px 0}
  .muted{color:var(--muted)}
  .note{background:var(--gold-soft);border:1px solid var(--gold-line);border-left:3px solid var(--gold);border-radius:10px;padding:13px 16px;font-size:13px;color:var(--mid);margin:14px 0}
  .note b{color:var(--gold2)}
  .flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0}
  .flow .st{background:var(--card2);border:1px solid var(--line2);border-radius:8px;padding:8px 14px;font-size:12px;font-weight:500}
  .flow .ar{color:var(--faint)}
  .hidden{display:none!important}

/* ── nav grouping ───────────────────────────────────────────── */
.navgrp{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);
  font-weight:700;padding:16px 14px 6px;margin-top:4px}
.navgrp:first-child{margin-top:0}

/* ── who am I ───────────────────────────────────────────────── */
.whobar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card2);
  border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:16px}
.whobar b{color:var(--ink)}
.whobar select{background:var(--card3);border:1px solid var(--line2);border-radius:8px;
  padding:8px 12px;color:var(--ink);font-family:inherit;font-size:14px}

/* ── record cards (clients / members) ───────────────────────── */
.recs{display:grid;gap:12px}
.rec{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.rec>summary{cursor:pointer;list-style:none;padding:14px 16px;display:flex;align-items:center;gap:12px}
.rec>summary::-webkit-details-marker{display:none}
.rec>summary::after{content:'▾';margin-left:auto;color:var(--muted);font-size:13px}
.rec[open]>summary::after{content:'▴'}
.rec .nm{font-weight:600;font-size:15.5px}
.rec .meta{font-size:12.5px;color:var(--muted)}
.rec .bd{padding:0 16px 16px;border-top:1px solid var(--line)}
.fieldgrid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:14px}
@media(min-width:720px){.fieldgrid.c2{grid-template-columns:1fr 1fr}.fieldgrid.c3{grid-template-columns:1fr 1fr 1fr}}
.fw label{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);font-weight:700;margin-bottom:5px}
.chk{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:14px;border-top:1px solid var(--line)}
.chk:first-of-type{border-top:0}
.chk input{width:17px;height:17px;accent-color:var(--gold);flex:0 0 auto}
.chk.done span{color:var(--muted);text-decoration:line-through}
.subh{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);
  font-weight:700;margin:18px 0 8px}
.warn{background:var(--amber-s);border:1px solid var(--amber);color:var(--ink);
  border-radius:10px;padding:10px 13px;font-size:13.5px;margin-top:10px}
.danger{background:var(--red-s);border-color:var(--red)}
.ok{background:var(--green-s);border-color:var(--green)}

/* ── who-am-I bar ───────────────────────────────────────────────── */
.whobar .lbl0{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);font-weight:700}
.whobar .muted{font-size:12px}

/* ── three across ──────────────────────────────────────────────── */
.tiles.c3{grid-template-columns:repeat(3,1fr)}
@media(max-width:1000px){.tiles.c3{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.tiles,.tiles.c3{grid-template-columns:1fr}}

/* ── record cards ──────────────────────────────────────────────── */
.rec .av{flex:0 0 auto;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  background:var(--gold-soft);border:1px solid var(--gold-line);color:var(--gold2);
  font-size:12px;font-weight:700;letter-spacing:.04em}
.rec .recid{min-width:0}
.rec .nm,.rec .meta{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recdel{margin-top:22px;background:transparent;border:1px solid var(--line2);color:var(--muted);
  border-radius:9px;padding:8px 14px;font-family:var(--body);font-size:12px;cursor:pointer}
.recdel:hover{border-color:var(--red);color:var(--red)}
.chkcnt{font-size:11.5px;margin-top:7px}
.recfoot{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:22px}
.recfoot .recdel{margin-top:0}
.recfoot .muted{font-size:11.5px}
.recarch{background:transparent;border:1px solid var(--line2);color:var(--muted);
  border-radius:9px;padding:8px 14px;font-family:var(--body);font-size:12px;cursor:pointer}
.recarch:hover{border-color:var(--gold);color:var(--gold2)}
.archbox{margin-top:18px;border:1px solid var(--line);border-radius:12px;background:var(--bg2);overflow:hidden}
.archbox>summary{cursor:pointer;list-style:none;padding:12px 16px;font-size:12px;color:var(--muted);
  letter-spacing:.05em;text-transform:uppercase}
.archbox>summary::-webkit-details-marker{display:none}

   different sections never collide. Two people in the SAME section —
   ours wins and we say so out loud, rather than losing work silently.
   ────────────────────────────────────────────────────────────────── */
var BASE={};
function snapBase(){BASE={};for(var k in DB){try{BASE[k]=JSON.stringify(DB[k]);}catch(e){}}}
function mergeFrom(serverData){
  if(!serverData||typeof serverData!=='object')return [];
  var clashes=[],k;
  for(k in serverData){
    var theirs=JSON.stringify(serverData[k]);
    var base=BASE.hasOwnProperty(k)?BASE[k]:undefined;
    var ours;try{ours=JSON.stringify(DB[k]);}catch(e){ours=undefined;}
    if(theirs===ours)continue;                       /* already agree */
    if(ours===base){DB[k]=serverData[k];continue;}   /* we never touched it — take theirs */
    if(theirs===base)continue;                       /* they never touched it — keep ours */
    if(k!=='updated')clashes.push(k);                /* both changed it */
  }
  for(k in serverData)if(!DB.hasOwnProperty(k))DB[k]=serverData[k];
  return clashes;
}
function serverSave(){
  fetch(FN_OS,{method:'POST',headers:osHeaders(),body:osBody({action:'set',data:DB,rev:myRev})})
    .then(function(r){return r.json().then(function(d){return {status:r.status,d:d};},function(){return {status:r.status,d:null};});})
    .then(function(res){
      serverOnline=true;
      if(res.status===409&&res.d&&res.d.conflict){
        var clashes=mergeFrom(res.d.data);
        myRev=res.d.rev||myRev;
        try{localStorage.setItem(LS,JSON.stringify(DB));}catch(e){}
        var cur=currentSection();build(cur);
        toast(clashes.length
          ? 'Merged with the team — your edits kept in: '+clashes.map(sectionName).join(', ')
          : 'Merged with the team');
        clearTimeout(srvT);srvT=setTimeout(serverSave,600);   /* retry on the fresh rev */
        return;
      }
      if(res.status>=400||!res.d||!res.d.ok){
        setSync('local');$('#savedAt').textContent='Saved locally '+new Date().toLocaleString();
        return;
      }
      myRev=res.d.rev||myRev;snapBase();setSync('synced');
      $('#savedAt').textContent='Synced '+new Date(res.d.updated||Date.now()).toLocaleString();
    })
    .catch(function(){serverOnline=false;setSync('local');
      $('#savedAt').textContent='Saved locally '+new Date().toLocaleString();});
}
/* A rejected session is a dead end without this: the session is
   remembered, so every reload signs back in and fails again, and there is
   no sign-out anywhere in the OS. The way out is the access code. */
function authWarn(){
  var m=document.querySelector('main'),w=$('#wrap');if(!m||!w)return;
  var old=$('#authwarn');if(old)old.remove();
  if(!REJECT)return;
  var b=el('div','warn danger');b.id='authwarn';
  b.style.cssText='margin:18px 30px 0';
  b.innerHTML='<b>The server will not accept this sign-in, so nothing you type here is being saved for the team.</b><br>'+
    esc(REJECT)+'<br>';
  var btn=el('button','addbtn','Sign out and use the access code');
  btn.style.cssText='margin-top:10px;width:auto;padding:9px 16px';
  btn.addEventListener('click',function(){
    btn.disabled=true;btn.textContent='Signing out\u2026';
    try{sessionStorage.removeItem('bwos');}catch(e){}
    function done(){location.reload();}
    if(SB&&SB.auth&&SB.auth.signOut)SB.auth.signOut().then(done,done);else done();
  });
  b.appendChild(btn);
  m.insertBefore(b,w);
}
function sectionName(k){for(var i=0;i<SECTIONS.length;i++)if(SECTIONS[i].id===k)return SECTIONS[i].name;return k;}
function serverLoad(cb){
  REJECT='';
  fetch(FN_OS,{method:'POST',headers:osHeaders(),body:osBody({action:'get'})})
    .then(function(r){
      if(r.ok)return r.json();
      /* Keep the reason. A 401 is not "the network is down". */
      return r.json().then(function(d){return Promise.reject({status:r.status,d:d});},
                           function(){return Promise.reject({status:r.status});});
    })
    .then(function(resp){serverOnline=true;
      if(resp&&resp.data){DB=Object.assign(seed(),resp.data);myRev=resp.rev||0;try{localStorage.setItem(LS,JSON.stringify(DB));}catch(e){}}
      snapBase();cb&&cb(true,!!(resp&&resp.data));})
    .catch(function(e){serverOnline=false;
      if(e&&e.status===401)REJECT=(e.d&&e.d.error)||'the server did not accept this sign-in';
      cb&&cb(false,false);});
}

function ta(obj,key,ph){var t=el('textarea','f');t.value=obj[key]||'';t.placeholder=ph||'';t.rows=1;
  setTimeout(function(){autoGrow(t);},0);

function inp(obj,key,ph){var i=el('input','f');i.value=obj[key]||'';i.placeholder=ph||'';
  i.addEventListener('input',function(){obj[key]=i.value;save();});return i;}

/* ---------- generic table ---------- */
/* cols: [{k,label,w,type:'text'|'area'|'status'|'select',opts,ph}] */
function tableEditor(mount,arr,cols,blank,addLabel,afterChange){
  var tw=el('div','tw');var tbl=el('table');var thead=el('thead');var trh=el('tr');
  cols.forEach(function(c){var th=el('th');th.textContent=c.label;if(c.w)th.style.width=c.w;trh.appendChild(th);});
  trh.appendChild(el('th'));thead.appendChild(trh);tbl.appendChild(thead);
  var tb=el('tbody');tbl.appendChild(tb);
  function row(r){var tr=el('tr');
    cols.forEach(function(c){var td=el('td');
      if(c.type==='status')td.appendChild(statusPill(r,c.k,afterChange));
      else if(c.type==='area')td.appendChild(ta(r,c.k,c.ph));
      else if(c.type==='select')td.appendChild(selField(r,c.k,c.opts));
      else td.appendChild(inp(r,c.k,c.ph));
      tr.appendChild(td);
    });
    var dtd=el('td','del');var x=el('span','x','×');x.title='Remove';
    x.addEventListener('click',function(){var i=arr.indexOf(r);if(i>-1){arr.splice(i,1);tb.removeChild(tr);save();if(afterChange)afterChange();}});
    dtd.appendChild(x);tr.appendChild(dtd);tb.appendChild(tr);
  }
  arr.forEach(row);
  tw.appendChild(tbl);mount.appendChild(tw);
  var add=el('button','addbtn','+ '+(addLabel||'Add row'));
  add.addEventListener('click',function(){var r=JSON.parse(JSON.stringify(blank));arr.push(r);row(r);save();if(afterChange)afterChange();});
  mount.appendChild(add);
}

/* ---------- bullet list editor ---------- */
function listEditor(mount,arr,ph,addLabel){
  var ul=el('ul','lst');

    var t=el('textarea','f');t.value=arr[i]||'';t.placeholder=ph||'';t.rows=1;setTimeout(function(){autoGrow(t);},0);
    t.addEventListener('input',function(){arr[i]=t.value;autoGrow(t);save();});

    var tas=ul.querySelectorAll('textarea');if(tas.length)tas[tas.length-1].focus();save();});
  mount.appendChild(add);
}

/* ---------- export / import ---------- */

/* ══════════════════════════════════════════════════════════════════
   WHO AM I
   The OS had one shared passcode and no notion of who was typing,
   which makes an EOD report worthless — a report with no author is
   just a note. Roster comes from People & Performance so there is
   only ever one list of the team. Choice is per device, not shared.
   ══════════════════════════════════════════════════════════════════ */
var WHO_KEY='bw-os-who';
function who(){try{return localStorage.getItem(WHO_KEY)||'';}catch(e){return '';}}
function setWho(v){try{localStorage.setItem(WHO_KEY,v);}catch(e){}}
function team(){return (DB.people||[]).map(function(p){return p&&p.name;}).filter(Boolean);}
function secH(t,extra){return el('div','sec-h','<h3>'+t+'</h3><span class="ln"></span>'+(extra||''));}
function tile(label,val,sub,cls){return '<div class="tile"><div class="t">'+esc(label)+
  '</div><div class="v'+(cls?' '+cls:'')+'">'+esc(val)+'</div><div class="s">'+esc(sub||'')+'</div></div>';}
function whoBar(mount,after){
  var b=el('div','whobar');
  b.appendChild(el('span','lbl0','You are'));
  var sel=el('select');
  sel.appendChild(el('option',null,'— choose —'));
  team().forEach(function(n){var o=el('option');o.value=n;o.textContent=n;if(n===who())o.selected=true;sel.appendChild(o);});
  sel.addEventListener('change',function(){setWho(sel.value);after&&after();});
  b.appendChild(sel);
  b.appendChild(el('span','muted','remembered on this device only · add people in People & Performance'));
  mount.appendChild(b);
}

/* ---------- multi-document calls against the shared store ---------- */
function osDoc(action,doc,extra,cb){
  var body={action:action,doc:doc};
  for(var k in (extra||{}))body[k]=extra[k];
  fetch(FN_OS,{method:'POST',headers:osHeaders(),body:osBody(body)})
    .then(function(r){return r.json().then(function(d){return d;},function(){return {error:'bad response'};});})
    .then(function(d){cb&&cb(null,d);})
    .catch(function(e){cb&&cb(e);});
}
function ymd(d){d=d||new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);}
function eodDoc(){return 'eod/'+ymd().slice(0,7);}
function prettyDate(s){try{return new Date(s+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});}catch(e){return s;}}

/* ══════════════════════════════════════════════════════════════════
   02 · END OF DAY
   Appended to a monthly list document, so two people filing at the
   same moment cannot overwrite each other.
   ══════════════════════════════════════════════════════════════════ */
var EOD=[],EOD_LOADED=false;
/* Rolls up the things that only show as a problem once it is too late:
   who is quiet, who is behind on money, who has not filed today. */
function renderPulse(){
  var m=$('#pulse');if(!m)return;
  var boss=notArch(DB.boss),acad=notArch(DB.academy);
  var bossA=boss.filter(function(c){return (c.status||'Active')==='Active';}).length;
  var atRisk=boss.concat(acad).filter(function(c){return c.risk==='At risk'||c.risk==='Watch';}).length;
  var money=boss.concat(acad).filter(function(c){return c.payments==='Failed payment'||c.payments==='Behind';}).length;
  var gtee=boss.concat(acad).filter(function(c){return c.guarantee==='Behind'||c.guarantee==='Claimed';}).length;
  var today=ymd(),filed={};EOD.forEach(function(x){if(x&&x.date===today)filed[x.who]=1;});
  var missing=team().filter(function(n){return !filed[n];}).length;
  m.innerHTML=
    tile('B.O.S.S. capacity',bossA+' / 10','active clients',bossA>10?'':'gold')+
    tile('Clients at risk',String(atRisk),'across B.O.S.S. and Academy',atRisk?'':'green')+
    tile('Payment problems',String(money),'failed or behind',money?'':'green')+
    tile('Guarantee exposure',String(gtee),'behind or claimed',gtee?'':'green')+
    tile('EOD not filed',EOD_LOADED?String(missing):'\u2014','today, out of '+team().length+' people',(EOD_LOADED&&!missing)?'green':'')+
    tile('Academy members',String(acad.filter(function(x){return (x.status||'Active')==='Active';}).length),'currently active')+
    tile('Upsell ready',String(acad.filter(function(x){return x.upsell==='Ready';}).length),'earned the B.O.S.S. conversation','gold')+
    tile('Open projects',String((DB.projects||[]).filter(function(x){return x.s!=='green';}).length),'not yet on track');
}

function renderEod(){
  var p=$('#p-eod');if(!p)return;p.innerHTML='';
  p.appendChild(el('p','intro','<b>Four lines, every day</b> — plus your numbers, if you own any. Not paperwork: it is so tomorrow starts with yesterday’s blockers visible instead of forgotten, and so the <b>Sales Scorecard</b> has something real behind it rather than a sentence nobody can add up.'));
  whoBar(p,renderEod);
  if(REJECT)p.appendChild(el('div','warn danger','<b>A report filed now will not reach the team.</b> '+
    esc(REJECT)+' Use <b>Sign out and use the access code</b> at the top of the page, then file it again.'));

  var today=ymd();

  if(!team().length){
    p.appendChild(el('div','warn','Add your team in <b>People &amp; Performance</b> first — a report with no author is just a note.'));
    return;
  }
  /* Reading the team’s reports needs no identity. Only filing one does. */
  if(!who()){
    p.appendChild(el('div','warn','Choose who you are above to file your own report. You can read everyone else’s below either way.'));
    eodRollup(p,today);
    return;
  }

  var myId=today+'|'+who(),mine=null;
  for(var i=0;i<EOD.length;i++)if(EOD[i]&&EOD[i].id===myId)mine=EOD[i];

  p.appendChild(secH('Today · '+prettyDate(today)));
  var card=el('div','card');
  var draft={moved:(mine&&mine.moved)||'',number:(mine&&mine.number)||'',
             blocker:(mine&&mine.blocker)||'',tomorrow:(mine&&mine.tomorrow)||''};

  /* If this person owns sales numbers, ask for them by name instead of as
     prose. Same question the free-text "your number" asked — but a week of
     these can be added up, and a week of sentences cannot. */
  var role=salesRoleOf(who()),nums={};
  if(role){
    if(mine&&mine.m)for(var nk in mine.m)nums[nk]=mine.m[nk];
    card.appendChild(el('div','eodrole',SALES_ROLES[role].label+' · today’s numbers'));
    var ng=el('div','eodnums');
    SALES_ROLES[role].inputs.forEach(function(f){
      var w=el('div');w.appendChild(el('label',null,f.l));
      var inp=el('input','f');inp.type='number';inp.min='0';inp.step='any';
      inp.value=(nums[f.k]==null?'':nums[f.k]);
      inp.addEventListener('input',function(){
        if(inp.value==='')delete nums[f.k];else nums[f.k]=Number(inp.value);});
      w.appendChild(inp);ng.appendChild(w);
    });
    card.appendChild(ng);
  }

  [['moved','What moved today?','The thing that actually progressed'],
   ['number','Your number','Calls, sets, closes, lessons shipped — whatever you own'],
   ['blocker','What is in the way?','Leave blank if nothing'],
   ['tomorrow','Tomorrow’s one thing','The single most important thing']
  ].filter(function(f){return !(role&&f[0]==='number');}).forEach(function(f){
    var w=el('div','fw');w.appendChild(el('label',null,f[1]));
    var t=el('textarea','f');t.rows=1;t.placeholder=f[2];t.value=draft[f[0]];
    t.addEventListener('input',function(){draft[f[0]]=t.value;autoGrow(t);});
    setTimeout(function(){autoGrow(t);},0);
    w.appendChild(t);card.appendChild(w);
  });
  var btn=el('button','addbtn',mine?'Update my report':'File my report');
  btn.addEventListener('click',function(){
    if(!draft.moved.trim()){toast('Say what moved — even if it is "nothing, here is why"');return;}
    btn.disabled=true;btn.textContent='Filing…';
    osDoc('append',eodDoc(),{entry:{id:myId,who:who(),date:today,moved:draft.moved,
      number:draft.number,blocker:draft.blocker,tomorrow:draft.tomorrow,m:nums}},function(err,d){
      btn.disabled=false;
      if(err||!d||!d.ok){
        btn.textContent=mine?'Update my report':'File my report';
        toast(d&&/unknown action/i.test(d.error||'')?'Backend needs the new bw-os deploy':((d&&d.error)||'Could not file — try again'));
        return;
      }
      toast('Filed. Thank you.');loadEod();
    });
  });
  card.appendChild(btn);
  p.appendChild(card);
  eodRollup(p,today);
}

/* The last seven days, grouped by day then by person — plus the one
   line that makes the whole thing work: who has not filed yet. */
function eodRollup(p,today){
  if(!EOD_LOADED){p.appendChild(el('p',REJECT?'warn danger':'muted',REJECT
    ? '<b>This month’s reports cannot be read.</b> '+esc(REJECT)
    : 'Loading this month’s reports…'));return;}

  /* who has not filed today */
  var filed={};EOD.forEach(function(x){if(x&&x.date===today)filed[x.who]=1;});
  var missing=team().filter(function(n){return !filed[n];});
  p.appendChild(el('div','warn'+(missing.length?'':' ok'),missing.length
    ? '<b>Not filed today:</b> '+missing.map(esc).join(', ')
    : '<b>Everyone has filed today.</b>'));

  /* last 7 days */
  var days={};EOD.forEach(function(x){if(x&&x.date)(days[x.date]=days[x.date]||[]).push(x);});
  var keys=Object.keys(days).sort().reverse().slice(0,7);
  if(!keys.length){p.appendChild(el('p','muted','No reports yet this month.'));return;}
  p.appendChild(secH('The last seven days'));
  keys.forEach(function(d){
    var c=el('div','card');
    c.appendChild(el('div','lbl',prettyDate(d)));
    days[d].sort(function(a,b){return String(a.who).localeCompare(String(b.who));}).forEach(function(r){
      var box=el('div','eodrow');
      var tag=r.number?esc(r.number):'';
      if(r.m&&salesRoleOf(r.who)){
        var rc=SALES_ROLES[salesRoleOf(r.who)],bits=[];
        rc.inputs.forEach(function(f){if(r.m[f.k]!=null&&r.m[f.k]!=='')
          bits.push(esc(f.l.toLowerCase())+' '+esc(String(r.m[f.k])));});
        if(bits.length)tag=bits.join(' · ');
      }
      box.appendChild(el('div','eodwho',esc(r.who)+(tag?' <span class="eodnum">'+tag+'</span>':'')));
      if(r.moved)   box.appendChild(el('div',null,esc(r.moved)));
      if(r.blocker) box.appendChild(el('div','warn danger','<b>Blocked:</b> '+esc(r.blocker)));
      if(r.tomorrow)box.appendChild(el('div','muted','Tomorrow: '+esc(r.tomorrow)));
      c.appendChild(box);
    });
    p.appendChild(c);
  });
}

function loadEod(){
  osDoc('get',eodDoc(),{},function(err,d){
    if(!err&&d&&d.ok&&Array.isArray(d.data))EOD=d.data;
    EOD_LOADED=true;renderEod();renderPulse();renderSales();
  });
}

/* ══════════════════════════════════════════════════════════════════
   03 · SALES SCORECARD
   The EOD report already asks for "your number" — as free text, which
   reads fine and rolls up into nothing. These are the same numbers,
   typed into named boxes, so a week can be added up.

   Modelled on the Master Sales Tracker: three roles, the daily inputs
   each one owns, and a 13-week L10 view with the goal beside the
   actual. Weekly goal = daily target × work days, so a short week is
   judged on a short week.

   Rates are computed from the summed numerator and denominator over
   the period, never by averaging daily percentages — 1-of-1 on Monday
   and 0-of-40 on Tuesday is 2%, not 50%.

   Deliberately NOT here: Show Rate. Bookings are the setter's number
   and holds are the next person's, so it spans two people's records
   and would be a different thing depending on who you asked. It lives
   in the tracker's Lead Pipeline, which is the only place that can
   honestly follow one lead from DM to cash.
   ══════════════════════════════════════════════════════════════════ */
var SALES_ROLES={
  dm:{label:'DM Setter',
    inputs:[{k:'dms',l:'New DMs sent',t:100},
            {k:'fups',l:'Follow-ups sent',t:50},
            {k:'replies',l:'Replies'},
            {k:'convos',l:'Conversations',t:15},
            {k:'booked',l:'Setter calls booked',t:3}],
    rates:[{k:'c2b',l:'Convo → book %',n:'booked',d:'convos',t:.20}]},
  phone:{label:'Phone Setter',
    inputs:[{k:'dials',l:'Outbound dials',t:100},
            {k:'pickups',l:'Pickups',t:25},
            {k:'convos',l:'Conversations',t:15},
            {k:'held',l:'Setter calls held'},
            {k:'qualified',l:'Qualified'},
            {k:'booked',l:'Closer calls booked',t:3}],
    rates:[{k:'pick',l:'Pickup %',n:'pickups',d:'dials',t:.25},
           {k:'qual',l:'Qualified lead rate',n:'qualified',d:'held',t:.80}]},
  closer:{label:'Closer',
    inputs:[{k:'sched',l:'Calls scheduled'},
            {k:'held',l:'Calls held',t:3},
            {k:'closes',l:'Closes',t:1},
            {k:'cash',l:'Cash collected',t:1500,money:1},
            {k:'contract',l:'Contract value sold',money:1}],
    rates:[{k:'cr',l:'Close rate',n:'closes',d:'held',t:.40},
           {k:'acpc',l:'Avg cash per close',n:'cash',d:'closes',money:1}]}
};

function salesCfg(){
  if(!DB.sales)DB.sales={roster:[{name:'Daniel',role:'dm'},{name:'Regina',role:'phone'},
                                 {name:'Austin',role:'closer'}],targets:{},weekends:false};
  if(!Array.isArray(DB.sales.roster))DB.sales.roster=[];
  if(!DB.sales.targets||typeof DB.sales.targets!=='object')DB.sales.targets={};
  return DB.sales;
}
function salesRoleOf(name){
  var r=null;salesCfg().roster.forEach(function(x){if(x&&x.name===name&&SALES_ROLES[x.role])r=x.role;});
  return r;
}
function salesTarget(role,k,def){
  var v=salesCfg().targets[role+'.'+k];
  if(v===''||v==null)return def;
  v=Number(v);return isNaN(v)?def:v;
}

/* ── dates ───────────────────────────────────────────────────────── */
function weekStart(ds){                       /* Monday of that week */
  var d=new Date(ds+'T12:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d);
}
function addDays(ds,n){var d=new Date(ds+'T12:00:00');d.setDate(d.getDate()+n);return ymd(d);}
function monthStart(ds){return String(ds).slice(0,7)+'-01';}
function monthEnd(ym){var p=ym.split('-');return ymd(new Date(+p[0],+p[1],0));}
function workDays(from,to){
  var wk=!!salesCfg().weekends,n=0,d=from,guard=0;
  while(d<=to&&guard++<400){var w=new Date(d+'T12:00:00').getDay();
    if(wk||(w>=1&&w<=5))n++;d=addDays(d,1);}
  return n;
}

/* ── the numbers ─────────────────────────────────────────────────── */
var EODM={},EODM_WANT=0,EODM_GOT=0;
function monthsBack(n){
  var out=[],d=new Date();
  for(var i=0;i<n;i++){out.push(ymd(d).slice(0,7));d.setDate(1);d.setMonth(d.getMonth()-1);}
  return out;
}
/* The current month is already live in EOD; only older months are fetched,
   and each one only once. */
function salesEntries(months){
  var cur=ymd().slice(0,7),out=[];
  months.forEach(function(m){
    if(m===cur)out=out.concat(EOD||[]);
    else if(EODM[m])out=out.concat(EODM[m]);
  });
  return out;
}
function loadSalesMonths(months,cb){
  var cur=ymd().slice(0,7),need=months.filter(function(m){return m!==cur&&!EODM[m];});
  if(!need.length){cb();return;}
  var left=need.length;
  need.forEach(function(m){
    osDoc('get','eod/'+m,{},function(err,d){
      EODM[m]=(!err&&d&&d.ok&&Array.isArray(d.data))?d.data:[];
      if(!--left)cb();
    });
  });
}
function salesSum(entries,who,from,to){
  var s={};
  entries.forEach(function(e){
    if(!e||e.who!==who||!e.date||e.date<from||e.date>to)return;
    var m=e.m||{};
    for(var k in m){var v=Number(m[k]);if(!isNaN(v))s[k]=(s[k]||0)+v;}
  });
  return s;
}
function fmtVal(v,money,rate){
  if(v==null||v==='')return '—';
  if(rate)return Math.round(v*1000)/10+'%';
  if(money)return '$'+Math.round(v).toLocaleString();
  return String(Math.round(v*10)/10);
}
function cellClass(actual,goal,partial){
  if(goal==null||!goal)return '';
  if(actual==null)return '';
  if(partial)return 'sc-part';
  var r=actual/goal;
  return r>=1?'sc-good':r>=.8?'sc-warn':'sc-bad';
}

/* ── the view ────────────────────────────────────────────────────── */
/* Six weeks fits on a screen; thirteen is the quarter, and has to scroll.
   Six is the default because a wall of columns nobody can read at a
   glance is the same as no scorecard at all. */
var WKS=6;
function renderSales(){
  var p=$('#p-sales');if(!p)return;p.innerHTML='';
  p.appendChild(el('p','intro','<b>The same numbers your team already files at end of day, added up.</b> '+
    'Weekly goal is the daily target times the work days in that week, so a short week is judged as a short week. '+
    'Percentages are worked out from the totals, not by averaging each day — one-for-one on Monday and nought-for-forty on Tuesday is 2%, not 50%.'));

  var cfg=salesCfg(),roster=cfg.roster.filter(function(r){return r&&r.name&&SALES_ROLES[r.role];});
  if(!roster.length){
    p.appendChild(el('div','warn','No one is assigned a sales role yet — add them under <b>Who files what</b> below, '+
      'and their end-of-day report will start asking for these numbers.'));
    salesSetup(p);return;
  }

  /* Seven months covers both tables — the quarter of weeks and the six
     months. Fetched only when this section is the one being looked at,
     so opening the OS is not a dozen requests for data nobody asked for. */
  var months=monthsBack(7);
  if(!EODM_GOT){
    if(currentSection()!=='sales'){salesSetup(p);return;}
    p.appendChild(el('p','muted','Loading the last few months of reports…'));
    salesSetup(p);
    if(!EODM_WANT){EODM_WANT=1;loadSalesMonths(months,function(){EODM_GOT=1;renderSales();});}
    return;
  }
  var ent=salesEntries(months),today=ymd(),thisWk=weekStart(today);

  /* Nothing filed yet by anyone who owns numbers. Eighteen rows of dashes
     across thirteen columns says exactly as much as one sentence does. */
  var names={};roster.forEach(function(r){names[r.name]=1;});
  var any=false;
  ent.forEach(function(e){
    if(any||!e||!names[e.who]||!e.m)return;
    for(var k in e.m){var v=Number(e.m[k]);if(!isNaN(v)&&v!==0){any=true;return;}}
  });
  if(!any){
    p.appendChild(secH('Week over week'));
    p.appendChild(el('div','card','<p class="muted" style="margin:0">No numbers yet. '+
      'The table fills itself in as '+roster.map(function(r){return esc(r.name);}).join(', ')+
      ' file their end-of-day reports — each one now asks for the numbers below instead of a sentence. '+
      'The first week shows up here the day after the first report.</p>'));
    salesSetup(p);return;
  }

  /* ── weeks, most recent first ── */
  var wks=[];for(var i=0;i<WKS;i++)wks.push(addDays(thisWk,-7*i));
  p.appendChild(secH('Week over week · last '+WKS+' weeks',
    '<span class="muted" style="font-size:12px">Mon–Sun · most recent on the left</span>'));
  var rng=el('div','scrange');
  [[6,'6 weeks'],[13,'13 weeks · the quarter']].forEach(function(o){
    var b=el('button',WKS===o[0]?'on':null,o[1]);
    b.addEventListener('click',function(){WKS=o[0];renderSales();});
    rng.appendChild(b);
  });
  p.appendChild(rng);
  p.appendChild(salesTable(ent,roster,wks.map(function(w,ix){
    return {from:w,to:addDays(w,6),label:ix===0?'This wk':(ix===1?'Last wk':'-'+ix+' wks'),
            sub:prettyShort(w),partial:ix===0,days:workDays(w,minDate(addDays(w,6),today))};
  })));

  /* ── 6 months ── */
  var mos=[];for(i=0;i<6;i++){var d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);mos.push(ymd(d).slice(0,7));}
  p.appendChild(secH('Month over month · last 6 months'));
  p.appendChild(salesTable(ent,roster,mos.map(function(m){
    var from=m+'-01',to=monthEnd(m),cur=m===today.slice(0,7);
    return {from:from,to:to,label:new Date(from+'T12:00:00').toLocaleDateString(undefined,{month:'short'}),
            sub:m.slice(0,4),partial:cur,days:workDays(from,cur?today:to)};
  })));

  salesSetup(p);
}
function minDate(a,b){return a<b?a:b;}
function prettyShort(ds){try{return new Date(ds+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'});}catch(e){return ds;}}

/* One table, whatever the periods are — weeks or months, same shape. */
function salesTable(ent,roster,periods){
  var wrap=el('div','sctwrap'),t=el('table','sctab');
  /* Fixed layout + a colgroup: the pinned columns are only in the right
     place if their widths are the ones the sticky offsets assume. */
  var colw=periods.length>8?66:84;
  t.style.minWidth=(116+180+92+colw*periods.length)+'px';
  var cols='<colgroup><col style="width:116px"><col style="width:180px"><col style="width:92px">'+
    periods.map(function(){return '<col style="width:'+colw+'px">';}).join('')+'</colgroup>';
  var head='<thead><tr><th class="sco">Owner</th><th class="scm">Measurable</th><th class="scg">Goal</th>'+
    periods.map(function(p){return '<th><span class="scl">'+esc(p.label)+'</span><span class="scs">'+esc(p.sub)+'</span></th>';}).join('')+
    '</tr></thead>';
  var body='';
  roster.forEach(function(r){
    var role=SALES_ROLES[r.role],sums=periods.map(function(p){return salesSum(ent,r.name,p.from,p.to);});
    var rows=[];
    role.inputs.forEach(function(f){
      rows.push({l:f.l,money:f.money,daily:salesTarget(r.role,f.k,f.t),
        vals:sums.map(function(s){return s[f.k]==null?null:s[f.k];})});
    });
    role.rates.forEach(function(f){
      rows.push({l:f.l,rate:!f.money,money:f.money,flat:true,
        goal:f.t==null?null:salesTarget(r.role,f.k,f.t),
        vals:sums.map(function(s){
          var d=s[f.d];if(!d)return null;return (s[f.n]||0)/d;})});
    });
    rows.forEach(function(row,ix){
      body+='<tr'+(ix===0?' class="own"':'')+'>'+(ix===0?'<td class="sco" rowspan="'+rows.length+'"><b>'+esc(r.name)+'</b><span class="scrole">'+esc(role.label)+'</span></td>':'')+
        '<td class="scm">'+esc(row.l)+'</td>';
      /* a count goal scales with the days worked; a rate goal does not */
      body+='<td class="scg">'+(row.flat
        ? (row.goal==null?'—':fmtVal(row.goal,row.money,row.rate))
        : (row.daily==null?'—':fmtVal(row.daily,row.money)+'<small>/day</small>'))+'</td>';
      row.vals.forEach(function(v,i){
        /* The goal is already in its own column; repeating "/500" in every
           cell of every row was most of the ink on the page and none of
           the meaning. The colour says whether it was hit. */
        var goal=row.flat?row.goal:(row.daily==null?null:row.daily*periods[i].days);
        var cls=cellClass(v,goal,periods[i].partial)||(v==null?'scnil':'');
        body+='<td class="'+cls+'"'+(goal!=null&&goal&&!row.flat
          ? ' title="goal '+esc(fmtVal(goal,row.money))+' this period"':'')+'>'+
          fmtVal(v,row.money,row.rate)+'</td>';
      });
      body+='</tr>';
    });
  });
  t.innerHTML=cols+head+'<tbody>'+body+'</tbody>';
  wrap.appendChild(t);
  var lg=el('div','sclegend','<span class="k"><i class="sw sc-good"></i>goal hit</span>'+
    '<span class="k"><i class="sw sc-warn"></i>within 80%</span>'+
    '<span class="k"><i class="sw sc-bad"></i>behind</span>'+
    '<span class="k"><i class="sw sc-part"></i>still in progress</span>'+
    '<span class="k">— means nobody filed a number</span>'+
    '<span class="k">hover a cell for that period’s goal</span>');
  wrap.appendChild(lg);
  return wrap;
}

/* Roster and targets — the tracker's Settings sheet, kept editable
   here so nobody has to open a spreadsheet to move a goal. */
function salesSetup(p){
  var cfg=salesCfg();
  p.appendChild(secH('Who files what'));
  var box=el('div');p.appendChild(box);
  tableEditor(box,cfg.roster,[
    {k:'name',label:'Person',type:'select',opts:team(),w:'45%'},
    {k:'role',label:'Sales role',type:'select',opts:['','dm','phone','closer'],w:'55%'}
  ],{name:'',role:''},'Add a rep',function(){EODM_GOT=EODM_GOT;renderSales();renderEod();});
  p.appendChild(el('p','muted','Roles are <b>dm</b> (DM setter), <b>phone</b> (phone setter) and <b>closer</b>. '+
    'Giving someone a role adds their numbers to the end-of-day form — nobody else’s form changes.'));

  p.appendChild(secH('Daily targets'));
  var wk=el('div','note');
  var cb=el('input');cb.type='checkbox';cb.checked=!!cfg.weekends;
  cb.addEventListener('change',function(){cfg.weekends=cb.checked;save();renderSales();});
  var lab=el('label',null,' Team works weekends — targets count 7 days a week instead of 5');
  lab.insertBefore(cb,lab.firstChild);wk.appendChild(lab);p.appendChild(wk);

  Object.keys(SALES_ROLES).forEach(function(rk){
    var role=SALES_ROLES[rk];
    if(!cfg.roster.some(function(r){return r&&r.role===rk;}))return;
    p.appendChild(el('div','lbl',role.label));
    var g=el('div','tgrid');
    role.inputs.concat(role.rates).forEach(function(f){
      if(f.t==null)return;
      var isRate=role.rates.indexOf(f)>-1&&!f.money;
      var w=el('div','tcell');
      w.appendChild(el('label',null,f.l+(isRate?' (%)':'/day')));
      var inp=el('input','f');inp.type='number';inp.step=isRate?'1':'any';
      var cur=salesTarget(rk,f.k,f.t);
      inp.value=isRate?Math.round(cur*100):cur;
      inp.addEventListener('change',function(){
        var v=inp.value===''?'':(isRate?Number(inp.value)/100:Number(inp.value));
        cfg.targets[rk+'.'+f.k]=v;save();renderSales();
      });
      w.appendChild(inp);g.appendChild(w);
    });
    p.appendChild(g);
  });
}

/* ══════════════════════════════════════════════════════════════════
   03 · MASTER CALENDAR
   Two different things, deliberately separated: the rhythm that
   repeats, and the dated things that do not.
   ══════════════════════════════════════════════════════════════════ */
function renderCalendar(){
  var p=$('#p-calendar');if(!p)return;p.innerHTML='';
  p.appendChild(el('p','intro','<b>One calendar for the company.</b> The weekly rhythm repeats on every matching day; dated events sit where you put them; strategy sessions booked on a client or member record show up here automatically — you never type them twice.'));
  var C=DB.calendar=DB.calendar||{rhythm:[],events:[]};
  var today=ymd();

  /* ── what the grid draws: real events, the repeating rhythm, and
        sessions that live on client/member records ──────────────── */
  var DOW=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  function sessionEntries(){
    var out=[];
    [['boss','B.O.S.S.'],['academy','Academy']].forEach(function(src){
      notArch(DB[src[0]]).forEach(function(c){
        (c.sessions||[]).forEach(function(se){
          if(!se.date||se.status==='Cancelled')return;
          out.push({date:se.date,kind:'session',
            what:(c.name||'Someone')+' · '+(se.expert||'session'),
            sub:(se.topic||'')+(se.status&&se.status!=='Booked'?' ('+se.status+')':''),
            who:src[1]});
        });
      });
    });
    return out;
  }
  function entriesFor(dateStr,dow){
    var out=[];
    C.events.forEach(function(e,i){ if(e.date===dateStr)
      out.push({kind:'event',type:e.type||'Other',what:e.what||'(untitled)',sub:e.who||'',idx:i}); });
    sessionEntries().forEach(function(se){ if(se.date===dateStr)out.push(se); });
    C.rhythm.forEach(function(r){ if(r.day===DOW[dow])
      out.push({kind:'rhythm',what:r.what||'(untitled)',sub:(r.time||'')+(r.who?' · '+r.who:'')}); });
    return out;
  }

  /* ── month navigation (kept on the object so it survives a redraw) ── */
  var now=new Date();
  if(!C._y||!C._m){C._y=now.getFullYear();C._m=now.getMonth()+1;}
  var Y=C._y,M=C._m;

  var head=el('div','calhead');
  var navb=el('div','calnav');
  function stepTo(y,m){C._y=y;C._m=m;renderCalendar();}
  var prev=el('button','calbtn','‹');prev.title='Previous month';
  prev.addEventListener('click',function(){stepTo(M===1?Y-1:Y,M===1?12:M-1);});
  var next=el('button','calbtn','›');next.title='Next month';
  next.addEventListener('click',function(){stepTo(M===12?Y+1:Y,M===12?1:M+1);});
  var tdy=el('button','calbtn wide','Today');
  tdy.addEventListener('click',function(){stepTo(now.getFullYear(),now.getMonth()+1);});
  navb.appendChild(prev);navb.appendChild(next);navb.appendChild(tdy);
  head.appendChild(el('div','calmonth',
    new Date(Y,M-1,1).toLocaleDateString(undefined,{month:'long',year:'numeric'})));
  head.appendChild(navb);
  p.appendChild(head);

  /* ── the grid ─────────────────────────────────────────────────── */
  var grid=el('div','calgrid');
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(function(d){
    grid.appendChild(el('div','caldow',d));});

  var first=new Date(Y,M-1,1), start=first.getDay(),
      dim=new Date(Y,M,0).getDate(), prevDim=new Date(Y,M-1,0).getDate();
  var cells=Math.ceil((start+dim)/7)*7;
  for(var i=0;i<cells;i++){
    var dnum=i-start+1, out=false, y=Y, m=M, d=dnum;
    if(dnum<1){out=true;d=prevDim+dnum;m=M-1;if(m<1){m=12;y=Y-1;}}
    else if(dnum>dim){out=true;d=dnum-dim;m=M+1;if(m>12){m=1;y=Y+1;}}
    var ds=y+'-'+('0'+m).slice(-2)+'-'+('0'+d).slice(-2);
    var dow=new Date(y,m-1,d).getDay();
    var cell=el('div','calcell'+(out?' out':'')+(ds===today?' today':''));
    var top=el('div','caltop');
    top.appendChild(el('span','caldate',String(d)));
    (function(ds){
      var plus=el('button','calplus','+');plus.title='Add an event on this day';
      plus.addEventListener('click',function(ev){
        ev.stopPropagation();
        C.events.push({date:ds,what:'',type:'Internal',who:'',notes:''});
        save();renderCalendar();
        var rows=p.querySelectorAll('#calevents tbody tr');
        var r=rows[rows.length-1];
        if(r){r.scrollIntoView({block:'center'});var f=r.querySelector('input.f:nth-of-type(1)');
              var ins=r.querySelectorAll('input.f');if(ins[1])ins[1].focus();}
      });
      top.appendChild(plus);
    })(ds);
    cell.appendChild(top);

    var list=entriesFor(ds,dow);
    var shown=list;
    shown.forEach(function(e,ci){
      var cls='chip '+(e.kind==='rhythm'?'rhythm':e.kind==='session'?'sess':('t-'+String(e.type||'Other').toLowerCase()));
      var c=el('div',cls);
      c.innerHTML='<span class="cw">'+esc(e.what)+'</span>'+(e.sub?'<span class="cs">'+esc(e.sub)+'</span>':'');
      c.title=e.what+(e.sub?' — '+e.sub:'')+(e.kind==='rhythm'?' (weekly)':e.kind==='session'?' (from a client record)':'');
      if(e.kind==='event')(function(idx){c.addEventListener('click',function(){
        var rows=p.querySelectorAll('#calevents tbody tr');
        if(rows[idx]){rows[idx].scrollIntoView({block:'center'});
          rows[idx].classList.add('flash');setTimeout(function(){rows[idx].classList.remove('flash');},1400);}
      });})(e.idx);
      if(ci>=4)c.classList.add('hid');
      cell.appendChild(c);
    });
    if(list.length>4){
      var more=el('button','calmore','+'+(list.length-4)+' more');
      (function(cell,more,n){
        more.addEventListener('click',function(){
          var open=cell.classList.toggle('open');
          more.textContent=open?'Show less':'+'+n+' more';
        });
      })(cell,more,list.length-4);
      cell.appendChild(more);
    }
    grid.appendChild(cell);
  }
  p.appendChild(grid);

  var lg=el('div','callegend');
  lg.innerHTML='<span class="k"><i class="sw t-launch"></i>Launch</span>'+
   '<span class="k"><i class="sw t-webinar"></i>Webinar</span>'+
   '<span class="k"><i class="sw t-content"></i>Content</span>'+
   '<span class="k"><i class="sw t-internal"></i>Internal</span>'+
   '<span class="k"><i class="sw t-deadline"></i>Deadline</span>'+
   '<span class="k"><i class="sw sess"></i>Strategy session (from a client record)</span>'+
   '<span class="k"><i class="sw rhythm"></i>Weekly rhythm</span>';
  p.appendChild(lg);

  /* ── the numbers ──────────────────────────────────────────────── */
  var soon=C.events.filter(function(e){return e.date&&e.date>=today;})
                   .sort(function(a,b){return a.date<b.date?-1:1;});
  var wk=soon.filter(function(e){return e.date<=ymd(new Date(Date.now()+6048e5));}).length;
  var sess=sessionEntries().filter(function(e){return e.date>=today;}).length;
  p.appendChild(el('div','tiles c3',
    tile('Next up',soon.length?(soon[0].what||'untitled'):'nothing scheduled',
      soon.length?prettyDate(soon[0].date):'add an event with the + on any day','gold')+
    tile('Next 7 days',String(wk),'dated events')+
    tile('Sessions ahead',String(sess),'booked on client and member records')));

  /* ── manage ───────────────────────────────────────────────────── */
  p.appendChild(secH('Weekly rhythm'));
  p.appendChild(el('p','intro','Anything here repeats on that weekday, every week, on the grid above.'));
  var c1=el('div');
  tableEditor(c1,C.rhythm,[
    {k:'day',label:'Day',type:'select',opts:DOW,w:'130px'},
    {k:'time',label:'Time',w:'110px',ph:'9:00 AM CT'},
    {k:'what',label:'What'},
    {k:'who',label:'Who runs it',type:'select',opts:[''].concat(team()),w:'160px'}
  ],{day:'Monday',time:'',what:'',who:''},'Add a recurring block',function(){renderCalendar();});
  p.appendChild(c1);

  p.appendChild(secH('Dated events'));
  var c2=el('div');c2.id='calevents';
  tableEditor(c2,C.events,[
    {k:'date',label:'Date',w:'130px',ph:'YYYY-MM-DD'},
    {k:'what',label:'What'},
    {k:'type',label:'Type',type:'select',opts:['Launch','Webinar','Content','Internal','Travel','Deadline','Other'],w:'140px'},
    {k:'who',label:'Owner',type:'select',opts:[''].concat(team()),w:'150px'},
    {k:'notes',label:'Notes',type:'area'}
  ],{date:today,what:'',type:'Internal',who:'',notes:''},'Add an event',function(){renderCalendar();});
  p.appendChild(c2);
}

/* ══════════════════════════════════════════════════════════════════
   RECORD CARDS — shared by B.O.S.S. and Academy
   ══════════════════════════════════════════════════════════════════ */
function recField(rec,f){
  var w=el('div','fw');w.appendChild(el('label',null,f.label));
  var e;
  if(f.type==='area')        e=ta(rec,f.k,f.ph);
  else if(f.type==='select') e=selField(rec,f.k,f.opts);
  else { e=inp(rec,f.k,f.ph); if(f.type==='date')e.type='date'; }
  w.appendChild(e);
  return w;
}
function fieldGrid(rec,fields,cls){
  var g=el('div','fieldgrid '+(cls||''));
  fields.forEach(function(f){g.appendChild(recField(rec,f));});
  return g;
}
function checklist(mount,rec,key,items,title){
  mount.appendChild(el('div','subh',title));
  rec[key]=rec[key]||{};
  var cnt=el('div','muted chkcnt');
  function count(){var n=0;items.forEach(function(i){if(rec[key][i])n++;});
    cnt.textContent=n+' of '+items.length+' complete';}
  items.forEach(function(it){
    var row=el('label','chk'+(rec[key][it]?' done':''));
    var cb=el('input');cb.type='checkbox';cb.checked=!!rec[key][it];

      row.className='chk'+(cb.checked?' done':'');count();save();});

/* A record is never silently destroyed. Archiving keeps everything and
   is reversible; removing is the only thing that deletes, and it says so.
   Archived records drop out of every count — see notArch(). */
function notArch(arr){return (arr||[]).filter(function(r){return !r.archived;});}

function recordList(p,arr,cfg){
  var wrap=el('div','recs');
  function wipe(rec){
    if(!confirm('Permanently remove '+(rec.name||'this record')+'?\n\n'+
      'This deletes the record and everything on it — attendance, sessions, notes, checklists. '+
      'It cannot be undone.\n\nTo keep the history instead, cancel and use Archive.'))return;
    var i=arr.indexOf(rec);if(i>-1)arr.splice(i,1);save();draw();cfg.after&&cfg.after();
  }
  function draw(){
    wrap.innerHTML='';
    var open=arr.filter(function(r){return !r.archived;});
    var gone=arr.filter(function(r){return r.archived;});
    if(!open.length)wrap.appendChild(el('p','muted',gone.length
      ? 'Nobody active here — every record is archived.'
      : 'Nobody here yet — add the first record below.'));
    open.forEach(function(rec){
      var d=el('details','rec');
      var sm=el('summary');
      sm.appendChild(el('span','av',esc(initials(rec.name||'?'))));
      var box=el('div','recid');
      box.appendChild(el('div','nm',esc(rec.name||'Unnamed')));
      box.appendChild(el('div','meta',cfg.meta(rec)));
      sm.appendChild(box);
      d.appendChild(sm);
      var bd=el('div','bd');
      cfg.body(bd,rec);
      var foot=el('div','recfoot');
      var arc=el('button','recarch','Archive');
      arc.addEventListener('click',function(){
        rec.archived=true;rec.archivedAt=ymd();save();draw();cfg.after&&cfg.after();
      });
      var del=el('button','recdel','Remove permanently');
      del.addEventListener('click',function(){wipe(rec);});
      foot.appendChild(arc);foot.appendChild(del);
      foot.appendChild(el('span','muted','Archiving is reversible and keeps the history. Removing is not.'));
      bd.appendChild(foot);
      d.appendChild(bd);wrap.appendChild(d);
    });
    if(gone.length){
      var ab=el('details','archbox');
      var as=el('summary');
      as.textContent='Archived — '+gone.length+' '+(gone.length===1?'record':'records');
      ab.appendChild(as);
      gone.forEach(function(rec){
        var row=el('div','archrow');
        var nm=el('div','anm',esc(rec.name||'Unnamed'));
        var bits=[];
        if(rec.status&&rec.status!=='Active')bits.push(rec.status);
        if(rec.archivedAt)bits.push('archived '+rec.archivedAt);
        if(bits.length)nm.appendChild(el('span','amt',' · '+esc(bits.join(' · '))));
        row.appendChild(nm);
        var sp=el('div','sp');
        var rb=el('button','ar','Restore');
        rb.addEventListener('click',function(){
          delete rec.archived;delete rec.archivedAt;save();draw();cfg.after&&cfg.after();
        });
        var xb=el('button','ax','Remove');
        xb.addEventListener('click',function(){wipe(rec);});
        sp.appendChild(rb);sp.appendChild(xb);row.appendChild(sp);
        ab.appendChild(row);
      });
      wrap.appendChild(ab);
    }
  }
  draw();
  p.appendChild(wrap);
  var add=el('button','addbtn','+ '+cfg.addLabel);
  add.addEventListener('click',function(){
    arr.push(cfg.blank());save();draw();cfg.after&&cfg.after();
    /* not :last-of-type — the archived block is a <details> sibling too */
    var all=wrap.querySelectorAll('details.rec');
    var last=all[all.length-1];
    if(last){last.open=true;last.scrollIntoView({block:'center'});
      var f=last.querySelector('.bd input.f');if(f)f.focus();}
  });
  p.appendChild(add);
}

/* ══════════════════════════════════════════════════════════════════
   BACKFILL — pull the Academy roster out of the members table
   `members` is readable only by a signed-in teammate (RLS), so the page
   asks the bw-os function to read it with the service role. Nothing is
   invented here: a field the roster cannot answer is left blank rather
   than filled with a plausible guess.
   ══════════════════════════════════════════════════════════════════ */
function pick(v){return (v===null||v===undefined||v==='')?'':String(v);}
function mapRosterMember(m){
  var t=m.track||{};
  var r={
    name:pick(m.name), email:pick(m.email), phone:'',
    joined: pick(t.enrolled_at) || (m.updated_at?String(m.updated_at).slice(0,10):''),
    owner:'',                       /* the roster does not record an owner */
    status: (m.churned||m.payment==='Cancelled') ? 'Churned'
          : t.status==='Graduated' ? 'Completed'
          : t.status==='Paused'    ? 'Paused' : 'Active',
    risk:   t.health_override==='Red'    ? 'At risk'
          : t.health_override==='Yellow' ? 'Watch'
          : m.red_flag                   ? 'At risk'
          : (m.payment==='Failed'||m.payment==='At risk') ? 'At risk'
          : (m.activated===false)        ? 'Watch' : 'OK',
    payments: m.payment==='Good'      ? 'Current'
            : m.payment==='Failed'    ? 'Failed payment'
            : m.payment==='At risk'   ? 'Behind'
            : m.payment==='Cancelled' ? 'Behind' : '',
    terms:'', agreement:'',          /* neither is recorded in the roster */
    guarantee:'', guaranteeNote:'',
    upsell: t.status==='Accelerator' ? 'Converted' : 'Not yet',
    upsellNote:'',
    profile:'', assessment:'', pathway:'', notes:'',
    activation:{}, attendance:[], sessions:[]
  };

  if(t.act_onboarding)   r.activation['Onboarding form returned']=true;
  if(t.act_assessment)   r.activation['Assessment completed']=true;
  if(t.act_focusplan)    r.activation['Focus plan built']=true;
  if(t.act_firstaction)  r.activation['First action completed']=true;
  if(m.payment==='Good') r.activation['Payment cleared']=true;
  if(Number(m.calls)>0)  r.activation['First session attended']=true;

  var prof=[];
  if(t.next_litter)   prof.push('Next litter: '+t.next_litter);
  if(t.litter_stage)  prof.push('Stage: '+t.litter_stage);
  if(m.support_tier)  prof.push('Support tier: '+m.support_tier);
  r.profile=prof.join('\n');

  var as=[];
  if(t.goal_120)        as.push('120-day goal: '+t.goal_120);
  if(t.primary_focus)   as.push('Primary focus: '+t.primary_focus);
  if(t.secondary_focus) as.push('Secondary focus: '+t.secondary_focus);
  if(t.clarity!=null)   as.push('Clarity pulse: '+t.clarity+'/10');
  if(m.nps!=null)       as.push('NPS: '+m.nps);
  if(m.homework!=null)  as.push('Homework completion: '+m.homework+'%');
  r.assessment=as.join('\n');

  var pw=[];
  if(t.first_action) pw.push('First action: '+t.first_action);
  if(t.next_action)  pw.push('Next action: '+t.next_action);
  if(t.last_contact) pw.push('Last contact: '+t.last_contact);
  r.pathway=pw.join('\n');

  var nt=[];
  if(m.notes) nt.push(String(m.notes));
  if(t.notes) nt.push(String(t.notes));
  r.notes=nt.join('\n\n');

  (m.attendance||[]).forEach(function(w){
    if(!w.week_start)return;
    if(Number(w.attended)>0)      r.attendance.push({date:w.week_start,call:'Weekly coaching',status:'Attended'});
    if(Number(w.support_call)>0)  r.attendance.push({date:w.week_start,call:'Support call',status:'Attended'});
    if(Number(w.womens_circle)>0) r.attendance.push({date:w.week_start,call:'Women’s Circle',status:'Attended'});
  });
  return r;
}

/* Live signals refresh on every pull; everything else only fills a blank,
   so nothing anyone typed by hand is ever overwritten. */
var ROSTER_REFRESH=['status','risk','payments'];
function applyRoster(list){
  DB.academy=DB.academy||[];
  var added=0,updated=0,refreshed=0,filled=0;
  list.forEach(function(src){
    var inc=mapRosterMember(src);
    var cur=null;
    for(var i=0;i<DB.academy.length;i++){
      var a=DB.academy[i];
      if(inc.email&&a.email&&a.email.toLowerCase()===inc.email.toLowerCase()){cur=a;break;}
      if(!inc.email&&a.name&&inc.name&&a.name.trim()===inc.name.trim()){cur=a;break;}
    }
    if(!cur){DB.academy.push(inc);added++;return;}
    var touched=false;
    ROSTER_REFRESH.forEach(function(k){
      if(inc[k]&&cur[k]!==inc[k]){cur[k]=inc[k];refreshed++;touched=true;}
    });
    Object.keys(inc).forEach(function(k){
      if(ROSTER_REFRESH.indexOf(k)>=0)return;
      var v=inc[k];
      if(v===''||v===null||v===undefined)return;
      if(Array.isArray(v)){ if(!Array.isArray(cur[k])||!cur[k].length){ if(v.length){cur[k]=v;filled++;touched=true;} } return; }
      if(typeof v==='object'){
        cur[k]=cur[k]||{};
        Object.keys(v).forEach(function(kk){ if(!cur[k][kk]){cur[k][kk]=v[kk];filled++;touched=true;} });
        return;
      }
      if(!cur[k]){cur[k]=v;filled++;touched=true;}
    });
    if(touched)updated++;
  });
  return {added:added,updated:updated,refreshed:refreshed,filled:filled};
}

function pullRoster(btn,mountMsg){
  btn.disabled=true;var was=btn.textContent;btn.textContent='Reading the roster…';
  osDoc('roster','bw-os',{program:'Academy'},function(err,d){
    btn.disabled=false;btn.textContent=was;
    if(err||!d||!d.ok){
      var why=(d&&d.error)||'could not reach the roster';
      if(/unknown action/i.test(why))why='the bw-os function needs redeploying before the roster can be read';
      mountMsg.className='warn danger';
      mountMsg.innerHTML='<b>Nothing imported.</b> '+esc(why)+'.';
      return;
    }
    var list=d.members||[];
    if(!list.length){
      mountMsg.className='warn';
      mountMsg.innerHTML='<b>The roster came back empty.</b> No rows in <code>members</code> with program “Academy” — so there is nothing to back-fill from here.';
      return;
    }
    var n=applyRoster(list);
    save();renderAcademy();renderPulse();
    var m=$('#rosterMsg');
    if(m){
      m.className='warn ok';
      m.innerHTML='<b>Imported '+list.length+' from the member roster.</b> '+
        n.added+' added, '+n.updated+' existing record'+(n.updated===1?'':'s')+' touched '+
        '('+n.refreshed+' live signal'+(n.refreshed===1?'':'s')+' refreshed, '+n.filled+' blank field'+(n.filled===1?'':'s')+' filled). '+
        'Payment terms, agreement status and owner are not in the roster — those are still yours to fill in.';
    }
  });
}

      (r.payments&&r.payments!=='Current'&&r.payments!=='Paid in full')?'⚠ '+r.payments:''
      ].filter(Boolean).map(esc).join(' · ');},
    body:function(bd,rec){
      clientBody(bd,rec,{termsPh:'e.g. $6,000 paid in full, or $291/mo',
        activationLabel:'First 7 days (activation window)',activation:ACTIVATION_ACADEMY,
        deliverables:false,attendance:true});
      bd.appendChild(el('div','subh','Ascension'));
      bd.appendChild(fieldGrid(rec,[
        {k:'upsell',label:'Upsell opportunity',type:'select',opts:['Not yet','Watching','Ready','Offered','Converted','No']},
        {k:'upsellNote',label:'Why / what changed',ph:'What makes them ready — or what is missing'}
      ],'c2'));
      ascensionBox(bd,rec);
    }
  });
}

function expJSON(){var blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  var a=el('a');a.href=URL.createObjectURL(blob);a.download='breedwise-os-'+new Date().toISOString().slice(0,10)+'.json';a.click();}
function impJSON(file){var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);DB=Object.assign(seed(),d);save();build();alert('Imported successfully.');}catch(e){alert('Could not read that file.');}};r.readAsText(file);}

/* ---------- gate ---------- */
function sha(s){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return x.toString(16).padStart(2,'0');}).join('');});}
var OK='368f5e7178dc18a1928df554c7251674d47b8cce87724d7a502d4aba67c99875'; /* BWTEAM2026 */
function reveal(){var g=$('#gate');if(g)g.remove();$('#app').style.display='block';document.title='BreedWise OS';
  load();build();
  if(DB.updated){$('#savedAt').textContent='Saved '+new Date(DB.updated).toLocaleString();}
  setSync('saving');$('#savetxt').textContent='Connecting…';
  serverLoad(function(online,hadData){
    if(online){var cur=currentSection();build(cur);setSync('synced');
      $('#savedAt').textContent=DB.updated?('Synced '+new Date(DB.updated).toLocaleString()):'Synced';
      if(!hadData)serverSave(); /* seed the shared doc on first run */
      loadEod();startPoll();
    } else {setSync('local');}
    authWarn();
  });
  $('#exp').addEventListener('click',expJSON);
  $('#imp').addEventListener('click',function(){$('#impf').click();});
  $('#impf').addEventListener('change',function(e){if(e.target.files[0])impJSON(e.target.files[0]);});
}
/* Signing in is the real gate: the server checks the session against
   bw_team, so who you are is decided on the server and not by a string
   typed into a public page. The access code stays as a fallback ONLY
   until every teammate has an account \u2014 at that point it goes, and so
   does the OS_SECRET literal above it. */
function trySignIn(){
  var em=($('#em').value||'').trim(), pw=$('#pw').value||'';
  if(!em||!pw){$('#gerr').textContent='Email and password required.';return;}
  if(!SB){$('#gerr').textContent='Sign-in unavailable here \u2014 use the access code.';return;}
  $('#gerr').textContent='Signing in\u2026';
  SB.auth.signInWithPassword({email:em,password:pw}).then(function(r){
    if(r.error){$('#gerr').textContent=r.error.message;return;}
    SESSION=(r.data&&r.data.session)||null;
    WHO_EMAIL=(r.data&&r.data.user&&r.data.user.email)||'';
    reveal();
  },function(e){$('#gerr').textContent=String((e&&e.message)||e);});
}
function tryUnlock(){var v=($('#code').value||'').trim().toUpperCase();sha(v).then(function(h){if(h===OK){try{sessionStorage.setItem('bwos','1');}catch(e){}reveal();}else{$('#gerr').textContent='Incorrect code.';$('#code').select();}});}
$('#signin').addEventListener('click',trySignIn);
$('#useCode').addEventListener('click',function(){$('#codeBox').style.display='block';this.style.display='none';$('#code').focus();});
$('#unlock').addEventListener('click',tryUnlock);
['em','pw'].forEach(function(id){$('#'+id).addEventListener('keydown',function(e){if(e.key==='Enter')trySignIn();});});
$('#code').addEventListener('keydown',function(e){if(e.key==='Enter')tryUnlock();});

/* Resume a real session first; only then fall back to the old flag. */
(function(){
  function legacy(){try{if(sessionStorage.getItem('bwos')==='1')return reveal();}catch(e){}
    var f=$('#em');if(f)f.focus();}
  if(!SB)return legacy();
  SB.auth.getSession().then(function(r){
    var ses=r&&r.data&&r.data.session;
    if(ses){SESSION=ses;WHO_EMAIL=(ses.user&&ses.user.email)||'';return reveal();}
    legacy();
  },legacy);
})();
})();
