<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Academy Acquisition Scoreboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@300;400;500;600;700&display=swap">
<style>
  :root{--bg:#0a0a0a;--panel:#141414;--panel2:#181818;--line:#242424;--gold:#cdae72;--gold2:#e2cb86;--ink:#f4f1ea;--sub:#c9c3b8;--muted:#8f8a80;--live:#57c98a;--warn:#e2953a;--disp:'Anton',Impact,sans-serif}
  *{box-sizing:border-box}html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:'Poppins',system-ui,sans-serif;font-weight:300}
  .wrap{max-width:1040px;margin:0 auto;padding:24px 18px 70px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  h1{font-family:var(--disp);font-weight:400;font-size:clamp(22px,4vw,30px);letter-spacing:1px;margin:0}
  h1 b{color:var(--gold)}
  .sub{color:var(--muted);font-size:12px;margin-top:5px}
  .ranges{display:flex;gap:6px;flex-wrap:wrap}
  .rg{font-family:'Poppins';font-size:12px;font-weight:500;color:var(--sub);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 13px;cursor:pointer}
  .rg.on{background:linear-gradient(135deg,#e2cb86,#c3a35c);color:#0a0a0a;border-color:transparent}

  h2{font-family:var(--disp);font-weight:400;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:32px 0 12px}
  .hero{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:22px 0 4px}
  .hcard{background:linear-gradient(180deg,#161616,#0f0f0f);border:1px solid var(--line);border-radius:16px;padding:20px 16px;text-align:center}
  .hcard .n{font-family:var(--disp);font-size:clamp(24px,4.4vw,40px);color:var(--gold2);line-height:1}
  .hcard .l{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:9px}
  .hcard.big .n{color:var(--live)}

  .grid{display:grid;gap:12px}
  .c5{grid-template-columns:repeat(5,1fr)}.c4{grid-template-columns:repeat(4,1fr)}
  .cell{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px}
  .cell .n{font-family:var(--disp);font-size:22px;color:var(--ink);line-height:1}
  .cell .l{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:7px}
  .cell.g .n{color:var(--gold2)} .cell.green .n{color:var(--live)}

  /* inputs */
  .inputs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .inp{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
  .inp label{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
  .inp input{width:100%;background:#0d0d0d;border:1px solid var(--line);border-radius:8px;color:var(--ink);font-family:var(--disp);font-size:20px;padding:6px 10px;outline:none}
  .inp input:focus{border-color:var(--gold)}
  .inote{font-size:11px;color:var(--muted);margin-top:8px}

  /* funnel */
  .fn{display:flex;flex-direction:column;gap:8px}
  .frow{display:grid;grid-template-columns:170px 1fr 78px 110px;gap:10px;align-items:center}
  .fname{font-size:13px;color:var(--sub)}
  .ftrack{position:relative;background:#0e0e0e;border:1px solid var(--line);border-radius:8px;height:32px;overflow:hidden}
  .ffill{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,#c3a35c,#e2cb86);border-radius:7px;transition:width .5s}
  .fcount{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-family:var(--disp);font-size:15px;color:var(--ink)}
  .fconv{font-family:var(--disp);font-size:15px;color:var(--live);text-align:right}
  .fconv .cl{display:block;font-family:'Poppins';font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:400}
  .fval{font-size:12px;color:var(--muted);text-align:right}

  /* forecast */
  .fc{background:linear-gradient(135deg,#1a160e,#0f0d0a);border:1px solid rgba(205,174,114,.4);border-radius:16px;padding:22px}
  .fcsteps{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-family:var(--disp);font-size:clamp(15px,2.4vw,20px)}
  .fcsteps .st{color:var(--gold2)}.fcsteps .ar{color:var(--muted);font-size:14px}
  .fcsteps .st small{display:block;font-family:'Poppins';font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:400;text-align:center;margin-top:3px}
  .fcnote{color:var(--sub);font-size:12.5px;margin-top:14px;line-height:1.5}

  .phase{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:16px 18px;color:var(--muted);font-size:13px;line-height:1.55}
  .phase b{color:var(--sub)}
  .msg{color:var(--muted);font-size:14px;padding:36px 0;text-align:center}
  .foot{color:var(--muted);font-size:11px;margin-top:30px}
  @media(max-width:820px){.hero{grid-template-columns:1fr 1fr 1fr}.c5,.c4,.inputs{grid-template-columns:1fr 1fr}.frow{grid-template-columns:104px 1fr 56px}.fval{display:none}}
  @media(max-width:520px){.hero{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>ACADEMY <b>SCOREBOARD</b></h1><div class="sub" id="sub">Loading…</div></div>
    <div class="ranges" id="ranges">
      <button class="rg" data-days="0">Today</button>
      <button class="rg on" data-days="7">7D</button>
      <button class="rg" data-days="30">30D</button>
      <button class="rg" data-days="90">90D</button>
      <button class="rg" data-days="-1">All</button>
    </div>
  </div>

  <div id="app"><div class="msg">Loading live data…</div></div>
  <div class="foot" id="foot"></div>
</div>

<script>
  var API = "https://xhjdowbnqcsvhtcccuqx.supabase.co/functions/v1/bw-metrics";
  var DEFAULT_AOV = 6000;
  var days = 7, DATA = null;
  function key(){ try{ return new URLSearchParams(location.search).get("key") || ""; }catch(e){ return ""; } }
  var m = function(n){ return "$" + Math.round(n||0).toLocaleString("en-US"); };
  var m1 = function(n){ return "$" + (Math.round((n||0)*10)/10).toLocaleString("en-US"); };
  var pc = function(v){ return v==null||!isFinite(v) ? "—" : Math.round(v*100)+"%"; };
  var x1 = function(v){ return v==null||!isFinite(v) ? "—" : (Math.round(v*100)/100)+"x"; };
  function esc(s){ return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }

  // manual inputs persisted per date range
  function inKey(){ return "bw-inp-"+days; }
  function getInputs(){ try{ return JSON.parse(localStorage.getItem(inKey())) || {}; }catch(e){ return {}; } }
  function setInput(k,v){ var o=getInputs(); o[k]=v; try{ localStorage.setItem(inKey(), JSON.stringify(o)); }catch(e){} }

  function sinceParam(){
    if(days<0) return "";
    if(days===0){ var d=new Date(); d.setHours(0,0,0,0); return "&since="+d.getTime(); }
    return "&since="+(Date.now()-days*86400000);
  }

  // map CC360 stages -> funnel milestones (regex, resilient to stage renames)
  function funnel(stages){
    var sum=function(re){ return stages.filter(function(s){return re.test(s.name);}).reduce(function(a,b){return a+b.count;},0); };
    var val=function(re){ return stages.filter(function(s){return re.test(s.name);}).reduce(function(a,b){return a+b.value;},0); };
    var total=stages.reduce(function(a,b){return a+b.count;},0);
    var notFit=sum(/not qualified|not a fit/i);
    var apps=total;                                   // every opp = an application
    var qualified=apps-notFit;
    var noShow=sum(/no show/i);
    var booked=sum(/enrollment call booked|no show|showed|academy enrolled/i);
    var showed=Math.max(0, booked-noShow);
    var sales=sum(/academy enrolled/i);
    var contracted=val(/academy enrolled/i) || sales*DEFAULT_AOV;
    return {apps:apps,qualified:qualified,booked:booked,showed:showed,sales:sales,noShow:noShow,contracted:contracted,total:total};
  }

  function render(){
    var d=DATA; if(!d){ return; }
    var f=funnel(d.stages||[]);
    var inp=getInputs();
    var spend=+inp.spend||0, visitors=+inp.visitors||0, cash=+inp.cash||0, pif=+inp.pif||0;
    var aov = f.sales>0 ? f.contracted/f.sales : DEFAULT_AOV;
    var roas = spend>0 ? cash/spend : null;
    var cac = f.sales>0 ? spend/f.sales : null;
    var cpa = f.apps>0 ? spend/f.apps : null;
    var cQual = f.qualified>0 ? spend/f.qualified : null;
    var cBook = f.booked>0 ? spend/f.booked : null;
    var cShow = f.showed>0 ? spend/f.showed : null;
    var appR = visitors>0 ? f.apps/visitors : null;
    var qualR = f.apps>0 ? f.qualified/f.apps : null;
    var bookR = f.qualified>0 ? f.booked/f.qualified : null;
    var showR = f.booked>0 ? f.showed/f.booked : null;
    var closeR = f.showed>0 ? f.sales/f.showed : null;
    var pifPct = f.sales>0 ? pif/f.sales : null;

    // forecast per 100 applications using current rates
    var fq = qualR!=null?100*qualR:null, fb=(fq!=null&&bookR!=null)?fq*bookR:null,
        fs=(fb!=null&&showR!=null)?fb*showR:null, fsale=(fs!=null&&closeR!=null)?fs*closeR:null;
    var fContracted = fsale!=null? fsale*aov : null;
    var cashRatio = f.contracted>0 && cash>0 ? cash/f.contracted : null;
    var fCash = (fContracted!=null && cashRatio!=null) ? fContracted*cashRatio : fContracted;

    var frow=function(name,count,convVal,convLbl,val){
      var maxC=Math.max(f.apps,1); var w=count?Math.max(6,Math.round(count/maxC*100)):0;
      return '<div class="frow"><div class="fname">'+name+'</div>'+
        '<div class="ftrack"><div class="ffill" style="width:'+w+'%"></div><span class="fcount">'+count+'</span></div>'+
        '<div class="fconv">'+(convVal==null?'—':pc(convVal))+'<span class="cl">'+convLbl+'</span></div>'+
        '<div class="fval">'+(val==null?'':m(val))+'</div></div>';
    };

    document.getElementById("app").innerHTML =
      '<div class="hero">'+
        hc(m(spend),"Spend",0)+hc(f.qualified,"Qualified Apps",0)+hc(f.showed,"Shows",0)+
        hc(f.sales,"Sales",1)+hc(m(cash),"Cash",1)+
      '</div>'+

      '<h2>Money</h2><div class="grid c5">'+
        cell(m(spend),"Ad Spend","")+cell(m(cash),"Cash Collected","green")+cell(m(f.contracted),"Contracted","g")+
        cell(x1(roas),"ROAS","green")+cell(cac==null?"—":m(cac),"CAC","")+
      '</div>'+

      '<h2>Funnel</h2><div class="fn">'+
        frow("Visitors",visitors||"—",null,"",null)+
        frow("Applications",f.apps,appR,"App rate",null)+
        frow("Qualified",f.qualified,qualR,"Qual rate",null)+
        frow("Booked",f.booked,bookR,"Book rate",null)+
        frow("Showed",f.showed,showR,"Show rate",null)+
        frow("Sales",f.sales,closeR,"Close rate",f.contracted)+
      '</div>'+

      '<h2>Costs</h2><div class="grid c4">'+
        cell(cpa==null?"—":m(cpa),"Cost / Application","g")+cell(cQual==null?"—":m(cQual),"Cost / Qualified","g")+
        cell(cBook==null?"—":m(cBook),"Cost / Booked","g")+cell(cShow==null?"—":m(cShow),"Cost / Show","g")+
      '</div>'+

      '<h2>Sales</h2><div class="grid c4">'+
        cell(m(aov),"AOV / Contract","g")+cell(pifPct==null?"—":pc(pifPct),"PIF %","green")+
        cell(pifPct==null?"—":pc(1-pifPct),"Payment Plan %","")+cell(m(cash),"Cash Collected","green")+
      '</div>'+

      '<h2>Your numbers (type per range — Spend, Visitors, Cash, PIF)</h2>'+
      '<div class="inputs">'+
        field("spend","Ad Spend ($)",spend)+field("visitors","Visitors",visitors)+
        field("cash","Cash Collected ($)",cash)+field("pif","PIF sales (count)",pif)+
      '</div><div class="inote">Saved in this browser per date range. Later I wire Meta Ads + payments to auto-fill these.</div>'+

      '<h2>Forecast — per 100 applications</h2>'+
      '<div class="fc"><div class="fcsteps">'+
        '<span class="st">100<small>Apps</small></span><span class="ar">→</span>'+
        '<span class="st">'+num(fq)+'<small>Qualified</small></span><span class="ar">→</span>'+
        '<span class="st">'+num(fb)+'<small>Booked</small></span><span class="ar">→</span>'+
        '<span class="st">'+num(fs)+'<small>Showed</small></span><span class="ar">→</span>'+
        '<span class="st">'+num(fsale)+'<small>Sales</small></span><span class="ar">→</span>'+
        '<span class="st">'+(fContracted==null?"—":m(fContracted))+'<small>Contracted</small></span><span class="ar">→</span>'+
        '<span class="st">'+(fCash==null?"—":m(fCash))+'<small>Cash</small></span>'+
      '</div><div class="fcnote">'+forecastNote(fsale,fContracted)+'</div></div>'+

      '<h2>Source breakdown</h2>'+
      '<div class="phase"><b>Phase 2 — activates once applications are tagged by source.</b> Right now the intake captures each applicant\'s source/UTM but doesn\'t tag it on the CC360 opportunity. Once I wire source tags (Meta Paid / Organic / Email / Referral / TPB), this shows Applications · Qualified · Sales · Cash per source, so you can see e.g. organic closing at 35% vs Meta at 12%.</div>';

    bindInputs();
    var t=new Date(d.generated).toLocaleString("en-US",{timeZone:"America/New_York"});
    document.getElementById("sub").textContent = "Live from CC360 · New VSL Funnel";
    document.getElementById("foot").textContent = "Updated "+t+" ET · "+f.total+" opportunities in range. Money/visitor figures are your manual inputs until Meta Ads + payments are connected.";
  }
  function hc(n,l,big){ return '<div class="hcard'+(big?' big':'')+'"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>'; }
  function cell(n,l,cls){ return '<div class="cell '+(cls||'')+'"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>'; }
  function field(k,l,v){ return '<div class="inp"><label>'+l+'</label><input type="number" min="0" step="any" data-k="'+k+'" value="'+(v||"")+'" placeholder="0"></div>'; }
  function num(v){ return v==null?"—":(Math.round(v*10)/10); }
  function forecastNote(fsale,fContracted){
    if(fsale==null||fContracted==null) return "Type your Visitors + Cash to complete the forecast. Then this reads like: every 100 applications currently produces X enrollments and $Y contracted.";
    return "Every 100 applications currently produces <b style='color:#e2cb86'>"+(Math.round(fsale*10)/10)+" enrollments</b> and <b style='color:#e2cb86'>"+m(fContracted)+" contracted</b>. Scaling is now math: know your cost per application, and you know what more spend buys.";
  }
  function bindInputs(){
    Array.prototype.forEach.call(document.querySelectorAll('.inp input'),function(el){
      el.addEventListener('input',function(){ setInput(el.getAttribute('data-k'), el.value); render(); refocus(el.getAttribute('data-k')); });
    });
  }
  var _focus=null;
  function refocus(k){ _focus=k; setTimeout(function(){ var el=document.querySelector('.inp input[data-k="'+k+'"]'); if(el){ el.focus(); var v=el.value; el.value=""; el.value=v; } },0); }

  function load(){
    var k=key(); if(!k){ document.getElementById("app").innerHTML='<div class="msg">Add ?key=YOUR_DASH_SECRET to the URL.</div>'; return; }
    fetch(API+"?secret="+encodeURIComponent(k)+sinceParam())
      .then(function(r){return r.json();})
      .then(function(d){ if(d&&d.ok){ DATA=d; render(); } else { document.getElementById("app").innerHTML='<div class="msg">'+esc((d&&d.error)||"Could not load")+'</div>'; } })
      .catch(function(){ document.getElementById("app").innerHTML='<div class="msg">Network error loading metrics.</div>'; });
  }

  document.getElementById("ranges").addEventListener("click",function(e){
    var b=e.target.closest(".rg"); if(!b)return;
    Array.prototype.forEach.call(document.querySelectorAll(".rg"),function(x){x.classList.remove("on");});
    b.classList.add("on"); days=+b.getAttribute("data-days"); load();
  });
  load();
  setInterval(load,120000);
</script>
</body>
</html>
