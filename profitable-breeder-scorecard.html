<style>
  :root{
    --bg:#0b0e13;--panel:#12181f;--panel2:#0f151c;--line:#212b36;--line2:#2c3846;
    --ink:#f0f4f9;--mid:#c0cad6;--muted:#818d9b;
    --gold:#c9a862;--gold-soft:#e4cf9a;--green:#57b98a;--red:#ff8178;
    --disp:'Fraunces',Georgia,serif;--sans:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:radial-gradient(1000px 560px at 50% -10%,rgba(201,168,98,.08),transparent 60%),var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;line-height:1.55}
  .bar{border-bottom:1px solid var(--line);padding:13px 20px;text-align:center;position:sticky;top:0;background:rgba(11,14,19,.86);backdrop-filter:blur(8px);z-index:20}
  .brand{font-size:13px;letter-spacing:.22em;font-weight:700;color:var(--mid)}.brand b{color:var(--gold)}
  .brand .w{color:var(--muted);font-weight:400;letter-spacing:.03em;font-size:12px;display:block;margin-top:2px}
  .wrap{max-width:720px;margin:0 auto;padding:30px 20px 70px}
  .center{text-align:center}
  .eyebrow{display:inline-block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-soft);font-weight:700;background:rgba(201,168,98,.1);border:1px solid rgba(201,168,98,.28);border-radius:20px;padding:5px 13px}
  h1{font-family:var(--disp);font-size:36px;line-height:1.1;margin:16px 0 10px;font-weight:600;letter-spacing:-.5px}
  @media(max-width:600px){h1{font-size:28px}}
  h1 .u{color:var(--gold-soft)}
  .lead{color:var(--mid);font-size:16.5px;max-width:580px;margin:0 auto;font-weight:300}
  .cta{display:inline-block;width:100%;max-width:420px;margin:22px auto 0;padding:16px 28px;background:linear-gradient(135deg,var(--gold),#a9863f);border:0;border-radius:13px;color:#1a130a;font-weight:700;font-size:17px;cursor:pointer;font-family:var(--sans);box-shadow:0 6px 26px rgba(201,168,98,.22);text-align:center;text-decoration:none}
  .cta:disabled{opacity:.55}
  .cta.ghost{background:transparent;border:1px solid var(--line2);color:var(--mid);box-shadow:none;font-weight:600}
  .undercta{font-size:12.5px;color:var(--muted);margin-top:11px;max-width:460px;margin-left:auto;margin-right:auto}
  .section-title{font-family:var(--disp);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-soft);font-weight:700;margin:34px 0 6px}
  .card{background:linear-gradient(162deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:18px;padding:22px}
  .how{display:grid;gap:12px;margin-top:16px;text-align:left}
  .how .row{display:flex;gap:13px;align-items:flex-start}
  .how .n{flex:none;width:28px;height:28px;border-radius:50%;background:rgba(201,168,98,.14);border:1px solid rgba(201,168,98,.35);color:var(--gold-soft);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
  .how .t{font-size:14.5px;color:var(--mid)}.how .t b{color:var(--ink);font-weight:600}
  .seclist{display:grid;gap:10px;margin-top:14px;text-align:left}
  .seclist .s{display:flex;gap:10px;font-size:13.5px;color:var(--mid)}
  .seclist .s b{color:var(--ink);font-weight:600}
  .seclist .k{flex:none;width:92px;color:var(--gold-soft);font-weight:700;font-size:12px}
  .credit{font-size:13.5px;color:var(--mid);text-align:left}
  .disc{font-size:11.5px;color:#6a7686;line-height:1.5;margin-top:14px}
  .trust{font-size:12px;color:var(--muted);margin-top:14px;text-align:center}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:460px){.row2{grid-template-columns:1fr}}
  .fld{margin-bottom:12px;text-align:left}
  label{font-size:11.5px;color:var(--muted);display:block;margin-bottom:5px}
  input,textarea{width:100%;padding:13px 14px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;color:var(--ink);font-size:15px;font-family:var(--sans)}
  textarea{min-height:92px;resize:vertical}
  input:focus,textarea:focus{outline:none;border-color:var(--gold)}
  .hp{position:absolute;left:-9999px}
  .msg{font-size:12.5px;margin-top:10px;min-height:16px;text-align:center;color:var(--muted)}
  .prog{position:sticky;top:51px;z-index:15;background:rgba(11,14,19,.86);backdrop-filter:blur(8px);padding:12px 20px 0}
  .prog .meta{max-width:720px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--muted);letter-spacing:.04em}
  .prog .stagename{color:var(--gold-soft);font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:11px}
  .track{max-width:720px;margin:8px auto 0;height:4px;border-radius:3px;background:var(--line);overflow:hidden}
  .track .fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-soft));width:0;transition:width .35s ease}
  .qnum{font-size:12px;color:var(--muted);letter-spacing:.06em;margin-bottom:6px}
  .qtext{font-family:var(--disp);font-size:25px;line-height:1.22;font-weight:600;margin:0 0 10px}
  @media(max-width:600px){.qtext{font-size:21px}}
  .qexplain{font-size:14px;color:var(--muted);margin:0 0 20px;padding-left:13px;border-left:2px solid var(--line2)}
  .opts{display:grid;gap:11px}
  .opt{width:100%;text-align:left;padding:16px 18px;background:var(--panel);border:1px solid var(--line);border-radius:13px;color:var(--ink);font-size:16px;font-weight:500;cursor:pointer;font-family:var(--sans);transition:border-color .15s,background .15s;display:flex;align-items:center;gap:13px}
  .opt:hover{border-color:var(--line2);background:#161d26}
  .opt.sel{border-color:var(--gold);background:rgba(201,168,98,.1)}
  .opt .dot{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--line2);display:inline-block}
  .opt.sel .dot{border-color:var(--gold);background:var(--gold);box-shadow:inset 0 0 0 3px var(--panel)}
  .opt.ns{color:var(--mid)}
  .navrow{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:12px}
  .back{background:none;border:0;color:var(--muted);font-size:14px;cursor:pointer;font-family:var(--sans);padding:8px 4px}
  .back:hover{color:var(--mid)}
  .optnote{font-size:12px;color:var(--muted);margin-top:14px}
  .scorewrap{text-align:center;margin-top:6px}
  .ring{position:relative;width:168px;height:168px;margin:6px auto 2px}
  .ring svg{transform:rotate(-90deg)}
  .ring .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .num{font-family:var(--disp);font-size:46px;font-weight:600;line-height:1}
  .ring .den{font-size:12px;color:var(--muted);margin-top:3px;letter-spacing:.08em}
  .band{font-family:var(--disp);font-size:24px;font-weight:600;margin:10px 0 4px}
  .bandmsg{color:var(--mid);font-size:15px;max-width:560px;margin:0 auto}
  .underscore{color:var(--muted);font-size:13.5px;max-width:560px;margin:14px auto 0}
  .startpoint .p{color:var(--ink);font-size:15.5px;margin:0 0 16px}
  .moves{display:grid;gap:12px}
  .move{display:flex;gap:13px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:15px 16px}
  .move .mi{flex:none;width:26px;height:26px;border-radius:50%;background:var(--gold);color:#15100a;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
  .move .mt b{color:var(--ink);font-size:15px;display:block;margin-bottom:3px}
  .move .mt span{color:var(--mid);font-size:13.5px}
  .bridgeline{color:var(--mid);font-size:14px;margin:16px 0 4px;text-align:center}
  .secgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
  .sc{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 6px;text-align:center}
  .sc .dots{display:flex;gap:4px;justify-content:center;margin-bottom:8px}
  .sc .d{width:9px;height:9px;border-radius:50%;background:var(--line2)}
  .sc .d.on{background:var(--gold)}
  .sc .nm{font-size:10.5px;color:var(--mid);line-height:1.25;min-height:26px}
  .sc .lb{font-size:10px;color:var(--muted);margin-top:5px;letter-spacing:.04em}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .chip{font-size:12.5px;color:#cfe9d9;background:rgba(87,185,138,.1);border:1px solid rgba(87,185,138,.3);border-radius:16px;padding:6px 12px}
  .subtle{color:var(--muted);font-size:13px;margin-top:6px}
  .stageblock{margin-top:22px}
  .stagehead{border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:14px}
  .stagehead .k{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .stagehead .nm{font-family:var(--disp);font-size:19px;font-weight:600;margin-top:3px}
  .stagehead .nm em{color:var(--gold-soft);font-style:normal}
  .stagehead .sm{font-size:13.5px;color:var(--mid);margin-top:5px}
  .gap{border:1px solid var(--line);border-radius:14px;padding:17px 18px;margin-bottom:12px;background:var(--panel)}
  .gap .gt{font-family:var(--disp);font-size:18px;font-weight:600;margin:0 0 10px;color:var(--ink)}
  .gap .ns{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;color:#f0c98a;background:rgba(201,168,98,.12);border:1px solid rgba(201,168,98,.3);border-radius:12px;padding:3px 9px;margin-bottom:9px}
  .gl{margin:0 0 9px}
  .gl .lab{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:2px}
  .gl .tx{font-size:13.8px;color:var(--mid)}
  .gl.win .tx{color:var(--ink)}
  .gl.win{background:rgba(201,168,98,.06);border-left:2px solid var(--gold);padding:8px 12px;border-radius:6px}
  .pcard{border-radius:16px;padding:20px;border:1px solid var(--gold);background:linear-gradient(162deg,rgba(201,168,98,.1),rgba(201,168,98,.03));margin-top:14px}
  .pcard .tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;color:var(--gold-soft)}
  .pcard h3{font-family:var(--disp);font-size:21px;font-weight:600;margin:0 0 8px}
  .pcard .desc{font-size:14px;color:var(--mid);margin:0 0 10px}
  .pcard .fit{font-size:13.5px;color:var(--ink);margin:0 0 14px;padding-left:12px;border-left:2px solid var(--gold)}
  .retake{margin-top:26px;text-align:center}
  footer{text-align:center;color:#59657380;font-size:11px;margin-top:34px;padding:0 20px}
  .fade{animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .hidden{display:none}
</style>

<body>
  <div class="bar"><span class="brand">BREED<b>WISE</b><span class="w">The Profitable Breeder · Program Scorecard</span></span></div>

  <div class="prog hidden" id="prog">
    <div class="meta"><span class="stagename" id="progStage">Demand &amp; Brand</span><span id="progCount">Question 1 of 19</span></div>
    <div class="track"><div class="fill" id="progFill"></div></div>
  </div>

  <div class="wrap" id="app"></div>
  <footer>BreedWise · The Profitable Breeder. An educational self-assessment of how your program runs — not financial, legal or veterinary advice.</footer>

<script>
/* ===================== CONFIG ===================== */
var FN='https://xhjdowbnqcsvhtcccuqx.supabase.co/functions/v1/pb-scorecard';
var TPB_URL='https://www.skool.com/theprofitablebreeder/about';

/* ===================== DATA ===================== */
var SECTIONS=['Demand & Brand','Sales & Buyer Experience','Pricing & Profit','Breeding Foundations','Systems & Data'];
function secName(n){return SECTIONS[n-1];}

/* 15 best-practice questions. best:'yes'|'no' (flipped = best 'no'). */
var BP=[
 {id:1,sec:1,best:'yes',q:"Do buyers come to you by name or referral, instead of you chasing every sale?",
  explain:"A premium program is pulled toward demand, not pushed to fill a litter.",
  strength:"Inbound demand and referrals",
  gap:{title:"Build demand that comes to you",
   where:"Most litters are sold by chasing buyers, not by demand that already exists.",
   why:"When demand is pulled, a name, referrals and a waitlist mean you choose buyers instead of discounting to fill a litter on a deadline.",
   cost:"Chasing buyers forces price concessions and puts puppies in the wrong homes under pressure.",
   change:"You start each litter with more interest than puppies, and you place on your terms.",
   win:"List your last 10 buyers and mark how each found you. If most came from chasing, that is your first lever."}},
 {id:2,sec:1,best:'yes',q:"Can you say in one sentence what makes your program different from the breeder down the road?",
  explain:"",
  strength:"Clear, specific positioning",
  gap:{title:"Make your difference impossible to miss",
   where:"Your program looks like every other listing in the breed to a buyer scrolling past.",
   why:"Buyers pay a premium for a program they can tell apart. A sharp, specific promise is what lets you charge more than the breeder down the road.",
   cost:"Without it you compete on price and photos, which is a race to the bottom in every breed.",
   change:"Buyers understand in seconds why you cost more, and the right ones self-select toward you.",
   win:"Write one sentence: “Unlike most breeders, my program ___, so your puppy ___.” Put it at the top of everything."}},
 {id:3,sec:1,best:'yes',q:"Do you keep a real waitlist, with names and deposits, ahead of your next litter?",
  explain:"",
  strength:"A deposit-backed waitlist",
  gap:{title:"Build a deposit-backed waitlist",
   where:"Buyers are found after the puppies are on the ground, not before.",
   why:"A waitlist with deposits proves demand, funds the litter and removes the panic that leads to discounting.",
   cost:"Selling from zero every litter means time pressure, price cuts and placements you would not make with a line of buyers waiting.",
   change:"You breed into demand you have already confirmed, not a hope that buyers will show up.",
   win:"Open a simple waitlist form and ask your last three interested buyers for a deposit to hold a spot."}},
 {id:4,sec:2,best:'yes',q:"Do you run every inquiry through the same steps: screen, reply, qualify, then close?",
  explain:"",
  strength:"A repeatable sales process",
  gap:{title:"Run every buyer through one process",
   where:"Each inquiry is handled differently, depending on the day and the mood.",
   why:"A repeatable process means fewer good buyers slip through the cracks and every lead gets the same strong experience.",
   cost:"Ad-hoc replies lose buyers to whoever answered faster and more clearly, and make your conversion impossible to improve.",
   change:"Every inquiry moves through the same reliable path, and you can see exactly where buyers drop off.",
   win:"Write your four steps on one page and follow it for the next 10 inquiries."}},
 {id:5,sec:2,best:'no',q:"Do you answer most buyer questions off the cuff, text by text, as they come in?",
  explain:"",
  strength:"Prepared buyer communication",
  gap:{title:"Prepare your buyer answers in advance",
   where:"Buyer questions are answered from scratch each time, in the moment.",
   why:"The same 10 questions come up every litter. Prepared, confident answers build trust and move buyers toward a deposit.",
   cost:"Off-the-cuff replies are inconsistent, slow and easy to second-guess, and they quietly cost you deposits.",
   change:"You respond fast and consistently, and buyers feel they are dealing with a professional.",
   win:"Write saved answers to your 10 most common buyer questions and keep them one tap away."}},
 {id:6,sec:2,best:'yes',q:"Do you track how many inquiries turn into deposits?",
  explain:"",
  strength:"Knows their inquiry-to-deposit rate",
  gap:{title:"Measure inquiry to deposit",
   where:"You know roughly how it is going, but not the actual conversion rate.",
   why:"The single number that tells you whether your problem is traffic or closing is how many inquiries become deposits.",
   cost:"Without it you can spend on more leads when the real leak is your follow-up, or the reverse.",
   change:"You know whether to work on demand or on closing, instead of guessing.",
   win:"Count last month: inquiries in, deposits out. That percentage is your baseline."}},
 {id:7,sec:3,best:'yes',q:"Is your price set on the value and outcomes you deliver, not on what others in your breed charge?",
  explain:"",
  strength:"Value-based pricing",
  gap:{title:"Price on your value, not the market",
   where:"Your price is anchored to what other breeders charge, not to what your program delivers.",
   why:"Matching the market caps you at the market. Pricing on health testing, support and outcomes is how premium programs break away.",
   cost:"Copying local prices leaves real money on the table and trains buyers to see your puppies as a commodity.",
   change:"Your price reflects your program, and the buyers who value it pay it without a flinch.",
   win:"List everything you do that an average breeder does not. That list is the case for your price."}},
 {id:8,sec:3,best:'yes',q:"Do you know your true cost and profit per litter, not just the revenue?",
  explain:"",
  strength:"Knows real profit per litter",
  gap:{title:"Know your real profit per litter",
   where:"You track what comes in, but not what each litter actually costs you to produce.",
   why:"Revenue is not profit. Health testing, feed, vet care, your time and the misses all come out before anything is left.",
   cost:"Without the real number you can grow your revenue and your workload while your profit quietly shrinks.",
   change:"You know which litters and which decisions actually make money, and you build around those.",
   win:"Add up every cost of your last litter, subtract it from revenue, and divide by puppies placed."}},
 {id:9,sec:3,best:'no',q:"Have you held the same puppy price for more than two years?",
  explain:"",
  strength:"Pricing reviewed regularly",
  gap:{title:"Revisit your price on a schedule",
   where:"Your price has not moved in years, even as your costs and your program have.",
   why:"Costs rise and your program improves every year. A price that never moves falls behind both.",
   cost:"A frozen price silently erodes your margin and signals that nothing about your program has gotten better.",
   change:"Your price keeps pace with your costs and the value you have added, on purpose.",
   win:"Set a date each year to review your price against your costs and what you have improved."}},
 {id:10,sec:4,best:'yes',q:"Do you complete the breed-appropriate health testing on every dog before breeding?",
  explain:"",
  strength:"Full pre-breeding health testing",
  gap:{title:"Test every dog before breeding",
   where:"Health testing happens sometimes, or on some dogs, rather than on every dog every time.",
   why:"Complete, breed-appropriate testing is the foundation of healthier litters and the clearest proof a premium buyer looks for.",
   cost:"Gaps in testing risk avoidable health problems, hard conversations and the reputation your whole program rests on.",
   change:"Every breeding decision starts from a known, documented health picture.",
   win:"Write the full testing panel for your breed, then mark which of your dogs are missing anything."}},
 {id:11,sec:4,best:'yes',q:"Do you time breedings with progesterone, not just signs or dates?",
  explain:"Progesterone testing pinpoints ovulation, which the calendar and behaviour only estimate.",
  strength:"Progesterone-timed breedings",
  gap:{title:"Time breedings with progesterone",
   where:"Breedings are timed by signs, behaviour or the calendar.",
   why:"Up to three quarters of conception failures trace back to timing, not fertility. Progesterone finds the real window.",
   cost:"Mis-timed breedings mean missed cycles, small litters and a lost season you cannot get back.",
   change:"You breed on the day that actually matters, and your conception and litter sizes reflect it.",
   win:"Plan progesterone testing with your vet or a repro service for your next breeding."}},
 {id:12,sec:4,best:'yes',q:"Do you have a written whelping and emergency plan agreed with your vet before the due date?",
  explain:"",
  strength:"A vet-agreed whelping plan",
  gap:{title:"Agree the whelping plan in advance",
   where:"The whelping plan lives in your head, and the emergency plan gets made in the moment.",
   why:"Whelping decisions are time-critical. A plan agreed with your vet before the due date is what turns a 2am scare into a known next step.",
   cost:"Without it, a hard whelping becomes guesswork and panic, which is exactly when puppies are lost.",
   change:"You and your vet already know the call points and the plan before labour starts.",
   win:"Before your next due date, write the plan and the after-hours number and confirm both with your vet."}},
 {id:13,sec:5,best:'yes',q:"Do you track each litter's outcomes and economics so you can compare litter to litter?",
  explain:"",
  strength:"Tracks outcomes litter to litter",
  gap:{title:"Compare your litters to each other",
   where:"Each litter is run and remembered on its own, with nothing to compare it against.",
   why:"Comparable records are how you see what is actually improving: survival, litter size, price, profit and time.",
   cost:"Without them, the same mistakes repeat and real progress is invisible, so you cannot tell what to double down on.",
   change:"Every litter becomes data that makes the next one better.",
   win:"Start one simple sheet with a row per litter: born, placed, price, cost, profit, notes."}},
 {id:14,sec:5,best:'no',q:"Does most of your program live in your head and your phone's notes?",
  explain:"",
  strength:"Program runs on systems, not memory",
  gap:{title:"Get your program out of your head",
   where:"The waitlist, the process and the records mostly live in your memory and scattered notes.",
   why:"A program that runs on systems can scale, survive a bad week and eventually run without you doing everything.",
   cost:"A program that lives in your head caps at your capacity, breaks when you are busy, and cannot be handed off.",
   change:"The work runs on checklists and simple systems, so nothing depends on you remembering it.",
   win:"Pick the one thing you most often drop and turn it into a written checklist this week."}},
 {id:15,sec:5,best:'yes',q:"Do you know your numbers: litters a year, average price, revenue and margin?",
  explain:"",
  strength:"Knows the core numbers",
  gap:{title:"Know your four core numbers",
   where:"You have a rough sense of the numbers, but not the actual figures in front of you.",
   why:"Litters a year, average price, revenue and margin are the dashboard of your program. You cannot grow what you do not measure.",
   cost:"Flying blind means decisions made on feel, and a program that drifts instead of improving on purpose.",
   change:"You make decisions from real numbers, and you can see the effect of every change you make.",
   win:"Write your four numbers for the last 12 months today. That is your starting line."}}
];

/* qualifying 16-20 */
var QUAL=[
 {id:16,q:"How many litters do you raise in a typical year?",
  opts:["Planning my first litter","1 to 2","3 to 5","6 or more"]},
 {id:17,q:"What is the biggest bottleneck in your program right now?",
  opts:["Not enough demand","Pricing & profit","Sales & closing buyers","Breeding outcomes","Systems & my time"]},
 {id:18,q:"In the next 12 months, what would change the game for you?",
  opts:["Consistent premium demand","A higher price per puppy","A program that runs without me","Stronger breeding outcomes","Finally knowing my numbers"]},
 {id:19,q:"How would you like to grow your program?",
  opts:["On my own, at my own pace","With a clear plan and a community of serious breeders","With structured coaching and expert support","Not sure yet"]},
 {id:20,q:"Anything else you'd like us to know?",free:true,
  note:"Optional. Keep questions about a specific dog for your own veterinarian."}
];

/* Q17 bottleneck → section */
var GOAL_SEC={0:1,1:3,2:2,3:4,4:5};

var BANDS=[
 {min:70,label:"Built to scale",
  msg:"Most of the fundamentals of a profitable program are already in place. What's left is sharpening the edges, and each remaining gap is below.",
  note:"You already run at a level most breeders never reach. The gaps left are the ones that separate a good program from a premium, profitable one. Close them one at a time and measure each."},
 {min:40,label:"Solid, with clear next gains",
  msg:"Good foundations are in place and the program works. A few areas still run on instinct instead of systems, and that is what holds back your best results.",
  note:"Your foundations are solid. A few areas still run on judgment rather than systems, and that is where your next year will gain the most. Every gap here is one habit, and none of it has to be built alone."},
 {min:0,label:"Most room to grow",
  msg:"Your next gains sit in a handful of habits that most breeders are never taught. Start with the three moves below, then work through your weakest area.",
  note:"If your score is lower than you expected, it is not a verdict on your program. These 15 practices go past what most breeders are ever shown. What matters is your next litter, and every gap here is something you can start on this week."}
];
var UNDERSCORE="These 15 practices go past what most breeders are taught. Every gap below is one habit to add, and each comes with a first step.";
var NOTSURE_WHERE="This is a practice you weren't sure about, so it counts as a gap for now.";

var SECMSG={
 3:{label:"Dialed in",msg:""},
 2:{label:"Nearly there",msg:"Strong foundations, with one habit left to add."},
 1:{label:"Next gain",msg:"Some foundations are in place. The two habits below are where this area has the most room."},
 0:{label:"Start here",msg:"This area has the most room in your program. Focus on these three foundations before anything more advanced."}
};

var OBSTACLE=[
 "You said demand is the bottleneck. The fix is a program buyers seek out and a waitlist that fills before the puppies do.",
 "You said pricing and profit is the bottleneck. That starts with knowing your real numbers, then pricing on the value you deliver.",
 "You said sales and closing is the bottleneck. One repeatable process, with prepared answers, is what turns inquiries into deposits.",
 "You said breeding outcomes are the bottleneck. That is where testing, timing and a whelping plan do the heavy lifting.",
 "You said systems and time are the bottleneck. The fix is getting the program out of your head and onto checklists, one at a time."
];
var BRIDGE="You now know where the gaps are and what to do about each one. Knowing the path is the first half. Walking it, one habit at a time, is faster with a proven plan and serious breeders around you.";

/* ===================== STATE ===================== */
var A={first:"",last:"",email:"",phone:"",bp:{},q16:null,q17:null,q18:null,q19:null,q20:""};
var STEPS=[];
(function(){STEPS.push('landing','contact');BP.forEach(function(x){STEPS.push('bp'+x.id);});QUAL.forEach(function(x){STEPS.push('q'+x.id);});STEPS.push('results');})();
var step=0, optinSent=false, completionSent=false;
var app=document.getElementById('app');
var emailRe=/^[^@\s]+@[^@\s]+\.[^@\s]+$/;

function show(){
  var s=STEPS[step];window.scrollTo(0,0);
  var isQ=(s.substr(0,2)==='bp')||(s.charAt(0)==='q'&&s!=='results');
  document.getElementById('prog').classList.toggle('hidden',!isQ);
  if(isQ)renderProgress();
  if(s==='landing')return renderLanding();
  if(s==='contact')return renderContact();
  if(s.substr(0,2)==='bp')return renderBP(parseInt(s.substr(2),10));
  if(s.charAt(0)==='q'&&s!=='results')return renderQual(parseInt(s.substr(1),10));
  if(s==='results')return renderResults();
}
function go(n){step=Math.max(0,Math.min(STEPS.length-1,n));show();}
function qIndexOf(){var done=0;for(var i=2;i<=step;i++){var s=STEPS[i];if((s.substr(0,2)==='bp')||(s.charAt(0)==='q'&&s!=='results'))done++;}return done;}
function renderProgress(){
  var idx=qIndexOf();var s=STEPS[step];var label="About you";
  if(s.substr(0,2)==='bp')label=secName(BP[parseInt(s.substr(2),10)-1].sec);
  document.getElementById('progStage').textContent=label;
  document.getElementById('progCount').textContent="Question "+idx+" of 19";
  document.getElementById('progFill').style.width=(idx/19*100)+"%";
}

function renderLanding(){
  app.innerHTML=
  '<div class="center fade">'
   +'<span class="eyebrow">Free · 19 quick questions · about 4 minutes</span>'
   +'<h1>Working harder every litter, but the program still <span class="u">isn\'t paying off</span>?</h1>'
   +'<p class="lead">Answer 19 quick questions to find out why. The scorecard measures the five areas that decide whether a breeding program is profitable, and gives you your first three moves for the next 90 days.</p>'
   +'<button class="cta" id="startBtn">Start the scorecard</button>'
   +'<div class="undercta">100% free. About 4 minutes. Your personal results and next steps appear on screen the moment you finish.</div>'
  +'</div>'
  +'<div class="section-title center">How it works</div>'
  +'<div class="card"><div class="how">'
    +'<div class="row"><div class="n">1</div><div class="t"><b>Answer:</b> 19 questions; most are yes or no, and "Not sure" is always an option.</div></div>'
    +'<div class="row"><div class="n">2</div><div class="t"><b>See your score:</b> an overall score plus a score for each of the five areas.</div></div>'
    +'<div class="row"><div class="n">3</div><div class="t"><b>Get your first three moves:</b> your top priorities for the next 90 days, plus every gap explained.</div></div>'
  +'</div></div>'
  +'<div class="section-title center">The five areas</div>'
  +'<div class="card"><div class="seclist">'
    +'<div class="s"><span class="k">Area 1</span><span><b>Demand &amp; Brand:</b> referrals, positioning, your waitlist.</span></div>'
    +'<div class="s"><span class="k">Area 2</span><span><b>Sales &amp; Buyer Experience:</b> process, follow-up, conversion.</span></div>'
    +'<div class="s"><span class="k">Area 3</span><span><b>Pricing &amp; Profit:</b> value-based pricing, real profit per litter.</span></div>'
    +'<div class="s"><span class="k">Area 4</span><span><b>Breeding Foundations:</b> health testing, timing, whelping plan.</span></div>'
    +'<div class="s"><span class="k">Area 5</span><span><b>Systems &amp; Data:</b> records, your numbers, operations.</span></div>'
  +'</div></div>'
  +'<div class="card" style="margin-top:14px"><p class="credit">The best breeders run a healthy program <b style="color:var(--ink)">and</b> a profitable one. This scorecard checks the handful of habits behind both, and whether they are already in your program.</p>'
    +'<p class="disc">An educational self-assessment of how your program runs. Not financial, legal or veterinary advice. Decisions about your dogs stay with your own veterinarian.</p></div>'
  +'<div class="center"><button class="cta" id="startBtn2">Start the scorecard</button></div>';
  document.getElementById('startBtn').onclick=function(){go(step+1);};
  document.getElementById('startBtn2').onclick=function(){go(step+1);};
}

function renderContact(){
  app.innerHTML=
   '<div class="center fade" style="max-width:480px;margin:0 auto">'
   +'<span class="eyebrow">Almost there</span>'
   +'<h1>Where should we send your <span class="u">results</span>?</h1>'
   +'<p class="lead">Your results appear on screen as soon as you finish. Your details stay private.</p>'
   +'<div class="card" style="margin-top:22px;text-align:left">'
    +'<input type="text" class="hp" id="company" tabindex="-1" autocomplete="off" aria-hidden="true">'
    +'<div class="row2">'
      +'<div class="fld"><label>First name</label><input type="text" id="first" autocomplete="given-name" required></div>'
      +'<div class="fld"><label>Last name <span style="color:#5b6775">(optional)</span></label><input type="text" id="last" autocomplete="family-name"></div>'
    +'</div>'
    +'<div class="fld"><label>Email</label><input type="email" id="email" autocomplete="email" required></div>'
    +'<div class="fld"><label>Phone</label><input type="tel" id="phone" autocomplete="tel" required></div>'
    +'<button class="cta" id="c_next" style="margin-top:4px">Start question 1</button>'
    +'<div class="msg" id="c_msg"></div>'
    +'<div class="trust">Free. Your information stays private.</div>'
   +'</div>'
   +'<div class="navrow" style="justify-content:flex-start"><button class="back" id="c_back">&larr; Back</button></div>'
  +'</div>';
  document.getElementById('first').value=A.first||'';
  document.getElementById('last').value=A.last||'';
  document.getElementById('email').value=A.email||'';
  document.getElementById('phone').value=A.phone||'';
  document.getElementById('c_back').onclick=function(){go(step-1);};
  document.getElementById('c_next').onclick=submitContact;
}
function submitContact(){
  var msg=document.getElementById('c_msg');
  var first=document.getElementById('first').value.trim();
  var email=document.getElementById('email').value.trim();
  var phone=document.getElementById('phone').value.trim();
  if(!first){msg.style.color='var(--red)';msg.textContent='Please add your first name.';return;}
  if(!emailRe.test(email)){msg.style.color='var(--red)';msg.textContent='Please enter a valid email.';return;}
  if(phone.replace(/\D/g,'').length<7){msg.style.color='var(--red)';msg.textContent='Please enter a valid phone number.';return;}
  A.first=first;A.last=document.getElementById('last').value.trim();A.email=email;A.phone=phone;
  A.company=document.getElementById('company').value;
  if(!optinSent){optinSent=true;
    try{fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'pb-optin',first:A.first,last:A.last,email:A.email,phone:A.phone,company:A.company})}).catch(function(){});}catch(e){}
  }
  go(step+1);
}

function renderBP(id){
  var Q=BP[id-1];var cur=A.bp[id]||null;
  var opts=[['yes','Yes'],['no','No'],['notsure','Not sure']];
  var html='<div class="fade"><div class="qnum">Area '+Q.sec+' · '+secName(Q.sec)+'</div>'
    +'<p class="qtext">'+Q.q+'</p>'
    +(Q.explain?'<p class="qexplain">'+Q.explain+'</p>':'')
    +'<div class="opts">';
  opts.forEach(function(o){html+='<button class="opt'+(cur===o[0]?' sel':'')+(o[0]==='notsure'?' ns':'')+'" data-v="'+o[0]+'"><span class="dot"></span>'+o[1]+'</button>';});
  html+='</div><div class="navrow"><button class="back" id="b_back">&larr; Back</button></div></div>';
  app.innerHTML=html;
  document.getElementById('b_back').onclick=function(){go(step-1);};
  Array.prototype.forEach.call(app.querySelectorAll('.opt'),function(b){
    b.onclick=function(){A.bp[id]=b.getAttribute('data-v');
      Array.prototype.forEach.call(app.querySelectorAll('.opt'),function(x){x.classList.remove('sel');});
      b.classList.add('sel');setTimeout(function(){go(step+1);},170);};
  });
}

function renderQual(id){
  var Q=QUAL[id-16];var key='q'+id;var cur=A[key];
  if(Q.free){
    app.innerHTML='<div class="fade"><div class="qnum">About you · last one</div>'
      +'<p class="qtext">'+Q.q+'</p>'
      +'<div class="fld"><textarea id="freeTxt" placeholder="Optional">'+(cur||'')+'</textarea></div>'
      +'<p class="optnote">'+Q.note+'</p>'
      +'<button class="cta" id="q_done">See my results</button>'
      +'<div class="navrow"><button class="back" id="q_back">&larr; Back</button></div></div>';
    document.getElementById('q_back').onclick=function(){go(step-1);};
    document.getElementById('q_done').onclick=function(){A.q20=document.getElementById('freeTxt').value.trim();go(step+1);};
    return;
  }
  var html='<div class="fade"><div class="qnum">About you</div><p class="qtext">'+Q.q+'</p><div class="opts">';
  Q.opts.forEach(function(o,i){html+='<button class="opt'+(cur===i?' sel':'')+'" data-i="'+i+'"><span class="dot"></span>'+o+'</button>';});
  html+='</div><div class="navrow"><button class="back" id="q_back">&larr; Back</button></div></div>';
  app.innerHTML=html;
  document.getElementById('q_back').onclick=function(){go(step-1);};
  Array.prototype.forEach.call(app.querySelectorAll('.opt'),function(b){
    b.onclick=function(){A[key]=parseInt(b.getAttribute('data-i'),10);
      Array.prototype.forEach.call(app.querySelectorAll('.opt'),function(x){x.classList.remove('sel');});
      b.classList.add('sel');setTimeout(function(){go(step+1);},170);};
  });
}

/* ===================== SCORING ===================== */
function isBest(Q){return A.bp[Q.id]===Q.best;}
function isGap(Q){return A.bp[Q.id]!==Q.best;}
function secScore(s){var c=0;BP.forEach(function(Q){if(Q.sec===s&&isBest(Q))c++;});return c;}
function weakestSec(){var best=1,bs=99;for(var s=1;s<=5;s++){var v=secScore(s);if(v<bs){bs=v;best=s;}}return best;}
function overallRaw(){var c=0;BP.forEach(function(Q){if(isBest(Q))c++;});return c;}
function overallPct(){return Math.round(overallRaw()/15*100);}
function bandFor(p){for(var i=0;i<BANDS.length;i++){if(p>=BANDS[i].min)return BANDS[i];}return BANDS[2];}
function bandKey(p){return p>=70?'scale':(p>=40?'solid':'grow');}
function segment(){ if(A.q19===2)return 'hot'; if(A.q19===1||A.q16===2||A.q16===3)return 'warm'; return 'cold'; }

/* ===================== RESULTS ===================== */
function renderResults(){
  var pct=overallPct(), raw=overallRaw(), band=bandFor(pct);
  var goalSec=GOAL_SEC[A.q17]; if(goalSec==null)goalSec=weakestSec();
  var weak=weakestSec();
  var gaps=BP.filter(isGap);
  var goalPhrase=lc(QUAL[1].opts[A.q17]||'');
  var sp='';
  if(gaps.length===0){sp="All 15 practices are in place. Your next 90 days are about tracking your numbers and compounding what already works.";}
  else if(secScore(goalSec)===3){sp="You told us your bottleneck is "+goalPhrase+". Your "+secName(goalSec)+" area is already dialed in, so the fastest gains sit in your "+secName(weak)+" area ("+secScore(weak)+" of 3).";}
  else{sp="You told us your bottleneck is "+goalPhrase+". Your "+secName(goalSec)+" area scored "+secScore(goalSec)+" of 3, so that is where your 90 days start.";}
  var moves=orderedGaps(goalSec).slice(0,3);
  var strengths=BP.filter(isBest);
  var gapSecs=[1,2,3,4,5].filter(function(s){return secScore(s)<3;}).sort(function(a,b){return secScore(a)-secScore(b)||a-b;});

  var html='<div class="fade">';
  html+='<h1 class="center" style="margin-top:4px">'+esc(A.first)+', here\'s where your program stands.</h1>';
  html+='<div class="scorewrap">'+ring(pct)
    +'<div class="band">'+band.label+'</div><p class="bandmsg">'+band.msg+'</p>'
    +'<p class="underscore">'+UNDERSCORE+'</p></div>';
  html+='<div class="section-title">Your 90-day starting point</div><div class="card startpoint"><p class="p">'+sp+'</p>';
  if(moves.length){
    html+='<div class="moves">';
    moves.forEach(function(Q,i){html+='<div class="move"><div class="mi">'+(i+1)+'</div><div class="mt"><b>'+Q.gap.title+'</b><span>'+Q.gap.win+'</span></div></div>';});
    html+='</div><p class="bridgeline">Want these moves turned into a full plan, with breeders working on the same thing?</p>'
      +'<a class="cta" href="'+TPB_URL+'" target="_blank" rel="noopener">Join The Profitable Breeder &rarr;</a>';
  }
  html+='</div>';
  html+='<div class="section-title">Your five areas</div><div class="secgrid">';
  for(var s=1;s<=5;s++){var ss=secScore(s);var dots='';for(var d=0;d<3;d++)dots+='<span class="d'+(d<ss?' on':'')+'"></span>';
    html+='<div class="sc"><div class="dots">'+dots+'</div><div class="nm">'+secName(s)+'</div><div class="lb">'+SECMSG[ss].label+'</div></div>';}
  html+='</div>';
  if(strengths.length){
    html+='<div class="section-title">Already in place</div><div class="chips">';
    strengths.forEach(function(Q){html+='<span class="chip">'+Q.strength+'</span>';});
    html+='</div><p class="subtle">These habits are already at the level a premium program needs. Keep them.</p>';
  }
  if(gapSecs.length){
    html+='<div class="section-title">Your gaps, area by area</div>';
    gapSecs.forEach(function(s){var ss=secScore(s),sm=SECMSG[ss];
      html+='<div class="stageblock"><div class="stagehead"><div class="k">Area '+s+' · '+ss+' of 3 in place</div>'
        +'<div class="nm">'+secName(s)+': <em>'+sm.label+'</em></div>'+(sm.msg?'<div class="sm">'+sm.msg+'</div>':'')+'</div>';
      BP.filter(function(Q){return Q.sec===s&&isGap(Q);}).forEach(function(Q){html+=gapCard(Q);});
      html+='</div>';});
  }
  html+='<div class="section-title">Your next step</div><div class="card">'
    +'<p class="bandmsg" style="text-align:left;color:var(--ink);margin:0 0 10px">'+OBSTACLE[A.q18]+'</p>'
    +'<p class="bandmsg" style="text-align:left;margin:0 0 4px">'+BRIDGE+'</p>'
    +'<div class="pcard"><div class="tag">Recommended for you</div><h3>The Profitable Breeder</h3>'
    +'<p class="desc">Get your program ready to scale with a clearer plan: the 90-day Profitable Breeder Blueprint, weekly live sessions, and business, sales and breeding education, in a community of serious breeders.</p>'
    +'<p class="fit">Your three moves above are the start. The Profitable Breeder gives you the framework and the people to see them through.</p>'
    +'<a class="cta" href="'+TPB_URL+'" target="_blank" rel="noopener">See what\'s inside The Profitable Breeder &rarr;</a></div></div>';
  html+='<div class="retake"><button class="cta ghost" id="retake">Retake the scorecard</button></div>';
  html+='<p class="subtle center" style="max-width:560px;margin:18px auto 0">An educational self-assessment of how your program runs. Not financial, legal or veterinary advice.</p>';
  html+='</div>';
  app.innerHTML=html;
  document.getElementById('retake').onclick=function(){A.bp={};A.q16=A.q17=A.q18=A.q19=null;A.q20="";completionSent=false;step=0;show();};
  sendCompletion(pct,raw,band,goalSec,moves,segment(),gaps);
}
function orderedGaps(goalSec){
  var gaps=BP.filter(isGap);
  var g1=gaps.filter(function(Q){return Q.sec===goalSec;}).sort(function(a,b){return a.id-b.id;});
  var g2=gaps.filter(function(Q){return Q.sec!==goalSec;}).sort(function(a,b){return secScore(a.sec)-secScore(b.sec)||a.id-b.id;});
  return g1.concat(g2);
}
function gapCard(Q){
  var ns=(A.bp[Q.id]==='notsure');var where=ns?NOTSURE_WHERE:Q.gap.where;
  return '<div class="gap">'+(ns?'<span class="ns">You answered ‘Not sure’</span>':'')
    +'<div class="gt">'+Q.gap.title+'</div>'
    +gl('Where you are',where)+gl('Why it matters',Q.gap.why)+gl('The cost of leaving it',Q.gap.cost)
    +gl('What changes when you close it',Q.gap.change)
    +'<div class="gl win"><span class="lab">Quick win this week</span><span class="tx">'+Q.gap.win+'</span></div></div>';
}
function gl(lab,tx){return '<div class="gl"><span class="lab">'+lab+'</span><span class="tx">'+tx+'</span></div>';}
function ring(pct){
  var r=76,c=2*Math.PI*r,off=c*(1-pct/100);
  return '<div class="ring"><svg width="168" height="168" viewBox="0 0 168 168">'
    +'<circle cx="84" cy="84" r="'+r+'" fill="none" stroke="#212b36" stroke-width="11"/>'
    +'<circle cx="84" cy="84" r="'+r+'" fill="none" stroke="url(#g)" stroke-width="11" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'"/>'
    +'<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c9a862"/><stop offset="1" stop-color="#e4cf9a"/></linearGradient></defs>'
    +'</svg><div class="val"><div class="num">'+pct+'</div><div class="den">OUT OF 100</div></div></div>';
}
function lc(s){return s?s.charAt(0).toLowerCase()+s.slice(1):s;}
function esc(s){return (s||'').replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];});}

function sendCompletion(pct,raw,band,goalSec,moves,seg,gaps){
  if(completionSent)return;completionSent=true;
  var answers={};BP.forEach(function(Q){answers['q'+Q.id]=A.bp[Q.id]||null;});
  var payload={action:'pb-scorecard',first:A.first,last:A.last,email:A.email,phone:A.phone,company:A.company||'',
    scorePct:pct,scoreRaw:raw,band:bandKey(pct),
    secScores:{1:secScore(1),2:secScore(2),3:secScore(3),4:secScore(4),5:secScore(5)},
    gaps:gaps.map(function(Q){return Q.id;}),
    notsure:BP.filter(function(Q){return A.bp[Q.id]==='notsure';}).map(function(Q){return Q.id;}),
    priorities:moves.map(function(Q){return Q.gap.title;}),
    goalSec:goalSec,segment:seg,programShown:'tpb',
    answers:answers,qual:{q16:A.q16,q17:A.q17,q18:A.q18,q19:A.q19,q20:A.q20}};
  try{fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).catch(function(){});}catch(e){}
}

show();
</script>
</body>
</html>
