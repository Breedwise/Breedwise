<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Revision Worklist · BreedWise</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0b0e13;--panel:#12181f;--panel2:#0f151c;--line:#212b36;--line2:#2c3846;--ink:#f0f4f9;--mid:#c0cad6;--muted:#818d9b;--faint:#5a6675;--gold:#c9a862;--gold-soft:#e4cf9a;--green:#57b98a;--green-s:rgba(87,185,138,.14);--amber:#e0b15e;--amber-s:rgba(224,177,94,.14);--blue:#7fb0dd;--blue-s:rgba(127,176,221,.14);--red:#ff8178;--disp:'Fraunces',Georgia,serif;--sans:'Inter',-apple-system,BlinkMacSystemFont,sans-serif}
  *{box-sizing:border-box;margin:0}
  body{background:radial-gradient(1000px 560px at 80% -10%,rgba(201,168,98,.07),transparent 60%),var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;line-height:1.5}
  #gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:90}
  #gate .box{width:min(92vw,380px);text-align:center}
  #gate .mk{font-family:var(--disp);font-size:13px;letter-spacing:.22em;font-weight:700;color:var(--gold);margin-bottom:16px}
  #gate h1{font-family:var(--disp);font-size:22px;font-weight:600;margin-bottom:18px}
  #gate input{width:100%;padding:13px 15px;background:var(--panel);border:1px solid var(--line2);border-radius:11px;color:var(--ink);font-size:15px;text-align:center;letter-spacing:.05em}
  #gate button{width:100%;margin-top:10px;padding:13px;background:var(--gold);border:0;border-radius:11px;color:#17130a;font-weight:700;font-size:14px;cursor:pointer;font-family:var(--sans)}
  #gate .err{color:var(--red);font-size:12.5px;min-height:16px;margin-top:9px}
  #app{display:none}
  .bar{position:sticky;top:0;z-index:30;background:rgba(11,14,19,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .bar .in{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:13px 20px;flex-wrap:wrap}
  .brand{font-size:12px;letter-spacing:.2em;font-weight:700;color:var(--mid)}.brand b{color:var(--gold)}
  .sp{flex:1}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tab{background:var(--panel);border:1px solid var(--line2);color:var(--mid);border-radius:20px;padding:7px 14px;font-size:12.5px;font-weight:500;cursor:pointer;font-family:var(--sans)}
  .tab.on{background:rgba(201,168,98,.14);border-color:var(--gold);color:var(--gold-soft);font-weight:600}
  .tab .c{opacity:.7;margin-left:5px}
  .tbtn{background:var(--panel);border:1px solid var(--line2);color:var(--mid);border-radius:8px;padding:8px 13px;font-size:12.5px;cursor:pointer;font-family:var(--sans)}
  .tbtn:hover{border-color:var(--gold);color:var(--ink)}
  .wrap{max-width:1000px;margin:0 auto;padding:22px 20px 80px}
  .empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:14px}
  .req{background:linear-gradient(162deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:16px}
  .req.done{opacity:.62}
  .rhead{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:6px}
  .rhead .who{flex:1;min-width:200px}
  .rhead .kn{font-family:var(--disp);font-size:19px;font-weight:600;color:var(--ink)}
  .rhead .meta{font-size:12.5px;color:var(--muted);margin-top:3px}
  .rhead .meta a{color:var(--gold-soft);text-decoration:none}
  .rhead .meta a:hover{text-decoration:underline}
  .when{font-size:12px;color:var(--faint);white-space:nowrap}
  .status{display:flex;gap:5px}
  .sbtn{border:1px solid var(--line2);background:var(--panel2);color:var(--muted);border-radius:16px;padding:5px 12px;font-size:11.5px;font-weight:600;cursor:pointer;font-family:var(--sans)}
  .sbtn.on.new{background:var(--amber-s);border-color:var(--amber);color:var(--amber)}
  .sbtn.on.doing{background:var(--blue-s);border-color:var(--blue);color:var(--blue)}
  .sbtn.on.done{background:var(--green-s);border-color:var(--green);color:var(--green)}
  .changes{margin-top:14px;border-top:1px solid var(--line);padding-top:6px}
  .chg{padding:14px 0;border-bottom:1px solid rgba(255,255,255,.05)}
  .chg:last-child{border-bottom:0}
  .chg .ct{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:8px}
  .chg .num{font-family:var(--disp);font-size:14px;color:var(--gold);width:24px}
  .badge{font-size:11px;font-weight:600;letter-spacing:.03em;padding:3px 10px;border-radius:14px;background:rgba(201,168,98,.12);border:1px solid rgba(201,168,98,.3);color:var(--gold-soft)}
  .badge.type{background:var(--panel2);border-color:var(--line2);color:var(--mid)}
  .chg .detail{font-size:14.5px;color:var(--ink);white-space:pre-wrap;line-height:1.55;margin-left:33px}
  .imgs{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0 33px}
  .imgs a{width:92px;height:92px;border-radius:10px;overflow:hidden;border:1px solid var(--line2);background:var(--panel2);display:block}
  .imgs img{width:100%;height:100%;object-fit:cover}
  .imgs .ph{display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:11px;height:100%}
  .notes{margin-top:12px;font-size:13px;color:var(--mid);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
  .notes b{color:var(--gold-soft)}
  #lb{position:fixed;inset:0;background:rgba(6,8,11,.95);z-index:120;display:none;align-items:center;justify-content:center;padding:28px;cursor:zoom-out}
  #lb.on{display:flex}#lb img{max-width:92vw;max-height:90vh;border-radius:12px}
</style>
</head>
<body>
  <div id="gate"><div class="box">
    <div class="mk">BREEDWISE · WEBSITE BUILD</div>
    <h1>Revision Worklist</h1>
    <input id="pw" type="password" placeholder="Access code" autocomplete="off">
    <button id="unlock">Open →</button>
    <div class="err" id="gerr"></div>
  </div></div>

  <div id="app">
    <div class="bar"><div class="in">
      <span class="brand"><b>BREEDWISE</b> · REVISIONS</span>
      <span class="sp"></span>
      <div class="tabs" id="tabs"></div>
      <button class="tbtn" id="refresh">Refresh</button>
    </div></div>
    <div class="wrap"><div id="list"><div class="empty">Loading…</div></div></div>
  </div>
  <div id="lb"><img src="" alt=""></div>

<script>
var SB_URL='https://xhjdowbnqcsvhtcccuqx.supabase.co';
var FN=SB_URL+'/functions/v1/asset-upload';
var SECRET='bw_assets_7Hq2';
var OK='9246644800ee47514a21d1c58ddb2e9da50acbf5a431e30b2bac0e387e55882b'; /* REVISIONS2026 */
function $(s,r){return (r||document).querySelector(s);}
function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];});}
var ROWS=[],FILTER='open',LINKS={};
var STLABEL={new:'New',doing:'In progress',done:'Done'};

function fmtDate(s){try{var d=new Date(s);return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' · '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});}catch(e){return '';}}

async function fetchRows(){
  var r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'revisions',secret:SECRET})});
  var d=await r.json();
  if(!d||!d.ok){$('#list').innerHTML='<div class="empty">Could not load ('+esc((d&&d.error)||'unknown')+').</div>';return;}
  ROWS=d.rows||[];
  await loadLinks();
  renderTabs();render();
}
async function loadLinks(){
  var paths=[];ROWS.forEach(function(r){(r.files||[]).forEach(function(f){if(f.path)paths.push(f.path);});});
  paths=paths.slice(0,80);
  if(!paths.length)return;
  try{
    var r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'links',secret:SECRET,paths:paths})});
    var d=await r.json();
    if(d&&d.ok)(d.links||[]).forEach(function(l){LINKS[l.path]=l.url;});
  }catch(e){}
}

function counts(){var c={open:0,new:0,doing:0,done:0,all:ROWS.length};ROWS.forEach(function(r){c[r.status]=(c[r.status]||0)+1;if(r.status!=='done')c.open++;});return c;}
function renderTabs(){
  var c=counts();
  var tabs=[['open','Open',c.open],['new','New',c.new],['doing','In progress',c.doing],['done','Done',c.done],['all','All',c.all]];
  var box=$('#tabs');box.innerHTML='';
  tabs.forEach(function(t){
    var b=el('button','tab'+(FILTER===t[0]?' on':''),esc(t[1])+'<span class="c">'+t[2]+'</span>');
    b.addEventListener('click',function(){FILTER=t[0];renderTabs();render();});
    box.appendChild(b);
  });
}
function visible(){
  if(FILTER==='all')return ROWS;
  if(FILTER==='open')return ROWS.filter(function(r){return r.status!=='done';});
  return ROWS.filter(function(r){return r.status===FILTER;});
}
function render(){
  var list=$('#list');var rows=visible();
  if(!rows.length){list.innerHTML='<div class="empty">Nothing here yet.</div>';return;}
  list.innerHTML='';
  rows.forEach(function(r){list.appendChild(card(r));});
}
function card(r){
  var c=el('div','req'+(r.status==='done'?' done':''));
  var head=el('div','rhead');
  var who=el('div','who');
  who.appendChild(el('div','kn',esc(r.kennel||r.name||r.email||'Unnamed')));
  var meta=[];
  if(r.name&&r.kennel)meta.push(esc(r.name));
  if(r.email)meta.push('<a href="mailto:'+esc(r.email)+'">'+esc(r.email)+'</a>');
  if(r.phone)meta.push('<a href="tel:'+esc(r.phone)+'">'+esc(r.phone)+'</a>');
  if(r.site){var u=/^https?:/.test(r.site)?r.site:('https://'+r.site);meta.push('<a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(r.site)+'</a>');}
  who.appendChild(el('div','meta',meta.join(' &nbsp;·&nbsp; ')));
  head.appendChild(who);
  head.appendChild(el('div','when',fmtDate(r.created_at)));
  c.appendChild(head);

  // status buttons
  var st=el('div','status');
  ['new','doing','done'].forEach(function(s){
    var b=el('button','sbtn '+s+(r.status===s?' on':''),STLABEL[s]);
    b.addEventListener('click',function(){setStatus(r,s);});
    st.appendChild(b);
  });
  c.appendChild(st);

  // changes
  var ch=el('div','changes');
  (r.revisions||[]).forEach(function(rv,i){
    var box=el('div','chg');
    var t=el('div','ct');
    t.appendChild(el('span','num',(rv.n||i+1)));
    t.appendChild(el('span','badge',esc(rv.page||'—')));
    if(rv.typeLabel)t.appendChild(el('span','badge type',esc(rv.typeLabel)));
    box.appendChild(t);
    box.appendChild(el('div','detail',esc(rv.detail||'')));
    // images with this change's field
    var field=rv.field||('rev-'+(rv.n||i+1));
    var imgs=(r.files||[]).filter(function(f){return f.field===field;});
    if(imgs.length){
      var ig=el('div','imgs');
      imgs.forEach(function(f){
        var url=LINKS[f.path];
        var a=el('a');a.href=url||'#';a.target='_blank';a.rel='noopener';
        if(url){var im=el('img');im.src=url;im.alt=f.name||'';a.appendChild(im);a.addEventListener('click',function(e){e.preventDefault();openLb(url);});}
        else a.appendChild(el('div','ph','image'));
        ig.appendChild(a);
      });
      box.appendChild(ig);
    }
    ch.appendChild(box);
  });
  c.appendChild(ch);

  // notes
  var notes=r.revisions&&r.revisions.length?null:null;
  if(r.summary&&!r.revisions.length)c.appendChild(el('div','notes',esc(r.summary)));
  // free-text extra note lives in inputs.fields.notes — not returned; skip gracefully
  return c;
}
async function setStatus(r,s){
  var prev=r.status;r.status=s;renderTabs();render();
  try{
    var res=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'revstatus',secret:SECRET,id:r.id,status:s})});
    var d=await res.json();if(!d||!d.ok){r.status=prev;renderTabs();render();alert('Could not update status.');}
  }catch(e){r.status=prev;renderTabs();render();}
}
function openLb(url){var lb=$('#lb');$('#lb img').src=url;lb.classList.add('on');}
$('#lb').addEventListener('click',function(){$('#lb').classList.remove('on');$('#lb img').src='';});
$('#refresh').addEventListener('click',fetchRows);

/* gate */
function sha(s){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return x.toString(16).padStart(2,'0');}).join('');});}
function reveal(){var g=$('#gate');if(g)g.remove();$('#app').style.display='block';fetchRows();}
function tryUnlock(){var v=($('#pw').value||'').trim().toUpperCase();sha(v).then(function(h){if(h===OK){try{sessionStorage.setItem('rev_ok','1');}catch(e){}reveal();}else{$('#gerr').textContent='Incorrect code.';$('#pw').select();}});}
$('#unlock').addEventListener('click',tryUnlock);
$('#pw').addEventListener('keydown',function(e){if(e.key==='Enter')tryUnlock();});
try{if(sessionStorage.getItem('rev_ok')==='1')reveal();else $('#pw').focus();}catch(e){$('#pw').focus();}
</script>
</body>
</html>
