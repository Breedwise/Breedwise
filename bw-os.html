<style>

    --ink:#f5f2ea;--mid:#b9b3a7;--muted:#8a8578;--faint:#5f5b52;
    --gold:#cdae72;--gold2:#dcc185;--gold-soft:rgba(205,174,114,.12);--gold-line:rgba(205,174,114,.3);
    --green:#6dbf90;--amber:#e0b15e;--red:#e07a6d;--blue:#6fa8d6;
    --green-s:rgba(109,191,144,.14);--amber-s:rgba(224,177,94,.14);--red-s:rgba(224,122,109,.14);
    --display:'Anton',Impact,sans-serif;--body:'Poppins',-apple-system,BlinkMacSystemFont,sans-serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:300;font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
  h1,h2,h3,h4{margin:0;font-family:var(--display);font-weight:400;letter-spacing:.01em;text-transform:uppercase}
  a{color:inherit}
  /* gate */
  #gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:120}
  #gate .box{width:min(92vw,400px);text-align:center}
  #gate .mk{width:56px;height:56px;border-radius:14px;background:linear-gradient(150deg,var(--gold),#9c7d3f);display:inline-flex;align-items:center;justify-content:center;font-family:var(--display);font-size:30px;color:#120d04;margin-bottom:20px}
  #gate h1{font-size:30px;letter-spacing:.04em}
  #gate .sub{color:var(--muted);font-size:12px;letter-spacing:.24em;text-transform:uppercase;margin:6px 0 22px}
  #gate input{width:100%;padding:14px 16px;background:var(--card);border:1px solid var(--line2);border-radius:10px;color:var(--ink);font-size:15px;text-align:center;letter-spacing:.05em;font-family:var(--body)}
  #gate button{width:100%;margin-top:11px;padding:14px;background:var(--gold);border:0;border-radius:10px;color:#120d04;font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;font-family:var(--body)}
  #gate .err{color:var(--red);font-size:12.5px;min-height:16px;margin-top:10px}
  #app{display:none}

  /* layout */
  .shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
  aside{background:var(--bg2);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;padding:22px 0}
  .brand{display:flex;align-items:center;gap:11px;padding:0 22px 20px;border-bottom:1px solid var(--line);margin-bottom:14px}
  .brand .mk{width:38px;height:38px;border-radius:10px;background:linear-gradient(150deg,var(--gold),#9c7d3f);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:21px;color:#120d04;flex:none}
  .brand .wm{font-family:var(--display);font-size:16px;line-height:1;letter-spacing:.02em}
  .brand .wm small{display:block;font-family:var(--body);font-size:8.5px;font-weight:600;letter-spacing:.26em;color:var(--gold);margin-top:5px}
  nav.side a{display:flex;align-items:center;gap:13px;padding:11px 22px;color:var(--mid);text-decoration:none;font-size:13.5px;font-weight:400;cursor:pointer;border-left:2px solid transparent}
  nav.side a .nn{font-family:var(--display);font-size:12px;color:var(--faint);width:20px;flex:none}
  nav.side a:hover{color:var(--ink);background:var(--card)}
  nav.side a.on{color:var(--gold2);border-left-color:var(--gold);background:var(--gold-soft)}
  nav.side a.on .nn{color:var(--gold)}
  .side-foot{padding:16px 22px;margin-top:10px;border-top:1px solid var(--line);font-size:11px;color:var(--faint);line-height:1.8}

  main{min-width:0}
  .topbar{position:sticky;top:0;z-index:40;background:rgba(10,10,10,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:14px 32px}
  .topbar .sct{font-family:var(--display);font-size:22px;letter-spacing:.02em}
  .topbar .q{font-size:11.5px;color:var(--muted);margin-left:4px}
  .topbar .sp{flex:1}
  .save{font-size:11.5px;color:var(--green);letter-spacing:.04em;display:flex;align-items:center;gap:7px}
  .save .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
  .save.saving{color:var(--amber)}.save.saving .dot{background:var(--amber)}
  .tbtn{background:var(--card);border:1px solid var(--line2);color:var(--mid);border-radius:8px;padding:8px 13px;font-size:12px;font-weight:500;cursor:pointer;font-family:var(--body)}
  .tbtn:hover{border-color:var(--gold);color:var(--ink)}
  .wrap{padding:30px 32px 80px;max-width:1240px}
  .panel{display:none}.panel.on{display:block}
  .intro{color:var(--mid);font-size:14px;max-width:760px;margin:0 0 26px;font-weight:300}
  .intro b{color:var(--ink);font-weight:600}

  /* blocks */
  .sec-h{display:flex;align-items:center;gap:14px;margin:34px 0 16px}
  .sec-h h3{font-size:18px;letter-spacing:.02em}
  .sec-h .ln{flex:1;height:1px;background:var(--line)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:16px}
  .grid{display:grid;gap:16px}
  .g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:1000px){.g3,.g4{grid-template-columns:1fr 1fr}}
  @media(max-width:720px){.shell{grid-template-columns:1fr}aside{position:static;height:auto}.g2,.g3,.g4{grid-template-columns:1fr}.wrap{padding:22px 18px 70px}.topbar{padding:12px 18px}}
  .lbl{font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  .khead{font-family:var(--display);font-size:13px;letter-spacing:.06em;color:var(--gold);margin-bottom:12px;text-transform:uppercase}

  /* editable fields */
  .f{width:100%;background:transparent;border:0;border-bottom:1px dashed transparent;color:var(--ink);font-family:var(--body);font-size:13.5px;font-weight:300;padding:4px 2px;transition:border-color .2s;resize:none;line-height:1.5}
  .f:hover{border-bottom-color:var(--line2)}
  .f:focus{outline:none;border-bottom-color:var(--gold);background:var(--gold-soft)}
  textarea.f{min-height:26px;overflow:hidden}
  .big{font-family:var(--display);font-size:30px;color:var(--gold2);letter-spacing:.01em}
  .big.f{border:0}
  select.f{cursor:pointer}
  select.f option{background:var(--card2);color:var(--ink)}

  /* tiles */
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  @media(max-width:1000px){.tiles{grid-template-columns:1fr 1fr}}
  .tile{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:14px;padding:18px 18px}
  .tile .t{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .tile .v{font-family:var(--display);font-size:30px;color:var(--ink);margin-top:6px;letter-spacing:.01em}
  .tile .v.gold{color:var(--gold2)}.tile .v.green{color:var(--green)}
  .tile .s{font-size:11.5px;color:var(--muted);margin-top:3px}

  /* list editor (bullets) */
  .lst{list-style:none;padding:0;margin:0}

  .lst li .x{color:var(--faint);cursor:pointer;font-size:16px;line-height:1;margin-top:2px;flex:none}

  tr:last-child td{border-bottom:0}

  td .x{color:var(--faint);cursor:pointer;font-size:16px}td .x:hover{color:var(--red)}

  .rcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0;overflow:hidden;margin-bottom:16px}
  .rcard .rh{display:flex;align-items:center;gap:14px;padding:16px 20px;background:linear-gradient(120deg,var(--card2),var(--card));border-bottom:1px solid var(--line)}
  .rcard .rh .av{width:40px;height:40px;border-radius:50%;background:var(--gold-soft);border:1px solid var(--gold-line);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:17px;color:var(--gold2);flex:none;text-transform:uppercase}
  .rcard .rh .ti{flex:1;min-width:0}
  .rcard .rh .ti input{font-family:var(--display);font-size:18px}
  .rcard .rb{padding:18px 20px;display:grid;grid-template-columns:1fr 1fr;gap:16px 26px}
  @media(max-width:720px){.rcard .rb{grid-template-columns:1fr}}
  .rcard .fld.full{grid-column:1/-1}
  .delrole{color:var(--faint);cursor:pointer;font-size:12px;border:1px solid var(--line);border-radius:7px;padding:5px 10px}
  .delrole:hover{color:var(--red);border-color:var(--red)}

  .sopfolder{margin-bottom:14px}
  .sopfolder .fh{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:14px;color:var(--gold2);letter-spacing:.04em;padding:10px 0}
  .muted{color:var(--muted)}
  .note{background:var(--gold-soft);border:1px solid var(--gold-line);border-left:3px solid var(--gold);border-radius:10px;padding:13px 16px;font-size:13px;color:var(--mid);margin:14px 0}
  .note b{color:var(--gold2)}
  .flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0}
  .flow .st{background:var(--card2);border:1px solid var(--line2);border-radius:8px;padding:8px 14px;font-size:12px;font-weight:500}
  .flow .ar{color:var(--faint)}
  .hidden{display:none!important}

/* ---------- editable helpers ---------- */
function autoGrow(t){t.style.height='auto';t.style.height=(t.scrollHeight)+'px';}
/* bound textarea */
function ta(obj,key,ph){var t=el('textarea','f');t.value=obj[key]||'';t.placeholder=ph||'';t.rows=1;
  setTimeout(function(){autoGrow(t);},0);
  t.addEventListener('input',function(){obj[key]=t.value;autoGrow(t);save();});
  return t;}
function inp(obj,key,ph){var i=el('input','f');i.value=obj[key]||'';i.placeholder=ph||'';
  i.addEventListener('input',function(){obj[key]=i.value;save();});return i;}
var STATES=['gray','green','yellow','red'],SLBL={gray:'Not set',green:'On track',yellow:'At risk',red:'Off track'};
function statusPill(obj,key,onchange){
  var b=el('button','pill '+(obj[key]||'gray'));
  function render(){b.className='pill '+(obj[key]||'gray');b.innerHTML='<span class="d"></span>'+SLBL[obj[key]||'gray'];}
  render();
  b.addEventListener('click',function(){var i=STATES.indexOf(obj[key]||'gray');obj[key]=STATES[(i+1)%STATES.length];render();save();if(onchange)onchange();});
  return b;}
function selField(obj,key,opts){var s=el('select','f');opts.forEach(function(o){var op=el('option');op.value=o;op.textContent=o;if((obj[key]||'')===o)op.selected=true;s.appendChild(op);});
  s.addEventListener('change',function(){obj[key]=s.value;save();});return s;}

/* ---------- generic table ---------- */
/* cols: [{k,label,w,type:'text'|'area'|'status'|'select',opts,ph}] */
function tableEditor(mount,arr,cols,blank,addLabel,afterChange){
  var tw=el('div','tw');var tbl=el('table');var thead=el('thead');var trh=el('tr');
  cols.forEach(function(c){var th=el('th');th.textContent=c.label;if(c.w)th.style.width=c.w;trh.appendChild(th);});
  trh.appendChild(el('th'));thead.appendChild(trh);tbl.appendChild(thead);
  var tb=el('tbody');tbl.appendChild(tb);
  function row(r){var tr=el('tr');
    cols.forEach(function(c){var td=el('td');
      if(c.type==='status')td.appendChild(statusPill(r,c.k,afterChange));
      else if(c.type==='area')td.appendChild(ta(r,c.k,c.ph));
      else if(c.type==='select')td.appendChild(selField(r,c.k,c.opts));
      else td.appendChild(inp(r,c.k,c.ph));
      tr.appendChild(td);
    });
    var dtd=el('td','del');var x=el('span','x','×');x.title='Remove';
    x.addEventListener('click',function(){var i=arr.indexOf(r);if(i>-1){arr.splice(i,1);tb.removeChild(tr);save();if(afterChange)afterChange();}});
    dtd.appendChild(x);tr.appendChild(dtd);tb.appendChild(tr);
  }
  arr.forEach(row);
  tw.appendChild(tbl);mount.appendChild(tw);
  var add=el('button','addbtn','+ '+(addLabel||'Add row'));
  add.addEventListener('click',function(){var r=JSON.parse(JSON.stringify(blank));arr.push(r);row(r);save();if(afterChange)afterChange();});
  mount.appendChild(add);
}

/* ---------- bullet list editor ---------- */
function listEditor(mount,arr,ph,addLabel){
  var ul=el('ul','lst');
  function row(i){var li=el('li');li.appendChild(el('span','bu','›'));
    var t=el('textarea','f');t.value=arr[i]||'';t.placeholder=ph||'';t.rows=1;setTimeout(function(){autoGrow(t);},0);
    t.addEventListener('input',function(){arr[i]=t.value;autoGrow(t);save();});
    t.style.flex='1';li.appendChild(t);
    var x=el('span','x','×');x.addEventListener('click',function(){arr.splice(i,1);rebuild();save();});
    li.appendChild(x);ul.appendChild(li);
  }
  function rebuild(){ul.innerHTML='';arr.forEach(function(_,i){row(i);});}
  rebuild();mount.appendChild(ul);
  var add=el('button','addbtn','+ '+(addLabel||'Add'));
  add.addEventListener('click',function(){arr.push('');rebuild();
    var tas=ul.querySelectorAll('textarea');if(tas.length)tas[tas.length-1].focus();save();});
  mount.appendChild(add);
}

/* ---- 10 People ---- */
function peopleCard(r){
  var c=el('div','rcard');
  var rh=el('div','rh');rh.appendChild(el('div','av',initials(r.name)));
  var ti=el('div','ti');ti.appendChild(inp(r,'name','Name'));var sub=inp(r,'role','Role');sub.style.cssText='color:var(--gold2);font-size:12.5px';ti.appendChild(sub);rh.appendChild(ti);
  rh.appendChild(statusPill(r,'s'));
  var del=el('span','delrole','Remove');del.style.marginLeft='10px';del.addEventListener('click',function(){var i=DB.people.indexOf(r);if(i>-1){DB.people.splice(i,1);renderPeople();save();}});
  rh.appendChild(del);c.appendChild(rh);
  var rb=el('div','rb');
  function fld(label,key,full){var d=el('div','fld'+(full?' full':''));d.appendChild(el('div','lbl',label));d.appendChild(ta(r,key));return d;}
  rb.appendChild(fld('Primary Outcomes','outcomes',true));
  rb.appendChild(fld('KPI Targets vs Actuals','kpis',true));
  rb.appendChild(fld('Deliverables Completed','deliver'));
  rb.appendChild(fld('Quality / Accuracy','quality'));
  rb.appendChild(fld('Reliability','reliability'));
  rb.appendChild(fld('Current Priorities','priorities'));
  rb.appendChild(fld('Blockers / Support Needed','blockers',true));
  rb.appendChild(fld('Coaching / Development','coaching',true));
  rb.appendChild(fld('Next Review Date','review'));
  c.appendChild(rb);return c;
}
function renderPeople(){var p=$('#p-people');p.innerHTML='';
  p.appendChild(el('p','intro','<b>How each person is performing</b> against their role, not just whether they are busy. Monthly review with a simple Green / Yellow / Red, backed by real data. Never hold someone responsible for a company result they do not control.'));
  DB.people.forEach(function(r){p.appendChild(peopleCard(r));});
  var add=el('button','addbtn','+ Add person');
  add.addEventListener('click',function(){DB.people.push({name:'New Person',role:'',outcomes:'',kpis:'',deliver:'',quality:'',reliability:'',priorities:'',blockers:'',coaching:'',review:'',s:'gray'});renderPeople();save();});
  p.appendChild(add);
}

/* ---------- export / import ---------- */
function expJSON(){var blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  var a=el('a');a.href=URL.createObjectURL(blob);a.download='breedwise-os-'+new Date().toISOString().slice(0,10)+'.json';a.click();}
function impJSON(file){var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);DB=Object.assign(seed(),d);save();build();alert('Imported successfully.');}catch(e){alert('Could not read that file.');}};r.readAsText(file);}

/* ---------- gate ---------- */
function sha(s){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return x.toString(16).padStart(2,'0');}).join('');});}
var OK='368f5e7178dc18a1928df554c7251674d47b8cce87724d7a502d4aba67c99875'; /* BWTEAM2026 */
function reveal(){var g=$('#gate');if(g)g.remove();$('#app').style.display='block';document.title='BreedWise OS';
  load();build();
  if(DB.updated){$('#savedAt').textContent='Saved '+new Date(DB.updated).toLocaleString();}
  $('#exp').addEventListener('click',expJSON);
  $('#imp').addEventListener('click',function(){$('#impf').click();});
  $('#impf').addEventListener('change',function(e){if(e.target.files[0])impJSON(e.target.files[0]);});
}
function tryUnlock(){var v=($('#pw').value||'').trim().toUpperCase();sha(v).then(function(h){if(h===OK){try{sessionStorage.setItem('bwos','1');}catch(e){}reveal();}else{$('#gerr').textContent='Incorrect code.';$('#pw').select();}});}
$('#unlock').addEventListener('click',tryUnlock);
$('#pw').addEventListener('keydown',function(e){if(e.key==='Enter')tryUnlock();});
try{if(sessionStorage.getItem('bwos')==='1')reveal();else $('#pw').focus();}catch(e){$('#pw').focus();}
})();
</script>
