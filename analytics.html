<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Private · BreedWise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@300;400;500;600;700&display=swap">
<style>
  :root{--bg:#0a0a0a;--panel:#141419;--panel2:#1a1a20;--line:rgba(245,242,234,.10);--ink:#f5f2ea;--mid:rgba(245,242,234,.72);--muted:rgba(245,242,234,.46);
    --gold:#cdae72;--gold2:#e2cb86;--gold-soft:rgba(205,174,114,.12);--gold-line:rgba(205,174,114,.30);--grad:linear-gradient(135deg,#e2cb86,#c3a35c);--green:#6dbf90;
    --disp:'Anton',Impact,sans-serif;--body:'Poppins',-apple-system,sans-serif;}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;background-image:radial-gradient(120% 50% at 50% -6%,rgba(205,174,114,.08),transparent 60%)}
  .wrap{max-width:920px;margin:0 auto;padding:0 18px}
  h1,h2,.disp{font-family:var(--disp);font-weight:400;text-transform:uppercase;letter-spacing:.01em;line-height:1.05}
  #gate{position:fixed;inset:0;z-index:99;background:#0a0a0a;display:flex;align-items:center;justify-content:center;padding:24px}
  .gate-card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:34px 30px;text-align:center}
  .gate-brand{font-family:var(--disp);font-size:24px;letter-spacing:2px}.gate-brand b{color:var(--gold)}
  .gate-title{font-family:var(--disp);font-size:20px;color:var(--gold2);margin-top:16px}
  #pw{width:100%;margin-top:20px;background:#0d0d0d;border:1px solid var(--line);border-radius:10px;color:var(--ink);font-size:16px;padding:13px;outline:none;text-align:center}
  #pw:focus{border-color:var(--gold)}
  #unlock{width:100%;margin-top:12px;background:var(--grad);color:#0a0a0a;font-weight:700;font-size:15px;text-transform:uppercase;border:0;border-radius:10px;padding:14px;cursor:pointer}
  #gate-err{color:#ff6a5d;font-size:13px;margin-top:12px;min-height:16px}
  #app{display:none}
  header{padding:34px 0 6px;text-align:center}
  .brand{font-family:var(--disp);font-size:20px;letter-spacing:2px}.brand b{color:var(--gold)}
  .eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-top:18px}
  header h1{font-size:clamp(26px,5vw,40px);margin-top:8px}
  .ctrls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:20px 0 6px}
  .ctrls select,.ctrls .seg button{font-family:var(--body);font-weight:600;font-size:13px;color:var(--mid);background:var(--panel);border:1px solid var(--line);border-radius:30px;padding:9px 15px;cursor:pointer;outline:none}
  .ctrls .seg{display:inline-flex;gap:4px}
  .ctrls .seg button.on{background:var(--grad);color:#1a1206;border-color:transparent}
  .gen{text-align:center;font-size:11.5px;color:var(--muted);margin-top:6px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0 0}
  @media(max-width:640px){.kpis{grid-template-columns:1fr 1fr}}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 16px;text-align:center}
  .kpi .v{font-family:var(--disp);color:var(--gold);font-size:30px;line-height:1}
  .kpi .l{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:7px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-top:16px}
  .card h2{font-size:16px;color:var(--ink);text-transform:none;font-family:var(--body);font-weight:700;margin-bottom:14px;display:flex;justify-content:space-between;align-items:baseline}
  .card h2 small{font-size:12px;color:var(--muted);font-weight:400}
  .bar{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin-bottom:10px}
  .bar .lab{font-size:13.5px;color:var(--mid)}
  .bar .track{grid-column:1/-1;height:8px;background:var(--panel2);border-radius:6px;overflow:hidden;margin-top:-4px}
  .bar .track i{display:block;height:100%;background:var(--grad);border-radius:6px}
  .bar .val{font-family:var(--disp);color:var(--gold);font-size:15px}
  .row{display:flex;justify-content:space-between;font-size:13.5px;color:var(--mid);padding:8px 0;border-top:1px solid var(--line)}
  .row:first-child{border-top:0}.row b{color:var(--ink)}
  .funnel{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .funnel .f{text-align:center;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px 8px}
  .funnel .f .p{font-family:var(--disp);color:var(--gold);font-size:22px}
  .funnel .f .l{font-size:11px;color:var(--muted);margin-top:4px}
  .empty{text-align:center;color:var(--muted);font-size:14px;padding:30px}
  footer{margin:44px 0 40px;text-align:center;color:var(--muted);font-size:11px;border-top:1px solid var(--line);padding-top:20px}
</style>
</head>
<body>
  <div id="gate"><div class="gate-card">
    <div class="gate-brand">BREED<b>WISE</b></div>
    <div class="gate-title">Site Engagement</div>
    <input id="pw" type="password" placeholder="Password" autocomplete="off">
    <button id="unlock" type="button">Unlock →</button>
    <div id="gate-err"></div>
  </div></div>

  <div id="app"><div class="wrap">
    <header>
      <div class="brand">BREED<b>WISE</b></div>
      <div class="eyebrow">First-Party Analytics</div>
      <h1>Site Engagement</h1>
      <div class="ctrls">
        <div class="seg" id="daysSeg"><button data-d="7">7d</button><button data-d="30" class="on">30d</button><button data-d="90">90d</button></div>
        <select id="pageSel"></select>
      </div>
      <div class="gen" id="gen"></div>
    </header>
    <div id="body"></div>
    <footer>Anonymous first-party analytics · no PII. Views = page loads · time = active (visible) seconds · dwell = seconds a section was ≥50% in view.</footer>
  </div></div>

<script>
  var SECRET="YrKJx6hWQ-buaiTVuN3VcqMS";
  var EP="https://xhjdowbnqcsvhtcccuqx.supabase.co/functions/v1/site-analytics";
  var DATA=null, DAYS=30, PAGE="__overall";
  function fmtTime(s){s=Math.round(s||0);if(s<60)return s+'s';var m=Math.floor(s/60);return m+'m '+(s%60)+'s';}
  function load(){
    document.getElementById('gen').textContent='Loading…';
    fetch(EP+'?secret='+encodeURIComponent(SECRET)+'&days='+DAYS).then(function(r){return r.json();}).then(function(d){
      DATA=d; if(!d.ok){document.getElementById('body').innerHTML='<div class="empty">'+(d.error||'No data')+'</div>';return;}
      var sel=document.getElementById('pageSel');var pages=Object.keys(d.pages||{});
      sel.innerHTML='<option value="__overall">All pages (overall)</option>'+pages.map(function(p){return '<option value="'+p+'">'+p+'</option>';}).join('');
      sel.value=PAGE;
      document.getElementById('gen').textContent='Updated '+new Date(d.generated).toLocaleString()+' · last '+d.days+' days';
      render();
    }).catch(function(){document.getElementById('body').innerHTML='<div class="empty">Could not load analytics.</div>';});
  }
  function render(){
    var d=DATA; if(!d)return;
    var s=(PAGE==='__overall')?d.overall:(d.pages[PAGE]||null);
    if(!s||!s.views){document.getElementById('body').innerHTML='<div class="empty">No views recorded yet for this selection. Data appears as real visitors browse the tracked pages.</div>';return;}
    var h='';
    h+='<div class="kpis">'
      +'<div class="kpi"><div class="v">'+s.views+'</div><div class="l">Views</div></div>'
      +'<div class="kpi"><div class="v">'+s.uniques+'</div><div class="l">Unique visits</div></div>'
      +'<div class="kpi"><div class="v">'+fmtTime(s.avgActiveSec)+'</div><div class="l">Avg time on page</div></div>'
      +'<div class="kpi"><div class="v">'+s.avgScrollPct+'%</div><div class="l">Avg scroll depth</div></div>'
      +'</div>';
    // scroll funnel
    var sc=s.scrollFunnel||{},ss=s.sessions||1;
    function pc(n){return Math.round((n||0)/ss*100);}
    h+='<div class="card"><h2>Scroll depth <small>of '+ss+' sessions</small></h2><div class="funnel">'
      +'<div class="f"><div class="p">'+pc(sc.d25)+'%</div><div class="l">reached 25%</div></div>'
      +'<div class="f"><div class="p">'+pc(sc.d50)+'%</div><div class="l">reached 50%</div></div>'
      +'<div class="f"><div class="p">'+pc(sc.d75)+'%</div><div class="l">reached 75%</div></div>'
      +'<div class="f"><div class="p">'+pc(sc.d100)+'%</div><div class="l">reached 100%</div></div>'
      +'</div></div>';
    // section dwell
    var secs=s.sections||[];var maxSec=secs.reduce(function(a,x){return Math.max(a,x.avgSec);},1);
    if(secs.length){h+='<div class="card"><h2>Time spent per section <small>avg seconds ≥50% in view</small></h2>';
      secs.forEach(function(x){h+='<div class="bar"><span class="lab">'+esc(x.label)+'</span><span class="val">'+fmtTime(x.avgSec)+'</span><span class="track"><i style="width:'+Math.round(x.avgSec/maxSec*100)+'%"></i></span></div>';});
      h+='</div>';}
    // form + sources
    h+='<div class="card"><h2>Form engagement</h2>'
      +'<div class="row"><span>Reached the application form</span><b>'+s.formReachedPct+'%</b></div>'
      +'<div class="row"><span>Started filling it in</span><b>'+s.formStartedPct+'%</b></div></div>';
    if((s.sources||[]).length){h+='<div class="card"><h2>Top sources</h2>';s.sources.forEach(function(x){h+='<div class="row"><span>'+esc(x.src)+'</span><b>'+x.n+'</b></div>';});h+='</div>';}
    document.getElementById('body').innerHTML=h;
  }
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
  document.getElementById('daysSeg').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;DAYS=+b.getAttribute('data-d');this.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b);});load();});
  document.getElementById('pageSel').addEventListener('change',function(){PAGE=this.value;render();});

  (function(){
    var HASH="9885ae29c35ad5f2ea7bfd249af85902cd22c7b426f60c795f6105d4ba5a1153"; // BreedWiseNumbers26
    function h(s){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return x.toString(16).padStart(2,'0');}).join('');});}
    function reveal(){var g=document.getElementById('gate');if(g)g.remove();document.getElementById('app').style.display='block';document.title='Engagement · BreedWise';load();}
    function tryU(){h(document.getElementById('pw').value||'').then(function(x){if(x===HASH){try{sessionStorage.setItem('an_ok','1');}catch(e){}reveal();}else{document.getElementById('gate-err').textContent='Incorrect password.';document.getElementById('pw').select();}});}
    document.getElementById('unlock').addEventListener('click',tryU);
    document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')tryU();});
    try{if(sessionStorage.getItem('an_ok')==='1'){reveal();}else{document.getElementById('pw').focus();}}catch(e){document.getElementById('pw').focus();}
  })();
</script>
</body>
</html>
