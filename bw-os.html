<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Private · BreedWise</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0a;--bg2:#060606;--card:#15151a;--card2:#1b1b21;--card3:#202027;
    --line:rgba(245,242,234,.10);--line2:rgba(245,242,234,.16);
    --ink:#f5f2ea;--mid:#b9b3a7;--muted:#8a8578;--faint:#5f5b52;
    --gold:#cdae72;--gold2:#dcc185;--gold-soft:rgba(205,174,114,.12);--gold-line:rgba(205,174,114,.3);
    --green:#6dbf90;--amber:#e0b15e;--red:#e07a6d;--blue:#6fa8d6;
    --green-s:rgba(109,191,144,.14);--amber-s:rgba(224,177,94,.14);--red-s:rgba(224,122,109,.14);
    --display:'Anton',Impact,sans-serif;--body:'Poppins',-apple-system,BlinkMacSystemFont,sans-serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:300;font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
  h1,h2,h3,h4{margin:0;font-family:var(--display);font-weight:400;letter-spacing:.01em;text-transform:uppercase}
  a{color:inherit}
  /* gate */
  #gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:120}
  #gate .box{width:min(92vw,400px);text-align:center}
  #gate .mk{width:56px;height:56px;border-radius:14px;background:linear-gradient(150deg,var(--gold),#9c7d3f);display:inline-flex;align-items:center;justify-content:center;font-family:var(--display);font-size:30px;color:#120d04;margin-bottom:20px}
  #gate h1{font-size:30px;letter-spacing:.04em}
  #gate .sub{color:var(--muted);font-size:12px;letter-spacing:.24em;text-transform:uppercase;margin:6px 0 22px}
  #gate input{width:100%;padding:14px 16px;background:var(--card);border:1px solid var(--line2);border-radius:10px;color:var(--ink);font-size:15px;text-align:center;letter-spacing:.05em;font-family:var(--body)}
  #gate button{width:100%;margin-top:11px;padding:14px;background:var(--gold);border:0;border-radius:10px;color:#120d04;font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;font-family:var(--body)}
  #gate .err{color:var(--red);font-size:12.5px;min-height:16px;margin-top:10px}
  #app{display:none}

  /* layout */
  .shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
  aside{background:var(--bg2);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;padding:22px 0}
  .brand{display:flex;align-items:center;gap:11px;padding:0 22px 20px;border-bottom:1px solid var(--line);margin-bottom:14px}
  .brand .mk{width:38px;height:38px;border-radius:10px;background:linear-gradient(150deg,var(--gold),#9c7d3f);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:21px;color:#120d04;flex:none}
  .brand .wm{font-family:var(--display);font-size:16px;line-height:1;letter-spacing:.02em}
  .brand .wm small{display:block;font-family:var(--body);font-size:8.5px;font-weight:600;letter-spacing:.26em;color:var(--gold);margin-top:5px}
  nav.side a{display:flex;align-items:center;gap:13px;padding:11px 22px;color:var(--mid);text-decoration:none;font-size:13.5px;font-weight:400;cursor:pointer;border-left:2px solid transparent}
  nav.side a .nn{font-family:var(--display);font-size:12px;color:var(--faint);width:20px;flex:none}
  nav.side a:hover{color:var(--ink);background:var(--card)}
  nav.side a.on{color:var(--gold2);border-left-color:var(--gold);background:var(--gold-soft)}
  nav.side a.on .nn{color:var(--gold)}
  .side-foot{padding:16px 22px;margin-top:10px;border-top:1px solid var(--line);font-size:11px;color:var(--faint);line-height:1.8}

  main{min-width:0}
  .topbar{position:sticky;top:0;z-index:40;background:rgba(10,10,10,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:14px 32px}
  .topbar .sct{font-family:var(--display);font-size:22px;letter-spacing:.02em}
  .topbar .q{font-size:11.5px;color:var(--muted);margin-left:4px}
  .topbar .sp{flex:1}
  .save{font-size:11.5px;color:var(--green);letter-spacing:.04em;display:flex;align-items:center;gap:7px}
  .save .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
  .save.saving{color:var(--amber)}.save.saving .dot{background:var(--amber)}
  .save.synced{color:var(--green)}.save.synced .dot{background:var(--green)}
  .save.local{color:var(--amber)}.save.local .dot{background:var(--amber)}
  .tbtn{background:var(--card);border:1px solid var(--line2);color:var(--mid);border-radius:8px;padding:8px 13px;font-size:12px;font-weight:500;cursor:pointer;font-family:var(--body)}
  .tbtn:hover{border-color:var(--gold);color:var(--ink)}
  .wrap{padding:30px 32px 80px;max-width:1240px}
  .panel{display:none}.panel.on{display:block}
  .intro{color:var(--mid);font-size:14px;max-width:760px;margin:0 0 26px;font-weight:300}
  .intro b{color:var(--ink);font-weight:600}

  /* blocks */
  .sec-h{display:flex;align-items:center;gap:14px;margin:34px 0 16px}
  .sec-h h3{font-size:18px;letter-spacing:.02em}
  .sec-h .ln{flex:1;height:1px;background:var(--line)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:16px}
  .grid{display:grid;gap:16px}
  .g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:1000px){.g3,.g4{grid-template-columns:1fr 1fr}}
  @media(max-width:720px){.shell{grid-template-columns:1fr}aside{position:static;height:auto}.g2,.g3,.g4{grid-template-columns:1fr}.wrap{padding:22px 18px 70px}.topbar{padding:12px 18px}}
  .lbl{font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  .khead{font-family:var(--display);font-size:13px;letter-spacing:.06em;color:var(--gold);margin-bottom:12px;text-transform:uppercase}

  /* editable fields */
  .f{width:100%;background:transparent;border:0;border-bottom:1px dashed transparent;color:var(--ink);font-family:var(--body);font-size:13.5px;font-weight:300;padding:4px 2px;transition:border-color .2s;resize:none;line-height:1.5}
  .f:hover{border-bottom-color:var(--line2)}
  .f:focus{outline:none;border-bottom-color:var(--gold);background:var(--gold-soft)}
  textarea.f{min-height:26px;overflow:hidden}
  .big{font-family:var(--display);font-size:30px;color:var(--gold2);letter-spacing:.01em}
  .big.f{border:0}
  select.f{cursor:pointer}
  select.f option{background:var(--card2);color:var(--ink)}

  /* tiles */
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  @media(max-width:1000px){.tiles{grid-template-columns:1fr 1fr}}
  .tile{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:14px;padding:18px 18px}
  .tile .t{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .tile .v{font-family:var(--display);font-size:30px;color:var(--ink);margin-top:6px;letter-spacing:.01em}
  .tile .v.gold{color:var(--gold2)}.tile .v.green{color:var(--green)}
  .tile .s{font-size:11.5px;color:var(--muted);margin-top:3px}

  /* five levers */
  .levers{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
  @media(max-width:1100px){.levers{grid-template-columns:1fr 1fr 1fr}}
  @media(max-width:720px){.levers{grid-template-columns:1fr}}
  .lever{position:relative;background:linear-gradient(165deg,var(--card),var(--card2));border:1px solid var(--line);border-top:2px solid var(--gold);border-radius:12px;padding:16px 15px 15px}
  .lever .lnum{font-family:var(--display);font-size:26px;color:var(--gold);line-height:1}
  .lever .lname{font-family:var(--display)!important;font-size:14.5px!important;letter-spacing:.03em;text-transform:uppercase;margin:9px 0 5px;color:var(--ink)}
  .lever .ldesc{font-size:12.5px;color:var(--mid)}
  .lever .x{position:absolute;top:9px;right:11px;color:var(--faint);cursor:pointer;font-size:15px;line-height:1}
  .lever .x:hover{color:var(--red)}

  /* list editor (bullets) */
  .lst{list-style:none;padding:0;margin:0}
  .lst li{display:flex;align-items:flex-start;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
  .lst li:last-child{border-bottom:0}
  .lst li .bu{color:var(--gold);font-weight:700;margin-top:4px;flex:none}
  .lst li .x{color:var(--faint);cursor:pointer;font-size:16px;line-height:1;margin-top:2px;flex:none}
  .lst li .x:hover{color:var(--red)}
  .addbtn{background:transparent;border:1px dashed var(--line2);color:var(--mid);border-radius:8px;padding:9px 14px;font-size:12px;font-weight:500;cursor:pointer;font-family:var(--body);margin-top:10px}
  .addbtn:hover{border-color:var(--gold);color:var(--gold2)}

  /* tables */
  .tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:12px 12px;border-bottom:1px solid var(--line2);white-space:nowrap;background:var(--bg2)}
  td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  tr:last-child td{border-bottom:0}
  td .f{font-size:13px}
  td.del{width:28px;text-align:center}
  td .x{color:var(--faint);cursor:pointer;font-size:16px}td .x:hover{color:var(--red)}

  /* status pill */
  .pill{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:30px;padding:5px 12px;font-size:11px;font-weight:600;letter-spacing:.04em;cursor:pointer;font-family:var(--body);white-space:nowrap}
  .pill .d{width:7px;height:7px;border-radius:50%}
  .pill.green{background:var(--green-s);color:var(--green)}.pill.green .d{background:var(--green)}
  .pill.yellow{background:var(--amber-s);color:var(--amber)}.pill.yellow .d{background:var(--amber)}
  .pill.red{background:var(--red-s);color:var(--red)}.pill.red .d{background:var(--red)}
  .pill.gray{background:var(--card3);color:var(--muted)}.pill.gray .d{background:var(--muted)}

  /* role / people cards */
  .rcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0;overflow:hidden;margin-bottom:16px}
  .rcard .rh{display:flex;align-items:center;gap:14px;padding:16px 20px;background:linear-gradient(120deg,var(--card2),var(--card));border-bottom:1px solid var(--line)}
  .rcard .rh .av{width:40px;height:40px;border-radius:50%;background:var(--gold-soft);border:1px solid var(--gold-line);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:17px;color:var(--gold2);flex:none;text-transform:uppercase}
  .rcard .rh .ti{flex:1;min-width:0}
  .rcard .rh .ti input{font-family:var(--display);font-size:18px}
  .rcard .rb{padding:18px 20px;display:grid;grid-template-columns:1fr 1fr;gap:16px 26px}
  @media(max-width:720px){.rcard .rb{grid-template-columns:1fr}}
  .rcard .fld.full{grid-column:1/-1}
  .delrole{color:var(--faint);cursor:pointer;font-size:12px;border:1px solid var(--line);border-radius:7px;padding:5px 10px}
  .delrole:hover{color:var(--red);border-color:var(--red)}

  .sopfolder{margin-bottom:14px}
  .sopfolder .fh{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:14px;color:var(--gold2);letter-spacing:.04em;padding:10px 0}
  .muted{color:var(--muted)}
  .note{background:var(--gold-soft);border:1px solid var(--gold-line);border-left:3px solid var(--gold);border-radius:10px;padding:13px 16px;font-size:13px;color:var(--mid);margin:14px 0}
  .note b{color:var(--gold2)}
  .flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0}
  .flow .st{background:var(--card2);border:1px solid var(--line2);border-radius:8px;padding:8px 14px;font-size:12px;font-weight:500}
  .flow .ar{color:var(--faint)}
  .hidden{display:none!important}

/* ── nav grouping ───────────────────────────────────────────── */
.navgrp{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);
  font-weight:700;padding:16px 14px 6px;margin-top:4px}
.navgrp:first-child{margin-top:0}

/* ── who am I ───────────────────────────────────────────────── */
.whobar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card2);
  border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:16px}
.whobar b{color:var(--ink)}
.whobar select{background:var(--card3);border:1px solid var(--line2);border-radius:8px;
  padding:8px 12px;color:var(--ink);font-family:inherit;font-size:14px}

/* ── record cards (clients / members) ───────────────────────── */
.recs{display:grid;gap:12px}
.rec{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.rec>summary{cursor:pointer;list-style:none;padding:14px 16px;display:flex;align-items:center;gap:12px}
.rec>summary::-webkit-details-marker{display:none}
.rec>summary::after{content:'▾';margin-left:auto;color:var(--muted);font-size:13px}
.rec[open]>summary::after{content:'▴'}
.rec .nm{font-weight:600;font-size:15.5px}
.rec .meta{font-size:12.5px;color:var(--muted)}
.rec .bd{padding:0 16px 16px;border-top:1px solid var(--line)}
.fieldgrid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:14px}
@media(min-width:720px){.fieldgrid.c2{grid-template-columns:1fr 1fr}.fieldgrid.c3{grid-template-columns:1fr 1fr 1fr}}
.fw label{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);font-weight:700;margin-bottom:5px}
.chk{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:14px;border-top:1px solid var(--line)}
.chk:first-of-type{border-top:0}
.chk input{width:17px;height:17px;accent-color:var(--gold);flex:0 0 auto}
.chk.done span{color:var(--muted);text-decoration:line-through}
.subh{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);
  font-weight:700;margin:18px 0 8px}
.warn{background:var(--amber-s);border:1px solid var(--amber);color:var(--ink);
  border-radius:10px;padding:10px 13px;font-size:13.5px;margin-top:10px}
.danger{background:var(--red-s);border-color:var(--red)}
.ok{background:var(--green-s);border-color:var(--green)}

/* ── who-am-I bar ───────────────────────────────────────────────── */
.whobar .lbl0{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);font-weight:700}
.whobar .muted{font-size:12px}

/* ── three across ──────────────────────────────────────────────── */
.tiles.c3{grid-template-columns:repeat(3,1fr)}
@media(max-width:1000px){.tiles.c3{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.tiles,.tiles.c3{grid-template-columns:1fr}}

/* ── record cards ──────────────────────────────────────────────── */
.rec .av{flex:0 0 auto;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  background:var(--gold-soft);border:1px solid var(--gold-line);color:var(--gold2);
  font-size:12px;font-weight:700;letter-spacing:.04em}
.rec .recid{min-width:0}
.rec .nm,.rec .meta{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recdel{margin-top:22px;background:transparent;border:1px solid var(--line2);color:var(--muted);
  border-radius:9px;padding:8px 14px;font-family:var(--body);font-size:12px;cursor:pointer}
.recdel:hover{border-color:var(--red);color:var(--red)}
.chkcnt{font-size:11.5px;margin-top:7px}

/* ── end-of-day entries ────────────────────────────────────────── */
.eodrow{border-top:1px solid var(--line);padding:13px 0;font-size:14px;font-weight:300;line-height:1.55}
.eodrow:first-of-type{border-top:0;padding-top:4px}
.eodwho{font-weight:600;font-size:13px;margin-bottom:4px}
.eodnum{display:inline-block;margin-left:8px;background:var(--gold-soft);border:1px solid var(--gold-line);
  color:var(--gold2);border-radius:20px;padding:2px 10px;font-size:11px;font-weight:600;letter-spacing:.03em}
.eodrow .warn{margin-top:7px}
</style>
</head>

var DB=seed();

var saveT;
function setSync(state){var s=$('#save'),t=$('#savetxt');if(!s)return;s.classList.remove('saving','local','synced');
  if(state==='saving'){s.classList.add('saving');t.textContent='Saving…';}
  else if(state==='synced'){s.classList.add('synced');t.textContent='Saved · team';}
  else if(state==='local'){s.classList.add('local');t.textContent='Saved locally (offline)';}
}
function save(){DB.updated=Date.now();lastEdit=Date.now();setSync('saving');
  clearTimeout(saveT);saveT=setTimeout(function(){try{localStorage.setItem(LS,JSON.stringify(DB));}catch(e){}},300);
  clearTimeout(srvT);srvT=setTimeout(serverSave,900);
}
/* ── three-way merge, by section ───────────────────────────────────
   The store used to accept any write and overwrite the whole document,
   so whoever saved last erased everyone else. It now refuses a stale
   write (409) and hands back the current version. BASE holds a copy of
   each section as it stood at our last successful sync, which is what
   makes a real merge possible: a section we have not touched takes the
   server's version, a section we have edited keeps ours. Two people in
   different sections never collide. Two people in the SAME section —
   ours wins and we say so out loud, rather than losing work silently.
   ────────────────────────────────────────────────────────────────── */
var BASE={};
function snapBase(){BASE={};for(var k in DB){try{BASE[k]=JSON.stringify(DB[k]);}catch(e){}}}
function mergeFrom(serverData){
  if(!serverData||typeof serverData!=='object')return [];
  var clashes=[],k;
  for(k in serverData){
    var theirs=JSON.stringify(serverData[k]);
    var base=BASE.hasOwnProperty(k)?BASE[k]:undefined;
    var ours;try{ours=JSON.stringify(DB[k]);}catch(e){ours=undefined;}
    if(theirs===ours)continue;                       /* already agree */
    if(ours===base){DB[k]=serverData[k];continue;}   /* we never touched it — take theirs */
    if(theirs===base)continue;                       /* they never touched it — keep ours */
    if(k!=='updated')clashes.push(k);                /* both changed it */
  }
  for(k in serverData)if(!DB.hasOwnProperty(k))DB[k]=serverData[k];
  return clashes;
}
function serverSave(){
  fetch(FN_OS,{method:'POST',headers:{'Content-Type':'application/json','apikey':AK},body:JSON.stringify({action:'set',secret:OS_SECRET,data:DB,rev:myRev})})
    .then(function(r){return r.json().then(function(d){return {status:r.status,d:d};},function(){return {status:r.status,d:null};});})
    .then(function(res){
      serverOnline=true;
      if(res.status===409&&res.d&&res.d.conflict){
        var clashes=mergeFrom(res.d.data);
        myRev=res.d.rev||myRev;
        try{localStorage.setItem(LS,JSON.stringify(DB));}catch(e){}
        var cur=currentSection();build(cur);
        toast(clashes.length
          ? 'Merged with the team — your edits kept in: '+clashes.map(sectionName).join(', ')
          : 'Merged with the team');
        clearTimeout(srvT);srvT=setTimeout(serverSave,600);   /* retry on the fresh rev */
        return;
      }
      if(res.status>=400||!res.d||!res.d.ok){
        setSync('local');$('#savedAt').textContent='Saved locally '+new Date().toLocaleString();
        return;
      }
      myRev=res.d.rev||myRev;snapBase();setSync('synced');
      $('#savedAt').textContent='Synced '+new Date(res.d.updated||Date.now()).toLocaleString();
    })
    .catch(function(){serverOnline=false;setSync('local');
      $('#savedAt').textContent='Saved locally '+new Date().toLocaleString();});
}
function sectionName(k){for(var i=0;i<SECTIONS.length;i++)if(SECTIONS[i].id===k)return SECTIONS[i].name;return k;}
function serverLoad(cb){
  fetch(FN_OS,{method:'POST',headers:{'Content-Type':'application/json','apikey':AK},body:JSON.stringify({action:'get',secret:OS_SECRET})})
    .then(function(r){return r.ok?r.json():Promise.reject(r);})
    .then(function(resp){serverOnline=true;
      if(resp&&resp.data){DB=Object.assign(seed(),resp.data);myRev=resp.rev||0;try{localStorage.setItem(LS,JSON.stringify(DB));}catch(e){}}
      snapBase();cb&&cb(true,!!(resp&&resp.data));})
    .catch(function(){serverOnline=false;cb&&cb(false,false);});
}

function startPoll(){clearInterval(pollT);pollT=setInterval(function(){
  if(!serverOnline)return;
  var editing=document.activeElement&&document.activeElement.classList&&document.activeElement.classList.contains('f');
  if(editing||Date.now()-lastEdit<9000)return;

    .then(function(r){return r.json();}).then(function(resp){
      if(resp&&resp.rev&&resp.rev>myRev&&resp.data){
        DB=Object.assign(seed(),resp.data);myRev=resp.rev;snapBase();try{localStorage.setItem(LS,JSON.stringify(DB));}catch(e){}
        var cur=currentSection();build(cur);toast('Updated from the team');

    }).catch(function(){});
},25000);}

/* ---------- editable helpers ---------- */
function autoGrow(t){t.style.height='auto';t.style.height=(t.scrollHeight)+'px';}
/* bound textarea */
function ta(obj,key,ph){var t=el('textarea','f');t.value=obj[key]||'';t.placeholder=ph||'';t.rows=1;
  setTimeout(function(){autoGrow(t);},0);
  t.addEventListener('input',function(){obj[key]=t.value;autoGrow(t);save();});
  return t;}
function inp(obj,key,ph){var i=el('input','f');i.value=obj[key]||'';i.placeholder=ph||'';
  i.addEventListener('input',function(){obj[key]=i.value;save();});return i;}
var STATES=['gray','green','yellow','red'],SLBL={gray:'Not set',green:'On track',yellow:'At risk',red:'Off track'};
function statusPill(obj,key,onchange){
  var b=el('button','pill '+(obj[key]||'gray'));
  function render(){b.className='pill '+(obj[key]||'gray');b.innerHTML='<span class="d"></span>'+SLBL[obj[key]||'gray'];}
  render();
  b.addEventListener('click',function(){var i=STATES.indexOf(obj[key]||'gray');obj[key]=STATES[(i+1)%STATES.length];render();save();if(onchange)onchange();});
  return b;}
function selField(obj,key,opts){var s=el('select','f');opts.forEach(function(o){var op=el('option');op.value=o;op.textContent=o;if((obj[key]||'')===o)op.selected=true;s.appendChild(op);});
  s.addEventListener('change',function(){obj[key]=s.value;save();});return s;}

/* ---------- generic table ---------- */
/* cols: [{k,label,w,type:'text'|'area'|'status'|'select',opts,ph}] */
function tableEditor(mount,arr,cols,blank,addLabel,afterChange){
  var tw=el('div','tw');var tbl=el('table');var thead=el('thead');var trh=el('tr');
  cols.forEach(function(c){var th=el('th');th.textContent=c.label;if(c.w)th.style.width=c.w;trh.appendChild(th);});
  trh.appendChild(el('th'));thead.appendChild(trh);tbl.appendChild(thead);
  var tb=el('tbody');tbl.appendChild(tb);
  function row(r){var tr=el('tr');
    cols.forEach(function(c){var td=el('td');
      if(c.type==='status')td.appendChild(statusPill(r,c.k,afterChange));
      else if(c.type==='area')td.appendChild(ta(r,c.k,c.ph));
      else if(c.type==='select')td.appendChild(selField(r,c.k,c.opts));
      else td.appendChild(inp(r,c.k,c.ph));
      tr.appendChild(td);
    });
    var dtd=el('td','del');var x=el('span','x','×');x.title='Remove';
    x.addEventListener('click',function(){var i=arr.indexOf(r);if(i>-1){arr.splice(i,1);tb.removeChild(tr);save();if(afterChange)afterChange();}});
    dtd.appendChild(x);tr.appendChild(dtd);tb.appendChild(tr);
  }
  arr.forEach(row);
  tw.appendChild(tbl);mount.appendChild(tw);
  var add=el('button','addbtn','+ '+(addLabel||'Add row'));
  add.addEventListener('click',function(){var r=JSON.parse(JSON.stringify(blank));arr.push(r);row(r);save();if(afterChange)afterChange();});
  mount.appendChild(add);
}

/* ---------- bullet list editor ---------- */
function listEditor(mount,arr,ph,addLabel){
  var ul=el('ul','lst');
  function row(i){var li=el('li');li.appendChild(el('span','bu','›'));
    var t=el('textarea','f');t.value=arr[i]||'';t.placeholder=ph||'';t.rows=1;setTimeout(function(){autoGrow(t);},0);
    t.addEventListener('input',function(){arr[i]=t.value;autoGrow(t);save();});
    t.style.flex='1';li.appendChild(t);
    var x=el('span','x','×');x.addEventListener('click',function(){arr.splice(i,1);rebuild();save();});
    li.appendChild(x);ul.appendChild(li);
  }
  function rebuild(){ul.innerHTML='';arr.forEach(function(_,i){row(i);});}
  rebuild();mount.appendChild(ul);
  var add=el('button','addbtn','+ '+(addLabel||'Add'));
  add.addEventListener('click',function(){arr.push('');rebuild();
    var tas=ul.querySelectorAll('textarea');if(tas.length)tas[tas.length-1].focus();save();});
  mount.appendChild(add);
}

/* ══════════════════════════════════════════════════════════════════
   WHO AM I
   The OS had one shared passcode and no notion of who was typing,
   which makes an EOD report worthless — a report with no author is
   just a note. Roster comes from People & Performance so there is
   only ever one list of the team. Choice is per device, not shared.
   ══════════════════════════════════════════════════════════════════ */
var WHO_KEY='bw-os-who';
function who(){try{return localStorage.getItem(WHO_KEY)||'';}catch(e){return '';}}
function setWho(v){try{localStorage.setItem(WHO_KEY,v);}catch(e){}}
function team(){return (DB.people||[]).map(function(p){return p&&p.name;}).filter(Boolean);}
function secH(t,extra){return el('div','sec-h','<h3>'+t+'</h3><span class="ln"></span>'+(extra||''));}
function tile(label,val,sub,cls){return '<div class="tile"><div class="t">'+esc(label)+
  '</div><div class="v'+(cls?' '+cls:'')+'">'+esc(val)+'</div><div class="s">'+esc(sub||'')+'</div></div>';}
function whoBar(mount,after){
  var b=el('div','whobar');
  b.appendChild(el('span','lbl0','You are'));
  var sel=el('select');
  sel.appendChild(el('option',null,'— choose —'));
  team().forEach(function(n){var o=el('option');o.value=n;o.textContent=n;if(n===who())o.selected=true;sel.appendChild(o);});
  sel.addEventListener('change',function(){setWho(sel.value);after&&after();});
  b.appendChild(sel);
  b.appendChild(el('span','muted','remembered on this device only · add people in People & Performance'));
  mount.appendChild(b);
}

/* ---------- multi-document calls against the shared store ---------- */
function osDoc(action,doc,extra,cb){
  var body={action:action,secret:OS_SECRET,doc:doc};
  for(var k in (extra||{}))body[k]=extra[k];
  fetch(FN_OS,{method:'POST',headers:{'Content-Type':'application/json','apikey':AK},body:JSON.stringify(body)})
    .then(function(r){return r.json().then(function(d){return d;},function(){return {error:'bad response'};});})
    .then(function(d){cb&&cb(null,d);})
    .catch(function(e){cb&&cb(e);});
}
function ymd(d){d=d||new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);}
function eodDoc(){return 'eod/'+ymd().slice(0,7);}

/* ══════════════════════════════════════════════════════════════════
   02 · END OF DAY
   Appended to a monthly list document, so two people filing at the
   same moment cannot overwrite each other.
   ══════════════════════════════════════════════════════════════════ */
var EOD=[],EOD_LOADED=false;
/* Rolls up the things that only show as a problem once it is too late:
   who is quiet, who is behind on money, who has not filed today. */
function renderPulse(){
  var m=$('#pulse');if(!m)return;
  var boss=DB.boss||[],acad=DB.academy||[];
  var bossA=boss.filter(function(c){return (c.status||'Active')==='Active';}).length;
  var atRisk=boss.concat(acad).filter(function(c){return c.risk==='At risk'||c.risk==='Watch';}).length;
  var money=boss.concat(acad).filter(function(c){return c.payments==='Failed payment'||c.payments==='Behind';}).length;
  var gtee=boss.concat(acad).filter(function(c){return c.guarantee==='Behind'||c.guarantee==='Claimed';}).length;
  var today=ymd(),filed={};EOD.forEach(function(x){if(x&&x.date===today)filed[x.who]=1;});
  var missing=team().filter(function(n){return !filed[n];}).length;
  m.innerHTML=
    tile('B.O.S.S. capacity',bossA+' / 10','active clients',bossA>10?'':'gold')+
    tile('Clients at risk',String(atRisk),'across B.O.S.S. and Academy',atRisk?'':'green')+
    tile('Payment problems',String(money),'failed or behind',money?'':'green')+
    tile('Guarantee exposure',String(gtee),'behind or claimed',gtee?'':'green')+
    tile('EOD not filed',EOD_LOADED?String(missing):'\u2014','today, out of '+team().length+' people',(EOD_LOADED&&!missing)?'green':'')+
    tile('Academy members',String(acad.filter(function(x){return (x.status||'Active')==='Active';}).length),'currently active')+
    tile('Upsell ready',String(acad.filter(function(x){return x.upsell==='Ready';}).length),'earned the B.O.S.S. conversation','gold')+
    tile('Open projects',String((DB.projects||[]).filter(function(x){return x.s!=='green';}).length),'not yet on track');
}

  p.appendChild(el('p','intro','<b>Four lines, every day.</b> Not paperwork — it is so tomorrow starts with yesterday’s blockers visible instead of forgotten, and so the weekly scorecard has something real behind it.'));
  whoBar(p,renderEod);

  var today=ymd();

  if(!team().length){
    p.appendChild(el('div','warn','Add your team in <b>People &amp; Performance</b> first — a report with no author is just a note.'));
    return;
  }
  /* Reading the team’s reports needs no identity. Only filing one does. */
  if(!who()){
    p.appendChild(el('div','warn','Choose who you are above to file your own report. You can read everyone else’s below either way.'));
    eodRollup(p,today);
    return;
  }

  var myId=today+'|'+who(),mine=null;
  for(var i=0;i<EOD.length;i++)if(EOD[i]&&EOD[i].id===myId)mine=EOD[i];

  p.appendChild(secH('Today · '+prettyDate(today)));
  var card=el('div','card');
  var draft={moved:(mine&&mine.moved)||'',number:(mine&&mine.number)||'',
             blocker:(mine&&mine.blocker)||'',tomorrow:(mine&&mine.tomorrow)||''};
  [['moved','What moved today?','The thing that actually progressed'],
   ['number','Your number','Calls, sets, closes, lessons shipped — whatever you own'],
   ['blocker','What is in the way?','Leave blank if nothing'],
   ['tomorrow','Tomorrow’s one thing','The single most important thing']
  ].forEach(function(f){
    var w=el('div','fw');w.appendChild(el('label',null,f[1]));
    var t=el('textarea','f');t.rows=1;t.placeholder=f[2];t.value=draft[f[0]];
    t.addEventListener('input',function(){draft[f[0]]=t.value;autoGrow(t);});
    setTimeout(function(){autoGrow(t);},0);
    w.appendChild(t);card.appendChild(w);
  });
  var btn=el('button','addbtn',mine?'Update my report':'File my report');
  btn.addEventListener('click',function(){
    if(!draft.moved.trim()){toast('Say what moved — even if it is "nothing, here is why"');return;}
    btn.disabled=true;btn.textContent='Filing…';
    osDoc('append',eodDoc(),{entry:{id:myId,who:who(),date:today,moved:draft.moved,
      number:draft.number,blocker:draft.blocker,tomorrow:draft.tomorrow}},function(err,d){
      btn.disabled=false;
      if(err||!d||!d.ok){
        btn.textContent=mine?'Update my report':'File my report';
        toast(d&&/unknown action/i.test(d.error||'')?'Backend needs the new bw-os deploy':((d&&d.error)||'Could not file — try again'));
        return;
      }
      toast('Filed. Thank you.');loadEod();
    });
  });
  card.appendChild(btn);
  p.appendChild(card);
  eodRollup(p,today);
}

/* The last seven days, grouped by day then by person — plus the one
   line that makes the whole thing work: who has not filed yet. */
function eodRollup(p,today){
  if(!EOD_LOADED){p.appendChild(el('p','muted','Loading this month’s reports…'));return;}

  /* who has not filed today */
  var filed={};EOD.forEach(function(x){if(x&&x.date===today)filed[x.who]=1;});
  var missing=team().filter(function(n){return !filed[n];});
  p.appendChild(el('div','warn'+(missing.length?'':' ok'),missing.length
    ? '<b>Not filed today:</b> '+missing.map(esc).join(', ')
    : '<b>Everyone has filed today.</b>'));

  /* last 7 days */
  var days={};EOD.forEach(function(x){if(x&&x.date)(days[x.date]=days[x.date]||[]).push(x);});
  var keys=Object.keys(days).sort().reverse().slice(0,7);
  if(!keys.length){p.appendChild(el('p','muted','No reports yet this month.'));return;}
  p.appendChild(secH('The last seven days'));
  keys.forEach(function(d){
    var c=el('div','card');
    c.appendChild(el('div','lbl',prettyDate(d)));
    days[d].sort(function(a,b){return String(a.who).localeCompare(String(b.who));}).forEach(function(r){
      var box=el('div','eodrow');
      box.appendChild(el('div','eodwho',esc(r.who)+(r.number?' <span class="eodnum">'+esc(r.number)+'</span>':'')));
      if(r.moved)   box.appendChild(el('div',null,esc(r.moved)));
      if(r.blocker) box.appendChild(el('div','warn danger','<b>Blocked:</b> '+esc(r.blocker)));
      if(r.tomorrow)box.appendChild(el('div','muted','Tomorrow: '+esc(r.tomorrow)));
      c.appendChild(box);
    });
    p.appendChild(c);
  });
}

function loadEod(){
  osDoc('get',eodDoc(),{},function(err,d){
    if(!err&&d&&d.ok&&Array.isArray(d.data))EOD=d.data;
    EOD_LOADED=true;renderEod();renderPulse();
  });
}

function recField(rec,f){
  var w=el('div','fw');w.appendChild(el('label',null,f.label));
  var e;
  if(f.type==='area')        e=ta(rec,f.k,f.ph);
  else if(f.type==='select') e=selField(rec,f.k,f.opts);
  else { e=inp(rec,f.k,f.ph); if(f.type==='date')e.type='date'; }
  w.appendChild(e);
  return w;
}
function fieldGrid(rec,fields,cls){
  var g=el('div','fieldgrid '+(cls||''));
  fields.forEach(function(f){g.appendChild(recField(rec,f));});
  return g;
}
function checklist(mount,rec,key,items,title){
  mount.appendChild(el('div','subh',title));
  rec[key]=rec[key]||{};
  var cnt=el('div','muted chkcnt');
  function count(){var n=0;items.forEach(function(i){if(rec[key][i])n++;});
    cnt.textContent=n+' of '+items.length+' complete';}
  items.forEach(function(it){
    var row=el('label','chk'+(rec[key][it]?' done':''));
    var cb=el('input');cb.type='checkbox';cb.checked=!!rec[key][it];
    cb.addEventListener('change',function(){rec[key][it]=cb.checked;
      row.className='chk'+(cb.checked?' done':'');count();save();});
    row.appendChild(cb);row.appendChild(el('span',null,esc(it)));mount.appendChild(row);
  });
  count();mount.appendChild(cnt);
}
function recordList(p,arr,cfg){
  var wrap=el('div','recs');
  function draw(){
    wrap.innerHTML='';
    if(!arr.length)wrap.appendChild(el('p','muted','Nobody here yet — add the first record below.'));
    arr.forEach(function(rec){
      var d=el('details','rec');
      var sm=el('summary');
      sm.appendChild(el('span','av',esc(initials(rec.name||'?'))));
      var box=el('div','recid');
      box.appendChild(el('div','nm',esc(rec.name||'Unnamed')));
      box.appendChild(el('div','meta',cfg.meta(rec)));
      sm.appendChild(box);
      d.appendChild(sm);
      var bd=el('div','bd');
      cfg.body(bd,rec);
      var del=el('button','recdel','Remove this record');
      del.addEventListener('click',function(){
        if(!confirm('Remove '+(rec.name||'this record')+'? This cannot be undone.'))return;
        var i=arr.indexOf(rec);if(i>-1)arr.splice(i,1);save();draw();cfg.after&&cfg.after();
      });
      bd.appendChild(del);
      d.appendChild(bd);wrap.appendChild(d);
    });
  }
  draw();
  p.appendChild(wrap);
  var add=el('button','addbtn','+ '+cfg.addLabel);
  add.addEventListener('click',function(){
    arr.push(cfg.blank());save();draw();cfg.after&&cfg.after();
    var last=wrap.querySelector('.rec:last-of-type');if(last){last.open=true;last.scrollIntoView({block:'center'});}
  });
  p.appendChild(add);
}

/* ---------- gate ---------- */
function sha(s){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return x.toString(16).padStart(2,'0');}).join('');});}
var OK='368f5e7178dc18a1928df554c7251674d47b8cce87724d7a502d4aba67c99875'; /* BWTEAM2026 */
function reveal(){var g=$('#gate');if(g)g.remove();$('#app').style.display='block';document.title='BreedWise OS';
  load();build();
  if(DB.updated){$('#savedAt').textContent='Saved '+new Date(DB.updated).toLocaleString();}
  setSync('saving');$('#savetxt').textContent='Connecting…';
  serverLoad(function(online,hadData){
    if(online){var cur=currentSection();build(cur);setSync('synced');
      $('#savedAt').textContent=DB.updated?('Synced '+new Date(DB.updated).toLocaleString()):'Synced';
      if(!hadData)serverSave(); /* seed the shared doc on first run */
      loadEod();startPoll();
    } else {setSync('local');}
  });
  $('#exp').addEventListener('click',expJSON);
  $('#imp').addEventListener('click',function(){$('#impf').click();});
  $('#impf').addEventListener('change',function(e){if(e.target.files[0])impJSON(e.target.files[0]);});
}
function tryUnlock(){var v=($('#pw').value||'').trim().toUpperCase();sha(v).then(function(h){if(h===OK){try{sessionStorage.setItem('bwos','1');}catch(e){}reveal();}else{$('#gerr').textContent='Incorrect code.';$('#pw').select();}});}
$('#unlock').addEventListener('click',tryUnlock);
$('#pw').addEventListener('keydown',function(e){if(e.key==='Enter')tryUnlock();});
try{if(sessionStorage.getItem('bwos')==='1')reveal();else $('#pw').focus();}catch(e){$('#pw').focus();}
})();
