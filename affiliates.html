<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Breedwise — Affiliate OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --surface:#111114; --bg:#1b1b20; --card:#26262c; --card-2:#212127;
    --border:#34343c; --border-2:#2b2b32; --gold:#d6ba76; --gold-deep:#b89c47;
    --gold-faint:rgba(214,186,118,.10); --gold-mid:rgba(214,186,118,.20);
    --gold-grad:linear-gradient(135deg,#e2cb86,#bfa050); --gold-soft:rgba(214,186,118,.30); --on-gold:#1a1509;
    --ink:#f4f1ea; --muted:#8f8d85; --mid:#c4c1b8;
    --green:#6dbf90; --green-bg:rgba(109,191,144,.14); --yellow:#d7a94e; --yellow-bg:rgba(215,169,78,.16);
    --red:#e0807e; --red-bg:rgba(224,128,126,.16);
    --heading:'Playfair Display',Georgia,serif; --body:'Inter',-apple-system,sans-serif;
    --radius:11px; --radius-lg:16px;
    --sh-sm:0 1px 3px rgba(0,0,0,.45); --sh-md:0 4px 12px rgba(0,0,0,.5),0 16px 40px rgba(0,0,0,.55); --sh-gold:0 6px 22px rgba(214,186,118,.28);
  }
  html{color-scheme:dark}
  body{background:var(--surface);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1000px;margin:0 auto;padding:0 20px}

  #login,#setpw{position:fixed;inset:0;background:var(--surface);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
  .login-card{width:100%;max-width:380px;padding:44px 38px;background:radial-gradient(130% 90% at 50% 0%,rgba(214,186,118,.10),var(--bg) 64%);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--sh-md);text-align:center}
  .brand{font-family:var(--heading);font-size:28px;font-weight:600;color:var(--gold)}
  .brand-sub{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);display:block;margin:4px 0 30px}
  .lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:block;text-align:left;margin-bottom:7px}
  .inp{width:100%;background:#141417;border:1px solid var(--border);color:var(--ink);font-family:var(--body);font-size:14px;padding:13px 15px;border-radius:var(--radius);outline:none;margin-bottom:14px}
  .inp:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
  .btn{width:100%;background:var(--gold-grad);color:var(--on-gold);border:none;font-family:var(--body);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:14px;border-radius:var(--radius);cursor:pointer;box-shadow:var(--sh-gold)}
  .btn:disabled{opacity:.5;cursor:default}
  .err{color:var(--red);font-size:13px;margin-top:10px;min-height:18px}
  .hint{font-size:11px;color:var(--muted);margin-top:18px}

  #app{display:none;min-height:100vh}
  nav{position:sticky;top:0;background:rgba(20,20,24,.85);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);box-shadow:var(--sh-sm);height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
  .nav-logo{font-family:var(--heading);font-size:19px;font-weight:600;color:var(--gold)}
  .nav-tag{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);border-left:1px solid var(--border);padding-left:11px;margin-left:11px}
  .nav-out{font-size:11px;font-weight:600;color:var(--mid);background:var(--card);border:1px solid var(--border);border-radius:6px;padding:8px 12px;cursor:pointer}
  .head{margin:34px 0 6px}
  .eyebrow{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
  .title{font-family:var(--heading);font-size:30px;font-weight:600;letter-spacing:-.01em}
  .sub{font-size:13px;color:var(--muted);margin-top:7px}

  .card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px 24px;box-shadow:var(--sh-sm);margin-top:20px}
  .card-h{font-family:var(--heading);font-size:16px;font-weight:600;margin-bottom:3px}
  .card-sub{font-size:12px;color:var(--muted);margin-bottom:14px}
  .reflink{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .reflink code{flex:1;min-width:220px;background:#141417;border:1px solid var(--gold-mid);border-radius:8px;padding:11px 13px;color:var(--gold);font-size:13px;font-family:ui-monospace,Menlo,monospace;overflow-x:auto;white-space:nowrap}
  .copy{background:var(--gold-grad);color:var(--on-gold);border:none;font-weight:700;font-size:12px;letter-spacing:.04em;padding:11px 16px;border-radius:8px;cursor:pointer;box-shadow:var(--sh-gold)}
  .terms{font-size:13px;color:var(--mid);margin-top:12px}.terms b{color:var(--gold)}

  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:20px}
  @media(max-width:760px){.kpis{grid-template-columns:1fr 1fr}}
  .kpi{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--sh-sm)}
  .kpi-n{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .kpi-v{font-family:var(--heading);font-size:29px;font-weight:600;margin-top:8px;line-height:1;letter-spacing:-.01em;font-feature-settings:"tnum" 1}
  .kpi-v.gold{color:var(--gold)}
  table{width:100%;border-collapse:collapse}
  thead th{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:12px;border-bottom:1px solid var(--gold-mid);background:var(--card-2);white-space:nowrap}
  tbody td{padding:12px;border-bottom:1px solid var(--border-2);font-size:12.5px;vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .m-name{font-weight:600}
  .tag{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;border-radius:5px;background:var(--gold-mid);color:var(--gold)}
  .st{font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:3px 8px;border-radius:5px}
  .st-new{background:var(--card);color:var(--mid)}.st-engaged{background:var(--gold-mid);color:var(--gold)}
  .st-scheduled{background:var(--yellow-bg);color:var(--yellow)}.st-closed_won{background:var(--green);color:#0e1c14}
  .st-no_show{background:var(--red-bg);color:var(--red)}.st-closed_lost{background:var(--red-bg);color:var(--red)}
  .aff-st{font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:3px 8px;border-radius:5px}
  .aff-active{background:var(--green);color:#0e1c14}.aff-onboarded{background:var(--green-bg);color:var(--green)}.aff-signed{background:var(--gold-mid);color:var(--gold)}.aff-prospect{background:var(--card);color:var(--mid)}.aff-inactive{background:var(--red-bg);color:var(--red)}
  .empty{text-align:center;color:var(--muted);padding:26px;font-size:13px}
  .foot{color:var(--muted);font-size:11px;text-align:center;padding:30px 0 50px}
  .badge{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--on-gold);background:var(--gold);padding:3px 9px;border-radius:20px;margin-left:8px;vertical-align:middle}
</style>
</head>
<body>

  <div id="login">
    <form class="login-card" id="loginForm" autocomplete="on">
      <div class="brand">Breedwise</div>
      <span class="brand-sub">Affiliate OS</span>
      <span class="lbl">Email</span>
      <input class="inp" id="email" type="email" autocomplete="username" placeholder="you@email.com" required>
      <span class="lbl">Password</span>
      <input class="inp" id="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
      <button class="btn" id="loginBtn" type="submit">Sign in</button>
      <div class="err" id="loginErr"></div>
      <div class="hint">Partners see their own referrals. Founders see everyone.</div>
    </form>
  </div>

  <div id="setpw" style="display:none">
    <form class="login-card" id="setpwForm" autocomplete="on">
      <div class="brand">Breedwise</div>
      <span class="brand-sub">Set your password</span>
      <span class="lbl">New password</span>
      <input class="inp" id="newpw" type="password" autocomplete="new-password" placeholder="••••••••" required>
      <span class="lbl">Confirm password</span>
      <input class="inp" id="newpw2" type="password" autocomplete="new-password" placeholder="••••••••" required>
      <button class="btn" id="setpwBtn" type="submit">Save &amp; continue</button>
      <div class="err" id="setpwErr"></div>
      <div class="hint">Choose a password to finish setting up your affiliate login.</div>
    </form>
  </div>

  <div id="app">
    <nav>
      <div style="display:flex;align-items:center"><span class="nav-logo">Breedwise</span><span class="nav-tag">Affiliate OS</span></div>
      <button class="nav-out" id="logoutBtn">Sign out</button>
    </nav>
    <div class="wrap" id="main"></div>
    <div class="foot">Breedwise Affiliate Program</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL='https://xhjdowbnqcsvhtcccuqx.supabase.co';
    const SUPABASE_KEY='sb_publishable_2QU-ROYUu4a7bmYGdcFP5Q_qR5cF8B2';
    const VSL_BASE='https://review.breedwise.io/vsl';                 // ?ref= referral link base (the opt-in funnel)
    const FOUNDER_EMAILS=['austin@breedwise.io','support@breedwise.io'];
    const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    const $=s=>document.querySelector(s);
    const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    const money=n=>'$'+Math.round(+n||0).toLocaleString();
    const link=code=>code?`${VSL_BASE}?ref=${encodeURIComponent(code)}`:'';

    function commissionOwed(a, closed, cash, contract){
      const v=+(a.commission_value||0);
      if((a.commission_type||'percent')==='flat') return v*(closed||0);
      return Math.round(v/100*((a.commission_basis==='contract')?(contract||0):(cash||0))*100)/100;
    }
    function termsText(a){
      if(!a) return '';
      if(a.commission_type==='flat') return `${money(a.commission_value)} per closed sale${a.recurring?' (recurring)':''}`;
      return `${+a.commission_value||0}% of ${a.commission_basis==='contract'?'contract value':'cash collected'}${a.recurring?', every rebill':''}`;
    }

    // ── Password recovery (arriving from the reset email) — show a set-password screen ──
    let recovering = /type=recovery/.test(location.hash);
    function showSetPw(){ $('#login').style.display='none'; $('#app').style.display='none'; $('#setpw').style.display='flex'; setTimeout(()=>$('#newpw').focus(),80); }
    sb.auth.onAuthStateChange((event)=>{ if(event==='PASSWORD_RECOVERY'){ recovering=true; showSetPw(); } });
    $('#setpwForm').addEventListener('submit', async e=>{
      e.preventDefault();
      const pw=$('#newpw').value, pw2=$('#newpw2').value, err=$('#setpwErr'); err.textContent='';
      if(pw.length<8){ err.textContent='Use at least 8 characters.'; return; }
      if(pw!==pw2){ err.textContent='Passwords don’t match.'; return; }
      const btn=$('#setpwBtn'); btn.disabled=true;
      const { error } = await sb.auth.updateUser({ password: pw });
      btn.disabled=false;
      if(error){ err.textContent=error.message; return; }
      recovering=false; history.replaceState(null,'',location.pathname);
      $('#setpw').style.display='none'; boot();
    });

    async function boot(){
      if(recovering){ showSetPw(); return; }
      const { data:{ session } } = await sb.auth.getSession();
      if(!session){ $('#login').style.display='flex'; $('#app').style.display='none'; return; }
      const email=(session.user?.email||'').toLowerCase();
      let founder=FOUNDER_EMAILS.includes(email);
      if(!founder){
        try{ const p=(await sb.from('profiles').select('role').eq('email',email).maybeSingle()).data; if(p&&['Founder','Director'].includes(p.role)) founder=true; }catch(_){}
      }
      $('#login').style.display='none'; $('#app').style.display='block';
      if(founder) await renderAdmin(email); else await renderAffiliate();
    }

    // ── Founder / admin: every partner + totals ──
    async function renderAdmin(email){
      const A=(await sb.from('affiliates').select('*').order('name')).data||[];
      const leads=(await sb.from('leads').select('lead_id,status,affiliate_id')).data||[];
      let cashMap={};
      try{ const rv=(await sb.from('affiliate_rollup').select('*')).data||[]; rv.forEach(r=>cashMap[r.affiliate_id]={cash:r.cash_collected,contract:r.contract_total}); }catch(_){}
      const rows=A.map(a=>{
        const mine=leads.filter(l=>l.affiliate_id&&String(l.affiliate_id)===String(a.id));
        const by=s=>mine.filter(l=>l.status===s).length;
        const referred=mine.length, booked=by('scheduled'), closed=by('closed_won');
        const c=cashMap[a.id]||{}; const owed=commissionOwed(a,closed,c.cash,c.contract);
        return {a,referred,booked,closed,cash:+(c.cash||0),owed};
      }).sort((x,y)=>y.referred-x.referred);
      const active=A.filter(a=>a.status==='active').length;
      const totRef=rows.reduce((s,x)=>s+x.referred,0), totOwed=rows.reduce((s,x)=>s+x.owed,0), totCash=rows.reduce((s,x)=>s+x.cash,0);
      $('#main').innerHTML=`
        <div class="head"><div class="eyebrow">Founder view</div>
          <div class="title">Affiliate OS <span class="badge">Admin</span></div>
          <div class="sub">Every partner, their referred pipeline, and what they're owed — live from the funnel.</div></div>
        <div class="kpis">
          <div class="kpi"><div class="kpi-n">Affiliates</div><div class="kpi-v">${A.length}</div></div>
          <div class="kpi"><div class="kpi-n">Active</div><div class="kpi-v">${active}</div></div>
          <div class="kpi"><div class="kpi-n">Referred leads</div><div class="kpi-v">${totRef}</div></div>
          <div class="kpi"><div class="kpi-n">Cash collected</div><div class="kpi-v">${money(totCash)}</div></div>
          <div class="kpi"><div class="kpi-n">Commission owed</div><div class="kpi-v gold">${money(totOwed)}</div></div>
        </div>
        <div class="card"><div style="overflow-x:auto"><table>
          <thead><tr><th>Affiliate</th><th>Code</th><th class="num">Referred</th><th class="num">Booked</th><th class="num">Closed</th><th class="num">Cash</th><th class="num">Owed</th><th>Terms</th><th>Status</th></tr></thead>
          <tbody>${rows.map(({a,referred,booked,closed,cash,owed})=>`<tr>
            <td class="m-name">${esc(a.name)}</td>
            <td>${a.ref_code?`<span class="tag">${esc(a.ref_code)}</span>`:'<span style="color:var(--muted)">—</span>'}</td>
            <td class="num">${referred}</td><td class="num">${booked}</td><td class="num">${closed}</td>
            <td class="num">${cash?money(cash):'<span style="color:var(--muted)">—</span>'}</td>
            <td class="num">${owed?`<b style="color:var(--gold)">${money(owed)}</b>`:'<span style="color:var(--muted)">—</span>'}</td>
            <td style="color:var(--mid);font-size:11.5px">${esc(termsText(a))||'—'}</td>
            <td><span class="aff-st aff-${a.status||'prospect'}">${a.status||'prospect'}</span></td>
          </tr>`).join('')||`<tr><td colspan="9" class="empty">No affiliates yet — add them in the main OS → Affiliates.</td></tr>`}</tbody>
        </table></div></div>
        <div class="card"><div class="card-h">Referral link format</div>
          <div class="card-sub">Each partner's link is the funnel with their code appended:</div>
          <div class="reflink"><code>${VSL_BASE}?ref=THEIR_CODE</code></div></div>`;
    }

    // ── Affiliate: only their own ──
    async function renderAffiliate(){
      const me=(await sb.rpc('affiliate_me')).data;
      const a=Array.isArray(me)?me[0]:me;
      if(!a){
        $('#main').innerHTML=`<div class="card" style="margin-top:40px;text-align:center"><div class="card-h">Not linked yet</div><div class="card-sub" style="margin:0">This login isn’t connected to an affiliate account. Contact Breedwise to get set up.</div></div>`;
        return;
      }
      const sum=(await sb.rpc('affiliate_my_summary')).data;
      const s=(Array.isArray(sum)?sum[0]:sum)||{};
      const leads=(await sb.rpc('affiliate_my_leads')).data||[];
      const ln=a.ref_code?link(a.ref_code):'';
      $('#main').innerHTML=`
        <div class="head"><div class="eyebrow">Your partnership</div>
          <div class="title">${esc(a.name||'Welcome')}</div>
          <div class="sub">${a.status?('Status: '+esc(a.status)):''}</div></div>
        <div class="card"><div class="card-h">Your referral link</div>
          <div class="card-sub">Send this everywhere — anyone who opts in through it is tied to you.</div>
          <div class="reflink"><code id="refc">${ln||'Your referral code is being set up.'}</code>${ln?'<button class="copy" id="copyBtn">Copy</button>':''}</div>
          <div class="terms">You earn <b>${esc(termsText(a))}</b>.</div></div>
        <div class="kpis">
          <div class="kpi"><div class="kpi-n">Referred</div><div class="kpi-v">${s.referred||0}</div></div>
          <div class="kpi"><div class="kpi-n">Booked</div><div class="kpi-v">${s.booked||0}</div></div>
          <div class="kpi"><div class="kpi-n">Closed</div><div class="kpi-v">${s.closed||0}</div></div>
          <div class="kpi"><div class="kpi-n">Cash collected</div><div class="kpi-v">${money(s.cash_collected)}</div></div>
          <div class="kpi"><div class="kpi-n">You’re owed</div><div class="kpi-v gold">${money(s.commission_owed)}</div></div>
        </div>
        <div class="card"><div class="card-h">Everyone you've referred</div>
          <div class="card-sub">${leads.length?`${leads.length} through your link`:''}</div>
          <div style="overflow-x:auto"><table>
            <thead><tr><th>Name</th><th>Status</th><th>Referred on</th><th>Region</th></tr></thead>
            <tbody>${leads.map(l=>`<tr><td class="m-name">${esc(l.name||'—')}</td><td><span class="st st-${l.status||'new'}">${esc(l.status||'new')}</span></td><td style="color:var(--muted)">${(l.referred_on||'').slice(0,10)||'—'}</td><td style="color:var(--muted)">${esc(l.region||'—')}</td></tr>`).join('')||`<tr><td colspan="4" class="empty">No referrals yet — share your link above.</td></tr>`}</tbody>
          </table></div></div>`;
      const cb=$('#copyBtn'); if(cb) cb.onclick=()=>{ navigator.clipboard.writeText(ln).then(()=>{ cb.textContent='Copied!'; setTimeout(()=>cb.textContent='Copy',1500); }); };
    }

    $('#loginForm').addEventListener('submit', async e=>{
      e.preventDefault();
      const btn=$('#loginBtn'); btn.disabled=true; $('#loginErr').textContent='';
      const { error } = await sb.auth.signInWithPassword({ email:$('#email').value.trim(), password:$('#password').value });
      btn.disabled=false;
      if(error){ $('#loginErr').textContent=error.message; return; }
      boot();
    });
    $('#logoutBtn').onclick=async()=>{ await sb.auth.signOut(); location.reload(); };

    boot();
  </script>
</body>
</html>
