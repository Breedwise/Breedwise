<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0e13;--panel:#12181f;--panel2:#0f151c;--line:#212b36;--line2:#2c3846;
    --ink:#f0f4f9;--mid:#c0cad6;--muted:#818d9b;
    --gold:#c9a862;--gold-soft:#e4cf9a;--green:#57b98a;--red:#ff8178;
    --disp:'Fraunces',Georgia,serif;--sans:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:radial-gradient(1000px 560px at 50% -10%,rgba(201,168,98,.08),transparent 60%),var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;line-height:1.55}
  .bar{border-bottom:1px solid var(--line);padding:13px 20px;text-align:center;position:sticky;top:0;background:rgba(11,14,19,.86);backdrop-filter:blur(8px);z-index:20}
  .brand{font-size:13px;letter-spacing:.22em;font-weight:700;color:var(--mid)}.brand b{color:var(--gold)}
  .brand .w{color:var(--muted);font-weight:400;letter-spacing:.03em;font-size:12px;display:block;margin-top:2px}
  .wrap{max-width:720px;margin:0 auto;padding:30px 20px 70px}
  .center{text-align:center}
  .eyebrow{display:inline-block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-soft);font-weight:700;background:rgba(201,168,98,.1);border:1px solid rgba(201,168,98,.28);border-radius:20px;padding:5px 13px}
  h1{font-family:var(--disp);font-size:36px;line-height:1.1;margin:16px 0 10px;font-weight:600;letter-spacing:-.5px}
  @media(max-width:600px){h1{font-size:28px}}
  h1 .u{color:var(--gold-soft)}
  .lead{color:var(--mid);font-size:16.5px;max-width:580px;margin:0 auto;font-weight:300}
  .cta{display:inline-block;width:100%;max-width:420px;margin:22px auto 0;padding:16px 28px;background:linear-gradient(135deg,var(--gold),#a9863f);border:0;border-radius:13px;color:#1a130a;font-weight:700;font-size:17px;cursor:pointer;font-family:var(--sans);box-shadow:0 6px 26px rgba(201,168,98,.22);text-align:center;text-decoration:none}
  .cta:disabled{opacity:.55}
  .cta.ghost{background:transparent;border:1px solid var(--line2);color:var(--mid);box-shadow:none;font-weight:600}
  .undercta{font-size:12.5px;color:var(--muted);margin-top:11px;max-width:460px;margin-left:auto;margin-right:auto}
  .section-title{font-family:var(--disp);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-soft);font-weight:700;margin:34px 0 6px}
  .card{background:linear-gradient(162deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:18px;padding:22px}
  .how{display:grid;gap:12px;margin-top:16px;text-align:left}
  .how .row{display:flex;gap:13px;align-items:flex-start}
  .how .n{flex:none;width:28px;height:28px;border-radius:50%;background:rgba(201,168,98,.14);border:1px solid rgba(201,168,98,.35);color:var(--gold-soft);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
  .how .t{font-size:14.5px;color:var(--mid)}.how .t b{color:var(--ink);font-weight:600}
  .seclist{display:grid;gap:10px;margin-top:14px;text-align:left}
  .seclist .s{display:flex;gap:10px;font-size:13.5px;color:var(--mid)}
  .seclist .s b{color:var(--ink);font-weight:600}
  .seclist .k{flex:none;width:92px;color:var(--gold-soft);font-weight:700;font-size:12px}
  .credit{font-size:13.5px;color:var(--mid);text-align:left}
  .disc{font-size:11.5px;color:#6a7686;line-height:1.5;margin-top:14px}
  .trust{font-size:12px;color:var(--muted);margin-top:14px;text-align:center}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:460px){.row2{grid-template-columns:1fr}}
  .fld{margin-bottom:12px;text-align:left}
  label{font-size:11.5px;color:var(--muted);display:block;margin-bottom:5px}
  input,textarea{width:100%;padding:13px 14px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;color:var(--ink);font-size:15px;font-family:var(--sans)}
  textarea{min-height:92px;resize:vertical}
  input:focus,textarea:focus{outline:none;border-color:var(--gold)}
  .hp{position:absolute;left:-9999px}
  .msg{font-size:12.5px;margin-top:10px;min-height:16px;text-align:center;color:var(--muted)}
  .prog{position:sticky;top:51px;z-index:15;background:rgba(11,14,19,.86);backdrop-filter:blur(8px);padding:12px 20px 0}
  .prog .meta{max-width:720px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--muted);letter-spacing:.04em}
  .prog .stagename{color:var(--gold-soft);font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:11px}
  .track{max-width:720px;margin:8px auto 0;height:4px;border-radius:3px;background:var(--line);overflow:hidden}
  .track .fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-soft));width:0;transition:width .35s ease}
  .qnum{font-size:12px;color:var(--muted);letter-spacing:.06em;margin-bottom:6px}
  .qtext{font-family:var(--disp);font-size:25px;line-height:1.22;font-weight:600;margin:0 0 10px}
  @media(max-width:600px){.qtext{font-size:21px}}
  .qexplain{font-size:14px;color:var(--muted);margin:0 0 20px;padding-left:13px;border-left:2px solid var(--line2)}
  .opts{display:grid;gap:11px}
  .opt{width:100%;text-align:left;padding:16px 18px;background:var(--panel);border:1px solid var(--line);border-radius:13px;color:var(--ink);font-size:16px;font-weight:500;cursor:pointer;font-family:var(--sans);transition:border-color .15s,background .15s;display:flex;align-items:center;gap:13px}
  .opt:hover{border-color:var(--line2);background:#161d26}
  .opt.sel{border-color:var(--gold);background:rgba(201,168,98,.1)}
  .opt .dot{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--line2);display:inline-block}
  .opt.sel .dot{border-color:var(--gold);background:var(--gold);box-shadow:inset 0 0 0 3px var(--panel)}
  .opt.ns{color:var(--mid)}
  .navrow{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:12px}
  .back{background:none;border:0;color:var(--muted);font-size:14px;cursor:pointer;font-family:var(--sans);padding:8px 4px}
  .back:hover{color:var(--mid)}
  .optnote{font-size:12px;color:var(--muted);margin-top:14px}
  .scorewrap{text-align:center;margin-top:6px}
  .ring{position:relative;width:168px;height:168px;margin:6px auto 2px}
  .ring svg{transform:rotate(-90deg)}
  .ring .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .num{font-family:var(--disp);font-size:46px;font-weight:600;line-height:1}
  .ring .den{font-size:12px;color:var(--muted);margin-top:3px;letter-spacing:.08em}
  .band{font-family:var(--disp);font-size:24px;font-weight:600;margin:10px 0 4px}
  .bandmsg{color:var(--mid);font-size:15px;max-width:560px;margin:0 auto}
  .underscore{color:var(--muted);font-size:13.5px;max-width:560px;margin:14px auto 0}
  .startpoint .p{color:var(--ink);font-size:15.5px;margin:0 0 16px}
  .moves{display:grid;gap:12px}
  .move{display:flex;gap:13px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:15px 16px}
  .move .mi{flex:none;width:26px;height:26px;border-radius:50%;background:var(--gold);color:#15100a;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
  .move .mt b{color:var(--ink);font-size:15px;display:block;margin-bottom:3px}
  .move .mt span{color:var(--mid);font-size:13.5px}
  .bridgeline{color:var(--mid);font-size:14px;margin:16px 0 4px;text-align:center}
  .secgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
  .sc{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 6px;text-align:center}
  .sc .dots{display:flex;gap:4px;justify-content:center;margin-bottom:8px}
  .sc .d{width:9px;height:9px;border-radius:50%;background:var(--line2)}
  .sc .d.on{background:var(--gold)}
  .sc .nm{font-size:10.5px;color:var(--mid);line-height:1.25;min-height:26px}
  .sc .lb{font-size:10px;color:var(--muted);margin-top:5px;letter-spacing:.04em}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .chip{font-size:12.5px;color:#cfe9d9;background:rgba(87,185,138,.1);border:1px solid rgba(87,185,138,.3);border-radius:16px;padding:6px 12px}
  .subtle{color:var(--muted);font-size:13px;margin-top:6px}
  .stageblock{margin-top:22px}
  .stagehead{border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:14px}
  .stagehead .k{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .stagehead .nm{font-family:var(--disp);font-size:19px;font-weight:600;margin-top:3px}
  .stagehead .nm em{color:var(--gold-soft);font-style:normal}
  .stagehead .sm{font-size:13.5px;color:var(--mid);margin-top:5px}
  .gap{border:1px solid var(--line);border-radius:14px;padding:17px 18px;margin-bottom:12px;background:var(--panel)}
  .gap .gt{font-family:var(--disp);font-size:18px;font-weight:600;margin:0 0 10px;color:var(--ink)}
  .gap .ns{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;color:#f0c98a;background:rgba(201,168,98,.12);border:1px solid rgba(201,168,98,.3);border-radius:12px;padding:3px 9px;margin-bottom:9px}
  .gl{margin:0 0 9px}
  .gl .lab{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:2px}
  .gl .tx{font-size:13.8px;color:var(--mid)}
  .gl.win .tx{color:var(--ink)}
  .gl.win{background:rgba(201,168,98,.06);border-left:2px solid var(--gold);padding:8px 12px;border-radius:6px}
  .pcard{border-radius:16px;padding:20px;border:1px solid var(--gold);background:linear-gradient(162deg,rgba(201,168,98,.1),rgba(201,168,98,.03));margin-top:14px}
  .pcard .tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;color:var(--gold-soft)}
  .pcard h3{font-family:var(--disp);font-size:21px;font-weight:600;margin:0 0 8px}
  .pcard .desc{font-size:14px;color:var(--mid);margin:0 0 10px}
  .pcard .fit{font-size:13.5px;color:var(--ink);margin:0 0 14px;padding-left:12px;border-left:2px solid var(--gold)}
  .retake{margin-top:26px;text-align:center}
  footer{text-align:center;color:#59657380;font-size:11px;margin-top:34px;padding:0 20px}
  .fade{animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .hidden{display:none}
</style>

<body>
  <div class="bar"><span class="brand">BREED<b>WISE</b><span class="w">The Profitable Breeder · Program Scorecard</span></span></div>

  <div class="prog hidden" id="prog">
    <div class="meta"><span class="stagename" id="progStage">Demand &amp; Brand</span><span id="progCount">Question 1 of 19</span></div>
    <div class="track"><div class="fill" id="progFill"></div></div>
  </div>

  <div class="wrap" id="app"></div>
  <footer>BreedWise · The Profitable Breeder. An educational self-assessment of how your program runs — not financial, legal or veterinary advice.</footer>

<script>
/* ===================== CONFIG ===================== */
var FN='https://xhjdowbnqcsvhtcccuqx.supabase.co/functions/v1/pb-scorecard';
var TPB_URL='https://www.skool.com/theprofitablebreeder/about';

/* ===================== DATA ===================== */
var SECTIONS=['Demand & Brand','Sales & Buyer Experience','Pricing & Profit','Breeding Foundations','Systems & Data'];
function secName(n){return SECTIONS[n-1];}

/* 15 best-practice questions — pointed at the advanced habit most breeders skip.
   best:'yes'|'no' (flipped = best 'no'). */
var BP=[
 {id:1,sec:1,best:'yes',q:"From your last 10 placements, do you know which single channel brought the most buyers — by actual count, not a guess?",
  explain:"Most breeders have a feeling about where buyers come from. Few have the count.",
  strength:"Buyer sources tracked by count",
  gap:{title:"Count where your buyers actually come from",
   where:"Your buyer sources are a rough feeling, not a count.",
   why:"One or two channels usually drive most of your placements. Until you count, you cannot tell which to double down on and which is quietly wasting your time.",
   cost:"You spread effort evenly across everything, feeding channels that do not convert while the one that does goes under-fed.",
   change:"You put your time into the one or two sources that actually produce buyers.",
   win:"Write your last 10 buyers and the single way each first found you. The pattern is your map."}},
 {id:2,sec:1,best:'yes',q:"Does your website or marketing openly name the buyer you are NOT the right breeder for?",
  explain:"Repelling the wrong buyer is what makes the right buyer trust you.",
  strength:"Positioning that repels the wrong buyer",
  gap:{title:"Name who you're not for",
   where:"Your marketing tries to appeal to every possible buyer.",
   why:"A program that is “for everyone” reads as for no one in particular. Naming who you are not for — bargain hunters, first-time owners who want the cheapest pup — is what signals premium and earns the right buyer's trust.",
   cost:"Appealing to everyone attracts price shoppers and the wrong homes, and buries what makes you different.",
   change:"The right buyers self-select toward you and arrive already sold on why you cost more.",
   win:"Add one line to your site: “We're probably not the right fit if ___.” Watch who it filters out."}},
 {id:3,sec:1,best:'yes',q:"Before a litter is even confirmed, do you already have buyers who have paid a deposit to hold a spot?",
  explain:"A waitlist of names is interest. A waitlist of deposits is demand.",
  strength:"Deposit-backed waitlist before confirmation",
  gap:{title:"Collect deposits before the litter",
   where:"Buyers are found after the puppies arrive, and the waitlist, if any, is just names.",
   why:"Deposits before a confirmed litter prove real demand, fund the litter, and remove the pressure that leads to discounting and rushed placements.",
   cost:"Selling from zero every litter means deadline pressure, price cuts, and homes you would never choose with a line of paid buyers waiting.",
   change:"You breed into demand you have already collected, not a hope that buyers show up.",
   win:"Ask your three warmest prospects for a deposit to hold a spot on your next litter. Their answer is your real demand."}},
 {id:4,sec:2,best:'no',q:"When a good inquiry comes in, do you send your prices via text?",
  explain:"",
  strength:"Qualifies the buyer before quoting price",
  gap:{title:"Qualify before you quote",
   where:"Price goes out in the first reply, before the buyer is qualified or the value is built.",
   why:"Leading with price turns you into a number to compare. The stronger move is to qualify the buyer and establish what they are really buying, then price with context.",
   cost:"A price with no context gets shopped against every cheaper breeder, and your best buyers cannot tell you apart from the rest.",
   change:"Buyers understand what they are paying for before they see the number, so price becomes a decision, not a comparison.",
   win:"Write a two-question reply you send before any price: what they are looking for, and why now. Price comes after."}},
 {id:5,sec:2,best:'yes',q:"Do you know your inquiry-to-deposit rate as an actual percentage from your last litter?",
  explain:"Inquiries in, deposits out — the one number that tells you whether to fix traffic or fix closing.",
  strength:"Knows their conversion rate",
  gap:{title:"Measure inquiry to deposit",
   where:"You have a sense of how it went, but not the percentage.",
   why:"This single number tells you whether your bottleneck is demand (not enough inquiries) or closing (losing the ones you get). Without it you cannot tell which to fix.",
   cost:"You might buy more leads when the real leak is follow-up, or grind on sales when you simply need more demand.",
   change:"You work on the actual constraint instead of guessing.",
   win:"Count your last litter: inquiries received, deposits taken. That percentage is your baseline."}},
 {id:6,sec:2,best:'yes',q:"Do you have saved, written answers to your 10 most-asked buyer questions that you can send in under a minute?",
  explain:"",
  strength:"Prepared, consistent buyer answers",
  gap:{title:"Prepare your buyer answers",
   where:"The same questions get answered from scratch, in the moment, every litter.",
   why:"The same ten questions come up every time. Prepared, confident answers build trust and move buyers toward a deposit faster than whoever replies first.",
   cost:"Off-the-cuff replies are slow, inconsistent and easy to second-guess, and they quietly cost you deposits to faster breeders.",
   change:"You respond fast and consistently, and buyers feel they are dealing with a professional.",
   win:"Write saved answers to your ten most common questions this week and keep them one tap away."}},
 {id:7,sec:3,best:'yes',q:"Do you know your profit per puppy after counting your own hours as a real cost?",
  explain:"Most breeders count food and vet bills. Few count their own time.",
  strength:"Profit per puppy including owner labor",
  gap:{title:"Count your labor in the profit",
   where:"Profit is figured from hard costs only — your own hours are not in the math.",
   why:"Your time is the most expensive input in the litter. Until it is counted, “profit” is overstated and you cannot see which litters actually pay you for your work.",
   cost:"You can look profitable on paper while effectively working for a few dollars an hour, and never know it.",
   change:"You see the real return on a litter and can price and plan around it.",
   win:"Estimate the hours one litter takes, times a wage you would pay someone else, and subtract it from your profit. That is your real number."}},
 {id:8,sec:3,best:'no',q:"Is your puppy price within about $200 of what nearby breeders of your breed charge?",
  explain:"",
  strength:"Priced on value, not the local market",
  gap:{title:"Break away from the local price",
   where:"Your price sits right around what everyone nearby charges.",
   why:"Matching the local market caps you at the local market. Pricing on your health testing, support and outcomes — clearly above the pack — is how premium programs break away.",
   cost:"Clustering at the local price trains buyers to see your puppies as interchangeable, and leaves real money on the table every litter.",
   change:"Your price reflects your program, and the buyers who value it pay it without flinching.",
   win:"List everything you do that the average breeder near you does not. That list is the case for pricing above them."}},
 {id:9,sec:3,best:'yes',q:"When your waitlist fills before the puppies are born, do you raise your price on the next litter?",
  explain:"",
  strength:"Raises price on proven demand",
  gap:{title:"Let demand move your price",
   where:"Your price stays the same even when buyers are lined up before birth.",
   why:"A full waitlist before whelping is the clearest signal you are priced under the market's willingness to pay. Demand that strong is permission to raise.",
   cost:"Holding price while demand outstrips supply leaves money on the table and trains your best buyers to expect the old number.",
   change:"Your price tracks real demand, litter over litter, instead of staying frozen.",
   win:"If your next litter fills before it is born, raise the one after it and watch what happens to demand."}},
 {id:10,sec:4,best:'yes',q:"Do you know the exact progesterone value and units at which your vet's machine calls ovulation — not just that you “test progesterone”?",
  explain:"Different machines read the same blood differently; the number only means something next to the machine that produced it.",
  strength:"Knows the machine's ovulation value",
  gap:{title:"Know the number, not just the test",
   where:"You test progesterone, but the value and units that mark ovulation on your vet's machine are a black box.",
   why:"Reference labs and in-clinic analyzers read ovulation at different numbers. A value read against the wrong machine's range can put a breeding a day or two off — and up to 75% of conception failures trace to timing, not fertility.",
   cost:"“We test progesterone” with no grasp of the number means trusting a reading you cannot sanity-check, on the one day that decides the litter.",
   change:"You read every result the way your vet does and can follow the timing decision as it happens.",
   win:"At your next test, ask three things: which machine, what units, and the value where ovulation shows. Write them on her cycle sheet."}},
 {id:11,sec:4,best:'yes',q:"Do you weigh every puppy at birth and again at 24 hours, and flag any that have not gained?",
  explain:"",
  strength:"Birth and 24-hour weights on every pup",
  gap:{title:"Catch the fader in the first day",
   where:"Puppies are watched by eye in the first day, not weighed on a schedule.",
   why:"A puppy that fails to gain in the first 24 hours is the earliest warning you get. On a gram scale it shows a day before it is visible in the box.",
   cost:"The quiet, not-gaining puppy looks fine until it is clearly behind, by which point the easiest window to help has closed.",
   change:"You spot the slow starter on day one, not day five.",
   win:"Next litter, log a birth weight and a 24-hour weight on every pup, and circle any that did not gain."}},
 {id:12,sec:4,best:'yes',q:"Have you completed every health test your breed's parent club recommends — not just a basic DNA panel?",
  explain:"",
  strength:"Full parent-club health testing",
  gap:{title:"Finish the full testing panel",
   where:"Testing stops at a basic DNA panel, short of the full breed-specific recommendations.",
   why:"Most breeds have required screenings — hips, eyes, heart, breed-specific conditions — beyond a DNA kit. The full panel is the foundation of healthier litters and the clearest proof a premium buyer looks for.",
   cost:"A partial panel leaves known, testable risks unscreened, and the gap surfaces in a hard conversation or a sick puppy, against the reputation your whole program rests on.",
   change:"Every breeding decision starts from a complete, documented health picture.",
   win:"Pull your breed's parent-club testing list and mark which of your dogs are missing anything."}},
 {id:13,sec:5,best:'yes',q:"Could you hand your entire buyer-inquiry process to someone else today using only a written document?",
  explain:"If it only works when you do it, it isn't a system yet.",
  strength:"A documented, handoff-ready process",
  gap:{title:"Get it out of your head and onto paper",
   where:"Your process works because you run it from memory — there is nothing written to hand off.",
   why:"A documented process is what lets your program survive a busy week, scale past your own capacity, and eventually run without you doing every step.",
   cost:"A program that lives in your head caps at your hours, breaks when you are stretched, and cannot be delegated or sold.",
   change:"The work runs on a checklist anyone could follow, so nothing depends on you remembering it.",
   win:"Write your inquiry-to-deposit steps as a numbered checklist this week. If a stranger could follow it, it is a system."}},

function isBest(Q){return A.bp[Q.id]===Q.best;}
function isGap(Q){return A.bp[Q.id]!==Q.best;}
function secScore(s){var c=0;BP.forEach(function(Q){if(Q.sec===s&&isBest(Q))c++;});return c;}
function weakestSec(){var best=1,bs=99;for(var s=1;s<=5;s++){var v=secScore(s);if(v<bs){bs=v;best=s;}}return best;}
function overallRaw(){var c=0;BP.forEach(function(Q){if(isBest(Q))c++;});return c;}
function overallPct(){return Math.round(overallRaw()/15*100);}
function bandFor(p){for(var i=0;i<BANDS.length;i++){if(p>=BANDS[i].min)return BANDS[i];}return BANDS[2];}
function bandKey(p){return p>=70?'scale':(p>=40?'solid':'grow');}
function segment(){ if(A.q19===2)return 'hot'; if(A.q19===1||A.q16===2||A.q16===3)return 'warm'; return 'cold'; }

function orderedGaps(goalSec){
  var gaps=BP.filter(isGap);
  var g1=gaps.filter(function(Q){return Q.sec===goalSec;}).sort(function(a,b){return a.id-b.id;});
  var g2=gaps.filter(function(Q){return Q.sec!==goalSec;}).sort(function(a,b){return secScore(a.sec)-secScore(b.sec)||a.id-b.id;});
  return g1.concat(g2);
}
function gapCard(Q){
  var ns=(A.bp[Q.id]==='notsure');var where=ns?NOTSURE_WHERE:Q.gap.where;
  return '<div class="gap">'+(ns?'<span class="ns">You answered ‘Not sure’</span>':'')
    +'<div class="gt">'+Q.gap.title+'</div>'
    +gl('Where you are',where)+gl('Why it matters',Q.gap.why)+gl('The cost of leaving it',Q.gap.cost)
    +gl('What changes when you close it',Q.gap.change)
    +'<div class="gl win"><span class="lab">Quick win this week</span><span class="tx">'+Q.gap.win+'</span></div></div>';
}
function gl(lab,tx){return '<div class="gl"><span class="lab">'+lab+'</span><span class="tx">'+tx+'</span></div>';}
function ring(pct){
  var r=76,c=2*Math.PI*r,off=c*(1-pct/100);
  return '<div class="ring"><svg width="168" height="168" viewBox="0 0 168 168">'
    +'<circle cx="84" cy="84" r="'+r+'" fill="none" stroke="#212b36" stroke-width="11"/>'
    +'<circle cx="84" cy="84" r="'+r+'" fill="none" stroke="url(#g)" stroke-width="11" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'"/>'
    +'<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c9a862"/><stop offset="1" stop-color="#e4cf9a"/></linearGradient></defs>'
    +'</svg><div class="val"><div class="num">'+pct+'</div><div class="den">OUT OF 100</div></div></div>';
}
function lc(s){return s?s.charAt(0).toLowerCase()+s.slice(1):s;}
function esc(s){return (s||'').replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];});}

  if(completionSent)return;completionSent=true;
  var answers={};BP.forEach(function(Q){answers['q'+Q.id]=A.bp[Q.id]||null;});
  var payload={action:'pb-scorecard',first:A.first,last:A.last,email:A.email,phone:A.phone,company:A.company||'',
    scorePct:pct,scoreRaw:raw,band:bandKey(pct),
    secScores:{1:secScore(1),2:secScore(2),3:secScore(3),4:secScore(4),5:secScore(5)},
    gaps:gaps.map(function(Q){return Q.id;}),
    notsure:BP.filter(function(Q){return A.bp[Q.id]==='notsure';}).map(function(Q){return Q.id;}),
    priorities:moves.map(function(Q){return Q.gap.title;}),
    goalSec:goalSec,segment:seg,programShown:'tpb',
    answers:answers,qual:{q16:A.q16,q17:A.q17,q18:A.q18,q19:A.q19,q20:A.q20}};
  try{fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).catch(function(){});}catch(e){}
}

show();
</script>
