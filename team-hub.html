<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Private · BreedWise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0e13;--panel:#12181f;--panel2:#0f151c;--line:#212b36;--line2:#2c3846;
    --ink:#f0f4f9;--mid:#c0cad6;--muted:#818d9b;--faint:#5a6572;
    --gold:#c9a862;--gold-soft:#e4cf9a;--green:#57b98a;--blue:#5aa9e6;--purple:#a481d8;--amber:#e0a955;--teal:#54b8b0;
    --disp:'Fraunces',Georgia,serif;--sans:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 700px at 80% -12%,rgba(201,168,98,.06),transparent 60%),var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;line-height:1.5}

  #gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:80}
  #gate .box{width:min(92vw,380px);text-align:center}
  #gate input{width:100%;padding:13px 15px;background:var(--panel);border:1px solid var(--line);border-radius:11px;color:var(--ink);font-size:15px;text-align:center;letter-spacing:.05em;font-family:var(--sans)}
  #gate button{width:100%;margin-top:10px;padding:13px;background:var(--gold);border:0;border-radius:11px;color:#1a130a;font-weight:700;font-size:15px;cursor:pointer;font-family:var(--sans)}
  #gate .err{color:#e8695f;font-size:12.5px;min-height:16px;margin-top:10px}
  #gate .hint{color:var(--muted);font-size:12px;margin-top:14px}

  .logo{display:inline-flex;align-items:center;gap:11px}
  .logo .mk{width:34px;height:34px;border-radius:9px;background:linear-gradient(150deg,var(--gold),#a9863f);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 14px rgba(201,168,98,.28)}
  .logo .mk span{font-family:var(--disp);font-weight:700;color:#15100a;font-size:18px;line-height:1}
  .logo .wm{font-size:16px;letter-spacing:.2em;font-weight:700;color:var(--ink)}
  .logo .wm b{color:var(--gold)}

  #app{display:none}
  .wrap{max-width:1080px;margin:0 auto;padding:30px 22px 60px}
  header.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:8px}
  header .k{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700}
  header h1{font-family:var(--disp);font-size:34px;line-height:1.05;margin:8px 0 4px;font-weight:600;letter-spacing:-.4px}
  header p{color:var(--muted);font-size:14px;margin:0;max-width:560px;font-weight:300}
  .search{width:260px;max-width:48vw;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--ink);font-size:13px;font-family:var(--sans)}

  .grouphd{font-family:var(--disp);font-size:14px;letter-spacing:.02em;color:var(--muted);font-weight:600;margin:30px 0 12px;padding-bottom:7px;border-bottom:1px solid var(--line);text-transform:uppercase}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  @media(max-width:760px){.grid{grid-template-columns:1fr}}
  .pcard{background:linear-gradient(162deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:16px;padding:16px 18px}
  .pcard.wide{grid-column:1/-1}
  .person{display:flex;align-items:center;gap:11px;margin-bottom:12px}
  .ava{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:16px;color:#0c0f14;flex:none}
  .a-gold{background:linear-gradient(150deg,var(--gold),#a9863f)} .a-purple{background:linear-gradient(150deg,var(--purple),#7d5cb8)}
  .a-blue{background:linear-gradient(150deg,var(--blue),#3f7fb8)} .a-amber{background:linear-gradient(150deg,var(--amber),#b07f2e)}
  .a-green{background:linear-gradient(150deg,var(--green),#3d8a63)} .a-teal{background:linear-gradient(150deg,var(--teal),#357a74)}
  .pname{font-weight:700;font-size:15px}
  .prole{font-size:12px;color:var(--muted)}
  .doc{display:block;text-decoration:none;border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-top:9px;transition:border-color .15s,background .15s}
  .doc:hover{border-color:var(--gold);background:rgba(201,168,98,.05)}
  .doc .dt{font-size:13.5px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:7px}
  .doc .dt .arrow{color:var(--muted);font-size:12px;margin-left:auto}
  .doc:hover .dt .arrow{color:var(--gold)}
  .doc .dp{font-size:12px;color:var(--muted);font-weight:300;margin-top:3px}
  .doc .code{display:inline-block;margin-top:7px;font-size:10px;letter-spacing:.04em;font-weight:700;color:var(--gold-soft);background:rgba(201,168,98,.1);border:1px solid rgba(201,168,98,.22);border-radius:6px;padding:2px 7px}
  .doc .code.priv{color:#f2a59d;background:rgba(232,105,95,.1);border-color:rgba(232,105,95,.25)}
  .doc .code.login{color:#a9d6ff;background:rgba(90,169,230,.1);border-color:rgba(90,169,230,.25)}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:30px}
  footer.bf{text-align:center;color:#59657390;font-size:11px;margin-top:40px;letter-spacing:.04em}
  @media print{#gate{display:none!important}#app{display:block!important}body{background:#fff;color:#111}}
</style>
</head>
<body>
  <div id="gate"><div class="box">
    <div class="logo mark" style="margin-bottom:18px"><span class="mk"><span>B</span></span><span class="wm">BREED<b>WISE</b></span></div>
    <input id="pw" type="password" placeholder="Access code" autocomplete="off">
    <button id="unlock">Open the hub →</button>
    <div class="err" id="gate-err"></div>
    <div class="hint">BreedWise OS · team directory</div>
  </div></div>

  <div id="app">
    <div class="wrap">
      <header class="hero">
        <div>
          <div class="k">BreedWise OS</div>
          <h1>Team Hub</h1>
          <p id="subline">Every playbook, guide and SOP, organized by seat. You're seeing the documents your code unlocks.</p>
        </div>
        <input class="search" id="q" placeholder="Search documents…">
      </header>

      <div id="hub"></div>
      <div class="empty" id="noResults" style="display:none">No documents match that search.</div>

      <footer class="bf">BREEDWISE OS · Team Hub. Add new documents as we build them.</footer>
    </div>
  </div>

<script>
/* ---- the directory. Add a row here when a new doc ships. ---- */
var HUB=[
  { group:'Company', cards:[
    { name:'Company', role:'Shared · leadership', ava:'a-gold', initial:'B', docs:[
      { t:'📂 Page Directory', p:'Living index of every BreedWise page in one place — searchable, filtered by type (funnels, scorecards, tools, dashboards, SOPs, client sites), with access codes.', href:'directory.html', code:'BWTEAM2026' },
      { t:'Operating System Playbook', p:'Austin\'s day-to-day: rhythm, quarterly rocks, accountability, scorecards, the full OS.', href:'playbook.html', code:'BWTEAM2026' },
      { t:'BOSS™ Product Specification', p:'The full BOSS offer architecture: Phase 1 Implementation ($6K / 120 days) + Phase 2 Continuation ($297/mo), the certification pathway, customer journey and final offer stack.', href:'boss.html', code:'BWTEAM2026' },
      { t:'TPB 90-Day Curriculum System', p:'The Profitable Breeder teaching plan: weekly module template, the 12-week map tied to the Program Assessment areas, tool-coverage audit, and the ascension design (give wins, preserve the reason to go up).', href:'tpb-curriculum.html', code:'BWTEAM2026' },
      { t:'BOSS™ — Unveiling Module (deck)', p:'The evergreen "Welcome to BOSS" product unveiling, 22 slides in the black/gold Manrope + Cormorant system. Evolution, the BOSS Loop, two engines, built vs implemented, 120-to-build/12-to-prove, certification philosophy, and the Legacy-Access vs Implementation distinction. No pricing (stays usable long-term). Press N for the built-in teleprompter script. DRAFT: counsel to review legacy language before member announcement.', href:'boss-module.html', code:'BWTEAM2026' },
      { t:'BOSS™ — Academy → BOSS: Your Options (deck)', p:'The shorter, practical commercial follow-up, 13 slides. The three lanes (Academy + Legacy Access / Implementation Upgrade / Continuation), the full comparison table, Access vs Implementation, the upgrade stack + numbers ($6K new / +$3K upgrade), what happens if you upgrade or don\'t, term-end options, certification across all three groups, and "three choices, nothing auto-converts." Press N for the script. DRAFT: pricing/terms pending counsel review + fulfillment economics.', href:'boss-options-module.html', code:'BWTEAM2026' },
      { t:'BOSS™ — Closing Call Framework (sales)', p:'The consultative close for the BOSS Implementation build. 10-stage call flow (prep, frame, diagnose, priority, future pace, present, price, close, objections, lock next step) with live scripts, an objection-handling table, and a one-screen cheat sheet. Diagnose-don\'t-pressure, honor Academy, no guarantees. DRAFT: confirm pricing/agreement with counsel before quoting.', href:'boss-closing-call.html', code:'BWTEAM2026' },
      { t:'Accountability Chart', p:'Who owns what across the company.', href:'accountability-chart.html', code:'BWTEAM2026' },
      { t:'Command Center', p:'Real-time revenue wall: goal pace, funnel, pipeline, cash.', href:'command-center.html', code:'BreedWiseNumbers26' },
      { t:'Engagement Analytics', p:'First-party traffic and page-engagement dashboard.', href:'analytics.html', code:'BreedWiseNumbers26' },
      { t:'Metrics Dashboard', p:'Program metrics overview.', href:'dashboard.html', code:'BreedWiseNumbers26' }
    ]}
  ]},
  { group:'By seat', cards:[
    { name:'Austin', role:'CEO · Sales', ava:'a-gold', initial:'A', docs:[
      { t:'Operating System Playbook', p:'His run-the-company manual (same as Company).', href:'playbook.html', code:'BWTEAM2026' },
      { t:'Sales Seat Strategy', p:'Private: Regina seat comp design, legal, math, bottlenecks, day-30 evaluation.', href:'sales-buildout-internal.html', code:'BWTEAM2026', priv:true }
    ]},
    { name:'Jennifer', role:'Director of Member Success', ava:'a-purple', initial:'J', docs:[
      { t:'Member Success Operating Guide', p:'Her role, SOP index, dashboard spec, SLAs, escalation — what\'s live vs. pending.', href:'member-success-guide.html', code:'MEMBERSUCCESS2026' },
      { t:'Member Success SOP Library', p:'Her operating SOPs — Community Management, Inactive Member, and more as we build them.', href:'member-success-sops.html', code:'MEMBERSUCCESS2026' }
    ]},
    { name:'Regina', role:'Inbound Sales · Setter → Closer', ava:'a-blue', initial:'R', docs:[
      { t:'Sales Playbook', p:'Her role, pay, path, routing matrix, DM playbook, scoreboard, first 30 days.', href:'regina-sales-playbook.html', code:'REGINA2026' },
      { t:'7-Minute Setter Call Script', p:'Live call companion: pain → fit → urgency → route, with a tick-off qualification card.', href:'regina-call-script.html', code:'REGINA2026' }
    ]},
    { name:'Yasmin', role:'Social Media & Content', ava:'a-amber', initial:'Y', docs:[
      { t:'Content Ops Role Card', p:'Living dashboard: day/week plan, idea tracker, To-Film queue for Austin & Emmanuel, links, scorecard + the full content SOP.', href:'content-ops.html', code:'SOCIAL2026' },
      { t:'Content Engine', p:'The congruent-content playbook; Skool community as first destination.', href:'content-engine.html', code:'BreedWiseSetters26' },
      { t:'Social Media Plan', p:'Content manager role, cadence and strategy.', href:'social-media.html', code:'SOCIAL2026' }
    ]},
    { name:'Setters / Team', role:'Shared sales & delivery', ava:'a-green', initial:'S', docs:[
      { t:'New Member → Academy Ascension SOP', p:'The full cross-team ascension operating system (Jennifer → Regina → Austin): ownership, pipeline, qualification, briefs, follow-up, scoreboard.', href:'ascension-sop.html', code:'BreedWiseSetters26' },
      { t:'Setter Playbook', p:'Inbound setter operating guide.', href:'setter-playbook.html', code:'BreedWiseSetters26' },
      { t:'TPB → Academy Ascension SOP (legacy)', p:'Earlier ascension SOP — superseded by the full SOP above.', href:'tpb-ascension-sop.html', code:'BreedWiseSetters26' },
      { t:'Certification', p:'The certification standard and administration.', href:'certification.html', code:'BreedWiseSetters26' }
    ]}
  ]}
];

/* code hash → plaintext. Each person's code reveals only their docs; BWTEAM2026 sees all. */
var MASTER='BWTEAM2026';
var CODES={
  '368f5e7178dc18a1928df554c7251674d47b8cce87724d7a502d4aba67c99875':'BWTEAM2026',
  '6ffb0ebcb711bb7b807af8631cda2819f45fe628a2175bb5eea7bce3d6623db5':'REGINA2026',
  '559621627cc8f4f6b634325db97c94b584d5186ef210342720ad143db6e7bb44':'MEMBERSUCCESS2026',
  '9885ae29c35ad5f2ea7bfd249af85902cd22c7b426f60c795f6105d4ba5a1153':'BreedWiseNumbers26',
  '7c80836fc0ce4e3956aa136771a24b98d946bece11d70efef268e3612037234d':'BreedWiseSetters26',
  '440edf3cb587c1bf5da0521afae877f7aff7ddcfbf727bd43bdcb1a465b2c771':'SOCIAL2026'
};
var CURCODE='';
function canSee(d){ return CURCODE===MASTER || d.code===CURCODE; }
function render(filter){
  filter=(filter||'').toLowerCase().trim();
  var host=document.getElementById('hub'), html='', any=false;
  HUB.forEach(function(g){
    var cards='';
    g.cards.forEach(function(c){
      var docs=c.docs.filter(function(d){ return canSee(d) && (!filter || (d.t+' '+d.p+' '+c.name+' '+c.role).toLowerCase().indexOf(filter)>=0); });
      if(!docs.length) return;
      any=true;
      cards+='<div class="pcard'+(c.wide?' wide':'')+'">'+
        '<div class="person"><span class="ava '+c.ava+'">'+c.initial+'</span><div><div class="pname">'+c.name+'</div><div class="prole">'+c.role+'</div></div></div>'+
        docs.map(function(d){
          return '<a class="doc" href="'+d.href+'" target="_blank" rel="noopener"><div class="dt">'+d.t+'<span class="arrow">open ↗</span></div><div class="dp">'+d.p+'</div>'+(d.priv?'<span class="code priv">🔒 Private</span>':'')+'</a>';
        }).join('')+'</div>';
    });
    if(cards){ html+='<div class="grouphd">'+g.group+'</div><div class="grid">'+cards+'</div>'; }
  });
  host.innerHTML=html;
  document.getElementById('noResults').style.display=any?'none':'block';
}

/* ---- gate: resolve the entered code, reveal only what it unlocks ---- */
(function(){
  function h(s){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return x.toString(16).padStart(2,'0');}).join('');});}
  function el(id){return document.getElementById(id);}
  function resolve(v){ return Promise.all([h(v),h(v.toUpperCase())]).then(function(a){ return CODES[a[0]]||CODES[a[1]]||null; }); }
  function reveal(){
    var g=el('gate');if(g)g.remove();el('app').style.display='block';document.title='Team Hub · BreedWise OS';
    if(CURCODE!==MASTER) el('subline').textContent='Showing the documents for your access.';
    render('');el('q').addEventListener('input',function(e){render(e.target.value);});
  }
  function tryUnlock(){var v=(el('pw').value||'').trim();resolve(v).then(function(code){if(code){CURCODE=code;try{sessionStorage.setItem('hub_code',code);}catch(e){}reveal();}else{el('gate-err').textContent='Incorrect code.';el('pw').select();}});}
  el('unlock').addEventListener('click',tryUnlock);
  el('pw').addEventListener('keydown',function(e){if(e.key==='Enter')tryUnlock();});
  try{var saved=sessionStorage.getItem('hub_code');var valid=false;for(var k in CODES){if(CODES[k]===saved)valid=true;}if(valid){CURCODE=saved;reveal();}else{el('pw').focus();}}catch(e){el('pw').focus();}
})();
</script>
</body>
</html>
