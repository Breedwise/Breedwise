<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A free 4-minute Healthy Litter Scorecard from Dr. Emmanuel Fontaine. Find the science gaps in your breeding program across the five stages of a litter.">
<meta name="robots" content="noindex">
<title>Healthy Litter Scorecard · Dog Edition · with Dr. Emmanuel Fontaine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0e13;--panel:#12181f;--panel2:#0f151c;--line:#212b36;--line2:#2c3846;
    --ink:#f0f4f9;--mid:#c0cad6;--muted:#818d9b;
    --gold:#c9a862;--gold-soft:#e4cf9a;--green:#57b98a;--red:#ff8178;
    --disp:'Fraunces',Georgia,serif;--sans:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:radial-gradient(1000px 560px at 50% -10%,rgba(201,168,98,.08),transparent 60%),var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;line-height:1.55}
  .bar{border-bottom:1px solid var(--line);padding:13px 20px;text-align:center;position:sticky;top:0;background:rgba(11,14,19,.86);backdrop-filter:blur(8px);z-index:20}
  .brand{font-size:13px;letter-spacing:.22em;font-weight:700;color:var(--mid)}.brand b{color:var(--gold)}
  .brand .w{color:var(--muted);font-weight:400;letter-spacing:.03em;font-size:12px;display:block;margin-top:2px}
  .wrap{max-width:720px;margin:0 auto;padding:30px 20px 70px}
  .center{text-align:center}
  .eyebrow{display:inline-block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-soft);font-weight:700;background:rgba(201,168,98,.1);border:1px solid rgba(201,168,98,.28);border-radius:20px;padding:5px 13px}
  h1{font-family:var(--disp);font-size:36px;line-height:1.1;margin:16px 0 10px;font-weight:600;letter-spacing:-.5px}
  @media(max-width:600px){h1{font-size:28px}}
  h1 .u{color:var(--gold-soft)}
  .lead{color:var(--mid);font-size:16.5px;max-width:580px;margin:0 auto;font-weight:300}
  .cta{display:inline-block;width:100%;max-width:420px;margin:22px auto 0;padding:16px 28px;background:linear-gradient(135deg,var(--gold),#a9863f);border:0;border-radius:13px;color:#1a130a;font-weight:700;font-size:17px;cursor:pointer;font-family:var(--sans);box-shadow:0 6px 26px rgba(201,168,98,.22);text-align:center;text-decoration:none}
  .cta:disabled{opacity:.55}
  .cta.ghost{background:transparent;border:1px solid var(--line2);color:var(--mid);box-shadow:none;font-weight:600}
  .undercta{font-size:12.5px;color:var(--muted);margin-top:11px;max-width:460px;margin-left:auto;margin-right:auto}
  /* cards / panels */
  .card{background:linear-gradient(162deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:18px;padding:22px}
  .section-title{font-family:var(--disp);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-soft);font-weight:700;margin:34px 0 6px}
  .how{display:grid;gap:12px;margin-top:16px;text-align:left}
  .how .row{display:flex;gap:13px;align-items:flex-start}
  .how .n{flex:none;width:28px;height:28px;border-radius:50%;background:rgba(201,168,98,.14);border:1px solid rgba(201,168,98,.35);color:var(--gold-soft);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
  .how .n span{line-height:1}
  .how .t{font-size:14.5px;color:var(--mid)}.how .t b{color:var(--ink);font-weight:600}
  .stageslist{display:grid;gap:10px;margin-top:14px;text-align:left}
  .stageslist .s{display:flex;gap:10px;font-size:13.5px;color:var(--mid)}
  .stageslist .s b{color:var(--ink);font-weight:600}
  .stageslist .k{flex:none;width:58px;color:var(--gold-soft);font-weight:700;font-size:12px}
  .timeline{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
  .timeline .m{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:14px;padding:4px 11px}
  .credit{font-size:13.5px;color:var(--mid);text-align:left}
  .who{display:flex;align-items:center;gap:13px;margin:0 0 12px}
  .who .av{width:50px;height:50px;border-radius:50%;background:linear-gradient(150deg,var(--gold),#a9863f);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;color:#15100a;font-size:18px;flex:none}
  .who .t b{color:var(--ink)}.who .t{font-size:13px;color:var(--mid)}
  .disc{font-size:11.5px;color:#6a7686;line-height:1.5;margin-top:14px}
  .trust{font-size:12px;color:var(--muted);margin-top:14px;text-align:center}
  /* contact form */
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:460px){.row2{grid-template-columns:1fr}}
  .fld{margin-bottom:12px;text-align:left}
  label{font-size:11.5px;color:var(--muted);display:block;margin-bottom:5px}
  input,textarea{width:100%;padding:13px 14px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;color:var(--ink);font-size:15px;font-family:var(--sans)}
  textarea{min-height:92px;resize:vertical}
  input:focus,textarea:focus{outline:none;border-color:var(--gold)}
  .hp{position:absolute;left:-9999px}
  .msg{font-size:12.5px;margin-top:10px;min-height:16px;text-align:center;color:var(--muted)}
  /* progress */
  .prog{position:sticky;top:51px;z-index:15;background:rgba(11,14,19,.86);backdrop-filter:blur(8px);padding:12px 20px 0}
  .prog .meta{max-width:720px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--muted);letter-spacing:.04em}
  .prog .stagename{color:var(--gold-soft);font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:11px}
  .track{max-width:720px;margin:8px auto 0;height:4px;border-radius:3px;background:var(--line);overflow:hidden}
  .track .fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-soft));width:0;transition:width .35s ease}
  /* question */
  .qnum{font-size:12px;color:var(--muted);letter-spacing:.06em;margin-bottom:6px}
  .qtext{font-family:var(--disp);font-size:25px;line-height:1.22;font-weight:600;margin:0 0 10px}
  @media(max-width:600px){.qtext{font-size:21px}}
  .qexplain{font-size:14px;color:var(--muted);margin:0 0 20px;padding-left:13px;border-left:2px solid var(--line2)}
  .opts{display:grid;gap:11px}
  .opt{width:100%;text-align:left;padding:16px 18px;background:var(--panel);border:1px solid var(--line);border-radius:13px;color:var(--ink);font-size:16px;font-weight:500;cursor:pointer;font-family:var(--sans);transition:border-color .15s,background .15s,transform .05s;display:flex;align-items:center;gap:13px}
  .opt:hover{border-color:var(--line2);background:#161d26}
  .opt.sel{border-color:var(--gold);background:rgba(201,168,98,.1)}
  .opt .dot{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--line2);display:inline-block}
  .opt.sel .dot{border-color:var(--gold);background:var(--gold);box-shadow:inset 0 0 0 3px var(--panel)}
  .opt.ns{color:var(--mid)}
  .navrow{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:12px}
  .back{background:none;border:0;color:var(--muted);font-size:14px;cursor:pointer;font-family:var(--sans);padding:8px 4px}
  .back:hover{color:var(--mid)}
  .optnote{font-size:12px;color:var(--muted);margin-top:14px}
  /* results */
  .scorewrap{text-align:center;margin-top:6px}
  .ring{position:relative;width:168px;height:168px;margin:6px auto 2px}
  .ring svg{transform:rotate(-90deg)}
  .ring .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .num{font-family:var(--disp);font-size:46px;font-weight:600;line-height:1}
  .ring .den{font-size:12px;color:var(--muted);margin-top:3px;letter-spacing:.08em}
  .band{font-family:var(--disp);font-size:24px;font-weight:600;margin:10px 0 4px}
  .bandmsg{color:var(--mid);font-size:15px;max-width:560px;margin:0 auto}
  .underscore{color:var(--muted);font-size:13.5px;max-width:560px;margin:14px auto 0}
  .note{margin-top:20px;text-align:left}
  .note .nt{font-family:var(--disp);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-soft);font-weight:700;margin-bottom:8px}
  .note p{color:var(--mid);font-size:15px;margin:0 0 10px;font-style:italic}
  .note .sig{font-size:13px;color:var(--muted);font-style:normal}
  .startpoint{margin-top:16px;text-align:left}
  .startpoint .p{color:var(--ink);font-size:15.5px;margin:0 0 16px}
  .moves{display:grid;gap:12px}
  .move{display:flex;gap:13px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:15px 16px}
  .move .mi{flex:none;width:26px;height:26px;border-radius:50%;background:var(--gold);color:#15100a;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
  .move .mt b{color:var(--ink);font-size:15px;display:block;margin-bottom:3px}
  .move .mt span{color:var(--mid);font-size:13.5px}
  .bridgeline{color:var(--mid);font-size:14px;margin:16px 0 4px;text-align:center}
  /* stage dots */
  .stagegrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
  @media(max-width:560px){.stagegrid{grid-template-columns:repeat(5,1fr)}}
  .sc{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 6px;text-align:center}
  .sc .dots{display:flex;gap:4px;justify-content:center;margin-bottom:8px}
  .sc .d{width:9px;height:9px;border-radius:50%;background:var(--line2)}
  .sc .d.on{background:var(--gold)}
  .sc .nm{font-size:10.5px;color:var(--mid);line-height:1.25;min-height:26px}
  .sc .lb{font-size:10px;color:var(--muted);margin-top:5px;letter-spacing:.04em}
  /* chips */
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .chip{font-size:12.5px;color:#cfe9d9;background:rgba(87,185,138,.1);border:1px solid rgba(87,185,138,.3);border-radius:16px;padding:6px 12px}
  .subtle{color:var(--muted);font-size:13px;margin-top:6px}
  /* gap cards */
  .stageblock{margin-top:22px}
  .stagehead{border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:14px}
  .stagehead .k{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .stagehead .nm{font-family:var(--disp);font-size:19px;font-weight:600;margin-top:3px}
  .stagehead .nm em{color:var(--gold-soft);font-style:normal}
  .stagehead .sm{font-size:13.5px;color:var(--mid);margin-top:5px}
  .gap{border:1px solid var(--line);border-radius:14px;padding:17px 18px;margin-bottom:12px;background:var(--panel)}
  .gap .gt{font-family:var(--disp);font-size:18px;font-weight:600;margin:0 0 10px;color:var(--ink)}
  .gap .ns{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;color:#f0c98a;background:rgba(201,168,98,.12);border:1px solid rgba(201,168,98,.3);border-radius:12px;padding:3px 9px;margin-bottom:9px}
  .gl{margin:0 0 9px}
  .gl .lab{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:2px}
  .gl .tx{font-size:13.8px;color:var(--mid)}
  .gl.win .tx{color:var(--ink)}
  .gl.win{background:rgba(201,168,98,.06);border-left:2px solid var(--gold);padding:8px 12px;border-radius:6px}
  .gl.vet .tx{color:var(--mid)}
  /* programs */
  .prog-cards{display:grid;gap:14px;margin-top:14px}
  .pcard{border-radius:16px;padding:20px;border:1px solid var(--line2)}
  .pcard.rec{border-color:var(--gold);background:linear-gradient(162deg,rgba(201,168,98,.1),rgba(201,168,98,.03))}
  .pcard .tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
  .pcard.rec .tag{color:var(--gold-soft)}
  .pcard .tag.alt{color:var(--muted)}
  .pcard h3{font-family:var(--disp);font-size:21px;font-weight:600;margin:0 0 8px}
  .pcard .desc{font-size:14px;color:var(--mid);margin:0 0 10px}
  .pcard .fit{font-size:13.5px;color:var(--ink);margin:0 0 14px;padding-left:12px;border-left:2px solid var(--gold)}
  .obstacle{color:var(--ink);font-size:15px;margin:0 0 10px}
  .retake{margin-top:26px;text-align:center}
  footer{text-align:center;color:#59657380;font-size:11px;margin-top:34px;padding:0 20px}
  .hidden{display:none}
  .fade{animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
  <div class="bar"><span class="brand">BREED<b>WISE</b><span class="w">Healthy Litter Scorecard · Dog Edition · with Dr. Emmanuel Fontaine</span></span></div>

  <div class="prog hidden" id="prog">
    <div class="meta"><span class="stagename" id="progStage">The Breeding</span><span id="progCount">Question 1 of 20</span></div>
    <div class="track"><div class="fill" id="progFill"></div></div>
  </div>

  <div class="wrap" id="app"></div>

  <footer>BreedWise · The Profitable Breeder &amp; Breedwise Academy. Built with Dr. Emmanuel Fontaine, DVM, PhD, Dipl. ECAR.</footer>

<script>
/* ============================ CONFIG ============================ */
var FN='https://xhjdowbnqcsvhtcccuqx.supabase.co/functions/v1/vet-optin';
/* TEMP (VSL/application not live yet): Academy route points to the Skool community.
   Restore to 'academy-application.html' once the VSL application is up. */
var ACADEMY_URL='https://www.skool.com/theprofitablebreeder/about';
var TPB_URL='https://www.skool.com/theprofitablebreeder/about';
/* A/B test later — variant headline: "Is your program ready for its next litter?" */

/* ============================ DATA ============================ */
var STAGES=[
  {n:1,name:'The Breeding'},
  {n:2,name:'The Pregnancy'},
  {n:3,name:'Whelping Day'},
  {n:4,name:'The First 21 Days'},
  {n:5,name:'Weaning to Go-Home'}
];
function stageName(n){return STAGES[n-1].name;}
function stageNoThe(n){return stageName(n).replace(/^The\s+/,'');}

/* 15 best-practice questions. best:'yes'|'no' (flipped Qs best='no'). */
var BP=[
 {id:1,stage:1,best:'yes',
  q:"Before every breeding, do you score your female's body condition out of 9 with your hands, not just by eye?",
  explain:"Body condition score rates fat cover on a 1 to 9 scale by feeling the ribs, the waist and the belly.",
  strength:"Hands-on body condition score before breeding",
  gap:{title:"Breed her at 4 to 5 out of 9",
   where:"Her condition before breeding is judged by eye, not scored.",
   why:"The target for breeding is a body condition score of 4 to 5 out of 9. Extra fat settles in the uterine muscle and weakens contractions, and a coat can hide a full point either way, which is why the score is taken by hand.",
   cost:"A female one or two points over target carries a higher risk of a difficult birth, and tends to have smaller litters with lighter puppies.",
   change:"She starts the pregnancy in the condition that supports the easiest birth and the strongest litter.",
   win:"Score each of your females today: ribs easy to feel under light fat, a visible waist from above, a tucked belly from the side. Write the number down.",
   vet:"Ask your vet to score her with you once, so your hands learn the scale."}},
 {id:2,stage:1,best:'yes',
  q:"Do you know which machine your vet uses to measure progesterone, and the value at which ovulation shows on that machine?",
  explain:"Reference laboratories, in-clinic analyzers and quick point-of-care tests don't all read progesterone the same way.",
  strength:"You know your vet's progesterone machine and its ovulation range",
  gap:{title:"Know the machine behind the number",
   where:"Your vet's progesterone machine, and what its numbers mean, is a black box.",
   why:"Each method reads the same blood differently. Ovulation can read around 5 to 6 ng/mL (16 to 19 nmol/L) at a reference laboratory and 10 to 12 ng/mL (32 to 38 nmol/L) on some in-clinic analyzers. Some quick point-of-care tests only estimate a range, which can lack the precision a breeding decision needs. A progesterone value only means something next to the machine that produced it.",
   cost:"A number read against the wrong machine's ranges, from a forum, another breeder or a different clinic, can put a breeding a day or two off. Up to 75% of conception failures trace back to timing, not true infertility.",
   change:"You read every result the way your vet does, and you can follow the conversation at the moment it matters most.",
   win:"At your next visit, ask your vet three things: which machine runs the test, whether it gives an exact value or an estimate, and at what value ovulation usually shows on it. Write the answers on her cycle sheet.",
   vet:"Your vet knows the machine's ranges: let them read the curve, and ask them to walk you through it."}},
 {id:3,stage:1,best:'yes',
  q:"When your stud has rested more than 10 days, do you collect him once before the planned breeding?",
  explain:"Sperm stored too long in the stud age and lose quality.",
  strength:"Pre-breeding collection after a long rest",
  gap:{title:"Clear out stored sperm after a long rest",
   where:"After a long rest, your stud goes straight to the breeding.",
   why:"After more than 10 days without collection, the sperm stored in the stud age: more DNA damage and more abnormal shapes. One collection before the planned breeding clears them out, and fresh breedings work best spaced 48 to 72 hours apart.",
   cost:"The first breeding after a long rest can use the poorest sperm of the season, on the very day you worked hardest to time right.",
   change:"The breeding you timed so carefully uses his freshest, best sperm.",
   win:"Check your stud's calendar and mark every planned breeding that falls after more than 10 days of rest.",
   vet:"Plan the pre-breeding collection with your vet or reproduction service."}},
 {id:4,stage:2,best:'no',flip:true,
  q:"Do you rely on the calendar to judge when the puppies are ready to be born?",
  explain:"",
  strength:"Birth readiness confirmed by progesterone",
  gap:{title:"Let progesterone say when they're ready",
   where:"Birth readiness is judged by the calendar.",
   why:"Progesterone falls below 2 ng/mL (about 6 nmol/L) in the 24 to 48 hours before labour, and that drop is when the puppies' lungs finish maturing. The calendar, even counted from ovulation, gives a window. The progesterone drop confirms the day.",
   cost:"Puppies delivered before the drop, for example by a section booked on a date, can be born with lungs that are not ready to breathe.",
   change:"If a section is ever needed, it happens when the puppies are ready, not when the calendar says so.",
   win:'Add one line to your whelping plan: "Planned section only after a progesterone result below 2 ng/mL."',
   vet:"Agree with your vet, before the due window, how progesterone will be used to time any planned section."}},
 {id:5,stage:2,best:'no',flip:true,
  q:"Do you increase her food as soon as you know she's pregnant?",
  explain:"",
  strength:"Food held steady for the first 6 weeks",
  gap:{title:"Hold her food steady for the first 6 weeks",
   where:"Her food goes up as soon as the pregnancy is confirmed.",
   why:"For the first 6 weeks the puppies use very little energy, and her weight should stay flat. From week 6, food rises by about 10% a week, and she should finish at 115 to 125% of her weight before breeding.",
   cost:"Extra food early is stored as fat, including in the uterine muscle, which weakens contractions on whelping day.",
   change:"Her energy goes to the puppies when they actually grow, and she reaches whelping fit, not fat.",
   win:"Write her pre-breeding weight on her chart, with her 115% and 125% targets beside it.",
   vet:"Review the feeding plan with your vet at the pregnancy confirmation visit."}},
 {id:6,stage:2,best:'no',flip:true,
  q:"Do you start taking her temperature only in the last few days before she's due?",
  explain:"",
  strength:"Her own baseline temperature known in advance",
  gap:{title:"Know her normal before you watch for the drop",
   where:"Temperatures start only in the last few days, with no baseline.",
   why:"Each female has her own normal, usually within 38 to 39 °C (100.4 to 102.2 °F). The drop before labour is about 1 °C (1.8 °F), easiest to read against her own baseline, and labour usually follows within 12 to 24 hours.",
   cost:"Without her baseline, a small drop is easy to miss, and a normal low reading is easy to mistake for the drop.",
   change:"You read the drop the day it happens, and plan the night around it.",
   win:"For your next litter, start twice-daily temperatures, at the same times, at least a week before the due window, and log every reading.",
   vet:"Call your vet if the drop comes and labour hasn't started within 24 hours."}},
 {id:7,stage:3,best:'yes',
  q:"During whelping, do you write down the time each puppy and each placenta arrives?",
  explain:"",
  strength:"A timed birth log, puppies and placentas",
  gap:{title:"Log every puppy and every placenta",
   where:"Births and placentas aren't logged with times.",
   why:"Each puppy should be followed by its placenta. A timed log makes the call points visible: more than 2 hours between puppies when more are expected, or 30 minutes of strong pushing with no puppy.",
   cost:"In the middle of the night time blurs, and a long gap or a missing placenta goes unnoticed until it has become a problem.",
   change:"You and your vet read the same clock, and a missing placenta is spotted when it happens.",
   win:"Print a birth log today with four columns: puppy, time born, placenta seen, weight.",
   vet:"If the placenta count doesn't match the puppy count, tell your vet."}},
 {id:8,stage:3,best:'yes',
  q:"In each newborn's first minutes, do you give it a vitality score (an Apgar score) and write it down?",
  explain:"The Apgar score rates colour, heart rate, reflexes, movement and breathing, from 0 to 10.",
  strength:"Apgar score for every newborn",
  gap:{title:"Score every newborn in its first minutes",
   where:"Newborns are judged by eye, without a score.",
   why:"An Apgar score of 7 or more means a vigorous puppy. 4 to 7 needs active warming, stimulation and close watching, and below 4 is an emergency for your vet. The score stays useful for the first 8 hours.",
   cost:"Without a score, the quiet, weaker puppy in a busy litter can look fine until its first feeds have been missed.",
   change:"The puppies who need help are identified in their first minutes, not their first day.",
   win:"Add an Apgar column to your birth log.",
   vet:"Agree with your vet which scores mean call straight away."}},
 {id:9,stage:3,best:'yes',
  q:"In the first hours, do you check that every puppy has actually taken in colostrum, by weighing it before and after it nurses?",
  explain:"Colostrum is the first milk, the one that carries the mother's antibodies.",
  strength:"Colostrum intake checked on the scale",
  gap:{title:"Weigh the colostrum in",
   where:"Colostrum intake is assumed when a puppy is seen nursing.",
   why:"About 90% of a puppy's maternal antibodies arrive through colostrum, and the gut stops absorbing them 16 to 24 hours after birth. A puppy needs about 1.5 mL per 100 g of body weight, which shows on a gram scale as roughly 1.5 g gained per 100 g.",

/* ============================ SCORING ============================ */
function isBest(Q){return A.bp[Q.id]===Q.best;}
function isGap(Q){return A.bp[Q.id]!==Q.best;}
function stageScore(st){var c=0;BP.forEach(function(Q){if(Q.stage===st&&isBest(Q))c++;});return c;}
function weakestStage(){var best=1,bestScore=99;for(var st=1;st<=5;st++){var s=stageScore(st);if(s<bestScore){bestScore=s;best=st;}}return best;}
function routeProgram(){
  var q19=A.q19,q16=A.q16,score=overallPct();
  if(q19===2)return 'academy';                         // structured program
  if(q19===1){                                         // community
    if(q16===3)return 'academy';                       // 6 or more
    if(q16===2&&score>=70)return 'academy';            // 3 to 5 & 70+
    return 'tpb';
  }
  return 'tpb';                                         // on my own / not sure yet
}
function segment(){
  if(A.q19===2)return 'hot';
  if(A.q19===1||A.q16===2||A.q16===3)return 'warm';
  return 'cold';
}
function overallRaw(){var c=0;BP.forEach(function(Q){if(isBest(Q))c++;});return c;}
function overallPct(){return Math.round(overallRaw()/15*100);}
function bandFor(p){for(var i=0;i<BANDS.length;i++){if(p>=BANDS[i].min)return BANDS[i];}return BANDS[BANDS.length-1];}
function bandKey(p){return p>=70?'strong':(p>=40?'solid':'grow');}

  /* gap stages: weakest first (tie cycle order), only stages with gaps */
  var gapStages=[1,2,3,4,5].filter(function(st){return stageScore(st)<3;})
    .sort(function(a,b){return stageScore(a)-stageScore(b)||a-b;});

  var P=PROGRAMS[program];
  var firstFit= program==='academy' ? (pct>=70?P.fitStrong:P.fitOther) : P.fit;

  var html='<div class="fade">';

  /* 1. title */
  html+='<h1 class="center" style="margin-top:4px">'+esc(A.first)+', here\'s where your program stands.</h1>';

  /* 2. score */
  html+='<div class="scorewrap">'+ring(pct)
    +'<div class="band">'+band.label+'</div>'
    +'<p class="bandmsg">'+band.msg+'</p>'
    +'<p class="underscore">'+UNDERSCORE+'</p></div>';

  /* 3. note from Dr. Fontaine */
  html+='<div class="card note" style="margin-top:20px"><div class="nt">A note from Dr. Fontaine</div>'
    +'<p>'+band.note+'</p><div class="sig">Dr. Emmanuel Fontaine, DVM, PhD, Dipl. ECAR</div></div>';

  /* 4. 90-day starting point */
  html+='<div class="section-title">Your 90-day starting point</div><div class="card startpoint">'
    +'<p class="p">'+sp+'</p>';
  if(moves.length){
    html+='<div class="moves">';
    moves.forEach(function(Q,i){html+='<div class="move"><div class="mi">'+(i+1)+'</div><div class="mt"><b>'+Q.gap.title+'</b><span>'+Q.gap.win+'</span></div></div>';});
    html+='</div>';
    html+='<p class="bridgeline">Want help turning these moves into a full 90-day plan, with breeders working on the same thing?</p>'
      +'<a class="cta" href="'+P.url+'" target="_blank" rel="noopener">'+P.button+'</a>';
  }
  html+='</div>';

  /* 5. five stages */
  html+='<div class="section-title">Your five stages</div><div class="stagegrid">';
  for(var st=1;st<=5;st++){
    var ss=stageScore(st);var dots='';for(var d=0;d<3;d++){dots+='<span class="d'+(d<ss?' on':'')+'"></span>';}
    html+='<div class="sc"><div class="dots">'+dots+'</div><div class="nm">'+stageName(st)+'</div><div class="lb">'+STAGEMSG[ss].label+'</div></div>';
  }
  html+='</div>';

  /* 6. already in place */
  if(strengths.length){
    html+='<div class="section-title">Already in place</div>'
      +'<div class="chips">';
    strengths.forEach(function(Q){html+='<span class="chip">'+Q.strength+'</span>';});
    html+='</div><p class="subtle">These habits are already at the level the research supports. Keep them.</p>';
  }

  /* 7. gaps stage by stage */
  if(gapStages.length){
    html+='<div class="section-title">Your gaps, stage by stage</div>';
    gapStages.forEach(function(st){
      var ss=stageScore(st);var sm=STAGEMSG[ss];
      html+='<div class="stageblock"><div class="stagehead"><div class="k">Stage '+st+' · '+ss+' of 3 in place</div>'
        +'<div class="nm">'+stageName(st)+': <em>'+sm.label+'</em></div>'
        +(sm.msg?'<div class="sm">'+sm.msg+'</div>':'')+'</div>';
      BP.filter(function(Q){return Q.stage===st&&isGap(Q);}).forEach(function(Q){html+=gapCard(Q);});
      html+='</div>';
    });
  }

  /* 8. your next step */
  html+='<div class="section-title">Your next step</div><div class="card">';
  html+='<p class="obstacle">'+OBSTACLE[A.q18]+'</p>';
  html+='<p class="bandmsg" style="text-align:left;margin:0 0 4px">'+BRIDGE+'</p>';
  html+='<div class="prog-cards">'+programCard(program,true,firstFit)+programCard(program==='academy'?'tpb':'academy',false,null)+'</div>';
  html+='</div>';

  /* 9. retake + disclaimer */
  html+='<div class="retake"><button class="cta ghost" id="retake">Retake the scorecard</button></div>';
  html+='<p class="disc center" style="max-width:560px;margin:18px auto 0">An educational self-assessment. Dr. Fontaine is not acting as your veterinarian, and nothing here is veterinary advice for an individual animal. Decisions about your dogs stay with your own veterinarian.</p>';

  html+='</div>';
  app.innerHTML=html;
  document.getElementById('retake').onclick=function(){A.bp={};A.q16=A.q17=A.q18=A.q19=null;A.q20="";completionSent=false;step=0;show();};

  sendCompletion(pct,raw,band,goalStage,moves,program,seg,gaps);
}

function orderedGaps(goalStage){
  var gaps=BP.filter(isGap);
  var g1=gaps.filter(function(Q){return Q.stage===goalStage;}).sort(function(a,b){return a.id-b.id;});
  var g2=gaps.filter(function(Q){return Q.stage!==goalStage;}).sort(function(a,b){return stageScore(a.stage)-stageScore(b.stage)||a.id-b.id;});
  return g1.concat(g2);
}
function gapCard(Q){
  var ns=(A.bp[Q.id]==='notsure');
  var where=ns?NOTSURE_WHERE:Q.gap.where;
  var h='<div class="gap">'+(ns?'<span class="ns">You answered ‘Not sure’</span>':'')
    +'<div class="gt">'+Q.gap.title+'</div>'
    +gl('Where you are',where)
    +gl('Why it matters',Q.gap.why)
    +gl('The cost of leaving it',Q.gap.cost)
    +gl('What changes when you close it',Q.gap.change)
    +'<div class="gl win"><span class="lab">Quick win this week</span><span class="tx">'+Q.gap.win+'</span></div>'
    +'<div class="gl vet"><span class="lab">With your vet</span><span class="tx">'+Q.gap.vet+'</span></div>'
    +'</div>';
  return h;
}
function gl(lab,tx){return '<div class="gl"><span class="lab">'+lab+'</span><span class="tx">'+tx+'</span></div>';}
function programCard(key,rec,fit){
  var P=PROGRAMS[key];
  var h='<div class="pcard'+(rec?' rec':'')+'">'
    +'<div class="tag'+(rec?'':' alt')+'">'+(rec?'Recommended for you':'Also an option')+'</div>'
    +'<h3>'+P.name+'</h3>'
    +'<p class="desc">'+P.desc+'</p>';
  if(rec&&fit)h+='<p class="fit">'+fit+'</p>';
  h+='<a class="cta" href="'+P.url+'" target="_blank" rel="noopener">'+P.button+'</a></div>';
  return h;
}
function ring(pct){
  var r=76,c=2*Math.PI*r,off=c*(1-pct/100);
  return '<div class="ring"><svg width="168" height="168" viewBox="0 0 168 168">'
    +'<circle cx="84" cy="84" r="'+r+'" fill="none" stroke="#212b36" stroke-width="11"/>'
    +'<circle cx="84" cy="84" r="'+r+'" fill="none" stroke="url(#g)" stroke-width="11" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'"/>'
    +'<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c9a862"/><stop offset="1" stop-color="#e4cf9a"/></linearGradient></defs>'
    +'</svg><div class="val"><div class="num">'+pct+'</div><div class="den">OUT OF 100</div></div></div>';
}
function lc(s){return s?s.charAt(0).toLowerCase()+s.slice(1):s;}
function esc(s){return (s||'').replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];});}

/* ============================ STORE COMPLETION ============================ */
function sendCompletion(pct,raw,band,goalStage,moves,program,seg,gaps){
  if(completionSent)return;completionSent=true;
  var answers={};BP.forEach(function(Q){answers['q'+Q.id]=A.bp[Q.id]||null;});
  var payload={action:'litter-scorecard',
    first:A.first,last:A.last,email:A.email,phone:A.phone,company:A.company||'',
    scorePct:pct,scoreRaw:raw,band:bandKey(pct),
    stageScores:{1:stageScore(1),2:stageScore(2),3:stageScore(3),4:stageScore(4),5:stageScore(5)},
    gaps:gaps.map(function(Q){return Q.id;}),
    notsure:BP.filter(function(Q){return A.bp[Q.id]==='notsure';}).map(function(Q){return Q.id;}),
    priorities:moves.map(function(Q){return Q.gap.title;}),
    goalStage:goalStage,segment:seg,programShown:program,
    answers:answers,
    qual:{q16:A.q16,q17:A.q17,q18:A.q18,q19:A.q19,q20:A.q20}
  };
  try{fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).catch(function(){});}catch(e){}
}

/* ============================ BOOT ============================ */
show();
</script>

</html>
