<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#1b1b20;--surface:#111114;--card:#26262c;--card-2:#212127;--border:#34343c;
  --gold:#d6ba76;--gold-deep:#b89c47;--gold-faint:rgba(214,186,118,.10);--gold-grad:linear-gradient(135deg,#e2cb86 0%,#bfa050 100%);
  --on-gold:#1a1509;--ink:#f4f1ea;--muted:#8f8d85;--mid:#c4c1b8;
  --new:#7aa7d0;--rev:#d7a94e;--del:#6dbf90;--fu:#e0807e;--radius:11px;
  --heading:'Playfair Display',Georgia,serif;--body:'Inter',-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
.hide{display:none!important}a{color:var(--gold)}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
input,select,textarea{font-family:var(--body);font-size:14px;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--ink);padding:9px 11px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
.btn{background:var(--gold-grad);color:var(--on-gold);border:0;border-radius:9px;padding:11px 18px;font-weight:700;font-size:12px;letter-spacing:.05em;cursor:pointer}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--border);font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
.err{color:var(--fu);font-size:13px;min-height:16px}
.gate{max-width:380px;margin:9vh auto;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:30px}
.gate .mk{font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:16px}
.gate h1{font-family:var(--heading);font-size:24px;margin-bottom:6px}
.gate p{color:var(--muted);font-size:13px;margin:0 0 18px}
.gate input{width:100%;margin-bottom:11px}.gate .btn{width:100%}
#app{display:none}#app.on{display:block}
.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding:22px 0;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.top .mk{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.top h1{font-family:var(--heading);font-size:24px}
.who{font-size:12px;color:var(--muted)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tchip{font-size:12px;font-weight:600;padding:7px 13px;border-radius:9px;border:1px solid var(--border);background:var(--card-2);color:var(--muted);cursor:pointer}
.tchip.on{background:var(--gold-faint);color:var(--gold);border-color:var(--gold-deep)}
.tcat{font-size:9px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);opacity:.65;align-self:center;padding:0 3px 0 10px;margin-left:3px;border-left:1px solid var(--border)}
tr.grp td{background:var(--card-2);border-bottom:1px solid var(--gold-deep);border-top:1px solid var(--gold-deep);padding:8px 9px}
tr.grp .gl{font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.05em;font-size:11px}
tr.grp .gc{float:right;color:var(--muted);font-size:11px;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:13px}
.kpi .v{font-family:var(--heading);font-size:24px}.kpi .l{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.chip{font-size:12px;font-weight:600;padding:6px 12px;border-radius:20px;border:1px solid var(--border);background:var(--card-2);color:var(--muted);cursor:pointer}
.chip.on{background:var(--gold-faint);color:var(--gold);border-color:var(--gold-deep)}
.arow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--border)}
.arow:last-child{border-bottom:0}
.arow .q{font-size:13px;color:var(--mid);line-height:1.4}
.achip{font-size:11px;font-weight:700;border-radius:20px;padding:4px 11px;white-space:nowrap;flex:none}
.achip.ok{background:rgba(109,191,144,.16);color:#8fd0a6}
.achip.gap{background:rgba(224,128,126,.16);color:var(--fu)}
.achip.ns{background:var(--gold-faint);color:var(--gold)}
.achip.neutral{background:var(--card-2);color:var(--mid);border:1px solid var(--border)}
.sgrp{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:700;margin:15px 0 3px}
.sgrp:first-child{margin-top:2px}
.sgrp .sc{color:var(--muted);font-weight:600;margin-left:6px}
.search{margin-left:auto;min-width:190px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:10px 9px;border-bottom:1px solid var(--border);vertical-align:middle}
th{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
td .nm{font-weight:600;color:var(--ink)}td .sub{font-size:11.5px;color:var(--muted)}
.tooltag{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--gold);background:var(--gold-faint);border-radius:20px;padding:3px 9px;white-space:nowrap}
select.st,select.ow{font-size:12px;padding:5px 8px;border-radius:7px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.d-New{background:var(--new)}.d-Reviewed{background:var(--rev)}.d-Delivered{background:var(--del)}.d-Followup{background:var(--fu)}
.open{font-size:11px;font-weight:700;color:var(--gold);cursor:pointer;background:none;border:1px solid var(--border);border-radius:7px;padding:5px 10px}
.empty{color:var(--muted);padding:28px 0;text-align:center}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.62);display:flex;align-items:flex-start;justify-content:center;padding:24px;overflow:auto}
.sheet{background:var(--bg);border:1px solid var(--border);border-radius:16px;max-width:820px;width:100%;padding:26px;margin:auto}
.sheet h2{font-family:var(--heading);font-size:24px;color:var(--ink)}
.sheet .close{float:right;cursor:pointer;color:var(--muted);font-size:22px;line-height:1;background:none;border:0}
.block{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:15px 17px;margin-top:12px}
.block h3{font-family:var(--heading);font-size:15px;color:var(--gold);margin-bottom:6px}
.block p{color:var(--mid);white-space:pre-wrap;font-size:13.5px}
.money{background:linear-gradient(135deg,rgba(109,191,144,.13),rgba(214,186,118,.09));border:1px solid var(--del);border-radius:12px;padding:16px;margin-top:12px}
.money .big{font-family:var(--heading);font-size:22px;color:var(--ink)}
.tblwrap{overflow-x:auto}
table.sc{min-width:520px;font-size:12px}table.sc td.n{color:var(--ink);font-weight:600}table.sc tr.primary{background:var(--gold-faint)}
.pill{display:inline-block;min-width:24px;text-align:center;padding:2px 6px;border-radius:6px;font-weight:700}
.s-hi{background:rgba(109,191,144,.16);color:#8fd0a6}.s-md{background:var(--gold-faint);color:var(--gold)}.s-lo{background:rgba(224,128,126,.16);color:var(--fu)}
ul.li{margin:4px 0 0 18px;color:var(--mid);font-size:13px}ul.li li{margin:3px 0}
.scn{display:inline-block;background:var(--card-2);border:1px solid var(--border);border-radius:9px;padding:10px 12px;margin:6px 8px 0 0}
.scn .l{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}.scn .g{font-family:var(--heading);font-size:18px}
.kvrow{font-size:12.5px;color:var(--mid);padding:5px 0;border-bottom:1px solid var(--border-2,#2b2b32)}
.kvrow b{color:var(--ink)}
.mgmt{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.mgmt label{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px}
.intake{font-size:12.5px;color:var(--mid);white-space:pre-wrap;background:var(--card-2);border:1px solid var(--border);border-radius:9px;padding:12px}
@media(max-width:720px){.kpis{grid-template-columns:repeat(2,1fr)}.mgmt{grid-template-columns:1fr}}
</style>

<div id="gate" class="gate">
  <div class="mk">Breedwise · Admin</div>
  <h1>Tool Submissions</h1>
  <p>Sign in to review and manage submissions from every Accelerator tool.</p>
  <input id="gEmail" type="email" placeholder="you@breedwise.io" autocomplete="username">
  <input id="gPass" type="password" placeholder="Password" autocomplete="current-password">
  <button class="btn" id="gBtn">Sign in</button>
  <div class="err" id="gErr"></div>
</div>

<div id="app"><div class="wrap">
  <div class="top">
    <div><div class="mk">Breedwise · Accelerator</div><h1>Tool Submissions</h1></div>
    <div style="text-align:right"><div class="who" id="who"></div><button class="btn ghost" id="exportBtn" style="margin-top:6px;padding:5px 11px;margin-right:8px">Export CSV</button><button class="btn ghost" id="signout" style="margin-top:6px;padding:5px 11px">Sign out</button></div>
  </div>
  <div class="toolbar" id="tools"></div>
  <div class="kpis" id="kpis"></div>
  <div class="chips" id="chips"></div>
  <div class="tblwrap"><table><thead><tr><th>When</th><th>Tool</th><th>Member</th><th>Summary</th><th>Owner</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
</div></div>

<div id="modal" class="modal hide"><div class="sheet" id="sheet"></div></div>

<script>
const $=s=>document.querySelector(s);
const SB_URL='https://xhjdowbnqcsvhtcccuqx.supabase.co';
const SB_KEY='sb_publishable_2QU-ROYUu4a7bmYGdcFP5Q_qR5cF8B2';
const sb=supabase.createClient(SB_URL,SB_KEY);
const ASSET_FN=SB_URL+'/functions/v1/asset-upload';
const ASSET_SECRET='bw_assets_7Hq2';
const STATUSES=['New','Reviewed','Delivered','Follow-up'];
const OWNERS=['Unassigned','Austin','Jennifer','Madison','Yasmin','Derek','Jake','Regina','Angela Hughes','Dr. Fontaine','Dr. Mahoney'];
const usd=n=>'$'+Number(n||0).toLocaleString('en-US');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dcls=s=>'d-'+String(s||'New').replace('-','');
let ROWS=[], toolFilter='All', statusFilter='All', q='', ME=null;
const CATS=[
  {name:'Assessments', tools:['program-scorecard','implementation-assessment']},
  {name:'Scorecards', tools:['pb-scorecard','science-scorecard','litter-scorecard','free-scorecard','litter-snapshot']},
  {name:'Website Assets', tools:['website-assets']},
  {name:'Member Tools', tools:['niche-blueprint','value-architect','business','social-media']},
  {name:'Expert Consults', tools:['genetics-consult','repro-coaching','vet-relations']},
  {name:'Opt-ins & Leads', tools:['litter-optin','vet-optin','optin','program-scorecard-optin','pb-scorecard-optin']},
  {name:'Applications', tools:['application-partial','vsl-apply','academy-application','puppy-application','abr-application']},
  {name:'Feedback', tools:['feedback']},
  {name:'Revenue & Ops', tools:['sales-results','ad-metrics','q4-plan']},
  {name:'Tests', tools:['_probe','niche-test-probe']}
];
function catIndex(tool){ for(let i=0;i<CATS.length;i++){ if(CATS[i].tools.includes(tool)) return i; } return CATS.length; }
function catName(i){ return CATS[i]?CATS[i].name:'Other'; }

$('#gBtn').addEventListener('click',signIn);
$('#gPass').addEventListener('keydown',e=>{if(e.key==='Enter')signIn();});
$('#signout').addEventListener('click',async()=>{await sb.auth.signOut();location.reload();});
$('#exportBtn').addEventListener('click',csvExport);
async function signIn(){
  const email=$('#gEmail').value.trim(), password=$('#gPass').value; $('#gErr').textContent='';
  if(!email||!password){$('#gErr').textContent='Enter your email and password.';return;}
  $('#gBtn').disabled=true;$('#gBtn').textContent='Signing in…';
  const {error}=await sb.auth.signInWithPassword({email,password});
  $('#gBtn').disabled=false;$('#gBtn').textContent='Sign in';
  if(error){$('#gErr').textContent=error.message;return;}
  boot();
}
async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){$('#gate').classList.remove('hide');$('#app').classList.remove('on');return;}
  ME=session.user.email; $('#who').textContent=ME;
  $('#gate').classList.add('hide');$('#app').classList.add('on'); load();
}
async function load(){
  // Exclude pure-analytics rows at the query level. They are hidden from view anyway, but
  // left in they flood the row budget and push real submissions out of the fetch window.
  const {data,error}=await sb.from('tool_submissions').select('*')
    .not('tool','in','(site-session,site-pageview)')
    .order('created_at',{ascending:false}).limit(2000);
  if(error){ $('#rows').innerHTML=`<tr><td colspan="7" class="empty">Couldn't load (${esc(error.message)}). If this is the first run, the submissions table may not be set up yet.</td></tr>`; return; }
  const raw=data||[];
  // Program Scorecard was renamed to Program Assessment — normalize old rows' labels for display.
  raw.forEach(r=>{ if(r.tool==='program-scorecard') r.tool_label='Program Assessment'; else if(r.tool==='program-scorecard-optin') r.tool_label='Program Assessment Opt-in'; });
  // Build the set of emails that completed a full application (from completed attribution rows).
  const completed=new Set();
  raw.forEach(r=>{ if(r.tool==='meta-attribution'){ const isP=(r.meta&&r.meta.partial===true)||/partial/i.test(r.tool_label||''); if(!isP){ const e=(r.member_email||'').toLowerCase(); if(e) completed.add(e); } } });
  window.COMPLETED_EMAILS=completed;
  const HIDE=new Set(['site-pageview','site-session']);          // pure analytics — never in the work log
  ROWS=[];
  const byEmail={}, byName={}, partials=[];                       // condense the same lead into one entry
  raw.forEach(r=>{
    if(HIDE.has(r.tool)) return;
    if(r.tool==='meta-attribution'){
      const isP=(r.meta&&r.meta.partial===true)||/partial/i.test(r.tool_label||'');
      if(!isP) return;                                            // hide completed-attribution noise
      const e=(r.member_email||'').trim().toLowerCase();
      const nm=(r.member_name||'').trim().toLowerCase();
      const kept=(e&&byEmail[e])||(nm&&byName[nm]);               // same email OR same name = same person
      if(kept){                                                   // condense — do not double count
        kept._captures=(kept._captures||1)+1;
        const km=kept.meta||(kept.meta={}), rm=r.meta||{};
        ['phone','breeds','reason','fbc','fbclid','event_id'].forEach(f=>{ if(!km[f]&&rm[f]) km[f]=rm[f]; });
        if(!kept.member_name&&r.member_name) kept.member_name=r.member_name;
        if(e&&completed.has(e)) kept._converted=true;
        if(e&&!byEmail[e]) byEmail[e]=kept;
        if(nm&&!byName[nm]) byName[nm]=kept;
        return;                                                   // drop the duplicate row
      }
      r.tool='application-partial'; r.tool_label='Partial Application';
      r._converted=!!(e&&completed.has(e)); r._captures=1;
      if(e) byEmail[e]=r; if(nm) byName[nm]=r;
      partials.push(r); ROWS.push(r);
      return;
    }
    ROWS.push(r);
  });
  partials.forEach(r=>{                                           // finalize once capture counts are known
    r.summary=(r._converted?'✓ Converted to application':'Not submitted — follow up')
      +((r.meta&&r.meta.fbc)?' · from ad click':'')
      +(r._captures>1?(' · '+r._captures+' captures'):'');
  });
  render();
}
function toolsList(){ const m={}; ROWS.forEach(r=>{ m[r.tool]=r.tool_label||r.tool; }); return m; }
function inTool(r){ return toolFilter==='All'||r.tool===toolFilter; }
function counts(){ const base=ROWS.filter(inTool); const c={All:base.length}; STATUSES.forEach(s=>c[s]=base.filter(r=>(r.status||'New')===s).length); return c; }
function render(){
  const tl=toolsList();
  const byCat={}; Object.keys(tl).forEach(id=>{ const ci=catIndex(id); (byCat[ci]=byCat[ci]||[]).push(id); });
  let th=`<span class="tchip ${toolFilter==='All'?'on':''}" data-t="All">All tools · ${ROWS.length}</span>`;
  Object.keys(byCat).map(Number).sort((a,b)=>a-b).forEach(ci=>{
    th+=`<span class="tcat">${esc(catName(ci))}</span>`;
    byCat[ci].sort((a,b)=>(tl[a]||a).localeCompare(tl[b]||b)).forEach(id=>{
      th+=`<span class="tchip ${toolFilter===id?'on':''}" data-t="${esc(id)}">${esc(tl[id])} · ${ROWS.filter(r=>r.tool===id).length}</span>`;
    });
  });
  $('#tools').innerHTML=th;
  $('#tools').querySelectorAll('[data-t]').forEach(el=>el.addEventListener('click',()=>{toolFilter=el.getAttribute('data-t');statusFilter='All';render();}));
  drawKpis();
  const c=counts();
  $('#chips').innerHTML=['All',...STATUSES].map(s=>`<span class="chip ${statusFilter===s?'on':''}" data-f="${s}">${esc(s)}${s!=='All'?` · ${c[s]}`:''}</span>`).join('')+`<input class="search" id="search" placeholder="Search member / summary…" value="${esc(q)}">`;
  $('#chips').querySelectorAll('[data-f]').forEach(el=>el.addEventListener('click',()=>{statusFilter=el.getAttribute('data-f');render();}));
  $('#search').addEventListener('input',e=>{q=e.target.value.toLowerCase();renderRows();});
  renderRows();
}
function drawKpis(){ const c=counts(); $('#kpis').innerHTML=[['Total',c.All]].concat(STATUSES.map(s=>[s,c[s]])).map(([l,v])=>`<div class="kpi"><div class="v">${v}</div><div class="l">${esc(l)}</div></div>`).join(''); }
function visible(){
  return ROWS.filter(r=>{
    if(!inTool(r)) return false;
    if(statusFilter!=='All' && (r.status||'New')!==statusFilter) return false;
    if(q){ const hay=((r.member_name||'')+' '+(r.member_email||'')+' '+(r.summary||'')+' '+(r.tool_label||'')).toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  });
}
function rowHtml(r){
  const dt=r.created_at?new Date(r.created_at):null;
  const d=dt?dt.toLocaleDateString('en-US',{month:'short',day:'numeric'}):'';
  const tm=dt?dt.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}):'';
  return `<tr>
    <td class="sub" style="white-space:nowrap">${esc(d)}${tm?`<div style="font-size:11px;color:var(--muted)">${esc(tm)}</div>`:''}</td>
    <td><span class="tooltag">${esc(r.tool_label||r.tool)}</span></td>
    <td><div class="nm">${esc(r.member_name||'—')}</div><div class="sub">${esc(r.member_email||'')}</div></td>
    <td style="max-width:260px">${esc((r.summary||'').slice(0,100))}</td>
    <td><select class="ow" data-id="${r.id}">${OWNERS.map(o=>`<option ${((r.owner||'Unassigned')===o)?'selected':''}>${o}</option>`).join('')}</select></td>
    <td><span class="dot ${dcls(r.status)}"></span><select class="st" data-id="${r.id}">${STATUSES.map(s=>`<option ${((r.status||'New')===s)?'selected':''}>${s}</option>`).join('')}</select></td>
    <td><button class="open" data-open="${r.id}">Open</button></td>
  </tr>`;
}
function renderRows(){
  const rows=visible();
  if(!rows.length){ $('#rows').innerHTML=`<tr><td colspan="7" class="empty">No submissions yet.</td></tr>`; return; }
  let html='';
  if(toolFilter==='All'){                                     // separate every tool into its own labelled section
    const tl=toolsList(), groups={};
    rows.forEach(r=>{ (groups[r.tool]=groups[r.tool]||[]).push(r); });
    const order=Object.keys(groups).sort((a,b)=>{ const c=catIndex(a)-catIndex(b); return c||((tl[a]||a).localeCompare(tl[b]||b)); });
    order.forEach(tool=>{
      html+=`<tr class="grp"><td colspan="7"><span class="gl">${esc(tl[tool]||tool)}</span><span class="gc">${groups[tool].length}</span></td></tr>`;
      html+=groups[tool].map(rowHtml).join('');
    });
  } else {
    html=rows.map(rowHtml).join('');
  }
  $('#rows').innerHTML=html;
  $('#rows').querySelectorAll('.st').forEach(el=>el.addEventListener('change',()=>update(el.getAttribute('data-id'),{status:el.value})));
  $('#rows').querySelectorAll('.ow').forEach(el=>el.addEventListener('change',()=>update(el.getAttribute('data-id'),{owner:el.value})));
  $('#rows').querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',()=>openSub(el.getAttribute('data-open'))));
}
async function update(id,patch){
  patch.updated_at=new Date().toISOString(); patch.updated_by=ME;
  const {error}=await sb.from('tool_submissions').update(patch).eq('id',id);
  if(error){ alert('Could not save: '+error.message); return; }
  const r=ROWS.find(x=>x.id===id); if(r) Object.assign(r,patch); drawKpis();
}

/* downloads */
function download(filename,text,mime){
  const blob=new Blob([text],{type:mime||'text/plain;charset=utf-8'}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}
function csvExport(){
  const rows=visible();
  if(!rows.length){ alert('Nothing to export in the current view.'); return; }
  const cols=['When','Tool','Member','Email','Summary','Price low','Price high','Status','Owner','Notes'];

function humanLabel(k){

function humanVal(v){

  depth=depth||0;

    if(Array.isArray(v)){
      if(v.every(x=>typeof x!=='object')) return `<div class="kvrow"><b>${esc(humanLabel(k))}:</b> ${v.map(x=>esc(String(x))).join(', ')}</div>`;

  const kvrow=(k,v)=> (v!=null&&String(v).trim())?`<div class="kvrow"><b>${esc(k)}:</b> ${esc(v)}</div>`:'';
  const blk=(lbl,v)=> (v&&String(v).trim())?`<div class="block"><h3>${esc(lbl)}</h3><p style="white-space:pre-wrap">${esc(v)}</p></div>`:'';
  const byField={}; files.forEach(x=>{(byField[x.field||'file']=byField[x.field||'file']||[]).push(x);});
  const fileRows=arr=> (arr||[]).map(x=>`<div class="kvrow" data-apath="${esc(x.path)}">${esc(x.name)}${x.size?` <span style="color:var(--muted)">· ${Math.round(x.size/1024)} KB</span>`:''}</div>`).join('');
  const dogs=Array.isArray(f.dogs)?f.dogs:[], litters=Array.isArray(f.litters)?f.litters:[];
  const info=(pairs)=>pairs.filter(x=>x[1]&&String(x[1]).trim()).map(x=>kvrow(x[0],x[1])).join('');
  const dogsBlock=dogs.length?`<div class="block"><h3>Dogs (${dogs.length})</h3>`+dogs.map((d,idx)=>{
    const ff=byField['dog-'+(idx+1)]||[];
    return `<div class="sgrp">${esc(d.name||('Dog '+(idx+1)))}${d.sex?' · '+esc(d.sex):''}${d.breed?' · '+esc(d.breed):''}${ff.length?' · '+ff.length+' photo'+(ff.length===1?'':'s'):''}</div>`
      +info([['Sex',d.sex],['Breed',d.breed],['Color',d.color],['DOB/age',d.dob],['Weight/size',d.weight],['Health testing',d.health],['Titles',d.titles],['Notes',d.notes]])+fileRows(ff);
  }).join('')+`</div>`:'';
  const littersBlock=litters.length?`<div class="block"><h3>Litters (${litters.length})</h3>`+litters.map((l,idx)=>{
    const ff=byField['litter-'+(idx+1)]||[];
    return `<div class="sgrp">${esc(l.status||('Litter '+(idx+1)))}${l.breed?' · '+esc(l.breed):''}${ff.length?' · '+ff.length+' photo'+(ff.length===1?'':'s'):''}</div>`
      +info([['Sire',l.sire],['Dam',l.dam],['Breed',l.breed],['Born/due',l.born],['Available',l.available],['Price',l.price],['Litter size',l.count],['Notes',l.notes]])+fileRows(ff);
  }).join('')+`</div>`:'';
  const general=['logo','photos','videos','testimonials'].filter(k=>byField[k]&&byField[k].length);
  const generalBlock=general.length?`<div class="block"><h3>Other files</h3>`+general.map(k=>`<div class="sgrp">${esc(k)}</div>`+fileRows(byField[k])).join('')+`</div>`:'';
  return `
    <div class="money"><div style="font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--gold)">Website Assets</div>
      <div class="big" style="font-size:20px">${esc(m.kennel||r.member_name||'Member')}</div>
      <p style="color:var(--mid);font-size:12.5px;margin-top:6px">${esc(r.member_email||'')}${m.phone?' · '+esc(m.phone):''} · ${dogs.length} dog${dogs.length===1?'':'s'} · ${litters.length} litter${litters.length===1?'':'s'} · ${files.length} file${files.length===1?'':'s'}</p></div>
    <div class="block"><h3>Contact</h3>${kvrow('Name',r.member_name)}${kvrow('Kennel',m.kennel)}${kvrow('Email',r.member_email)}${kvrow('Phone',m.phone)}${kvrow('Breed(s)',f.breeds)}</div>
    ${blk('About their program',f.about)}
    ${blk('What makes them different',f.different)}
    ${dogsBlock}
    ${littersBlock}
    ${(f.website||f.social)?`<div class="block"><h3>Links</h3>${kvrow('Website',f.website)}${f.social?`<div class="kvrow"><b>Social:</b><br><span style="white-space:pre-wrap">${esc(f.social)}</span></div>`:''}</div>`:''}
    ${blk('Video links',f.videolinks)}
    ${generalBlock}
    ${files.length?`<div class="block"><button class="btn" id="dlLinks">Get download links (all files)</button><div id="dlOut" style="margin-top:10px;font-size:12.5px"></div></div>`:`<div class="block"><p style="color:var(--muted)">No files uploaded (text and links only).</p></div>`}`;
}
async function getAssetLinks(btn){
  const paths=Array.prototype.map.call(document.querySelectorAll('#sheet [data-apath]'),el=>el.getAttribute('data-apath'));
  if(!paths.length)return;
  btn.disabled=true;btn.textContent='Getting links…';
  try{
    const r=await fetch(ASSET_FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'links',secret:ASSET_SECRET,paths})});
    const d=await r.json();
    if(!d||!d.ok)throw new Error((d&&d.error)||'Failed');
    $('#dlOut').innerHTML=(d.links||[]).map(l=>l.url?`<div style="padding:4px 0"><a href="${esc(l.url)}" target="_blank" rel="noopener" style="color:var(--gold)">${esc(l.path.split('/').pop())}</a></div>`:`<div style="color:var(--muted)">${esc(l.path.split('/').pop())} — unavailable</div>`).join('');
    btn.textContent='Links ready (valid 6h)';
  }catch(e){ btn.disabled=false;btn.textContent='Get download links'; $('#dlOut').innerHTML=`<span style="color:#e8695f">${esc(e.message)}</span>`; }
}
function renderBody(r,forExport){
  if(r.tool==='website-assets') return renderWebsiteAssets(r);
  if(r.tool==='litter-scorecard') return renderLitterScorecard(r);
  if(r.tool==='pb-scorecard') return renderPbScorecard(r);
  if(r.tool==='litter-optin'||r.tool==='vet-optin'||r.tool==='optin'||r.tool==='program-scorecard-optin'||r.tool==='pb-scorecard-optin') return renderOptin(r);
  if(r.tool==='program-scorecard'&&r.result) return renderScorecard(r,forExport);
  if(r.tool==='implementation-assessment') return renderAssessment(r);
  if(r.tool==='niche-blueprint'&&r.result) return renderBlueprint(r.result,r.inputs||{});
  if(r.tool==='value-architect'&&r.result) return renderValueArchitect(r.result,r.inputs||{});
  if(r.tool==='feedback') return renderFeedback(r);
  if(r.tool==='genetics-consult') return renderGeneticsConsult(r);
  if(r.tool==='repro-coaching') return renderReproCoaching(r);
  if(r.tool==='vet-relations') return renderVetRelations(r);
  if(r.tool==='social-media') return renderSocialMedia(r);
  if(r.tool==='business') return renderBusiness(r);
  if(r.tool==='litter-snapshot') return renderLitterSnapshot(r);
  if(r.tool==='application-partial') return renderPartial(r);
  return renderGeneric(r);
}
function renderPartial(r){
  const m=r.meta||{};
  const conv=r._converted;
  const kvrow=(k,v)=> (v!=null&&String(v).trim())?`<div class="kvrow"><b>${esc(k)}:</b> ${esc(v)}</div>`:'';
  const cap=m.captured_at?new Date(m.captured_at*1000):(r.created_at?new Date(r.created_at):null);
  const when=cap?cap.toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'—';
  return `
    <div class="money"><div style="font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--del)">Partial application</div>
      <div class="big" style="font-size:22px">${conv?'Converted to a full application ✓':'Started — never submitted'}</div>
      <p style="color:var(--mid);font-size:13px;margin-top:6px">${conv?'This lead came back and completed the application. No recovery needed.':'Real recovery opportunity — they gave contact info and showed intent but did not finish. Reach out.'}</p></div>
    <div class="block"><h3>Contact</h3>
      ${kvrow('Email',r.member_email)}
      ${kvrow('Name',r.member_name)}
      ${kvrow('Phone', m.phone || '(in CC360 — search the contact tagged “application-partial”)')}
      ${kvrow('Breed(s)',m.breeds)}
    </div>
    <div class="block"><h3>Capture</h3>
      ${kvrow('Started',when)}
      ${kvrow('Drop point',m.reason)}
      ${kvrow('From ad click', m.fbc?'Yes':'No')}
      ${kvrow('Times started', (r._captures&&r._captures>1)?(r._captures+' captures (condensed to one lead)'):null)}
      ${kvrow('Status', conv?'Converted — no action':'Open — follow up')}
    </div>`;
}
function renderLitterSnapshot(r){
  const res=r.result||{}, i=r.inputs||{}, m=res.metrics||r.meta||{};
  const flags=res.flags||m.flags||[];
  const priority=res.priority||'';
  const money=v=>(Number(v)<0?'-$':'$')+Math.round(Math.abs(Number(v)||0)).toLocaleString('en-US');
  const pct=v=>(Math.round((Number(v)||0)*10)/10)+'%';
  const margin=(m.margin!=null)?m.margin:((Number(m.revenue)||0)-(Number(m.direct)||0));
  const answers=Array.isArray(i.answers)?i.answers:[];
  const ansBlocks=answers.map(g=>`<div class="block"><h3>${esc(g[0]||'')}</h3>${(g[1]||[]).map(qa=>`<div class="kvrow"><b>${esc(qa[0])}:</b> ${esc(qa[1])}</div>`).join('')}</div>`).join('');
  const moneyRows=[
    ['Gross Revenue',m.revenue],['Direct Litter Costs',m.direct],['Direct Litter Margin',margin],
    ['Indirect & Program Costs',m.alloc],['Estimated Litter Profit',m.profit]
  ].filter(x=>x[1]!=null).map(x=>`<div class="kvrow"><b>${x[0]}:</b> ${esc(money(x[1]))}</div>`).join('');
  const sub=[m.sold!=null?`${m.sold} sold`:'',m.placed!=null?`${m.placed} placed`:'',(m.surv!=null&&m.born!=null)?`${m.surv} survived of ${m.born}`:''].filter(Boolean).join(' · ');
  return `
    <div class="money"><div style="font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--del)">Estimated litter profit</div><div class="big">${money(m.profit)}</div><p style="color:var(--mid);font-size:13px;margin-top:6px">${esc(m.litter||'Litter')}${sub?' · '+esc(sub):''}${m.marginPct!=null?' · '+pct(m.marginPct)+' margin':''}</p></div>
    <div class="block"><h3>Money</h3>${moneyRows||'<p>—</p>'}
      ${m.profPer!=null?`<div class="kvrow"><b>Profit / puppy:</b> ${esc(money(m.profPer))}</div>`:''}
      ${m.breakeven!=null?`<div class="kvrow"><b>Break-even price:</b> ${esc(money(m.breakeven))}</div>`:''}
      ${m.hours?`<div class="kvrow"><b>Owner hours:</b> ${Math.round(m.hours)}${m.perHour?` (${esc(money(m.perHour))}/hr)`:''}</div>`:''}
      ${(i.guess||r.guess)?`<div class="kvrow"><b>Their gut guess:</b> ${esc(money(i.guess||r.guess))}</div>`:''}</div>
    ${flags.length?`<div class="block"><h3>Signals</h3><p>${flags.map(f=>esc(f)).join(' · ')}</p></div>`:''}
    ${priority?`<div class="block"><h3>Next-litter priority</h3><p>${esc(priority)}</p></div>`:''}
    ${ansBlocks?`<div class="block" style="background:none;border:0;padding:14px 0 0"><h3>Full answers (exactly what they entered)</h3></div>${ansBlocks}`:`<div class="block"><p style="color:var(--muted)">Full itemized answers weren't captured for this submission (saved before the update).</p></div>`}`;
}
function renderGeneric(r){
  const inp=r.inputs, res=r.result, m=r.meta||{};
  let out='';
  if(r.summary) out+=`<div class="block"><h3>Summary</h3><p>${esc(r.summary)}</p></div>`;
  const contact=kvPretty({name:r.member_name,email:r.member_email,phone:m.phone});
  if(contact) out+=`<div class="block"><h3>Contact</h3>${contact}</div>`;
  const inpBody=(inp&&typeof inp==='object')?kvPretty(inp):'';
  if(inpBody) out+=`<div class="block"><h3>Their answers</h3>${inpBody}</div>`;
  const resBody=(res&&typeof res==='object'&&!Array.isArray(res))?kvPretty(res):'';
  if(resBody) out+=`<div class="block"><h3>Result</h3>${resBody}</div>`;
  const extras={}; ['source','scorePct','band','segment'].forEach(k=>{ if(!emptyVal(m[k])) extras[k]=m[k]; });
  const exBody=kvPretty(extras);
  if(exBody&&!resBody&&!inpBody) out+=`<div class="block"><h3>Details</h3>${exBody}</div>`;
  return out||'<div class="block"><p>No detail recorded.</p></div>';
}
function openSub(id){
  const r=ROWS.find(x=>x.id===id); if(!r) return;
  const body=renderBody(r);
  $('#sheet').innerHTML=`
    <button class="close" id="mClose">×</button>
    <h2>${esc(r.member_name||r.tool_label||'Submission')}</h2>
    <div class="who"><span class="tooltag">${esc(r.tool_label||r.tool)}</span>${r.member_email?' · '+esc(r.member_email):''}${r.created_at?' · '+esc(new Date(r.created_at).toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'})):''}</div>
    ${body}
    <div class="mgmt">
      <div><label>Status</label><select id="m_status">${STATUSES.map(s=>`<option ${((r.status||'New')===s)?'selected':''}>${s}</option>`).join('')}</select></div>
      <div><label>Owner</label><select id="m_owner">${OWNERS.map(o=>`<option ${((r.owner||'Unassigned')===o)?'selected':''}>${o}</option>`).join('')}</select></div>
    </div>
    <div style="margin-top:12px"><label style="font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px">Staff notes</label><textarea id="m_notes" rows="3" style="width:100%">${esc(r.notes||'')}</textarea></div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:14px"><button class="btn ghost" id="mDelete" style="margin-right:auto;color:#e8695f;border-color:rgba(232,105,95,.4)">Delete</button><button class="btn ghost" id="mDownload">Download</button><button class="btn ghost" id="mCancel">Close</button><button class="btn" id="mSave">Save</button></div>`;
  $('#modal').classList.remove('hide');
  $('#mClose').onclick=closeModal; $('#mCancel').onclick=closeModal;
  $('#modal').onclick=e=>{if(e.target.id==='modal')closeModal();};
  $('#mDownload').onclick=()=>downloadOne(r);
  $('#mDelete').onclick=()=>deleteSub(id);
  $('#mSave').onclick=async()=>{ await update(id,{status:$('#m_status').value,owner:$('#m_owner').value,notes:$('#m_notes').value.trim()||null}); closeModal(); renderRows(); };
  const _dl=document.getElementById('dlLinks'); if(_dl)_dl.onclick=()=>getAssetLinks(_dl);
}
async function deleteSub(id){
  const r=ROWS.find(x=>x.id===id);
  const who=r?(r.member_name||r.member_email||r.tool_label||'this submission'):'this submission';
  if(!confirm('Delete "'+who+'"?\n\nThis permanently removes the submission and cannot be undone.')) return;
  const {error}=await sb.from('tool_submissions').delete().eq('id',id);
  if(error){ alert('Could not delete: '+error.message+(/permission|policy|denied/i.test(error.message)?'\n\nThe delete policy for tool_submissions needs to be enabled for the admin role in Supabase.':'')); return; }
  ROWS=ROWS.filter(x=>x.id!==id);
  closeModal(); render();
}
function closeModal(){ $('#modal').classList.add('hide'); }
boot();
</script>
